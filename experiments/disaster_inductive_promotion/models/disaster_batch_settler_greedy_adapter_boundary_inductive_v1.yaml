# Disaster axis: batch_settler_greedy_adapter_boundary
#
# AXIS (literal): The native batch-auction settler adapter and the Lean
# greedy-approximation wrappers must share candidate-order semantics. The
# disaster is the adapter selecting a clearing order OUTSIDE the Lean
# greedy-approximation envelope: it is strictly dominated (less executed
# volume than the greedy/skip-on-fail order) yet accepted, OR it creates
# value (Delta > 0), OR it under-delivers (a fill output below its min).
#
# This model proves the disaster UNREACHABLE by deriving, from the
# transition arithmetic, three inductive safety invariants whose negation
# is exactly the disaster:
#
#   (a) inv_no_underdelivery   : every executed fill had output >= its min
#       (under-delivery / surplus theft).  Carried as a monotone flag that
#       can ONLY be set by an execute step whose guard forbids it; so the
#       flag stays false unless an under-delivering step fires (impossible).
#
#   (b) inv_conservation       : fees + reward + total_actual_output
#                                <= total_input_collected   (Delta <= 0).
#       Each execute step moves input->output 1:1 minus a non-negative
#       price-impact wedge that accrues to fees; commit splits the wedge
#       into fees+reward and CANNOT exceed the accumulated wedge.
#
#   (c) inv_envelope_dominance : adapter_volume == greedy_volume while a
#       batch is being settled, and at Complete adapter_volume >= greedy
#       envelope.  Both lanes run the IDENTICAL skip-on-fail rule over the
#       SAME monotone-decreasing output schedule (Lean: outputAtN_antitone),
#       processed in the SAME canonical descending-minOut order (Lean:
#       exchange_at_any_position). Sharing candidate-order semantics keeps
#       the two lanes lock-step; their drift (adapter < greedy = dominated
#       accept, or adapter > greedy = fabricated witness) is the disaster.
#
# WHY NOT A TAUTOLOGY:
#   - The commit guard does NOT assume conservation/dominance; it only
#     consumes state that the execute-step arithmetic genuinely moved.
#   - greedy_volume and adapter_volume are built by two SEPARATE actions
#     (execute_greedy_step, execute_adapter_step) with their own guarded
#     arithmetic.  Their equality is a non-trivial inductive consequence of
#     processing the same schedule in the same order with the same rule.
#   - inv_envelope_dominance's negation (lane drift) is expressible: an
#     adapter step that fires on an intent the greedy lane skipped (or vice
#     versa) would break it.  The position/order guards make that
#     unreachable -- that is the content of the proof.
#
# MODEL <-> CODE GAP (honest):
#   Abstracts the Python adapter src/core/batch_clearing.py:
#     compute_settlement(..., swap_ordering="greedy_ab" | "greedy_ab_refined")
#     and _clear_swaps(...), whose greedy path sorts intents by effective
#     limit price (descending desirability == descending minOut surrogate)
#     and applies them skip-on-fail against the live CPMM pool. The Lean
#     wrappers it must agree with are BatchGreedyOptimality.scheduleVol /
#     greedy_volume_ge_reverse_equal_input and
#     BatchGreedyApproximation.k_intent_greedy_volume_optimal +
#     scheduleVol_le_sum_input + equal_input_output_sum_invariant.
#
#   OMITS (bounded-int abstraction): the real CPMM floor-division output
#   y*d/(x+d); here the per-position output is modeled as a monotone-
#   decreasing arithmetic schedule out(pos) = out_base - pos*decrement
#   (capped at 0), which is the EXACT shape Lean proves (outputAtN_antitone)
#   without the nonlinear division. It also omits multi-pool routing, fee
#   bps math, and unequal-input intents (Lean's equal-input scope). The
#   adapter-vs-greedy order divergence is modeled as: both lanes MUST consume
#   the same descending-min candidate stream; a real differential replay of
#   the Python adapter against scheduleVol is still required to discharge
#   the residual (unequal inputs / multi-pool) gap. This model proves the
#   equal-input, single-stream consensus core inductively.

ir_version: "esso-ir/v1"
meta:
  model_id: "disaster_batch_settler_greedy_adapter_boundary_inductive_v1"
  description: >
    Dual-lane skip-on-fail batch settler: proves the adapter's accepted
    clearing order stays within the Lean greedy-approximation envelope
    (no strictly-dominated accept), preserves conservation (Delta<=0), and
    never under-delivers. Disaster = lane drift / value creation /
    under-delivery, all made unreachable by transition-derived invariants.
  tags: ["dex", "batch-auction", "greedy", "envelope", "conservation", "fairness", "safety"]

observables:
  state_vars:
    - "phase"
    - "pos"
    - "out_base"
    - "decrement"
    - "greedy_volume"
    - "adapter_volume"
    - "total_input_collected"
    - "total_actual_output"
    - "fee_wedge"
    - "fees_captured"
    - "solver_reward"
    - "underdelivered"
    - "committed"
  effects:
    - "event"
    - "phase_out"
    - "greedy_vol_out"
    - "adapter_vol_out"

types:
  - id: "t_phase"
    type:
      kind: "enum"
      symbols: ["Setup", "Scheduling", "Committed"]
  - id: "t_event"
    type:
      kind: "enum"
      symbols:
        - "BatchOpened"
        - "GreedyStepExecuted"
        - "GreedyStepSkipped"
        - "AdapterStepExecuted"
        - "AdapterStepSkipped"
        - "SettlementCommitted"

state_vars:
  # Control phase.
  - id: "phase"
    role: "control"
    type: { ref: "t_phase" }

  # Current scheduling position (shared schedule index). Both lanes consume
  # the SAME descending-min candidate stream at the SAME position, so a
  # single position counter is the shared candidate-order semantics.
  - id: "pos"
    role: "data"
    type: { kind: "int", min: 0, max: 16 }

  # Monotone-decreasing position-output schedule: out(pos) = out_base - pos*decrement,
  # clamped at 0. Mirrors Lean outputAtN_antitone (each fill depletes the pool).
  - id: "out_base"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  - id: "decrement"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  # Greedy-envelope executed volume (canonical descending-min skip-on-fail).
  - id: "greedy_volume"
    role: "data"
    type: { kind: "int", min: 0, max: 16000000 }

  # Adapter's accepted-order executed volume (shares candidate-order semantics).
  - id: "adapter_volume"
    role: "data"
    type: { kind: "int", min: 0, max: 16000000 }

  # Total input committed to the batch (sum of executed-intent inputs).
  - id: "total_input_collected"
    role: "data"
    type: { kind: "int", min: 0, max: 16000000 }

  # Total output actually delivered by executed fills.
  - id: "total_actual_output"
    role: "data"
    type: { kind: "int", min: 0, max: 16000000 }

  # Accumulated price-impact wedge (input - output per executed fill).
  # This is the protocol-capturable surplus pool; commit may NOT exceed it.
  - id: "fee_wedge"
    role: "data"
    type: { kind: "int", min: 0, max: 16000000 }

  - id: "fees_captured"
    role: "data"
    type: { kind: "int", min: 0, max: 16000000 }

  - id: "solver_reward"
    role: "data"
    type: { kind: "int", min: 0, max: 16000000 }

  # Monotone disaster flag: set true only if an under-delivering fill ever
  # executed. The execute guards forbid it, so it must stay false.
  - id: "underdelivered"
    role: "data"
    type: { kind: "bool" }

  # Set true exactly when commit fires (drives Committed-phase invariants).
  - id: "committed"
    role: "data"
    type: { kind: "bool" }

init:
  - { var: "phase", expr: { enum: "Setup" } }
  - { var: "pos", expr: { const: 0 } }
  - { var: "out_base", expr: { const: 0 } }
  - { var: "decrement", expr: { const: 0 } }
  - { var: "greedy_volume", expr: { const: 0 } }
  - { var: "adapter_volume", expr: { const: 0 } }
  - { var: "total_input_collected", expr: { const: 0 } }
  - { var: "total_actual_output", expr: { const: 0 } }
  - { var: "fee_wedge", expr: { const: 0 } }
  - { var: "fees_captured", expr: { const: 0 } }
  - { var: "solver_reward", expr: { const: 0 } }
  - { var: "underdelivered", expr: { bool: false } }
  - { var: "committed", expr: { bool: false } }

invariants:
  # ---------------------------------------------------------------------------
  # (a) NO UNDER-DELIVERY: the disaster flag is never set in any reachable
  #     state. Its negation (underdelivered == true) is exactly a fill that
  #     paid out below its min => surplus theft / mis-settlement.
  # ---------------------------------------------------------------------------
  - id: "inv_no_underdelivery"
    kind: "safety"
    expr:
      op: "="
      args: [{ var: "underdelivered" }, { bool: false }]

  # ---------------------------------------------------------------------------
  # (b) CONSERVATION (Delta <= 0): fees + reward + delivered output never
  #     exceed collected input. Negation = value creation (Delta > 0).
  #     Derived: every execute step adds the SAME amount to total_input and
  #     splits it into total_actual_output + fee_wedge; commit moves at most
  #     fee_wedge into fees+reward.
  # ---------------------------------------------------------------------------
  - id: "inv_conservation"
    kind: "safety"
    expr:
      op: "<="
      args:
        - op: "+"
          args:
            - op: "+"
              args: [{ var: "fees_captured" }, { var: "solver_reward" }]
            - { var: "total_actual_output" }
        - { var: "total_input_collected" }

  # ---------------------------------------------------------------------------
  # (b') WEDGE ACCOUNTING (the inductive strengthening that makes (b) hold):
  #      input collected == delivered output + accumulated wedge, EXACTLY,
  #      until commit consumes the wedge into fees+reward. This ties the
  #      'total' to the per-fill arithmetic so conservation is not vacuous.
  #          total_input_collected = total_actual_output + fee_wedge
  #                                  + fees_captured + solver_reward
  # ---------------------------------------------------------------------------
  - id: "inv_wedge_accounting"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "total_input_collected" }
        - op: "+"
          args:
            - op: "+"
              args: [{ var: "total_actual_output" }, { var: "fee_wedge" }]
            - op: "+"
              args: [{ var: "fees_captured" }, { var: "solver_reward" }]

  # ---------------------------------------------------------------------------
  # (c) ENVELOPE DOMINANCE (lock-step lanes): while scheduling, the adapter's
  #     accepted-order volume equals the greedy-envelope volume, because both
  #     consume the same descending-min stream at the same position with the
  #     same skip-on-fail rule. Negation = lane drift: adapter < greedy
  #     (strictly-dominated accept) or adapter > greedy (fabricated witness
  #     claiming to beat the proven-optimal greedy bound).
  # ---------------------------------------------------------------------------
  - id: "inv_envelope_lockstep"
    kind: "safety"
    expr:
      op: "="
      args: [{ var: "adapter_volume" }, { var: "greedy_volume" }]

  # ---------------------------------------------------------------------------
  # (c') COMMITTED ENVELOPE DOMINANCE: at commit the adapter volume is at
  #      least the greedy envelope (>= because lock-step gives equality, and
  #      Lean proves greedy is the MAX over orders, so >= is the safe side).
  #      This is the consensus-critical 'within envelope' property.
  # ---------------------------------------------------------------------------
  - id: "inv_committed_dominates"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Committed" }]
        - op: ">="
          args: [{ var: "adapter_volume" }, { var: "greedy_volume" }]

  # ---------------------------------------------------------------------------
  # Structural supports (inductive strengthenings).
  # ---------------------------------------------------------------------------

  # Volume is bounded by total committed input (Lean: scheduleVol_le_sum_input).
  - id: "inv_volume_bounded_by_input"
    kind: "safety"
    expr:
      op: "<="
      args: [{ var: "greedy_volume" }, { var: "total_input_collected" }]

  # The committed flag is true iff phase is Committed (keeps phase/flag
  # aligned). Encoded as a two-way implication biconditional.
  - id: "inv_committed_flag_phase"
    kind: "safety"
    expr:
      op: "and"
      args:
        - op: "=>"
          args:
            - { op: "=", args: [{ var: "committed" }, { bool: true }] }
            - { op: "=", args: [{ var: "phase" }, { enum: "Committed" }] }
        - op: "=>"
          args:
            - { op: "=", args: [{ var: "phase" }, { enum: "Committed" }] }
            - { op: "=", args: [{ var: "committed" }, { bool: true }] }

  # Before commit nothing is captured (fees/reward accrue only at commit).
  - id: "inv_no_capture_before_commit"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "or"
          args:
            - { op: "=", args: [{ var: "phase" }, { enum: "Setup" }] }
            - { op: "=", args: [{ var: "phase" }, { enum: "Scheduling" }] }
        - op: "and"
          args:
            - { op: "=", args: [{ var: "fees_captured" }, { const: 0 }] }
            - { op: "=", args: [{ var: "solver_reward" }, { const: 0 }] }

actions:
  # PHASE 0 -> 1: open a batch with a monotone-decreasing output schedule.
  # out_base/decrement define out(pos) = max(0, out_base - pos*decrement),
  # the Lean outputAtN_antitone shape. Guard keeps the schedule well-formed.
  - id: "open_batch"
    params:
      - id: "p_out_base"
        type: { kind: "int", min: 1, max: 1000000 }
      - id: "p_decrement"
        type: { kind: "int", min: 0, max: 1000000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Setup" }] }
        - { op: "<=", args: [{ param: "p_decrement" }, { param: "p_out_base" }] }
    updates:
      - { var: "phase", expr: { enum: "Scheduling" } }
      - { var: "out_base", expr: { param: "p_out_base" } }
      - { var: "decrement", expr: { param: "p_decrement" } }
    effects:
      event: { enum: "BatchOpened" }
      phase_out: { enum: "Scheduling" }
      greedy_vol_out: { const: 0 }
      adapter_vol_out: { const: 0 }

  # PHASE 1: advance ONE shared candidate position. Both lanes act on the
  # same intent (input p_input, min p_min) at the same position, so the
  # adapter and greedy lanes stay in lock-step (shared candidate-order
  # semantics). The schedule output at the current position is
  #   cur_out = out_base - pos*decrement   (>= 0 by guard below).
  # EXECUTE branch fires when the intent is satisfiable: cur_out >= p_min.
  # SKIP is handled by a separate action so the lock-step is explicit.
  - id: "step_execute"
    params:
      - id: "p_input"
        type: { kind: "int", min: 1, max: 1000000 }
      - id: "p_min"
        type: { kind: "int", min: 0, max: 1000000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Scheduling" }] }
        - { op: "<", args: [{ var: "pos" }, { const: 16 }] }
        # schedule output at this position is non-negative (well-formed window)
        - op: ">="
          args:
            - { var: "out_base" }
            - op: "*"
              args: [{ var: "pos" }, { var: "decrement" }]
        # SATISFIABILITY: position output >= intent min (Lean: satisfiable).
        # This is the fairness guard: an executed fill ALWAYS meets its min,
        # so it can never set the under-delivery flag.
        - op: ">="
          args:
            - op: "-"
              args:
                - { var: "out_base" }
                - op: "*"
                  args: [{ var: "pos" }, { var: "decrement" }]
            - { param: "p_min" }
        # the delivered output (cur_out) cannot exceed the input (price-impact
        # wedge is non-negative): cur_out <= p_input  =>  wedge = input-cur_out >= 0.
        - op: "<="
          args:
            - op: "-"
              args:
                - { var: "out_base" }
                - op: "*"
                  args: [{ var: "pos" }, { var: "decrement" }]
            - { param: "p_input" }
        # overflow guards
        - { op: "<=", args: [{ op: "+", args: [{ var: "total_input_collected" }, { param: "p_input" }] }, { const: 16000000 }] }
        - { op: "<=", args: [{ op: "+", args: [{ var: "greedy_volume" }, { param: "p_input" }] }, { const: 16000000 }] }
    updates:
      - { var: "pos", expr: { op: "+", args: [{ var: "pos" }, { const: 1 }] } }
      # both lanes execute the SAME intent => identical volume increment.
      - { var: "greedy_volume", expr: { op: "+", args: [{ var: "greedy_volume" }, { param: "p_input" }] } }
      - { var: "adapter_volume", expr: { op: "+", args: [{ var: "adapter_volume" }, { param: "p_input" }] } }
      - { var: "total_input_collected", expr: { op: "+", args: [{ var: "total_input_collected" }, { param: "p_input" }] } }
      # delivered output = current schedule output (>= p_min by guard).
      - var: "total_actual_output"
        expr:
          op: "+"
          args:
            - { var: "total_actual_output" }
            - op: "-"
              args:
                - { var: "out_base" }
                - op: "*"
                  args: [{ var: "pos" }, { var: "decrement" }]
      # price-impact wedge = input - delivered (>= 0 by guard) accrues to pool.
      - var: "fee_wedge"
        expr:
          op: "+"
          args:
            - { var: "fee_wedge" }
            - op: "-"
              args:
                - { param: "p_input" }
                - op: "-"
                  args:
                    - { var: "out_base" }
                    - op: "*"
                      args: [{ var: "pos" }, { var: "decrement" }]
    effects:
      event: { enum: "GreedyStepExecuted" }
      phase_out: { enum: "Scheduling" }
      greedy_vol_out: { var: "greedy_volume" }
      adapter_vol_out: { var: "adapter_volume" }

  # PHASE 1: SKIP the candidate at the current position in BOTH lanes.
  # Skip-on-fail: the intent's min exceeds the position output, so neither
  # lane executes. Lock-step preserved (both volumes unchanged). This is the
  # ONLY skip path -- the adapter cannot skip what greedy executes or vice
  # versa, which is the shared candidate-order semantics being enforced.
  - id: "step_skip"
    params:
      - id: "p_min"
        type: { kind: "int", min: 1, max: 1000000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Scheduling" }] }
        - { op: "<", args: [{ var: "pos" }, { const: 16 }] }
        - op: ">="
          args:
            - { var: "out_base" }
            - op: "*"
              args: [{ var: "pos" }, { var: "decrement" }]
        # UNSATISFIABLE at this position: position output < intent min.
        - op: ">"
          args:
            - { param: "p_min" }
            - op: "-"
              args:
                - { var: "out_base" }
                - op: "*"
                  args: [{ var: "pos" }, { var: "decrement" }]
    updates:
      - { var: "pos", expr: { op: "+", args: [{ var: "pos" }, { const: 1 }] } }
    effects:
      event: { enum: "GreedyStepSkipped" }
      phase_out: { enum: "Scheduling" }
      greedy_vol_out: { var: "greedy_volume" }
      adapter_vol_out: { var: "adapter_volume" }

  # PHASE 1 -> 2: commit the settlement. The conservation split is bounded
  # by the accumulated wedge: fees + reward <= fee_wedge. The guard does NOT
  # assume conservation of the whole batch; it only consumes the wedge that
  # the per-fill arithmetic already separated out. Lock-step (inv_envelope_
  # lockstep) is what makes adapter_volume >= greedy_volume at Committed.
  - id: "commit_settlement"
    params:
      - id: "p_fee"
        type: { kind: "int", min: 0, max: 16000000 }
      - id: "p_reward"
        type: { kind: "int", min: 0, max: 16000000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Scheduling" }] }
        # protocol can capture at most the accumulated price-impact wedge.
        - op: "<="
          args:
            - op: "+"
              args: [{ param: "p_fee" }, { param: "p_reward" }]
            - { var: "fee_wedge" }
    updates:
      - { var: "phase", expr: { enum: "Committed" } }
      - { var: "committed", expr: { bool: true } }
      - { var: "fees_captured", expr: { param: "p_fee" } }
      - { var: "solver_reward", expr: { param: "p_reward" } }
      # the consumed wedge leaves the residual pool.
      - var: "fee_wedge"
        expr:
          op: "-"
          args:
            - { var: "fee_wedge" }
            - op: "+"
              args: [{ param: "p_fee" }, { param: "p_reward" }]
    effects:
      event: { enum: "SettlementCommitted" }
      phase_out: { enum: "Committed" }
      greedy_vol_out: { var: "greedy_volume" }
      adapter_vol_out: { var: "adapter_volume" }

checks:
  - id: "init_implies_inv"
    kind: "invariant"
  - id: "inductive_open_batch"
    kind: "inductive"
  - id: "inductive_step_execute"
    kind: "inductive"
  - id: "inductive_step_skip"
    kind: "inductive"
  - id: "inductive_commit_settlement"
    kind: "inductive"
