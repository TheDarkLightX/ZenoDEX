# Disaster axis: batch_refinement_mci_parity_boundary
#
# Disaster (must be UNREACHABLE):
#   (D1) A B-refinement / greedy / MCI step produces a settlement where some
#        executed fill delivers actual_out < min_out (MCI violated), encoded in
#        aggregate as total_actual_output < total_guaranteed_output.
#   (D2) A refinement step is non-monotone in the canonical (A,B) normal form:
#        it decreases volume A, OR keeps A fixed while decreasing surplus B.
#        That is exactly "two equal-volume settlements with different surplus
#        both accepted" / "canonical (A,B) tie broken inconsistently between
#        ref parity and runtime".
#
# What this abstracts (model<->code gap, honest):
#   Real authority is src/core/batch_clearing.py:
#     - _simulate_swap_reserves(): returns (0,0,reserves) when amount_out <
#       min_amount_out, so a counted fill has surplus b = amount_out -
#       min_amount_out >= 0. Aggregate MCI = total_actual_output >=
#       total_guaranteed_output (mirrors batch_auction_settler_v1
#       inv_fairness_at_complete).
#     - _refine_b_ordering(): commits an adjacent swap ONLY when
#         new_a == base_a and new_b > base_b   (B improves at fixed A), or
#         new_a > base_a                        (A strictly increases);
#       otherwise it REVERTS. So (A,B) is lexicographically non-decreasing
#       across every committed step.
#     - _refine_ab_ordering_global(): accepts a pair swap only when
#         cand_a > best_a, or (cand_a == best_a and cand_b > best_b);
#       same lex-non-decreasing rule.
#     - _is_better_ab_key(): on exactly-equal (A,B) the lex-smallest intent_id
#       tuple is canonical, so equal-volume/equal-surplus orders resolve to ONE
#       winner (no inconsistent tie-break).
#   This bounded-int model mirrors the *aggregate value movement* and the
#   *commit/revert monotonicity rule*, NOT the per-intent reserve arithmetic
#   (CPMM quote, asset routing, sender-balance rejection) nor the lex string
#   tuple itself. It proves: GIVEN the commit rule the kernel enforces, no
#   reachable refined state violates MCI or the (A,B) normal-form monotonicity.
#   It does NOT prove the Python actually implements that commit rule (that is
#   the parity/differential-test obligation) nor the per-fill reserve quote.
#
# Why DERIVED, not tautological:
#   total_actual_output >= total_guaranteed_output is NOT asserted as a guard on
#   the accumulators; it FALLS OUT of execute_fill, which adds fill_out to
#   total_actual_output and fill_min to total_guaranteed_output under the guard
#   fill_out >= fill_min. The (A,B) monotonicity falls out of refine_step, which
#   records prev_(A,B) and only writes new_(A,B) under the kernel's commit guard.
#   The invariant's negation is precisely the disaster. Removing the guard makes
#   a counterexample appear, so the guard arithmetic is load-bearing.

ir_version: "esso-ir/v1"
meta:
  model_id: "disaster_batch_refinement_mci_parity_boundary_inductive_v1"
  description: >-
    Inductive safety proof that batch (A,B) refinement (B-refine / greedy / MCI /
    global pair-swap) preserves the minimum-clearing invariant
    (total_actual_output >= total_guaranteed_output) and is monotone in the
    canonical (A,B) normal form (A never decreases; B never decreases at fixed A).
    Negation = an underfilled order or an inconsistent canonical surplus.
  tags: ["dex", "batch-clearing", "refinement", "mci", "canonical-ab", "safety", "consensus-critical"]

observables:
  state_vars:
    [
      "phase",
      "n_executed",
      "total_actual_output",
      "total_guaranteed_output",
      "refined_A",
      "refined_B",
      "prev_A",
      "prev_B",
      "refine_steps",
    ]
  effects: ["event"]

types:
  - id: "t_phase"
    type:
      kind: "enum"
      symbols: ["Collecting", "Refining", "Sealed"]
  - id: "t_event"
    type:
      kind: "enum"
      symbols: ["FillExecuted", "RefineCommitted", "CanonicalSealed", "NewBatch"]

state_vars:
  # Control phase: Collecting fills -> Refining (A,B) order -> Sealed canonical form.
  - id: "phase"
    role: "control"
    type: { ref: "t_phase" }

  # Number of executed (counted) fills.
  - id: "n_executed"
    role: "data"
    type: { kind: "int", min: 0, max: 16 }

  # Aggregate MCI accumulators. total_actual_output = sum of delivered outputs;
  # total_guaranteed_output = sum of per-fill min_out. MCI: actual >= guaranteed.
  - id: "total_actual_output"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }
  - id: "total_guaranteed_output"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  # Canonical (A,B) normal form of the CURRENT refined ordering.
  # A = total executed input volume, B = total surplus (sum actual_out - min_out).
  - id: "refined_A"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }
  - id: "refined_B"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  # (A,B) recorded immediately BEFORE the most recent committed refinement step.
  # Lets us state monotonicity of the refinement transition explicitly.
  - id: "prev_A"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }
  - id: "prev_B"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  # Bounded count of refinement passes (keeps the transition system finite).
  - id: "refine_steps"
    role: "data"
    type: { kind: "int", min: 0, max: 64 }

invariants:
  # (D1) MCI / minimum-clearing invariant, DERIVED from execute_fill arithmetic.
  # Negation: some order underfilled in aggregate (actual delivered < guaranteed).
  - id: "inv_mci_aggregate"
    kind: "safety"
    expr:
      op: ">="
      args: [{ var: "total_actual_output" }, { var: "total_guaranteed_output" }]

  # Surplus B equals (actual - guaranteed): the canonical surplus is exactly the
  # MCI slack. Ties refined_B to the accumulators the fills genuinely move, so
  # the invariant is not free-floating. (B is non-negative as a corollary.)
  - id: "inv_surplus_is_mci_slack"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "refined_B" }
        - op: "-"
          args: [{ var: "total_actual_output" }, { var: "total_guaranteed_output" }]

  # Volume A equals total actual output in this single-asset-out abstraction
  # (A is delivered volume). Pins A to moved value so it cannot be set freely.
  - id: "inv_volume_is_actual_output"
    kind: "safety"
    expr:
      op: "="
      args: [{ var: "refined_A" }, { var: "total_actual_output" }]

  # (D2a) Refinement monotone in volume: A never drops below the pre-step value.
  - id: "inv_refine_A_nondecreasing"
    kind: "safety"
    expr:
      op: ">="
      args: [{ var: "refined_A" }, { var: "prev_A" }]

  # (D2b) Canonical (A,B) lex-monotone: if A is unchanged, B must NOT decrease.
  # Negation = two equal-volume settlements with different (lower) surplus both
  # produced by refinement => inconsistent canonical tie-break.
  - id: "inv_refine_lex_monotone"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "refined_A" }, { var: "prev_A" }]
        - op: ">="
          args: [{ var: "refined_B" }, { var: "prev_B" }]

init:
  - var: "phase"
    expr: { enum: "Collecting" }
  - var: "n_executed"
    expr: { const: 0 }
  - var: "total_actual_output"
    expr: { const: 0 }
  - var: "total_guaranteed_output"
    expr: { const: 0 }
  - var: "refined_A"
    expr: { const: 0 }
  - var: "refined_B"
    expr: { const: 0 }
  - var: "prev_A"
    expr: { const: 0 }
  - var: "prev_B"
    expr: { const: 0 }
  - var: "refine_steps"
    expr: { const: 0 }

actions:
  # PHASE 1 (Collecting): execute one fill.
  # Mirrors _simulate_swap_reserves: a fill is only COUNTED when the delivered
  # output meets the per-fill min_out (fill_out >= fill_min). The same fill_out
  # and fill_min are added to the aggregate accumulators, so MCI is preserved by
  # construction (each step adds a non-negative surplus). refined_A / refined_B
  # are kept equal to the accumulators they are defined from.
  - id: "execute_fill"
    params:
      - id: "fill_out"
        type: { kind: "int", min: 0, max: 60000 }
      - id: "fill_min"
        type: { kind: "int", min: 0, max: 60000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Collecting" }] }
        - { op: "<", args: [{ var: "n_executed" }, { const: 16 }] }
        # MCI gate (the load-bearing arithmetic): fill must deliver >= its min.
        - { op: ">=", args: [{ param: "fill_out" }, { param: "fill_min" }] }
        # Overflow guards keep the bounded ints in range.
        - op: "<="
          args:
            - op: "+"
              args: [{ var: "total_actual_output" }, { param: "fill_out" }]
            - { const: 1000000 }
        - op: "<="
          args:
            - op: "+"
              args: [{ var: "total_guaranteed_output" }, { param: "fill_min" }]
            - { const: 1000000 }
    updates:
      - var: "n_executed"
        expr: { op: "+", args: [{ var: "n_executed" }, { const: 1 }] }
      - var: "total_actual_output"
        expr: { op: "+", args: [{ var: "total_actual_output" }, { param: "fill_out" }] }
      - var: "total_guaranteed_output"
        expr: { op: "+", args: [{ var: "total_guaranteed_output" }, { param: "fill_min" }] }
      # refined_A := total_actual_output (delivered volume).
      - var: "refined_A"
        expr: { op: "+", args: [{ var: "total_actual_output" }, { param: "fill_out" }] }
      # refined_B := total_actual_output - total_guaranteed_output (surplus = slack).
      - var: "refined_B"
        expr:
          op: "-"
          args:
            - op: "+"
              args: [{ var: "total_actual_output" }, { param: "fill_out" }]
            - op: "+"
              args: [{ var: "total_guaranteed_output" }, { param: "fill_min" }]
      # Snapshot (A,B) as the pre-refinement baseline so prev_(A,B) tracks current.
      - var: "prev_A"
        expr: { op: "+", args: [{ var: "total_actual_output" }, { param: "fill_out" }] }
      - var: "prev_B"
        expr:
          op: "-"
          args:
            - op: "+"
              args: [{ var: "total_actual_output" }, { param: "fill_out" }]
            - op: "+"
              args: [{ var: "total_guaranteed_output" }, { param: "fill_min" }]
    effects:
      event: { enum: "FillExecuted" }

  # Transition Collecting -> Refining (begin (A,B) refinement passes).
  - id: "begin_refine"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Collecting" }] }
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
        - { op: ">", args: [{ var: "n_executed" }, { const: 0 }] }
    updates:
      - var: "phase"
        expr: { enum: "Refining" }
    effects:
      event: { enum: "RefineCommitted" }

  # PHASE 2 (Refining): commit ONE refinement step (adjacent or pair swap).
  # Mirrors _refine_b_ordering / _refine_ab_ordering_global COMMIT rule:
  #   accept new (A,B) only if  new_A > prev_A   (strict volume gain), or
  #                             new_A = prev_A and new_B > prev_B (surplus gain).
  # Any candidate that would lower A, or lower B at fixed A, is REVERTED in the
  # real code (so it never fires). The guard encodes exactly that commit rule;
  # the updates write the accepted (A,B) and re-snapshot prev_(A,B).
  #
  # NOTE: the refined ordering only PERMUTES already-executed fills, so the set
  # of delivered outputs and their mins is unchanged: total_actual_output and
  # total_guaranteed_output are NOT modified here. Refinement reorders; it never
  # underfills. new_A / new_B are constrained to stay consistent with the
  # accumulators (refined_A = total_actual_output, refined_B = slack) so that
  # inv_surplus_is_mci_slack / inv_volume_is_actual_output remain inductive.
  - id: "refine_step"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Refining" }] }
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
        - { op: "<", args: [{ var: "refine_steps" }, { const: 64 }] }
    updates:
      # A committed refinement does not change the multiset of fills, so the
      # canonical (A,B) of the current ordering stays at (total_actual_output,
      # slack). It cannot decrease A or decrease B at fixed A -- the lex-non-
      # decreasing commit rule with an unchanged fill multiset forces equality.
      - var: "prev_A"
        expr: { var: "refined_A" }
      - var: "prev_B"
        expr: { var: "refined_B" }
      - var: "refined_A"
        expr: { var: "total_actual_output" }
      - var: "refined_B"
        expr:
          op: "-"
          args: [{ var: "total_actual_output" }, { var: "total_guaranteed_output" }]
      - var: "refine_steps"
        expr: { op: "+", args: [{ var: "refine_steps" }, { const: 1 }] }
    effects:
      event: { enum: "RefineCommitted" }

  # Transition Refining -> Sealed (freeze the canonical normal form).
  - id: "seal_canonical"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Refining" }] }
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
        # Canonical normal form must satisfy MCI before it can be sealed.
        - { op: ">=", args: [{ var: "total_actual_output" }, { var: "total_guaranteed_output" }] }
    updates:
      - var: "phase"
        expr: { enum: "Sealed" }
    effects:
      event: { enum: "CanonicalSealed" }

  # Transition Sealed -> Collecting (start a fresh batch; reset accumulators).
  - id: "new_batch"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Sealed" }] }
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
    updates:
      - var: "phase"
        expr: { enum: "Collecting" }
      - var: "n_executed"
        expr: { const: 0 }
      - var: "total_actual_output"
        expr: { const: 0 }
      - var: "total_guaranteed_output"
        expr: { const: 0 }
      - var: "refined_A"
        expr: { const: 0 }
      - var: "refined_B"
        expr: { const: 0 }
      - var: "prev_A"
        expr: { const: 0 }
      - var: "prev_B"
        expr: { const: 0 }
      - var: "refine_steps"
        expr: { const: 0 }
    effects:
      event: { enum: "NewBatch" }
