services:
  zeno-ledger-two-node-smoke:
    build:
      context: .
      dockerfile: Dockerfile.operator-tools
    image: zenodex/operator-tools:local
    command:
      - tools/zeno_ledger_public_network_smoke.py
      - --out-dir
      - /app/data/public-network-smoke
      - --network-id
      - zeno-ledger-testnet-v0
      - --chain-id
      - zeno-ledger-testnet-v0
      - --report-out
      - /app/data/public-network-smoke/report.json
    volumes:
      - zeno-ledger-two-node-data:/app/data
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=128m

volumes:
  zeno-ledger-two-node-data:
