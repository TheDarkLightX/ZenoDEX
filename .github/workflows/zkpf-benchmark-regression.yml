name: zkpf-benchmark-regression

on:
  pull_request:
    paths:
      - 'config/proof_profiles/zkpf_benchmark_development_policy_v1.json'
      - 'docs/research/ZKPF_BENCHMARK_REGRESSION_GATE_V1.md'
      - 'tools/check_zkpf_benchmark_regression.py'
      - 'tests/test_check_zkpf_benchmark_regression.py'
      - '.github/workflows/zkpf-benchmark-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'config/proof_profiles/zkpf_benchmark_development_policy_v1.json'
      - 'docs/research/ZKPF_BENCHMARK_REGRESSION_GATE_V1.md'
      - 'tools/check_zkpf_benchmark_regression.py'
      - 'tests/test_check_zkpf_benchmark_regression.py'
      - '.github/workflows/zkpf-benchmark-regression.yml'

permissions:
  contents: read

jobs:
  benchmark-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install hash-pinned assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run gate assurance
        run: |
          set -euo pipefail
          ruff check \
            tools/check_zkpf_benchmark_regression.py \
            tests/test_check_zkpf_benchmark_regression.py
          mypy --follow-imports=skip \
            tools/check_zkpf_benchmark_regression.py \
            tests/test_check_zkpf_benchmark_regression.py
          pytest -q tests/test_check_zkpf_benchmark_regression.py
