name: zkpf-reproof-planner

on:
  pull_request:
    paths:
      - 'config/proof_profiles/zkpf_reproof_graph_v1.json'
      - 'docs/research/ZKPF_REPROOF_PLANNER_V1.md'
      - 'tools/plan_zkpf_reproof.py'
      - 'tests/test_plan_zkpf_reproof.py'
      - '.github/workflows/zkpf-reproof-planner.yml'
  push:
    branches:
      - main
    paths:
      - 'config/proof_profiles/zkpf_reproof_graph_v1.json'
      - 'docs/research/ZKPF_REPROOF_PLANNER_V1.md'
      - 'tools/plan_zkpf_reproof.py'
      - 'tests/test_plan_zkpf_reproof.py'
      - '.github/workflows/zkpf-reproof-planner.yml'

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install hash-pinned assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run static and focused assurance
        run: |
          set -euo pipefail
          ruff check \
            tools/plan_zkpf_reproof.py \
            tests/test_plan_zkpf_reproof.py
          mypy --follow-imports=skip \
            tools/plan_zkpf_reproof.py \
            tests/test_plan_zkpf_reproof.py
          pytest -q tests/test_plan_zkpf_reproof.py

      - name: Emit a content-addressed sample task bundle
        run: |
          set -euo pipefail
          rm -rf internal/zkpf-reproof-sample
          mkdir -p internal
          python3 tools/plan_zkpf_reproof.py \
            --changed-path zk/zrpf_risc0/spot_value_leaf_v6_shared/src/lib.rs \
            --tasks-directory internal/zkpf-reproof-sample \
            > internal/zkpf-reproof-sample-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('internal/zkpf-reproof-sample-plan.json').read_text())
          stages = [row['stage_id'] for row in plan['tasks']]
          expected = [
              'spot_value_leaf_v6',
              'spot_value_aggregate_l1_v6',
              'spot_value_aggregate_l2_v6',
              'spot_settlement_v6',
              'spot_settlement_v7',
              'zrpf_host_verifiers',
              'release_closure_v7',
              'firecracker_authority_v7',
              'atomic_operational_join_v7',
              'production_qualification',
          ]
          if stages != expected:
              raise SystemExit(f'unexpected task chain: {stages!r}')
          if any(plan['authority'].values()):
              raise SystemExit('planner attempted to promote authority')
          PY

      - name: Upload sample planner output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zkpf-reproof-planner-sample
          path: |
            internal/zkpf-reproof-sample-plan.json
            internal/zkpf-reproof-sample
          if-no-files-found: error
          retention-days: 14
