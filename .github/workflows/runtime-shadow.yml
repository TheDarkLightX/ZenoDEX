name: runtime-shadow

# Deterministic-runtime migration gate: Python reference tests, the Rust core
# (test/clippy/fmt), golden-trace export/replay determinism, and the Python/Rust
# shadow differential. Tau/ESSO/Lean obligations are exercised by their own
# workflows and are intentionally not duplicated or weakened here.

on:
  pull_request:
    paths:
      - "src/core/fee_router.py"
      - "src/state/canonical.py"
      - "tools/runtime/**"
      - "tests/runtime/**"
      - "rust-runtime/**"
      - ".github/workflows/runtime-shadow.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "src/core/fee_router.py"
      - "src/state/canonical.py"
      - "tools/runtime/**"
      - "tests/runtime/**"
      - "rust-runtime/**"
      - ".github/workflows/runtime-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-runtime:
    name: Python runtime tests + golden traces
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Python runtime tests (reference + golden trace)
        run: python -m pytest tests/runtime -q --ignore=tests/runtime/test_fee_router_conformance.py

      - name: Golden trace export is deterministic (byte-stable)
        run: |
          python3 tools/runtime/export_golden_trace.py --out /tmp/smoke.json
          diff -u tests/runtime/golden_traces/smoke.json /tmp/smoke.json

      - name: Golden trace replays cleanly
        run: python3 tools/runtime/replay_golden_trace.py tests/runtime/golden_traces/smoke.json

  rust-runtime:
    name: Rust core (test / clippy / fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain fingerprint
        run: |
          rustc --version
          cargo --version

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  python-rust-shadow:
    name: Python/Rust shadow differential
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Build Rust shadow CLI
        working-directory: rust-runtime
        run: cargo build --bin zenodex-runtime

      - name: Python/Rust conformance differential
        run: python -m pytest tests/runtime/test_fee_router_conformance.py -q

      - name: Shadow replay (Rust must agree with Python)
        run: python3 tools/runtime/rust_shadow_replay.py tests/runtime/golden_traces/smoke.json
