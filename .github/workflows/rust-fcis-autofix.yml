name: rust-fcis-autofix

on:
  push:
    branches:
      - agent/rust-fcis-policy-inventory-20260722

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-fcis-policy-inventory-20260722
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Apply safe Ruff fixes and canonical formatting
        run: |
          python -m ruff check --fix \
            tools/check_rust_fcis_policy.py \
            tests/tools/test_check_rust_fcis_policy.py
          python -m ruff format \
            tools/check_rust_fcis_policy.py \
            tests/tools/test_check_rust_fcis_policy.py
      - name: Publish only when changed
        run: |
          if git diff --quiet; then
            echo "already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check_rust_fcis_policy.py tests/tools/test_check_rust_fcis_policy.py
          git commit -m "style(runtime): canonicalize Rust FCIS checker"
          git push origin HEAD:agent/rust-fcis-policy-inventory-20260722
