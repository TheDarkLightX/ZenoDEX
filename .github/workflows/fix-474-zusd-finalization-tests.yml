name: fix-474-zusd-finalization-tests

on:
  pull_request:
    branches:
      - agent/rust-fcis-policy-inventory-20260722
    paths:
      - ".github/workflows/fix-474-zusd-finalization-tests.yml"

concurrency:
  group: fix-474-zusd-finalization-tests
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-test-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/rust-zusd-audit-parity-20260722' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-zusd-audit-parity-20260722
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Insert explicit Oracle finalization in monetary integration witnesses
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/test_tau_testnet_dex_plugin.py")
          text = path.read_text(encoding="utf-8")

          old_first = '''    assert ok4 is True, err4

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json4,
'''
          new_first = '''    assert ok4 is True, err4

    ok_commit, app_state_json_commit, _hash_commit, _patch_commit, err_commit = (
        plugin.apply_app_tx(
            app_state_json=app_state_json4,
            chain_balances=chain_balances,
            operations={
                "11": [
                    {
                        "module": "ZUSDFinance",
                        "action": "oracle_commit",
                        "nonce": 3,
                        "deadline": deadline,
                    }
                ]
            },
            tx_sender_pubkey=oracle,
            block_timestamp=6,
        )
    )
    assert ok_commit is True, err_commit

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json_commit,
'''
          if text.count(old_first) != 1:
              raise SystemExit(f"first liquidation preimage count={text.count(old_first)}")
          text = text.replace(old_first, new_first, 1)

          old_first_time = '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )
    assert ok5 is True, err5
'''
          new_first_time = '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )
    assert ok5 is True, err5
'''
          if text.count(old_first_time) < 1:
              raise SystemExit("first liquidation timestamp preimage missing")
          text = text.replace(old_first_time, new_first_time, 1)

          old_claim_time = '''        tx_sender_pubkey=alice,
        block_timestamp=7,
    )
    assert ok6 is True, err6
'''
          new_claim_time = '''        tx_sender_pubkey=alice,
        block_timestamp=8,
    )
    assert ok6 is True, err6
'''
          if text.count(old_claim_time) != 1:
              raise SystemExit(f"claim timestamp preimage count={text.count(old_claim_time)}")
          text = text.replace(old_claim_time, new_claim_time, 1)

          old_second = '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
    ):
'''
          new_second = '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
        (
            6,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_commit",
                "nonce": 3,
                "deadline": deadline,
            },
        ),
    ):
'''
          if text.count(old_second) != 1:
              raise SystemExit(f"second liquidation preimage count={text.count(old_second)}")
          text = text.replace(old_second, new_second, 1)

          old_second_time = '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )

    assert ok is True, err
'''
          new_second_time = '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )

    assert ok is True, err
'''
          if text.count(old_second_time) != 1:
              raise SystemExit(f"second liquidation timestamp count={text.count(old_second_time)}")
          text = text.replace(old_second_time, new_second_time, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff check --fix tests/integration/test_tau_testnet_dex_plugin.py
          python -m ruff format tests/integration/test_tau_testnet_dex_plugin.py

      - name: Run focused monetary integration witnesses
        run: |
          python -m pytest -q \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_stability_pool_liquidation_and_claim \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_liquidation_compensation_pays_keeper

      - name: Publish clean test repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-474-zusd-finalization-tests.yml
          git add tests/integration/test_tau_testnet_dex_plugin.py
          git add -u .github/workflows/fix-474-zusd-finalization-tests.yml
          git commit -m "test(zusd): finalize Oracle before monetary liquidation"
          git push origin HEAD:agent/rust-zusd-audit-parity-20260722
