name: apply-audit-patch

on:
  push:
    branches:
      - agent/zusd-total-debt-cap-20260721

permissions:
  contents: write

jobs:
  apply-zusd-total-debt-cap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/zusd-total-debt-cap-20260721
          fetch-depth: 0

      - name: Detect staged repair
        id: staged
        shell: bash
        run: |
          if [[ -f .agent/zusd-total-debt-cap.patch.b64 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.staged.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development tooling
        if: steps.staged.outputs.present == 'true'
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Apply exact source transformation
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/core/zusd.py")
          text = path.read_text(encoding="utf-8")

          replacements = (
              (
                  '    if (state.free_debt_e8 + state.sp_debt_e8) != state.debt_e8:\n'
                  '        failed.append("inv_supply_conservation")\n'
                  '    if not _debt_floor_ok(debt_e8=state.debt_e8, min_debt_open_e8=state.min_debt_open_e8):',
                  '    if (state.free_debt_e8 + state.sp_debt_e8) != state.debt_e8:\n'
                  '        failed.append("inv_supply_conservation")\n'
                  '    if state.debt_e8 > state.max_debt_supply_e8:\n'
                  '        failed.append("inv_total_debt_cap")\n'
                  '    if not _debt_floor_ok(debt_e8=state.debt_e8, min_debt_open_e8=state.min_debt_open_e8):',
              ),
              (
                  '            if (state.free_debt_e8 + debt_delta) > state.max_debt_supply_e8:\n'
                  '                return ZUSDStepResult(ok=False, error="mint exceeds max_debt_supply_e8")',
                  '            if new_debt > state.max_debt_supply_e8:\n'
                  '                return ZUSDStepResult(ok=False, error="mint exceeds max_debt_supply_e8")',
              ),
              (
                  '    if (state.free_debt_e8 + state.sp_debt_e8) != td:\n'
                  '        failed.append("inv_supply_conservation")\n'
                  '    if not _debt_floor_ok(debt_e8=state.vault_a.debt_e8, min_debt_open_e8=state.min_debt_open_e8):',
                  '    if (state.free_debt_e8 + state.sp_debt_e8) != td:\n'
                  '        failed.append("inv_supply_conservation")\n'
                  '    if td > state.max_debt_supply_e8:\n'
                  '        failed.append("inv_total_debt_cap")\n'
                  '    if not _debt_floor_ok(debt_e8=state.vault_a.debt_e8, min_debt_open_e8=state.min_debt_open_e8):',
              ),
              (
                  '            if (state.free_debt_e8 + debt_delta) > state.max_debt_supply_e8:\n'
                  '                return ZUSDMultiStepResult(ok=False, error="mint exceeds max_debt_supply_e8")',
                  '            if (_total_debt(state) + debt_delta) > state.max_debt_supply_e8:\n'
                  '                return ZUSDMultiStepResult(ok=False, error="mint exceeds max_debt_supply_e8")',
              ),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate total-debt-cap repair
        if: steps.staged.outputs.present == 'true'
        run: |
          python -m ruff check src/core/zusd.py tests/core/test_zusd_total_debt_cap.py
          python -m py_compile src/core/zusd.py
          python -m pytest -q \
            tests/core/test_zusd_total_debt_cap.py \
            tests/core/test_zusd.py \
            tests/core/test_zusd_multi.py

      - name: Commit applied repair
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          rm -f .agent/zusd-total-debt-cap.patch.b64
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-audit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(zusd): cap free plus Stability Pool debt"
          git push origin HEAD:agent/zusd-total-debt-cap-20260721
