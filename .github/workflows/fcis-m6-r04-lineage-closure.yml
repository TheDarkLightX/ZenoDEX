name: fcis-m6-r04-lineage-closure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fcis-m6-r04-lineage-closure.yml"
      - "src/core/fcis_lineage_closure.py"
      - "tests/core/test_fcis_lineage_closure.py"
  pull_request:
    paths:
      - ".github/workflows/fcis-m6-r04-lineage-closure.yml"
      - "src/core/fcis_lineage_closure.py"
      - "tests/core/test_fcis_lineage_closure.py"

permissions:
  contents: write

jobs:
  assurance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact development requirements
        run: python -m pip install --requirement requirements-dev.txt
      - name: Apply the deterministic formatter and strict-type repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/core/fcis_lineage_closure.py")
          text = path.read_text(encoding="utf-8")
          old = "        claim = cast(FCISLineageClaimV1, claim_object)\n"
          if old in text:
              path.write_text(text.replace(old, "        claim = claim_object\n", 1), encoding="utf-8")
          PY
          python -m ruff check --fix \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_lineage_closure.py
          python -m ruff format \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_lineage_closure.py
      - name: Commit the exact repair once
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_lineage_closure.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_lineage_closure.py
          git commit -m "Normalize R04 imports and strict typing"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Compile exact files
        run: |
          python -m py_compile \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py
      - name: Lint and format-check exact files
        run: |
          python -m ruff check \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py
          python -m ruff format --check \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py
      - name: Type-check immutable research modules
        run: |
          python -m mypy \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py
      - name: Run focused R01 and R04 semantic tests
        run: |
          python -m pytest -q \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py
