name: fcis-m6-r04-lineage-closure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fcis-m6-r04-lineage-closure.yml"
      - "src/core/fcis_lineage_closure.py"
      - "src/core/fcis_fee_occurrence_extractor.py"
      - "src/core/fcis_source_bound_lineage.py"
      - "tests/core/test_fcis_lineage_closure.py"
      - "tests/core/test_fcis_fee_occurrence_extractor.py"
      - "tests/core/test_fcis_source_bound_lineage.py"
  pull_request:
    paths:
      - ".github/workflows/fcis-m6-r04-lineage-closure.yml"
      - "src/core/fcis_lineage_closure.py"
      - "src/core/fcis_fee_occurrence_extractor.py"
      - "src/core/fcis_source_bound_lineage.py"
      - "tests/core/test_fcis_lineage_closure.py"
      - "tests/core/test_fcis_fee_occurrence_extractor.py"
      - "tests/core/test_fcis_source_bound_lineage.py"

permissions:
  contents: write

jobs:
  assurance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact development requirements
        run: python -m pip install --requirement requirements-dev.txt
      - name: Remove unreachable exhaustive-union branches
        run: |
          python - <<'PY'
          from pathlib import Path

          extractor = Path("src/core/fcis_fee_occurrence_extractor.py")
          text = extractor.read_text(encoding="utf-8")
          replacements = (
              (
                  "    exact_evaluation = evaluation\n",
                  "    exact_evaluation = cast(FCISStepEvaluationOkV1, evaluation)\n",
              ),
              (
                  "    if type(segment_result) is not CanonicalFeeOccurrenceSegmentV1:\n"
                  "        return _reject_v1(\n"
                  "            SourceBoundFeeOccurrenceCodeV1.INTERNAL_RELATION_FAILURE,\n"
                  "            \"segment\",\n"
                  "        )\n",
                  "",
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing extractor repair target: {old!r}")
              text = text.replace(old, new, 1)
          extractor.write_text(text, encoding="utf-8")

          source = Path("src/core/fcis_source_bound_lineage.py")
          text = source.read_text(encoding="utf-8")
          blocks = (
              "    if type(extraction) is not SourceBoundFeeOccurrenceV1:\n"
              "        return _reject_v1(\n"
              "            FCISSourceBoundLineageCodeV1.INTERNAL_RELATION_FAILURE,\n"
              "            \"extraction\",\n"
              "        )\n",
              "    if type(bundle) is not CommitBundleV1:\n"
              "        return _reject_v1(\n"
              "            FCISSourceBoundLineageCodeV1.INTERNAL_RELATION_FAILURE,\n"
              "            \"bundle\",\n"
              "        )\n",
              "    if type(closure) is not FCISLineageClosureCertificateV1:\n"
              "        return _reject_v1(\n"
              "            FCISSourceBoundLineageCodeV1.INTERNAL_RELATION_FAILURE,\n"
              "            \"closure\",\n"
              "        )\n",
              "    if type(fresh_extraction) is not SourceBoundFeeOccurrenceV1:\n"
              "        return _reject_v1(\n"
              "            FCISSourceBoundLineageCodeV1.INTERNAL_RELATION_FAILURE,\n"
              "            \"fresh_extraction\",\n"
              "        )\n",
              "    if type(fresh_closure) is not FCISLineageClosureCertificateV1:\n"
              "        return _reject_v1(\n"
              "            FCISSourceBoundLineageCodeV1.INTERNAL_RELATION_FAILURE,\n"
              "            \"fresh_closure\",\n"
              "        )\n",
          )
          for block in blocks:
              if block not in text:
                  raise SystemExit(f"missing source-bound repair target: {block!r}")
              text = text.replace(block, "", 1)
          source.write_text(text, encoding="utf-8")
          PY
          python -m ruff check --fix \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py
          python -m ruff format \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py
      - name: Commit exact typing repair once
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py
          git commit -m "Close source-bound lineage typing"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Compile exact files
        run: |
          python -m py_compile \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_extractor.py \
            tests/core/test_fcis_source_bound_lineage.py
      - name: Lint and format-check exact files
        run: |
          python -m ruff check \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_extractor.py \
            tests/core/test_fcis_source_bound_lineage.py
          python -m ruff format --check \
            src/core/fcis_lineage_closure.py \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py \
            tests/core/test_fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_extractor.py \
            tests/core/test_fcis_source_bound_lineage.py
      - name: Type-check immutable research modules
        run: |
          python -m mypy \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            src/core/fcis_fee_occurrence_extractor.py \
            src/core/fcis_source_bound_lineage.py
      - name: Run focused R01 and R04 semantic tests
        run: |
          python -m pytest -q \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_extractor.py \
            tests/core/test_fcis_source_bound_lineage.py
