name: fcis-m6-r04-lineage-closure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fcis-m6-r04-lineage-closure.yml"
      - "src/core/fcis_lineage_closure.py"
      - "tests/core/test_fcis_lineage_closure.py"
  pull_request:
    paths:
      - ".github/workflows/fcis-m6-r04-lineage-closure.yml"
      - "src/core/fcis_lineage_closure.py"
      - "tests/core/test_fcis_lineage_closure.py"

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact development requirements
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile exact files
        run: |
          python -m py_compile \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py
      - name: Lint exact files
        run: |
          python -m ruff check \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py
          python -m ruff format --check \
            src/core/fcis_lineage_closure.py \
            tests/core/test_fcis_lineage_closure.py
      - name: Type-check immutable research modules
        run: |
          python -m mypy \
            src/core/fcis_fee_occurrence_normal_form.py \
            src/core/fcis_lineage_closure.py
      - name: Run focused R01 and R04 semantic tests
        run: |
          python -m pytest -q \
            tests/core/test_fcis_fee_occurrence_normal_form.py \
            tests/core/test_fcis_lineage_closure.py
