name: fcis-m6-r04-lineage-closure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fcis-m6-r04-lineage-closure.yml"
      - "src/core/fcis_fee_occurrence_extractor.py"

permissions:
  contents: write

jobs:
  assurance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact development requirements
        run: python -m pip install --requirement requirements-dev.txt
      - name: Format the pre-evaluation extractor
        run: python -m ruff format src/core/fcis_fee_occurrence_extractor.py
      - name: Commit exact formatting once
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- src/core/fcis_fee_occurrence_extractor.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/fcis_fee_occurrence_extractor.py
          git commit -m "Format pre-evaluation fee extractor"
          git push origin "HEAD:${HEAD_BRANCH}"
