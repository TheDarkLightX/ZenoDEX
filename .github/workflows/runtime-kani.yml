name: runtime-kani

# Kani is proof evidence for the Rust functional core. It is intentionally kept
# as a scheduled/manual receipt workflow first: the full harness sweep is heavier
# than ordinary PR CI, and promotion claims are recorded in docs/runtime/receipts.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  rust-core-kani:
    name: Rust core Kani proof sweep
    runs-on: ubuntu-20.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Kani harnesses
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: rust-runtime/crates/zenodex-runtime-core
          args: --lib --output-format terse -j 4 --harness-timeout 10m -Z unstable-options
