name: zeno-proof-client-package

# Build + test + publish-readiness check for the @zenodex/proof-client SDK
# package. Catches: drift between dex-ui source and package source, pinning
# violations, ESLint regressions, BLS verifier failures, cross-language
# disagreement with py_ecc.

on:
  pull_request:
    paths:
      - "packages/zeno-proof-client/**"
      - "tools/dex-ui/src/sdk/**"
      - "tools/sync_zeno_proof_client_package.sh"
      - "tests/fixtures/zeno_bls_public_key_dedupe_v0.json"
      - "tests/integration/test_zeno_proof_client_package.py"
      - ".github/workflows/zeno-proof-client-package.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "packages/zeno-proof-client/**"
      - "tools/dex-ui/src/sdk/**"
      - "tools/sync_zeno_proof_client_package.sh"
      - "tests/fixtures/zeno_bls_public_key_dedupe_v0.json"
      - "tests/integration/test_zeno_proof_client_package.py"
      - ".github/workflows/zeno-proof-client-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked Python deps
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Verify package source is in sync with dex-ui
        run: bash tools/sync_zeno_proof_client_package.sh --check

      - name: Install package deps (exact pin)
        run: |
          cd packages/zeno-proof-client
          npm ci || npm install --no-audit --no-fund

      - name: Confirm @noble/curves install matches declared pin
        run: |
          cd packages/zeno-proof-client
          node -e "const p=require('./node_modules/@noble/curves/package.json'); if (p.version !== '1.2.0') { console.error('expected @noble/curves@1.2.0 got', p.version); process.exit(1); }"

      - name: Run package tests
        run: |
          cd packages/zeno-proof-client
          npm test

      - name: npm pack dry-run (publish readiness)
        run: |
          cd packages/zeno-proof-client
          npm pack --dry-run

      - name: Run packaging gate tests (Python)
        run: |
          python -m pytest -v tests/integration/test_zeno_proof_client_package.py

      - name: Lint dex-ui SDK source
        run: |
          cd tools/dex-ui
          npm install --no-audit --no-fund
          npx eslint src/sdk/zenoProofClient.js src/sdk/zenoProofClient.test.mjs src/sdk/zenoBlsVerifier.js src/sdk/zenoBlsVerifier.test.mjs

      - name: Run dex-ui SDK tests (cross-language)
        run: |
          cd tools/dex-ui
          npm run test:sdk
          npm run test:config

      - name: Run Python SDK + TLA tests
        run: |
          python -m pytest -v tests/test_zeno_sdk_browser_bundle.py tests/formal/test_tla_zeno_sdk_wallet_sync_checkpoint.py
