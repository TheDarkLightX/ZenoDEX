name: zkpf-change-review

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  review-intent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Evaluate exact change-set review requirements
        id: review
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          mkdir -p internal
          if test "${EVENT_NAME}" = pull_request; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
          fi
          python3 tools/check_zkpf_change_review.py \
            --repository . \
            --base "${base}" \
            --head "${head}" \
            --require-review \
            > internal/zkpf-change-review-report.json \
            2> internal/zkpf-change-review-error.log
          status=$?
          printf '%s\n' "${status}" > internal/zkpf-change-review.status
          cat internal/zkpf-change-review-report.json || true
          cat internal/zkpf-change-review-error.log >&2 || true
          exit 0

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zkpf-change-review-report
          path: |
            internal/zkpf-change-review-report.json
            internal/zkpf-change-review-error.log
            internal/zkpf-change-review.status
          if-no-files-found: error
          retention-days: 30

      - name: Enforce review intent gate
        run: test "$(cat internal/zkpf-change-review.status)" = 0

  gate-self-assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install hash-pinned assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run gate assurance
        run: |
          set -euo pipefail
          ruff check \
            tools/check_zkpf_change_review.py \
            tests/test_check_zkpf_change_review.py
          mypy --follow-imports=skip \
            tools/check_zkpf_change_review.py \
            tests/test_check_zkpf_change_review.py
          pytest -q tests/test_check_zkpf_change_review.py
