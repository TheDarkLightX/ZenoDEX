name: tau-adt-table-lab

on:
  push:
    branches: ["lab/tau-adt-tables-20260901"]
  pull_request:
    paths:
      - "experiments/tau_adt_tables/**"
      - ".github/workflows/tau-adt-table-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tau-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libboost-all-dev python3 unzip wget

      - name: Install pinned prebuilt cvc5 1.3.1
        run: |
          set -euxo pipefail
          CVC5_ZIP=/tmp/cvc5-Linux-x86_64-shared.zip
          wget -q https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-shared.zip -O "$CVC5_ZIP"
          echo "2c845fed0ad0ab8b06391f0b2ddb9868bb0cf48f3806ad658ef3499cb1f0ba6f  $CVC5_ZIP" | sha256sum -c -
          rm -rf /tmp/cvc5-prebuilt
          mkdir -p /tmp/cvc5-prebuilt
          unzip -q "$CVC5_ZIP" -d /tmp/cvc5-prebuilt
          CVC5_HEADER="$(find /tmp/cvc5-prebuilt -type f -path '*/include/cvc5/cvc5.h' -print -quit)"
          test -n "$CVC5_HEADER"
          CVC5_ROOT="$(dirname "$(dirname "$(dirname "$CVC5_HEADER")")")"
          echo "cvc5 root: $CVC5_ROOT"
          test -f "$CVC5_ROOT/lib/libcvc5.so"
          test -d "$CVC5_ROOT/lib/cmake/cvc5"
          mkdir -p "$HOME/.tau/cvc5/dist"
          cp -a "$CVC5_ROOT"/. "$HOME/.tau/cvc5/dist/"
          "$HOME/.tau/cvc5/dist/bin/cvc5" --version | head -20
          echo "$HOME/.tau/cvc5/dist/lib" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.tau/cvc5/dist/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build exact pinned Tau source
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/IDNI/tau-lang.git /tmp/tau-lang
          cd /tmp/tau-lang
          git checkout 0ac2756fdff71338668bdeccd17b2a53e7be5198
          git submodule update --init --recursive
          ./dev release -DTAU_DONT_USE_FTXUI=ON -DTAU_BUILD_JOBS=2
          /tmp/tau-lang/build-Release/tau -v | tee "$GITHUB_WORKSPACE/experiments/tau_adt_tables/tau-version.txt"

      - name: Run upstream ADT table baselines
        run: |
          set -euxo pipefail
          git clone https://github.com/taumorrow/tau-lang-demos.git /tmp/tau-lang-demos
          cd /tmp/tau-lang-demos
          git checkout 0cfbaac933a99402eb36eb3f61b4b686a1809cb4
          cd "$GITHUB_WORKSPACE"
          mkdir -p experiments/tau_adt_tables/results/upstream
          TAU=/tmp/tau-lang/build-Release/tau
          TAU_BA_COMPONENT_FACTORING=1 timeout 120s "$TAU" -q -X < /tmp/tau-lang-demos/adt_tables_basic.tau | tee experiments/tau_adt_tables/results/upstream/basic.out
          TAU_BA_COMPONENT_FACTORING=1 timeout 120s "$TAU" -q -X < /tmp/tau-lang-demos/adt_tables_advanced.tau | tee experiments/tau_adt_tables/results/upstream/advanced.out

      - name: Run ZenoDEX contracts
        env:
          TAU_BIN: /tmp/tau-lang/build-Release/tau
        run: python3 experiments/tau_adt_tables/scripts/run_contracts.py

      - name: Benchmark relation-table lookup scaling
        if: always()
        env:
          TAU_BIN: /tmp/tau-lang/build-Release/tau
        run: python3 experiments/tau_adt_tables/scripts/bench_relation_tables.py

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tau-adt-table-lab-receipts
          path: |
            experiments/tau_adt_tables/results/
            experiments/tau_adt_tables/tau-version.txt
