name: apply-zrpf-assurance-repair

on:
  pull_request:
    branches:
      - agent/zrpf-completion-integration-20260712
  push:
    branches:
      - agent/zrpf-assurance-repair-20260714

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/zrpf-assurance-repair-20260714

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install hash-pinned assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Apply exact reviewed repair
        run: python3 tools/apply_zrpf_assurance_repair_20260714.py

      - name: Remove staging machinery and commit repaired tree
        run: |
          set -euo pipefail
          rm \
            .github/workflows/apply-zrpf-assurance-repair.yml \
            tools/apply_zrpf_assurance_repair_20260714.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'ci: repair exact-head ZRPF assurance regressions'

      - name: Run the eight previously failing tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_check_zrpf_v1_spot_adapter_temporary_evidence.py::test_retained_adapter_evidence_rejects_hardened_verifier_source_drift \
            tests/test_run_zrpf_source_opened_spot_v6_darwin_settlement_benchmark.py::test_bounded_quiet_command_allows_empty_stdout \
            tests/test_run_zrpf_source_opened_spot_v6_darwin_settlement_benchmark.py::test_bounded_command_kills_and_rejects_residual_process_group \
            tests/test_check_zrpf_v3_firecracker_replay_profile.py::test_deep_json_rejects_without_cli_traceback \
            tests/test_zrpf_v3_source_closure.py::test_current_clean_checkout_matches_exact_source_inventory \
            tests/test_zrpf_v3_source_closure.py::test_checker_rejects_a_rebound_source_digest \
            tests/test_check_zrpf_v3_structural_tree_temporary_evidence.py::test_retained_structural_evidence_rejects_hardened_verifier_source_drift \
            tests/integration/test_recursive_stark_admission_authority_boundary.py::test_private_admission_symbols_are_absent_from_other_production_modules

      - name: Push reviewed repair commit
        run: git push origin HEAD:agent/zrpf-assurance-repair-20260714
