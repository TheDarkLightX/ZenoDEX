name: dependency-assurance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Audit Python lockfiles
        run: |
          python -m pip_audit -r requirements-core.lock.txt
          python -m pip_audit -r requirements-agents.lock.txt
          python -m pip_audit -r requirements-dev.lock.txt

      - name: Run dependency parser tests
        run: |
          pytest -q \
            tests/integration/test_check_dex_ui_dependency_audit.py \
            tests/integration/test_check_risc0_dependency_audit.py \
            tests/integration/test_check_github_workflow_permissions.py

      - name: Enforce workflow token permissions
        run: python3 tools/check_github_workflow_permissions.py

  dex-ui-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/dex-ui/package-lock.json

      - name: Install DEX UI dependencies
        working-directory: tools/dex-ui
        run: npm ci

      - name: Enforce zero DEX UI dependency vulnerabilities
        run: python3 tools/check_dex_ui_dependency_audit.py

      - name: Lint DEX UI
        working-directory: tools/dex-ui
        run: npm run lint

      - name: Build DEX UI
        working-directory: tools/dex-ui
        run: npm run build

      - name: Enforce covered UI text posture
        run: python3 tools/covered_ui_lint.py --strict

  risc0-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Enforce clean RISC0 dependency audit
        run: |
          python3 tools/check_risc0_dependency_audit.py \
            --output internal/risc0_dependency_audit.json

      - name: Enforce clean privileged netns helper dependency audit
        run: |
          cargo audit \
            --file tools/zrpf_firecracker_netns_helper/Cargo.lock \
            --deny warnings \
            --json \
            > internal/zrpf_firecracker_netns_helper_dependency_audit.json

      - name: Upload Rust dependency audit reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: risc0-dependency-audit
          path: |
            internal/risc0_dependency_audit.json
            internal/zrpf_firecracker_netns_helper_dependency_audit.json
          if-no-files-found: warn
          retention-days: 14
