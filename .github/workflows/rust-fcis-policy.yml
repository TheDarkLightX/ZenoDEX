name: publish-474-finalization-witness-repair

on:
  push:
    branches:
      - agent/rust-fcis-policy-inventory-20260722
    paths:
      - ".github/workflows/rust-fcis-policy.yml"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-zusd-audit-parity-20260722
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Insert explicit Oracle finalization in monetary integration witnesses
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/test_tau_testnet_dex_plugin.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    assert ok4 is True, err4

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json4,
''',
                  '''    assert ok4 is True, err4

    ok_commit, app_state_json_commit, _hash_commit, _patch_commit, err_commit = (
        plugin.apply_app_tx(
            app_state_json=app_state_json4,
            chain_balances=chain_balances,
            operations={
                "11": [
                    {
                        "module": "ZUSDFinance",
                        "action": "oracle_commit",
                        "nonce": 3,
                        "deadline": deadline,
                    }
                ]
            },
            tx_sender_pubkey=oracle,
            block_timestamp=6,
        )
    )
    assert ok_commit is True, err_commit

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json_commit,
''',
                  "first finalization",
              ),
              (
                  '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )
    assert ok5 is True, err5
''',
                  '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )
    assert ok5 is True, err5
''',
                  "first liquidation timestamp",
              ),
              (
                  '''        tx_sender_pubkey=alice,
        block_timestamp=7,
    )
    assert ok6 is True, err6
''',
                  '''        tx_sender_pubkey=alice,
        block_timestamp=8,
    )
    assert ok6 is True, err6
''',
                  "claim timestamp",
              ),
              (
                  '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
    ):
''',
                  '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
        (
            6,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_commit",
                "nonce": 3,
                "deadline": deadline,
            },
        ),
    ):
''',
                  "second finalization",
              ),
              (
                  '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )

    assert ok is True, err
''',
                  '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )

    assert ok is True, err
''',
                  "second liquidation timestamp",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one preimage, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff check --fix tests/integration/test_tau_testnet_dex_plugin.py
          python -m ruff format tests/integration/test_tau_testnet_dex_plugin.py

      - name: Verify repaired witnesses
        run: |
          python -m pytest -q \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_stability_pool_liquidation_and_claim \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_liquidation_compensation_pays_keeper

      - name: Publish #474 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/test_tau_testnet_dex_plugin.py
          git commit -m "test(zusd): finalize Oracle before monetary liquidation"
          git push origin HEAD:agent/rust-zusd-audit-parity-20260722

      - name: Restore #473 assurance workflow
        run: |
          git fetch origin agent/rust-fcis-policy-inventory-20260722
          git checkout -B restore-fcis origin/agent/rust-fcis-policy-inventory-20260722
          git show HEAD~2:.github/workflows/rust-fcis-policy.yml > .github/workflows/rust-fcis-policy.yml
          git add .github/workflows/rust-fcis-policy.yml
          git commit -m "ci: restore Rust FCIS assurance workflow"
          git push origin HEAD:agent/rust-fcis-policy-inventory-20260722
