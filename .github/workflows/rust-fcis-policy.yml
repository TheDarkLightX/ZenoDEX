name: rust-fcis-policy

on:
  pull_request:
    paths:
      - "rust-runtime/**"
      - "src/core/**"
      - "src/state/**"
      - "src/integration/perp_engine.py"
      - "config/deploy/**"
      - "docs/runtime/RUST_FCIS_POLICY_V1.md"
      - "docs/runtime/RUST_VALUE_MOVEMENT_INVENTORY_V1.json"
      - "tools/check_rust_fcis_policy.py"
      - "tests/tools/test_check_rust_fcis_policy.py"
      - ".github/workflows/rust-fcis-policy.yml"
  push:
    branches:
      - agent/rust-fcis-policy-inventory-20260722
    paths:
      - "rust-runtime/**"
      - "src/core/**"
      - "src/state/**"
      - "src/integration/perp_engine.py"
      - "config/deploy/**"
      - "docs/runtime/RUST_FCIS_POLICY_V1.md"
      - "docs/runtime/RUST_VALUE_MOVEMENT_INVENTORY_V1.json"
      - "tools/check_rust_fcis_policy.py"
      - "tests/tools/test_check_rust_fcis_policy.py"
      - ".github/workflows/rust-fcis-policy.yml"

permissions:
  contents: write

jobs:
  policy-lint:
    name: Rust FCIS Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: |
          python -m ruff check \
            tools/check_rust_fcis_policy.py \
            tests/tools/test_check_rust_fcis_policy.py
      - run: |
          python -m ruff format --check \
            tools/check_rust_fcis_policy.py \
            tests/tools/test_check_rust_fcis_policy.py
      - run: python -m py_compile tools/check_rust_fcis_policy.py

  policy-validation:
    name: Rust FCIS inventory validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-zusd-audit-parity-20260722
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: python tools/check_rust_fcis_policy.py --pretty
      - run: python -m pytest -q tests/tools/test_check_rust_fcis_policy.py

      - name: Insert explicit Oracle finalization in monetary integration witnesses
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/rust-zusd-audit-parity-20260722' }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/test_tau_testnet_dex_plugin.py")
          text = path.read_text(encoding="utf-8")

          old = '''    assert ok4 is True, err4

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json4,
'''
          new = '''    assert ok4 is True, err4

    ok_commit, app_state_json_commit, _hash_commit, _patch_commit, err_commit = (
        plugin.apply_app_tx(
            app_state_json=app_state_json4,
            chain_balances=chain_balances,
            operations={
                "11": [
                    {
                        "module": "ZUSDFinance",
                        "action": "oracle_commit",
                        "nonce": 3,
                        "deadline": deadline,
                    }
                ]
            },
            tx_sender_pubkey=oracle,
            block_timestamp=6,
        )
    )
    assert ok_commit is True, err_commit

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json_commit,
'''
          if text.count(old) != 1:
              raise SystemExit(f"first finalization preimage count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )
    assert ok5 is True, err5
'''
          new = '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )
    assert ok5 is True, err5
'''
          if text.count(old) < 1:
              raise SystemExit("first liquidation timestamp preimage missing")
          text = text.replace(old, new, 1)

          old = '''        tx_sender_pubkey=alice,
        block_timestamp=7,
    )
    assert ok6 is True, err6
'''
          new = '''        tx_sender_pubkey=alice,
        block_timestamp=8,
    )
    assert ok6 is True, err6
'''
          if text.count(old) != 1:
              raise SystemExit(f"claim timestamp preimage count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
    ):
'''
          new = '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
        (
            6,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_commit",
                "nonce": 3,
                "deadline": deadline,
            },
        ),
    ):
'''
          if text.count(old) != 1:
              raise SystemExit(f"second finalization preimage count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )

    assert ok is True, err
'''
          new = '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )

    assert ok is True, err
'''
          if text.count(old) != 1:
              raise SystemExit(f"second liquidation timestamp count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff check --fix tests/integration/test_tau_testnet_dex_plugin.py
          python -m ruff format tests/integration/test_tau_testnet_dex_plugin.py

      - name: Verify focused integration witnesses
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/rust-zusd-audit-parity-20260722' }}
        run: |
          python -m pytest -q \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_stability_pool_liquidation_and_claim \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_liquidation_compensation_pays_keeper

      - name: Restore workflows and publish clean test repair
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/rust-zusd-audit-parity-20260722' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/rust-fcis-policy-inventory-20260722
          git show origin/agent/rust-fcis-policy-inventory-20260722:.github/workflows/rust-fcis-policy.yml \
            > .github/workflows/rust-fcis-policy.yml
          git show origin/agent/rust-fcis-policy-inventory-20260722:.github/workflows/zeno-oracle-mvp.yml \
            > .github/workflows/zeno-oracle-mvp.yml
          rm -f .github/workflows/fix-474-zusd-finalization-tests.yml
          git add tests/integration/test_tau_testnet_dex_plugin.py
          git add .github/workflows/rust-fcis-policy.yml .github/workflows/zeno-oracle-mvp.yml
          git add -u .github/workflows/fix-474-zusd-finalization-tests.yml
          git commit -m "test(zusd): finalize Oracle before monetary liquidation"
          git push origin HEAD:agent/rust-zusd-audit-parity-20260722

  rust-core:
    name: Exact-toolchain Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Record exact toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose
          test "$(rustc --version | awk '{print $2}')" = "1.87.0"

      - name: Locked metadata
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Debug tests
        run: cargo test --workspace --all-features --locked

      - name: Release tests
        run: cargo test --workspace --all-features --release --locked
