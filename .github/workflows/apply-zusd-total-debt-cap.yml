name: apply-zusd-total-debt-cap

on:
  pull_request:
    branches:
      - agent/functional-core-auth-effect-snapshots-20260719
  push:
    branches:
      - agent/zusd-total-debt-cap-20260721

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ hashFiles('.agent/zusd-total-debt-cap.patch.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/zusd-total-debt-cap-20260721
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Apply hash-pinned core patch
        run: |
          base64 -d .agent/zusd-total-debt-cap.patch.b64 > /tmp/zusd-total-debt-cap.patch
          echo "2d898c60e8fa667a988150919664bfeae3205b9bdd8ec34991a5c64bbac13985  /tmp/zusd-total-debt-cap.patch" | sha256sum -c -
          git apply --check /tmp/zusd-total-debt-cap.patch
          git apply /tmp/zusd-total-debt-cap.patch

      - name: Static and focused validation
        run: |
          python -m ruff check src/core/zusd.py tests/core/test_zusd_total_debt_cap.py
          python -m py_compile src/core/zusd.py
          python -m pytest -q \
            tests/core/test_zusd_total_debt_cap.py \
            tests/core/test_zusd.py \
            tests/core/test_zusd_multi.py

      - name: Retain patched authority source
        uses: actions/upload-artifact@v4
        with:
          name: zusd-total-debt-cap-patched-source
          path: src/core/zusd.py
          if-no-files-found: error

      - name: Commit applied repair
        run: |
          rm -f .agent/zusd-total-debt-cap.patch.b64
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-zusd-total-debt-cap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(zusd): cap free plus Stability Pool debt"
          git push origin HEAD:agent/zusd-total-debt-cap-20260721
