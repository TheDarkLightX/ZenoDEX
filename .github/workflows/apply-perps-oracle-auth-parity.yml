name: apply-perps-oracle-auth-parity

on:
  push:
    branches:
      - agent/perps-oracle-auth-parity-20260721

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.agent/perps-oracle-auth-parity.patch.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/perps-oracle-auth-parity-20260721
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Decode and apply scoped parity patch
        run: |
          base64 -d .agent/perps-oracle-auth-parity.patch.b64 > /tmp/perps-oracle-auth-parity.patch
          echo "58e435013159dbf4adb4d9b76e316166803089c08631cc9354df0125ad2248af  /tmp/perps-oracle-auth-parity.patch" | sha256sum -c -
          git apply --check /tmp/perps-oracle-auth-parity.patch
          git apply /tmp/perps-oracle-auth-parity.patch

      - name: Validate Oracle authorization parity
        run: |
          python -m ruff check \
            src/integration/perp_engine.py \
            src/integration/zeno_oracle_fail_closed_config.py \
            tests/integration/test_perp_engine_clearinghouse_oracle_authorization_parity.py \
            tests/integration/test_zeno_oracle_fail_closed_config.py
          python -m py_compile \
            src/integration/perp_engine.py \
            src/integration/zeno_oracle_fail_closed_config.py
          python -m pytest -q \
            tests/integration/test_perp_engine_clearinghouse_oracle_authorization_parity.py \
            tests/integration/test_zeno_oracle_fail_closed_config.py \
            tests/integration/test_perp_engine_clearinghouse_2p.py \
            tests/integration/test_perp_engine_clearinghouse_3p_transfer.py

      - name: Commit applied parity fix
        run: |
          rm -f .agent/perps-oracle-auth-parity.patch.b64
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-perps-oracle-auth-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(perps): unify clearinghouse Oracle authorization"
          git push origin HEAD:agent/perps-oracle-auth-parity-20260721
