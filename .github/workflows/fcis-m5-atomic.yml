name: fcis-m5-atomic

on:
  pull_request:
    paths:
      - "src/core/fcis_atomic_mount_values.py"
      - "src/core/fcis_atomic_mount_codec.py"
      - "src/integration/fcis_atomic_commit_reference.py"
      - "tests/core/test_fcis_atomic_mount*.py"
      - "docs/research/FCIS_M5_*.md"
      - "docs/research/FCIS_M5_*.json"
      - ".github/workflows/fcis-m5-atomic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-authority-checkpoint:
    name: M5 exact values, codec, and reference CAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development dependencies
        run: python -m pip install --quiet --require-hashes -r requirements-dev.lock.txt

      - name: Capture Ruff result and canonical patch
        run: |
          set +e
          python -m ruff check \
            --output-format=concise \
            src/core/fcis_atomic_mount_values.py \
            src/core/fcis_atomic_mount_codec.py \
            src/integration/fcis_atomic_commit_reference.py \
            tests/core/test_fcis_atomic_mount.py \
            tests/core/test_fcis_atomic_mount_binding.py \
            > /tmp/fcis-m5-ruff.txt 2>&1
          status=$?
          set -e
          cat /tmp/fcis-m5-ruff.txt
          printf '%s\n' "$status" > /tmp/fcis-m5-ruff.status
          if test "$status" -ne 0; then
            python -m ruff check --fix \
              src/core/fcis_atomic_mount_values.py \
              src/core/fcis_atomic_mount_codec.py \
              src/integration/fcis_atomic_commit_reference.py \
              tests/core/test_fcis_atomic_mount.py \
              tests/core/test_fcis_atomic_mount_binding.py || true
          fi
          git diff -- \
            src/core/fcis_atomic_mount_values.py \
            src/core/fcis_atomic_mount_codec.py \
            src/integration/fcis_atomic_commit_reference.py \
            tests/core/test_fcis_atomic_mount.py \
            tests/core/test_fcis_atomic_mount_binding.py \
            > /tmp/fcis-m5-ruff.patch

      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fcis-m5-ruff-diagnostics
          path: |
            /tmp/fcis-m5-ruff.txt
            /tmp/fcis-m5-ruff.status
            /tmp/fcis-m5-ruff.patch
          if-no-files-found: error
          retention-days: 1

      - name: Require Ruff success
        run: test "$(cat /tmp/fcis-m5-ruff.status)" -eq 0

      - name: Mypy
        run: |
          python -m mypy \
            src/core/fcis_atomic_mount_values.py \
            src/core/fcis_atomic_mount_codec.py \
            src/integration/fcis_atomic_commit_reference.py

      - name: Atomic authority laws
        run: |
          python -m pytest -q \
            tests/core/test_fcis_atomic_mount.py \
            tests/core/test_fcis_atomic_mount_binding.py
