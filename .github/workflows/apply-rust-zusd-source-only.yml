name: apply-rust-zusd-source-only

on:
  pull_request:
    branches:
      - agent/rust-fcis-policy-inventory-20260722
    paths:
      - ".agent/apply_python_zusd_semantics_only.py"
      - ".agent/apply_rust_zusd_source_only.py"
      - ".agent/normalize_rust_zusd_cap_witness.py"
      - ".agent/update_python_zusd_tests.py"
      - ".github/workflows/apply-rust-zusd-source-only.yml"

permissions:
  contents: write

jobs:
  apply-verify-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/rust-zusd-audit-parity-20260722' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-zusd-audit-parity-20260722
          fetch-depth: 0
          persist-credentials: true

      - name: Configure publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Apply exact Python and Rust authority transformations
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m py_compile \
              .agent/apply_python_zusd_semantics_only.py \
              .agent/apply_rust_zusd_source_only.py \
              .agent/normalize_rust_zusd_cap_witness.py \
              .agent/update_python_zusd_tests.py
            git update-index --no-assume-unchanged \
              src/core/zusd.py \
              tools/runtime/zusd_kernel_lib.py \
              tests/core/test_zusd.py \
              tests/runtime/test_zusd_rust_audit_parity.py \
              rust-runtime/crates/zenodex-runtime-core/src/zusd.rs \
              docs/runtime/RUST_VALUE_MOVEMENT_INVENTORY_V1.json || true
            git update-index --no-skip-worktree \
              src/core/zusd.py \
              tools/runtime/zusd_kernel_lib.py \
              tests/core/test_zusd.py \
              tests/runtime/test_zusd_rust_audit_parity.py \
              rust-runtime/crates/zenodex-runtime-core/src/zusd.rs \
              docs/runtime/RUST_VALUE_MOVEMENT_INVENTORY_V1.json || true
            python .agent/apply_python_zusd_semantics_only.py
            python .agent/apply_rust_zusd_source_only.py
            python .agent/normalize_rust_zusd_cap_witness.py
            python .agent/update_python_zusd_tests.py
            python -m ruff check --fix \
              src/core/zusd.py \
              tools/runtime/zusd_kernel_lib.py \
              tests/core/test_zusd.py \
              tests/runtime/test_zusd_rust_audit_parity.py
            python -m ruff format \
              src/core/zusd.py \
              tools/runtime/zusd_kernel_lib.py \
              tests/core/test_zusd.py \
              tests/runtime/test_zusd_rust_audit_parity.py
            cargo fmt --manifest-path rust-runtime/Cargo.toml
            git status --short
            git diff --stat
          } 2>&1 | tee rust-zusd-application-diagnostics.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-zusd-application-diagnostics
          path: rust-zusd-application-diagnostics.txt
          if-no-files-found: error

      - name: Enforce source application
        if: steps.apply.outputs.exit_code != '0'
        run: exit 1

      - name: Validate Rust FCIS policy
        run: python tools/check_rust_fcis_policy.py --pretty

      - name: Rust format check
        working-directory: rust-runtime
        run: cargo fmt --check

      - name: Rust Clippy
        working-directory: rust-runtime
        run: cargo clippy --locked -p zenodex-runtime-core --all-targets -- -D warnings

      - name: Rust zUSD unit tests
        working-directory: rust-runtime
        run: cargo test --locked -p zenodex-runtime-core zusd

      - name: Build Rust authority bridge
        working-directory: rust-runtime
        run: cargo build --locked --bin zenodex-runtime

      - name: Python zUSD core lifecycle tests
        run: python -m pytest -vv --tb=long tests/core/test_zusd.py

      - name: Cap rejection parity
        run: |
          python -m pytest -vv --tb=long \
            tests/runtime/test_zusd_rust_audit_parity.py::test_rust_mint_above_shared_vault_and_supply_cap_rejects

      - name: Exact cap parity
        run: |
          python -m pytest -vv --tb=long \
            tests/runtime/test_zusd_rust_audit_parity.py::test_rust_mint_accepts_exact_total_debt_cap

      - name: Pending observation authority parity
        run: |
          python -m pytest -vv --tb=long \
            tests/runtime/test_zusd_rust_audit_parity.py::test_pending_observation_has_no_rust_liquidation_authority

      - name: Adverse finalization and liquidation parity
        run: |
          python -m pytest -vv --tb=long \
            tests/runtime/test_zusd_rust_audit_parity.py::test_adverse_price_can_finalize_before_rust_liquidation

      - name: Stale finalized Oracle parity
        run: |
          python -m pytest -vv --tb=long \
            tests/runtime/test_zusd_rust_audit_parity.py::test_stale_finalized_price_has_no_rust_liquidation_authority

      - name: Existing Python/Rust zUSD conformance
        run: python -m pytest -vv --tb=long tests/runtime/test_zusd_conformance.py

      - name: Existing zUSD authority live path
        run: python -m pytest -vv --tb=long tests/runtime/test_zusd_live_path.py

      - name: Publish and verify the complete PR review range
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent/apply_python_zusd_semantics_only.py \
            .agent/apply_rust_zusd_source_only.py \
            .agent/normalize_rust_zusd_cap_witness.py \
            .agent/update_python_zusd_tests.py
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-rust-zusd-source-only.yml
          rm -f rust-zusd-application-diagnostics.txt
          git add -A
          git add --force \
            src/core/zusd.py \
            tools/runtime/zusd_kernel_lib.py \
            tests/core/test_zusd.py \
            tests/runtime/test_zusd_rust_audit_parity.py \
            rust-runtime/crates/zenodex-runtime-core/src/zusd.rs \
            docs/runtime/RUST_VALUE_MOVEMENT_INVENTORY_V1.json
          git commit -m "fix(runtime): align Rust zUSD with audited authority"
          git fetch origin agent/rust-fcis-policy-inventory-20260722
          git diff --name-only \
            origin/agent/rust-fcis-policy-inventory-20260722...HEAD \
            | tee review-paths.txt
          for path in \
            src/core/zusd.py \
            tools/runtime/zusd_kernel_lib.py \
            tests/core/test_zusd.py \
            tests/runtime/test_zusd_rust_audit_parity.py \
            rust-runtime/crates/zenodex-runtime-core/src/zusd.rs \
            docs/runtime/RUST_VALUE_MOVEMENT_INVENTORY_V1.json
          do
            grep -Fx "$path" review-paths.txt
          done
          rm -f review-paths.txt
          git push origin HEAD:agent/rust-zusd-audit-parity-20260722
