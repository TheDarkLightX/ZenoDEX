name: zeno-oracle-mvp

on:
  push:
    branches:
      - main
      - docs/zeno-oracle-mvp-design
  pull_request:

permissions:
  contents: read

jobs:
  oracle-mvp-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Oracle verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Zeno Oracle MVP replay gate
        run: bash scripts/check_zeno_oracle_mvp.sh
