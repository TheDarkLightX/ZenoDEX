name: zeno-oracle-mvp

on:
  push:
    branches:
      - main
      - docs/zeno-oracle-mvp-design
  pull_request:

permissions:
  contents: read

jobs:
  oracle-mvp-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Oracle verifier dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run Zeno Oracle MVP core gate
        run: bash scripts/check_zeno_oracle_mvp.sh

      - name: Check critical Oracle action map
        run: python3 tools/check_zeno_oracle_critical_action_map.py

      - name: Replay O3 receipt flow
        run: python3 tools/zeno_oracle_o3_receipt_flow_replay.py --format text

      - name: Test O3 receipt flow
        run: pytest -q tests/test_zeno_oracle_o3_receipt_flow_replay.py

      - name: Test Oracle devnet service and disaster harness
        run: pytest -q tests/test_zenodex_oracle_devnet_service.py tests/test_zenodex_oracle_devnet_disaster_harness.py

      - name: Replay Oracle reporter economics
        run: python3 tools/zenodex_oracle_reporter_economics_replay.py self-test

      - name: Run Oracle devnet disaster harness
        run: python3 tools/zenodex_oracle_devnet_disaster_harness.py --format text

      - name: Run Oracle disaster-class corpus
        run: python3 tools/zeno_oracle_disaster_class_corpus.py --format text

      - name: Check Oracle disaster obligation certificate
        run: python3 tools/check_disaster_obligation_certificate.py --manifest tools/zeno_oracle_disaster_obligation_certificate_manifest.json

      - name: Check Oracle workflow evidence status
        run: python3 tools/zeno_oracle_workflow_evidence_status.py --format text --skip-morph

      - name: Audit Oracle Devnet Alpha
        run: python3 tools/zenodex_oracle_devnet_alpha_audit.py

      - name: Build Zeno Oracle Devnet Alpha RC package
        run: bash scripts/package_zeno_oracle_rc.sh zeno-oracle-devnet-alpha-rc1

      - name: Verify Zeno Oracle Devnet Alpha RC package
        run: |
          python3 tools/check_zeno_oracle_rc_package.py \
            --package-dir dist/zeno-oracle-devnet-alpha-rc1 \
            --receipt dist/zeno-oracle-devnet-alpha-rc1.receipt.json \
            --sig dist/zeno-oracle-devnet-alpha-rc1.sig
          cd dist/zeno-oracle-devnet-alpha-rc1
          bash scripts/check_zeno_oracle_rc_bundle.sh

      - name: Upload Zeno Oracle Devnet Alpha RC package
        uses: actions/upload-artifact@v4
        with:
          name: zeno-oracle-devnet-alpha-rc1
          path: |
            dist/zeno-oracle-devnet-alpha-rc1.tar.gz
            dist/zeno-oracle-devnet-alpha-rc1.receipt.json
            dist/zeno-oracle-devnet-alpha-rc1.sig
            dist/zeno-oracle-devnet-alpha-rc1/ZEN_ORACLE_RC_MANIFEST.json
          if-no-files-found: error

  publish-zusd-finalization-witness-repair:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/rust-zusd-audit-parity-20260722' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-zusd-audit-parity-20260722
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Patch explicit Oracle finalization witnesses
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/test_tau_testnet_dex_plugin.py")
          text = path.read_text(encoding="utf-8")

          old = '''    assert ok4 is True, err4

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json4,
'''
          new = '''    assert ok4 is True, err4

    ok_commit, app_state_json_commit, _hash_commit, _patch_commit, err_commit = (
        plugin.apply_app_tx(
            app_state_json=app_state_json4,
            chain_balances=chain_balances,
            operations={
                "11": [
                    {
                        "module": "ZUSDFinance",
                        "action": "oracle_commit",
                        "nonce": 3,
                        "deadline": deadline,
                    }
                ]
            },
            tx_sender_pubkey=oracle,
            block_timestamp=6,
        )
    )
    assert ok_commit is True, err_commit

    ok5, app_state_json5, _hash5, _patch5, err5 = plugin.apply_app_tx(
        app_state_json=app_state_json_commit,
'''
          if text.count(old) != 1:
              raise SystemExit(f"first finalization preimage count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )
    assert ok5 is True, err5
'''
          new = '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )
    assert ok5 is True, err5
'''
          if text.count(old) < 1:
              raise SystemExit("first liquidation timestamp preimage missing")
          text = text.replace(old, new, 1)

          old = '''        tx_sender_pubkey=alice,
        block_timestamp=7,
    )
    assert ok6 is True, err6
'''
          new = '''        tx_sender_pubkey=alice,
        block_timestamp=8,
    )
    assert ok6 is True, err6
'''
          if text.count(old) != 1:
              raise SystemExit(f"claim timestamp preimage count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
    ):
'''
          new = '''        (
            5,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_report",
                "price_e8": 70 * E8,
                "nonce": 2,
                "deadline": deadline,
            },
        ),
        (
            6,
            oracle,
            {
                "module": "ZUSDFinance",
                "action": "oracle_commit",
                "nonce": 3,
                "deadline": deadline,
            },
        ),
    ):
'''
          if text.count(old) != 1:
              raise SystemExit(f"second finalization preimage count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        tx_sender_pubkey=keeper,
        block_timestamp=6,
    )

    assert ok is True, err
'''
          new = '''        tx_sender_pubkey=keeper,
        block_timestamp=7,
    )

    assert ok is True, err
'''
          if text.count(old) != 1:
              raise SystemExit(f"second liquidation timestamp count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff check --fix tests/integration/test_tau_testnet_dex_plugin.py
          python -m ruff format tests/integration/test_tau_testnet_dex_plugin.py

      - name: Run focused integration witnesses
        run: |
          python -m pytest -q \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_stability_pool_liquidation_and_claim \
            tests/integration/test_tau_testnet_dex_plugin.py::test_apply_app_tx_zusd_monetary_liquidation_compensation_pays_keeper

      - name: Restore workflow and publish clean commit
        run: |
          cat > .github/workflows/zeno-oracle-mvp.yml <<'YAML'
          name: zeno-oracle-mvp

          on:
            push:
              branches:
                - main
                - docs/zeno-oracle-mvp-design
            pull_request:

          permissions:
            contents: read

          jobs:
            oracle-mvp-replay:
              runs-on: ubuntu-latest
              timeout-minutes: 35
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'

                - name: Install Oracle verifier dependencies
                  run: |
                    python -m pip install --require-hashes -r requirements-dev.lock.txt

                - name: Run Zeno Oracle MVP plus Devnet Alpha replay gate
                  run: bash scripts/check_zeno_oracle_devnet_alpha.sh

                - name: Build Zeno Oracle Devnet Alpha RC package
                  run: bash scripts/package_zeno_oracle_rc.sh zeno-oracle-devnet-alpha-rc1

                - name: Verify Zeno Oracle Devnet Alpha RC package
                  run: |
                    python3 tools/check_zeno_oracle_rc_package.py \
                      --package-dir dist/zeno-oracle-devnet-alpha-rc1 \
                      --receipt dist/zeno-oracle-devnet-alpha-rc1.receipt.json \
                      --sig dist/zeno-oracle-devnet-alpha-rc1.sig
                    cd dist/zeno-oracle-devnet-alpha-rc1
                    bash scripts/check_zeno_oracle_rc_bundle.sh

                - name: Upload Zeno Oracle Devnet Alpha RC package
                  uses: actions/upload-artifact@v4
                  with:
                    name: zeno-oracle-devnet-alpha-rc1
                    path: |
                      dist/zeno-oracle-devnet-alpha-rc1.tar.gz
                      dist/zeno-oracle-devnet-alpha-rc1.receipt.json
                      dist/zeno-oracle-devnet-alpha-rc1.sig
                      dist/zeno-oracle-devnet-alpha-rc1/ZEN_ORACLE_RC_MANIFEST.json
                    if-no-files-found: error
          YAML
          rm -f .github/workflows/fix-474-zusd-finalization-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/test_tau_testnet_dex_plugin.py
          git add .github/workflows/zeno-oracle-mvp.yml
          git add -u .github/workflows/fix-474-zusd-finalization-tests.yml
          git commit -m "test(zusd): finalize Oracle before monetary liquidation"
          git push origin HEAD:agent/rust-zusd-audit-parity-20260722
