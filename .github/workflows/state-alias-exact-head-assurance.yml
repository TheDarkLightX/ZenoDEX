name: state-alias-exact-head-assurance

on:
  pull_request_target:
    branches:
      - agent/state-alias-assurance-base-20260721
    types: [edited, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  verify-state-alias-family:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/functional-core-owned-state-snapshots-20260719'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact same-repository head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact event binding
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REF: agent/functional-core-owned-state-snapshots-20260719
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = "$EXPECTED_REF"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Apply deterministic formatting
        run: |
          python -m ruff check --fix \
            src/core/batch_clearing_apply_settlement.py \
            src/core/batch_clearing_requests.py \
            src/core/dex.py \
            src/core/fees.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py \
            tests/core/test_dex_state_immutability.py
          python -m ruff format \
            src/core/batch_clearing_apply_settlement.py \
            src/core/batch_clearing_requests.py \
            src/core/dex.py \
            src/core/fees.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py \
            tests/core/test_dex_state_immutability.py

      - name: Static checks
        run: |
          python -m ruff check \
            src/core/batch_clearing_apply_settlement.py \
            src/core/batch_clearing_requests.py \
            src/core/dex.py \
            src/core/fees.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py \
            tests/core/test_dex_state_immutability.py
          python -m ruff format --check \
            src/core/batch_clearing_apply_settlement.py \
            src/core/batch_clearing_requests.py \
            src/core/dex.py \
            src/core/fees.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py \
            tests/core/test_dex_state_immutability.py
          python -m mypy \
            src/core/dex.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py
          python -m py_compile \
            src/core/dex.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py
          git diff --check

      - name: Alias and compatibility tests
        run: |
          python -m pytest -q \
            tests/core/test_dex_state_immutability.py \
            tests/core/test_batch_clearing.py \
            tests/core/test_batch_clearing_coverage_edges.py \
            tests/core/test_batch_clearing_properties.py \
            tests/core/test_dex_step.py \
            tests/core/test_dex_step_candidate_settlement.py \
            tests/core/test_settlement.py \
            tests/core/test_settlement_strong_validator.py

      - name: Publish exact-head evidence and clean one-shot workflow
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p audit/evidence
          cat > audit/evidence/state_alias_exact_head.json <<EOF
          {
            "schema": "zenodex/state_alias_exact_head/v1",
            "tested_head_sha": "$TESTED_SHA",
            "branch": "agent/functional-core-owned-state-snapshots-20260719",
            "witnesses": [
              "STATE-ALIAS-001",
              "STATE-ALIAS-002",
              "STATE-ALIAS-003",
              "STATE-ALIAS-004",
              "STATE-ALIAS-007"
            ],
            "static_checks": ["ruff", "ruff-format", "mypy", "py_compile", "git-diff-check"],
            "test_suites": [
              "tests/core/test_dex_state_immutability.py",
              "tests/core/test_batch_clearing.py",
              "tests/core/test_batch_clearing_coverage_edges.py",
              "tests/core/test_batch_clearing_properties.py",
              "tests/core/test_dex_step.py",
              "tests/core/test_dex_step_candidate_settlement.py",
              "tests/core/test_settlement.py",
              "tests/core/test_settlement_strong_validator.py"
            ]
          }
          EOF
          rm -f .github/workflows/state-alias-focused-assurance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(core): certify committed-state alias closure"
          git push origin HEAD:agent/functional-core-owned-state-snapshots-20260719
