name: state-alias-exact-head-assurance

on:
  pull_request_target:
    branches:
      - agent/state-alias-assurance-base-20260721
    types: [edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify-state-alias-family:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/functional-core-owned-state-snapshots-20260719'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact same-repository head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact event binding
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Static checks
        run: |
          python -m ruff check \
            src/core/batch_clearing_apply_settlement.py \
            src/core/dex.py \
            src/core/fees.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py \
            tests/core/test_dex_state_immutability.py
          python -m mypy \
            src/core/dex.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py
          python -m py_compile \
            src/core/dex.py \
            src/state/immutable_collections.py \
            src/state/state_snapshots.py
          git diff --check ${{ github.event.pull_request.base.sha }}..HEAD

      - name: Alias and compatibility tests
        run: |
          python -m pytest -q \
            tests/core/test_dex_state_immutability.py \
            tests/core/test_batch_clearing.py \
            tests/core/test_batch_clearing_coverage_edges.py \
            tests/core/test_batch_clearing_properties.py \
            tests/core/test_dex_step.py \
            tests/core/test_dex_step_candidate_settlement.py \
            tests/core/test_settlement.py \
            tests/core/test_settlement_strong_validator.py
