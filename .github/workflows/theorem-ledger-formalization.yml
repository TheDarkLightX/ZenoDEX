name: theorem-ledger-formalization

on:
  push:
    branches:
      - agent/theorem-ledger-formalization-20260721
  pull_request:
    paths:
      - "lean-mathlib/Proofs/TypedDeterministicParser.lean"
      - "lean-mathlib/Proofs/DeterministicParallelExecution.lean"
      - "lean-mathlib/Proofs/ReadWriteStableParallel.lean"
      - "lean-mathlib/Proofs/TheoremLedger.lean"
      - "lean-mathlib/Proofs.lean"
      - "tools/query_theoremsearch_zenodex.py"
      - "tools/check_zenodex_theorem_ledger.py"
      - "tests/tools/test_check_zenodex_theorem_ledger.py"
      - "docs/research/ZENODEX_THEOREM_LEDGER_2026-07-21.md"
      - "docs/research/ZENODEX_THEOREM_LEDGER_V1.json"
      - ".github/workflows/theorem-ledger-formalization.yml"

permissions:
  contents: read

jobs:
  format-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theorem-ledger-formalization-20260721
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Apply deterministic Ruff fixes and formatting
        run: |
          python -m ruff check --fix \
            tools/query_theoremsearch_zenodex.py \
            tools/check_zenodex_theorem_ledger.py \
            tests/tools/test_check_zenodex_theorem_ledger.py
          python -m ruff format \
            tools/query_theoremsearch_zenodex.py \
            tools/check_zenodex_theorem_ledger.py \
            tests/tools/test_check_zenodex_theorem_ledger.py
      - name: Publish formatting when required
        run: |
          if git diff --quiet; then
            echo "Python sources already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/query_theoremsearch_zenodex.py \
            tools/check_zenodex_theorem_ledger.py \
            tests/tools/test_check_zenodex_theorem_ledger.py
          git commit -m "style: canonicalize theorem-ledger Python"
          git push origin HEAD:agent/theorem-ledger-formalization-20260721

  theorem-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query TheoremSearch reproducibly
        run: |
          python tools/query_theoremsearch_zenodex.py \
            --output internal/theoremsearch/zenodex_theorem_queries_v1.json \
            --n-results 8
      - name: Validate retrieval bundle shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("internal/theoremsearch/zenodex_theorem_queries_v1.json")
          obj = json.loads(path.read_text(encoding="utf-8"))
          assert obj["schema"] == "zenodex.theoremsearch.query_bundle.v1"
          assert len(obj["queries"]) == 12
          assert all(item["theorem_search"] for item in obj["queries"])
          assert all(item["theorem_graph"] for item in obj["queries"])
          PY
      - name: Upload raw theorem retrieval
        uses: actions/upload-artifact@v4
        with:
          name: zenodex-theoremsearch-results
          path: internal/theoremsearch/zenodex_theorem_queries_v1.json
          if-no-files-found: error

  lean-formalization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned Mathlib source
        run: |
          rm -rf external/mathlib4
          git clone --depth 1 --branch v4.27.0 \
            https://github.com/leanprover-community/mathlib4.git \
            external/mathlib4
      - name: Restore Mathlib compiled cache
        working-directory: lean-mathlib
        run: |
          lake update
          lake exe cache get
      - name: Build read/write footprint theorem target
        working-directory: lean-mathlib
        run: lake build Proofs.ReadWriteStableParallel
      - name: Build integrated theorem-ledger module graph
        working-directory: lean-mathlib
        run: lake build Proofs.TheoremLedger
      - name: Type-check parser theorem source directly
        working-directory: lean-mathlib
        run: lake env lean Proofs/TypedDeterministicParser.lean
      - name: Type-check parallel theorem source directly
        working-directory: lean-mathlib
        run: lake env lean Proofs/DeterministicParallelExecution.lean
      - name: Reject proof placeholders
        run: |
          ! grep -R -nE '\b(sorry|admit|axiom)\b' \
            lean-mathlib/Proofs/TypedDeterministicParser.lean \
            lean-mathlib/Proofs/DeterministicParallelExecution.lean \
            lean-mathlib/Proofs/ReadWriteStableParallel.lean \
            lean-mathlib/Proofs/TheoremLedger.lean

  ledger-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Static checks
        run: |
          python -m ruff check \
            tools/query_theoremsearch_zenodex.py \
            tools/check_zenodex_theorem_ledger.py \
            tests/tools/test_check_zenodex_theorem_ledger.py
          python -m ruff format --check \
            tools/query_theoremsearch_zenodex.py \
            tools/check_zenodex_theorem_ledger.py \
            tests/tools/test_check_zenodex_theorem_ledger.py
          python -m py_compile \
            tools/query_theoremsearch_zenodex.py \
            tools/check_zenodex_theorem_ledger.py \
            tests/tools/test_check_zenodex_theorem_ledger.py
      - name: Validate theorem ledger
        run: python tools/check_zenodex_theorem_ledger.py --pretty
      - name: Run fail-closed ledger tests
        run: python -m pytest -q tests/tools/test_check_zenodex_theorem_ledger.py
