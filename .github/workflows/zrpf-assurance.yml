name: zrpf-assurance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: zrpf-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zrpf-assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout full source history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize fail-closed ZRPF assurance report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal
          printf '%s\n' \
            '{"accepted":false,"reason":"required_source_built_replay_did_not_complete","schema":"zenodex/zrpf/ci_live_replay_status/v1","status":"not_run"}' \
            > internal/zrpf-ci-live-replay.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Node for browser-verifier assurance
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/dex-ui/package-lock.json

      - name: Install lockfile-bound browser-verifier dependencies
        working-directory: tools/dex-ui
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify durable source-anchor tags
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'refs/tags/zrpf-v3-source-anchor-20260711^{commit}')" = \
            'b37b741520e95f50236f6a9f0825c23ae3487374'
          test "$(git rev-parse 'refs/tags/zrpf-v3-source-anchor-v7-20260712^{commit}')" = \
            'ff76ff9c1dc307f0e7dc5afd009e2961f2e36f21'
          test "$(git rev-parse 'refs/tags/zrpf-v3-firecracker-elf-source-v2-20260712^{commit}')" = \
            '25032924eb4fca7f156a9ec4eedd39afeade9623'
          test "$(git rev-parse 'refs/tags/zrpf-v1-retained-source-anchor-20260710^{commit}')" = \
            '1d1559fd402cdb906d52e6d572d39aec99a5ebda'

      - name: Install hash-pinned Python assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Install hash-pinned RISC0 host Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz"
          destination="${HOME}/.risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            'https://github.com/risc0/rust/releases/download/r0.1.94.1/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz'
          test "$(stat --format='%s' "${archive}")" = '512619537'
          echo 'e88d823762fc06e8911fb6b310ffe2fca8fcd7af2438572f7aa90aaf3e84ea02  '"${archive}" \
            | sha256sum --check --strict
          mkdir -p "${destination}"
          tar --extract --gzip --file "${archive}" \
            --directory "${destination}" --no-same-owner
          rm --force "${archive}"

      - name: Acquire lockfile-bound Cargo sources
        shell: bash
        run: |
          set -euo pipefail
          pinned_bin="${HOME}/.risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu/bin"
          replay_anchor_commit="ff76ff9c1dc307f0e7dc5afd009e2961f2e36f21"
          anchor_checkout="${RUNNER_TEMP}/zrpf-v3-source-anchor-fetch"
          test ! -e "${anchor_checkout}"
          cleanup_anchor_checkout() {
            git worktree remove --force "${anchor_checkout}" >/dev/null 2>&1 || true
          }
          trap cleanup_anchor_checkout EXIT
          git -c core.hooksPath=/dev/null worktree add --detach "${anchor_checkout}" \
            "${replay_anchor_commit}"
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path "${anchor_checkout}/zk/zrpf_risc0/Cargo.toml"
          git worktree remove --force "${anchor_checkout}"
          trap - EXIT
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/zrpf_risc0/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/state_proof_risc0/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/recursive_stark_v2_active_reproof_risc0/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/spot_state_root_v5_bridge_shared/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/spot_state_root_v7_semantic_shared/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/spot_settlement_v7_effect_binding_shared/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/spot_settlement_v7_risc0/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/zrpf_full_blob_da_checker/Cargo.toml

      - name: Run Python and evidence assurance
        run: |
          ruff check \
            src/core/recursive_stark_admission.py \
            src/integration/_recursive_stark_admission_store_engine.py \
            src/integration/_recursive_stark_admission_store_hashes.py \
            src/integration/_recursive_stark_admission_store_history.py \
            src/integration/_recursive_stark_admission_store_schema.py \
            src/integration/recursive_stark_admission_store.py \
            src/integration/recursive_stark_admission_store_types.py \
            src/integration/recursive_stark_replay_manifest.py \
            src/integration/recursive_stark_verifier_adapter.py \
            src/integration/_zrpf_spot_v7_atomic_settlement_capability.py \
            src/integration/_zrpf_spot_v7_firecracker_authority.py \
            src/integration/_zrpf_spot_v7_firecracker_execution_binding.py \
            src/integration/_zrpf_spot_v7_firecracker_output.py \
            src/integration/_zrpf_spot_v7_journal_projection.py \
