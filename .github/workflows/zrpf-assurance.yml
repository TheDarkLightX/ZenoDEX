            -p zenodex-zrpf-risc0-spot-settlement-v7-guest
          candidate_guard_log="${RUNNER_TEMP}/candidate-source-policy-zkvm-reject.log"
          if "${pinned_bin}/cargo" check \
            --manifest-path zk/zrpf_risc0/Cargo.toml \
            --locked --offline \
            --target riscv32im-risc0-zkvm-elf \
            --target-dir "${RUNNER_TEMP}/zrpf-candidate-policy-negative-check" \
            -p zenodex-zrpf-risc0-shared \
            --features test-only-candidate-source-policy \
            >"${candidate_guard_log}" 2>&1; then
            echo "candidate source policy unexpectedly compiled for the zkVM target" >&2
            exit 1
          fi
          grep -F \
            "test-only candidate source policy is forbidden on the zkVM target" \
            "${candidate_guard_log}"

      - name: Build pinned replay container
        run: |
          docker build \
            --file .docker/zrpf-assurance.Dockerfile \
            --tag zenodex-zrpf-assurance:ci \
            .

      - name: Run required source-built replay without network
        shell: bash
        run: |
          set -euo pipefail
          live_report="internal/zrpf-ci-live-replay.pending.json"
          rm -f "${live_report}"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --cpus 4 \
            --memory 6g \
            --memory-swap 6g \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777 \
            --tmpfs /out:rw,exec,nosuid,nodev,size=6g,mode=1777 \
            --volume "${GITHUB_WORKSPACE}:/input:ro" \
            --volume "${HOME}/.risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu:/risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu:ro" \
            --volume "${HOME}/.cargo/registry:/home/zrpf/.cargo/registry:ro" \
            zenodex-zrpf-assurance:ci \
            /bin/sh -ceu '
              install -d -m 700 /out/private /out/private/git-home
              export GIT_CONFIG_NOSYSTEM=1
              export HOME=/out/private/git-home
              git config --global --add safe.directory /input
              git config --global --add safe.directory /input/.git
              source_head="$(git -C /input rev-parse HEAD)"
              git clone --no-checkout --no-hardlinks /input /out/private/repo
              git -C /out/private/repo checkout --detach "${source_head}"
              cd /out/private/repo
              python3 tools/check_zrpf_v3_replay_verifier_evidence.py \
                --live \
                --risc0-home /risc0 \
                --target-dir /out/private/live \
                --json
            ' | tee "${live_report}"
          python3 - "${live_report}" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          value = json.loads(report_path.read_text(encoding="utf-8"))
          if not isinstance(value, dict):
              raise SystemExit("live replay report must be a JSON object")
          if value.get("ok") is not True:
              raise SystemExit("live replay report must record ok=true")
          PY
          mv "${live_report}" internal/zrpf-ci-live-replay.json

      - name: Upload ZRPF assurance report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
