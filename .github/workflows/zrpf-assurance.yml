name: zrpf-assurance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: zrpf-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zrpf-assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout full source history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Verify durable source-anchor tags
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'refs/tags/zrpf-v3-source-anchor-20260711^{commit}')" = \
            'b37b741520e95f50236f6a9f0825c23ae3487374'
          test "$(git rev-parse 'refs/tags/zrpf-v3-source-anchor-v7-20260712^{commit}')" = \
            'ff76ff9c1dc307f0e7dc5afd009e2961f2e36f21'
          test "$(git rev-parse 'refs/tags/zrpf-v3-firecracker-elf-source-v2-20260712^{commit}')" = \
            '25032924eb4fca7f156a9ec4eedd39afeade9623'
          test "$(git rev-parse 'refs/tags/zrpf-v1-retained-source-anchor-20260710^{commit}')" = \
            '1d1559fd402cdb906d52e6d572d39aec99a5ebda'

      - name: Install hash-pinned Python assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Install hash-pinned RISC0 host Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz"
          destination="${HOME}/.risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            'https://github.com/risc0/rust/releases/download/r0.1.94.1/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz'
          test "$(stat --format='%s' "${archive}")" = '512619537'
          echo 'e88d823762fc06e8911fb6b310ffe2fca8fcd7af2438572f7aa90aaf3e84ea02  '"${archive}" \
            | sha256sum --check --strict
          mkdir -p "${destination}"
          tar --extract --gzip --file "${archive}" \
            --directory "${destination}" --no-same-owner
          rm --force "${archive}"

      - name: Acquire lockfile-bound Cargo sources
        shell: bash
        run: |
          set -euo pipefail
          pinned_bin="${HOME}/.risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu/bin"
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/zrpf_risc0/Cargo.toml
          env \
            PATH="${pinned_bin}:/usr/bin:/bin" \
            RUSTC="${pinned_bin}/rustc" \
            RUSTDOC="${pinned_bin}/rustdoc_tool_binary" \
            "${pinned_bin}/cargo" fetch --locked \
              --manifest-path zk/state_proof_risc0/Cargo.toml

      - name: Run Python and evidence assurance
        run: |
          ruff check \
            src/core/recursive_stark_admission.py \
            src/integration/_recursive_stark_admission_store_engine.py \
            src/integration/_recursive_stark_admission_store_hashes.py \
            src/integration/_recursive_stark_admission_store_history.py \
            src/integration/_recursive_stark_admission_store_schema.py \
            src/integration/recursive_stark_admission_store.py \
            src/integration/recursive_stark_admission_store_types.py \
            src/integration/recursive_stark_replay_manifest.py \
            src/integration/recursive_stark_verifier_adapter.py \
            tools/check_risc0_recursive_rebuild_evidence.py \
            tools/check_risc0_recursive_live_replay.py \
            tools/check_risc0_recursive_live_replay_evidence.py \
            tools/risc0_recursive_live_replay_support.py \
            tools/check_zrpf_v3_firecracker_direct_replay_evidence.py \
            tools/check_zrpf_v3_firecracker_guest_elf.py \
            tools/check_zrpf_v3_firecracker_launch_preflight.py \
            tools/check_zrpf_v3_firecracker_protocol_binding.py \
            tools/check_zrpf_v3_firecracker_replay_profile.py \
            tools/check_zrpf_v3_firecracker_runtime_artifacts.py \
            tools/check_zrpf_v3_replay_verifier_evidence.py \
            tools/build_zrpf_semantic_epoch_v1_local_evidence.py \
            tools/check_zrpf_semantic_epoch_v1_local_evidence.py \
            tools/zrpf_semantic_epoch_v1_evidence_support.py \
            tools/check_zrpf_v4_spot_value_leaf_local_evidence.py \
            tools/zrpf_v4_spot_value_leaf_evidence_support.py \
            tools/zrpf_evidence_boundary_concolic.py \
            tools/zrpf_v3_artifact_privacy.py \
            tools/zrpf_v3_firecracker_host_probe.py \
            tools/zrpf_v3_firecracker_artifact_set.py \
            tools/zrpf_v3_firecracker_candidate_plan.py \
            tools/zrpf_v3_firecracker_output_protocol.py \
            tools/zrpf_v3_firecracker_runtime_manifest.py \
            tools/zrpf_v3_replay_*.py \
            tools/zrpf_v3_source_closure.py \
            tests/test_check_zrpf_v3_firecracker_direct_replay_evidence.py \
            tests/test_check_zrpf_v3_firecracker_guest_elf.py \
            tests/test_check_zrpf_v3_firecracker_launch_preflight.py \
            tests/test_check_zrpf_v3_firecracker_protocol_binding.py \
            tests/test_check_zrpf_v3_firecracker_replay_profile.py \
            tests/test_check_zrpf_v3_firecracker_runtime_artifacts.py \
            tests/test_check_zrpf_v3_replay_verifier_evidence.py \
            tests/test_check_risc0_recursive_rebuild_evidence.py \
            tests/test_check_risc0_recursive_live_replay.py \
            tests/test_check_risc0_recursive_live_replay_evidence.py \
            tests/test_build_zrpf_semantic_epoch_v1_local_evidence.py \
            tests/test_check_zrpf_semantic_epoch_v1_local_evidence.py \
            tests/test_check_zrpf_v4_spot_value_leaf_local_evidence.py \
            tests/test_zrpf_evidence_boundary_concolic.py \
            tests/test_zrpf_semantic_guest_source_contract.py \
            tests/test_zrpf_v3_artifact_privacy.py \
            tests/test_zrpf_v3_firecracker_profile_boundary_atlas.py \
            tests/test_zrpf_v3_firecracker_host_probe.py \
            tests/test_zrpf_v3_firecracker_artifact_set.py \
            tests/test_zrpf_v3_firecracker_candidate_plan.py \
            tests/test_zrpf_v3_firecracker_launch_boundary_atlas.py \
            tests/test_zrpf_v3_firecracker_output_protocol.py \
            tests/test_zrpf_v3_firecracker_runtime_manifest.py \
            tests/test_zrpf_v3_source_closure.py \
            tests/test_zrpf_assurance_workflow.py \
            tests/core/test_recursive_stark_exact_once_admission.py \
            tests/integration/test_recursive_stark_admission_authority_boundary.py \
            tests/integration/test_recursive_stark_durable_admission_store.py \
            tests/integration/test_recursive_stark_replay_manifest.py \
            tests/integration/test_recursive_stark_verifier_adapter.py
          mypy --follow-imports=skip \
            src/core/recursive_stark_admission.py \
            src/integration/_recursive_stark_admission_store_engine.py \
            src/integration/_recursive_stark_admission_store_hashes.py \
            src/integration/_recursive_stark_admission_store_history.py \
            src/integration/_recursive_stark_admission_store_schema.py \
            src/integration/recursive_stark_admission_store.py \
            src/integration/recursive_stark_admission_store_types.py \
            src/integration/recursive_stark_replay_manifest.py \
            src/integration/recursive_stark_verifier_adapter.py \
            tools/check_risc0_recursive_rebuild_evidence.py \
            tools/check_risc0_recursive_live_replay.py \
            tools/check_risc0_recursive_live_replay_evidence.py \
            tools/risc0_recursive_live_replay_support.py \
            tools/check_zrpf_v3_firecracker_direct_replay_evidence.py \
            tools/check_zrpf_v3_firecracker_guest_elf.py \
            tools/check_zrpf_v3_firecracker_launch_preflight.py \
            tools/check_zrpf_v3_firecracker_protocol_binding.py \
            tools/check_zrpf_v3_firecracker_replay_profile.py \
            tools/check_zrpf_v3_firecracker_runtime_artifacts.py \
            tools/check_zrpf_v3_replay_verifier_evidence.py \
            tools/build_zrpf_semantic_epoch_v1_local_evidence.py \
            tools/check_zrpf_semantic_epoch_v1_local_evidence.py \
            tools/zrpf_semantic_epoch_v1_evidence_support.py \
            tools/check_zrpf_v4_spot_value_leaf_local_evidence.py \
            tools/zrpf_v4_spot_value_leaf_evidence_support.py \
            tools/zrpf_evidence_boundary_concolic.py \
            tools/zrpf_v3_artifact_privacy.py \
            tools/zrpf_v3_firecracker_host_probe.py \
            tools/zrpf_v3_firecracker_artifact_set.py \
            tools/zrpf_v3_firecracker_candidate_plan.py \
            tools/zrpf_v3_firecracker_output_protocol.py \
            tools/zrpf_v3_firecracker_runtime_manifest.py \
            tools/zrpf_v3_replay_*.py \
            tools/zrpf_v3_source_closure.py \
            tests/test_zrpf_v3_source_closure.py \
            tests/core/test_recursive_stark_exact_once_admission.py \
            tests/integration/test_recursive_stark_admission_authority_boundary.py \
            tests/integration/test_recursive_stark_durable_admission_store.py \
            tests/integration/test_recursive_stark_replay_manifest.py \
            tests/integration/test_recursive_stark_verifier_adapter.py
          pytest -q \
            tests/test_check_zrpf_v1_leaf_adapter_source_policy.py \
            tests/test_check_zrpf_v1_leaf_adapter_vector.py \
            tests/test_check_zrpf_v1_spot_adapter_temporary_evidence.py \
            tests/test_check_risc0_recursive_rebuild_evidence.py \
            tests/test_check_risc0_recursive_live_replay.py \
            tests/test_check_risc0_recursive_live_replay_evidence.py \
            tests/test_check_zrpf_v3_firecracker_direct_replay_evidence.py \
            tests/test_check_zrpf_v3_firecracker_guest_elf.py \
            tests/test_check_zrpf_v3_firecracker_launch_preflight.py \
            tests/test_check_zrpf_v3_firecracker_protocol_binding.py \
            tests/test_check_zrpf_v3_firecracker_replay_profile.py \
            tests/test_check_zrpf_v3_firecracker_runtime_artifacts.py \
            tests/test_check_zrpf_v3_replay_verifier_evidence.py \
            tests/test_build_zrpf_semantic_epoch_v1_local_evidence.py \
            tests/test_check_zrpf_semantic_epoch_v1_local_evidence.py \
            tests/test_check_zrpf_v4_spot_value_leaf_local_evidence.py \
            tests/test_zrpf_evidence_boundary_concolic.py \
            tests/test_zrpf_semantic_guest_source_contract.py \
            tests/test_zrpf_v3_artifact_privacy.py \
            tests/test_zrpf_v3_firecracker_profile_boundary_atlas.py \
            tests/test_zrpf_v3_firecracker_host_probe.py \
            tests/test_zrpf_v3_firecracker_artifact_set.py \
            tests/test_zrpf_v3_firecracker_candidate_plan.py \
            tests/test_zrpf_v3_firecracker_launch_boundary_atlas.py \
            tests/test_zrpf_v3_firecracker_output_protocol.py \
            tests/test_zrpf_v3_firecracker_runtime_manifest.py \
            tests/test_zrpf_assurance_workflow.py \
            tests/test_zrpf_v3_source_closure.py \
            tests/test_check_zrpf_v3_hash_vector.py \
            tests/test_check_recursive_stark_cbc_spec.py \
            tests/test_check_zrpf_v3_structural_tree_temporary_evidence.py \
            tests/core/test_recursive_stark_exact_once_admission.py \
            tests/integration/test_recursive_stark_admission_authority_boundary.py \
            tests/integration/test_recursive_stark_durable_admission_store.py \
            tests/integration/test_recursive_stark_replay_manifest.py \
            tests/integration/test_recursive_stark_verifier_adapter.py
          python3 tools/check_zrpf_v1_leaf_adapter_source_policy.py
          python3 tools/check_risc0_recursive_live_replay_evidence.py --json
          python3 tools/check_recursive_stark_cbc_spec.py
          python3 tools/check_zrpf_semantic_epoch_v1_local_evidence.py
          python3 tools/check_zrpf_v4_spot_value_leaf_local_evidence.py
          python3 -I tools/check_zrpf_v3_firecracker_direct_replay_evidence.py
          python3 -I tools/check_zrpf_v3_firecracker_replay_profile.py
          python3 -I tools/check_zrpf_v3_firecracker_protocol_binding.py
          python3 -I tools/check_zrpf_v3_firecracker_runtime_artifacts.py
          bash -n tools/build_zrpf_v3_firecracker_guest_images.sh
          python3 tools/zrpf_v3_artifact_privacy.py
          python3 tools/zrpf_v3_artifact_privacy.py \
            --artifact docs/research/RISC0_RECURSIVE_V1_LIVE_REPLAY_EVIDENCE_20260712.json
          python3 tools/check_zrpf_v3_replay_verifier_evidence.py --json

      - name: Run Rust protocol and verifier assurance
        shell: bash
        run: |
          set -euo pipefail
          pinned_bin="${HOME}/.risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu/bin"
          export CARGO="${pinned_bin}/cargo"
          export PATH="${pinned_bin}:/usr/bin:/bin"
          export RISC0_SKIP_BUILD=1
          export RUSTC="${pinned_bin}/rustc"
          export RUSTDOC="${pinned_bin}/rustdoc_tool_binary"
          "${pinned_bin}/cargo" fmt --manifest-path zk/zrpf_protocol/Cargo.toml \
            --all -- --check
          "${pinned_bin}/cargo" test --manifest-path zk/zrpf_protocol/Cargo.toml \
            --locked --all-targets
          "${pinned_bin}/cargo-clippy" clippy \
            --manifest-path zk/zrpf_protocol/Cargo.toml \
            --locked --all-targets -- -D warnings
          "${pinned_bin}/cargo" fmt --manifest-path zk/zrpf_risc0/Cargo.toml \
            --all -- --check
          "${pinned_bin}/cargo" test --manifest-path zk/zrpf_risc0/Cargo.toml \
            --locked --all-targets \
            -p zenodex-zrpf-risc0-shared \
            -p zenodex-zrpf-risc0-aggregate-shared \
            -p zenodex-zrpf-risc0-semantic-shared \
            -p zenodex-zrpf-risc0-value-node-shared \
            -p zenodex-zrpf-risc0-harness \
            -p zenodex-zrpf-risc0-verifier \
            -p zenodex-zrpf-risc0-replay-verifier
          "${pinned_bin}/cargo-clippy" clippy \
            --manifest-path zk/zrpf_risc0/Cargo.toml \
            --locked --all-targets \
            -p zenodex-zrpf-risc0-shared \
            -p zenodex-zrpf-risc0-aggregate-shared \
            -p zenodex-zrpf-risc0-semantic-shared \
            -p zenodex-zrpf-risc0-value-node-shared \
            -p zenodex-zrpf-risc0-harness \
            -p zenodex-zrpf-risc0-verifier \
            -p zenodex-zrpf-risc0-replay-verifier \
            -- -D warnings
          "${pinned_bin}/cargo" test \
            --manifest-path zk/zrpf_risc0/Cargo.toml \
            --locked -p zenodex-zrpf-risc0-semantic-shared \
            --no-default-features --test semantic_v2
          "${pinned_bin}/cargo-clippy" clippy \
            --manifest-path zk/zrpf_risc0/Cargo.toml \
            --locked -p zenodex-zrpf-risc0-semantic-shared \
            --no-default-features --test semantic_v2 -- -D warnings
          "${pinned_bin}/cargo" fmt \
            --manifest-path zk/recursive_stark_v2_risc0/Cargo.toml \
            --all -- --check
          "${pinned_bin}/cargo" test \
            --manifest-path zk/recursive_stark_v2_risc0/Cargo.toml \
            --locked --all
          "${pinned_bin}/cargo-clippy" clippy \
            --manifest-path zk/recursive_stark_v2_risc0/Cargo.toml \
            --locked --workspace --all-targets -- -D warnings
          "${pinned_bin}/cargo" fmt \
            --manifest-path zk/state_proof_risc0/Cargo.toml \
            --all -- --check
          "${pinned_bin}/cargo" test \
            --manifest-path zk/state_proof_risc0/Cargo.toml \
            --locked --offline -p tau-state-proof-risc0-cli --all-targets
          "${pinned_bin}/cargo-clippy" clippy \
            --manifest-path zk/state_proof_risc0/Cargo.toml \
            --locked --offline -p tau-state-proof-risc0-cli --all-targets -- -D warnings

      - name: Build pinned replay container
        run: |
          docker build \
            --file .docker/zrpf-assurance.Dockerfile \
            --tag zenodex-zrpf-assurance:ci \
            .

      - name: Run required source-built replay without network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --cpus 4 \
            --memory 6g \
            --memory-swap 6g \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777 \
            --tmpfs /out:rw,exec,nosuid,nodev,size=6g,mode=1777 \
            --volume "${GITHUB_WORKSPACE}:/input:ro" \
            --volume "${HOME}/.risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu:/risc0/toolchains/v1.94.1-rust-x86_64-unknown-linux-gnu:ro" \
            --volume "${HOME}/.cargo/registry:/home/zrpf/.cargo/registry:ro" \
            zenodex-zrpf-assurance:ci \
            /bin/sh -ceu '
              install -d -m 700 /out/private /out/private/git-home
              export GIT_CONFIG_NOSYSTEM=1
              export HOME=/out/private/git-home
              git config --global --add safe.directory /input
              git config --global --add safe.directory /input/.git
              source_head="$(git -C /input rev-parse HEAD)"
              git clone --no-checkout --no-hardlinks /input /out/private/repo
              git -C /out/private/repo checkout --detach "${source_head}"
              cd /out/private/repo
              python3 tools/check_zrpf_v3_replay_verifier_evidence.py \
                --live \
                --risc0-home /risc0 \
                --target-dir /out/private/live \
                --json
            ' | tee internal/zrpf-ci-live-replay.json

      - name: Upload ZRPF assurance report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zrpf-assurance-report
          path: internal/zrpf-ci-live-replay.json
          if-no-files-found: error
          retention-days: 14
