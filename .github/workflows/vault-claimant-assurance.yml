name: vault-claimant-assurance

on:
  pull_request:
    paths:
      - "src/core/vault.py"
      - "src/core/vault_claimant.py"
      - "tests/core/test_vault_claimant.py"
      - "tests/core/test_vault_legacy_authority.py"
      - "docs/security/CLAIMANT_VAULT_AUTHORITY_BOUNDARY_V1.md"
      - ".github/workflows/vault-claimant-assurance.yml"
  push:
    branches:
      - agent/vault-claimant-accounting-v1-20260721

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Run and retain Ruff diagnostics
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check \
            src/core/vault.py \
            src/core/vault_claimant.py \
            tests/core/test_vault_claimant.py \
            tests/core/test_vault_legacy_authority.py \
            --output-format=concise 2>&1 | tee ruff-diagnostics.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-claimant-ruff-diagnostics
          path: ruff-diagnostics.txt
          if-no-files-found: error
      - name: Enforce Ruff result
        if: steps.ruff.outputs.exit_code != '0'
        run: exit 1

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: python -m mypy src/core/vault_claimant.py

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile src/core/vault.py src/core/vault_claimant.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - run: |
          python -m pytest -q \
            tests/core/test_vault_claimant.py \
            tests/core/test_vault_legacy_authority.py \
            tests/core/test_vault_ref_parity.py
