name: zrpf-operational-policy-adapter

on:
  pull_request:
    paths:
      - 'src/integration/zrpf_spot_v7_operational_policy_adapter.py'
      - 'tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py'
      - '.github/workflows/zrpf-operational-policy-adapter.yml'
  push:
    branches:
      - main
    paths:
      - 'src/integration/zrpf_spot_v7_operational_policy_adapter.py'
      - 'tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py'
      - '.github/workflows/zrpf-operational-policy-adapter.yml'

permissions:
  contents: read

jobs:
  policy-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install hash-pinned assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run Ruff
        run: |
          ruff check \
            src/integration/zrpf_spot_v7_operational_policy_adapter.py \
            tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py

      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: |
          mkdir -p internal
          set -o pipefail
          mypy --follow-imports=skip \
            src/integration/zrpf_spot_v7_operational_policy_adapter.py \
            tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py \
            2>&1 | tee internal/zrpf-operational-policy-mypy.log

      - name: Run focused tests
        id: pytest
        continue-on-error: true
        run: |
          mkdir -p internal
          set -o pipefail
          pytest -q tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py \
            2>&1 | tee internal/zrpf-operational-policy-pytest.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zrpf-operational-policy-diagnostics
          path: |
            internal/zrpf-operational-policy-mypy.log
            internal/zrpf-operational-policy-pytest.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce focused results
        if: steps.mypy.outcome != 'success' || steps.pytest.outcome != 'success'
        run: exit 1
