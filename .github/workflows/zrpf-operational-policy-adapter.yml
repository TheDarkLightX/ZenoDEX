name: zrpf-operational-policy-adapter

on:
  pull_request:
    paths:
      - 'src/integration/zrpf_spot_v7_operational_policy_adapter.py'
      - 'tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py'
      - '.github/workflows/zrpf-operational-policy-adapter.yml'
  push:
    branches:
      - main
    paths:
      - 'src/integration/zrpf_spot_v7_operational_policy_adapter.py'
      - 'tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py'
      - '.github/workflows/zrpf-operational-policy-adapter.yml'

permissions:
  contents: read

jobs:
  policy-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install hash-pinned assurance tools
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run adapter assurance
        run: |
          set -euo pipefail
          ruff check \
            src/integration/zrpf_spot_v7_operational_policy_adapter.py \
            tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py
          mypy --follow-imports=skip \
            src/integration/zrpf_spot_v7_operational_policy_adapter.py \
            tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py
          pytest -q tests/integration/test_zrpf_spot_v7_operational_policy_adapter.py
