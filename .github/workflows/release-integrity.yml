name: release-integrity-blocked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-current-release-refusal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce current operator release admission
        run: |
          python3 tools/check_operator_packaging.py --pretty

      - name: Unreachable release guard
        if: always()
        run: |
          test "${{ job.status }}" = "failure"
          echo "Current operator profile remains release-ineligible."
