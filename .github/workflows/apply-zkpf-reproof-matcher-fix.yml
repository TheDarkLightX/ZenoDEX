name: apply-zkpf-reproof-matcher-fix

on:
  push:
    branches:
      - agent/zkpf-reproof-planner-20260714

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/zkpf-reproof-planner-20260714

      - name: Patch matcher without weakening path validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/plan_zkpf_reproof.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _matches(path: str, pattern: str) -> bool:
              if pattern.endswith("/**"):
                  prefix = pattern[:-3].rstrip("/")
                  return path == prefix or path.startswith(prefix + "/")
              return fnmatch.fnmatchcase(path, pattern)
          '''
          new = '''def _matches(path: str, pattern: str) -> bool:
              prefix_candidate = pattern[:-3] if pattern.endswith("/**") else pattern
              if pattern.endswith("/**") and not any(
                  marker in prefix_candidate for marker in ("*", "?", "[")
              ):
                  prefix = prefix_candidate.rstrip("/")
                  return path == prefix or path.startswith(prefix + "/")
              return fnmatch.fnmatchcase(path, pattern)
          '''
          if text.count(old) != 1:
              raise SystemExit('reproof matcher source drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify focused planner tests
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_plan_zkpf_reproof.py

      - name: Remove staging workflow and push reviewed fix
        run: |
          set -euo pipefail
          rm .github/workflows/apply-zkpf-reproof-matcher-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: support wildcard recursive reproof globs'
          git push origin HEAD:agent/zkpf-reproof-planner-20260714
