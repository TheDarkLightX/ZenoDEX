name: Materialize FCIS M5-to-M6 refinement matrix

on:
  push:
    branches:
      - agent/fcis-m5-to-m6-refinement-matrix-20260729
    paths:
      - .github/fcis_m5_to_m6_payload/**
      - .github/workflows/materialize_fcis_m5_to_m6.yml

permissions:
  contents: write

concurrency:
  group: materialize-fcis-m5-to-m6-refinement-matrix
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Decode, verify, and validate reviewed artifacts
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA='6c22f52c5e65f14b4501a62a049d231fd48aa2d3'
          ARCHIVE_SHA='c26611308d5026b452cdfaaec9cc416304f4b06582200bad1d9debd7c911e1e8'
          MD_SHA='0cce014acd454132fb5ea2a0d4da3719eb185e29936141a8266c17a520abc889'
          JSON_SHA='4152a911f4de39898cc781f2713a23aaf038c7e04929be95bc1973f3ef3f4348'
          CHECKER_SHA='e04e49cad0423b4921c98680c7b14ffeac1e2b8f2ae5093473e49d09a190b8e4'

          git merge-base --is-ancestor "$BASE_SHA" HEAD

          cat .github/fcis_m5_to_m6_payload/chunk_*.txt \
            | base64 --decode \
            > /tmp/fcis_m5_to_m6_payload.tar.xz
          echo "$ARCHIVE_SHA  /tmp/fcis_m5_to_m6_payload.tar.xz" | sha256sum -c -

          mapfile -t archive_entries < <(tar -tJf /tmp/fcis_m5_to_m6_payload.tar.xz | LC_ALL=C sort)
          expected_archive_entries=(
            'FCIS_M5_TO_M6_REFINEMENT_MATRIX.json'
            'FCIS_M5_TO_M6_REFINEMENT_MATRIX.md'
            'check_fcis_m5_to_m6_refinement_matrix.py'
          )
          if ! diff -u \
            <(printf '%s\n' "${expected_archive_entries[@]}") \
            <(printf '%s\n' "${archive_entries[@]}"); then
            echo 'Unexpected archive member set' >&2
            exit 1
          fi

          rm -rf /tmp/fcis_m5_to_m6_payload
          mkdir -p /tmp/fcis_m5_to_m6_payload
          tar --extract --xz --file /tmp/fcis_m5_to_m6_payload.tar.xz \
            --directory /tmp/fcis_m5_to_m6_payload \
            --no-same-owner --no-same-permissions

          install -D -m 0644 \
            /tmp/fcis_m5_to_m6_payload/FCIS_M5_TO_M6_REFINEMENT_MATRIX.md \
            docs/research/FCIS_M5_TO_M6_REFINEMENT_MATRIX.md
          install -D -m 0644 \
            /tmp/fcis_m5_to_m6_payload/FCIS_M5_TO_M6_REFINEMENT_MATRIX.json \
            docs/research/FCIS_M5_TO_M6_REFINEMENT_MATRIX.json
          install -D -m 0755 \
            /tmp/fcis_m5_to_m6_payload/check_fcis_m5_to_m6_refinement_matrix.py \
            tools/check_fcis_m5_to_m6_refinement_matrix.py

          echo "$MD_SHA  docs/research/FCIS_M5_TO_M6_REFINEMENT_MATRIX.md" | sha256sum -c -
          echo "$JSON_SHA  docs/research/FCIS_M5_TO_M6_REFINEMENT_MATRIX.json" | sha256sum -c -
          echo "$CHECKER_SHA  tools/check_fcis_m5_to_m6_refinement_matrix.py" | sha256sum -c -

          PYTHONPYCACHEPREFIX=/tmp/fcis-matrix-pycache \
            python3 -m py_compile tools/check_fcis_m5_to_m6_refinement_matrix.py
          python3 tools/check_fcis_m5_to_m6_refinement_matrix.py
          python3 tools/check_fcis_m5_to_m6_refinement_matrix.py --json \
            > /tmp/fcis_m5_to_m6_check.json
          git diff --check

      - name: Replace staging payload with the three research artifacts
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA='6c22f52c5e65f14b4501a62a049d231fd48aa2d3'
          rm -rf .github/fcis_m5_to_m6_payload
          rm -f .github/workflows/materialize_fcis_m5_to_m6.yml
          git add -A
          git diff --cached --check

          mapfile -t actual_paths < <(git diff --cached --name-only "$BASE_SHA" -- | LC_ALL=C sort)
          expected_paths=(
            'docs/research/FCIS_M5_TO_M6_REFINEMENT_MATRIX.json'
            'docs/research/FCIS_M5_TO_M6_REFINEMENT_MATRIX.md'
            'tools/check_fcis_m5_to_m6_refinement_matrix.py'
          )
          if ! diff -u \
            <(printf '%s\n' "${expected_paths[@]}") \
            <(printf '%s\n' "${actual_paths[@]}"); then
            echo 'Final tree is not the exact three-file research-only change' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(fcis): add M5-to-M6 refinement matrix'
          git push origin "HEAD:${GITHUB_REF_NAME}"
