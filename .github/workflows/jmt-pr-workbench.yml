name: jmt-pr-workbench

on:
  push:
    branches:
      - agent/jmt-storage-update-plan-v1
  pull_request:

permissions:
  contents: write

concurrency:
  group: jmt-pr-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize JMT code inside the governed source closure
        id: normalize
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import indent

          module_path = Path(
              "zk/zrpf_protocol/protocol/src/"
              "sparse_merkle_batch_transition_v1/jmt_storage_update_plan_v1.rs"
          )
          module_root = Path(
              "zk/zrpf_protocol/protocol/src/"
              "sparse_merkle_batch_transition_v1/mod.rs"
          )
          jmt_test_path = Path(
              "zk/zrpf_protocol/protocol/tests/jmt_storage_update_plan_v1.rs"
          )
          batch_test_path = Path(
              "zk/zrpf_protocol/protocol/tests/sparse_merkle_batch_transition_v1.rs"
          )
          manifest_path = Path("zk/zrpf_protocol/protocol/Cargo.toml")

          inline_marker = "mod jmt_storage_update_plan_v1 {"
          nested_test_marker = "mod jmt_storage_update_plan_v1_tests {"
          target_block = (
              '[[test]]\n'
              'name = "jmt_storage_update_plan_v1"\n'
              'path = "tests/jmt_storage_update_plan_v1.rs"\n\n'
          )

          if module_path.exists():
              module_text = module_path.read_text(encoding="utf-8")
              root_text = module_root.read_text(encoding="utf-8")
              external_decl = "mod jmt_storage_update_plan_v1;\n"
              if root_text.count(external_decl) != 1 or inline_marker in root_text:
                  raise SystemExit("unexpected JMT module layout")
              root_text = root_text.replace(external_decl, "", 1)
              root_text = (
                  root_text.rstrip()
                  + "\n\nmod jmt_storage_update_plan_v1 {\n"
                  + indent(module_text.rstrip() + "\n", "    ")
                  + "}\n"
              )
              module_root.write_text(root_text, encoding="utf-8")
              module_path.unlink()

              test_text = jmt_test_path.read_text(encoding="utf-8")
              support_decl = "mod sparse_merkle_batch_support;\n\n"
              if not test_text.startswith(support_decl):
                  raise SystemExit("unexpected JMT test support declaration")
              test_body = test_text[len(support_decl):].replace(
                  "use sparse_merkle_batch_support::{",
                  "use super::sparse_merkle_batch_support::{",
                  1,
              )
              batch_test_text = batch_test_path.read_text(encoding="utf-8")
              if nested_test_marker in batch_test_text:
                  raise SystemExit("JMT test module already present")
              batch_test_text = (
                  batch_test_text.rstrip()
                  + "\n\nmod jmt_storage_update_plan_v1_tests {\n"
                  + indent(test_body.rstrip() + "\n", "    ")
                  + "}\n"
              )
              batch_test_path.write_text(batch_test_text, encoding="utf-8")
              jmt_test_path.unlink()

              manifest = manifest_path.read_text(encoding="utf-8")
              if manifest.count(target_block) != 1:
                  raise SystemExit("unexpected JMT test target layout")
              manifest_path.write_text(
                  manifest.replace(target_block, "", 1),
                  encoding="utf-8",
              )
          else:
              if inline_marker not in module_root.read_text(encoding="utf-8"):
                  raise SystemExit("JMT module is neither external nor inline")
              if nested_test_marker not in batch_test_path.read_text(encoding="utf-8"):
                  raise SystemExit("JMT tests are not in the governed batch test")
              if jmt_test_path.exists():
                  raise SystemExit("unexpected external JMT test remains")
              if target_block in manifest_path.read_text(encoding="utf-8"):
                  raise SystemExit("unexpected external JMT test target remains")
          PY

          cargo fmt --manifest-path zk/zrpf_protocol/Cargo.toml --all

          if git diff --quiet --exit-code; then
            echo 'commit_created=false' >> "${GITHUB_OUTPUT}"
          else
            git config user.name 'ZenoDEX JMT Workbench'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- \
              zk/zrpf_protocol/protocol/Cargo.toml \
              zk/zrpf_protocol/protocol/src/sparse_merkle_batch_transition_v1 \
              zk/zrpf_protocol/protocol/tests/sparse_merkle_batch_transition_v1.rs \
              zk/zrpf_protocol/protocol/tests/jmt_storage_update_plan_v1.rs
            git commit -m 'zk: keep JMT boundary inside governed source closure'
            echo 'commit_created=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo-clippy --version
          rustfmt --version

      - name: Check governed source inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.zrpf_v3_source_closure import build_source_closure
          document = build_source_closure(Path.cwd())
          print(document["file_count"])
          print(document["sha256"])
          PY

      - name: Check formatting
        shell: bash
        run: cargo fmt --manifest-path zk/zrpf_protocol/Cargo.toml --all -- --check

      - name: Run protocol tests
        shell: bash
        run: cargo test --manifest-path zk/zrpf_protocol/Cargo.toml --locked --all-targets

      - name: Run protocol clippy
        shell: bash
        run: cargo clippy --manifest-path zk/zrpf_protocol/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run protocol doctests
        shell: bash
        run: cargo test --manifest-path zk/zrpf_protocol/Cargo.toml --locked --doc

      - name: Push normalized governed-source commit
        if: github.event_name == 'push' && steps.normalize.outputs.commit_created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/jmt-storage-update-plan-v1
