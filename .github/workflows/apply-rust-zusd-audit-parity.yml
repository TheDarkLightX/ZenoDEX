name: apply-rust-zusd-audit-parity

on:
  pull_request:
    branches:
      - agent/rust-fcis-policy-inventory-20260722
    paths:
      - ".agent/apply_rust_zusd_audit_parity.py"
      - "tests/runtime/test_zusd_rust_audit_parity.py"
      - ".github/workflows/apply-rust-zusd-audit-parity.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.event.pull_request.head.ref == 'agent/rust-zusd-audit-parity-20260722' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-zusd-audit-parity-20260722
          fetch-depth: 0
          persist-credentials: true

      - name: Merge the latest FCIS policy base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/rust-fcis-policy-inventory-20260722
          git merge --no-edit origin/agent/rust-fcis-policy-inventory-20260722

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Apply exact-source Python and Rust transformation
        id: transform
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python .agent/apply_rust_zusd_audit_parity.py 2>&1 | tee transformation-diagnostics.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload transformation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-zusd-transformation-diagnostics
          path: transformation-diagnostics.txt
          if-no-files-found: error

      - name: Enforce transformation result
        if: steps.transform.outputs.exit_code != '0'
        run: exit 1

      - name: Ruff safe fixes
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check --fix \
            src/core/zusd.py \
            tools/runtime/zusd_kernel_lib.py \
            tests/runtime/test_zusd_rust_audit_parity.py \
            2>&1 | tee ruff-diagnostics.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-zusd-ruff-diagnostics
          path: ruff-diagnostics.txt
          if-no-files-found: error

      - name: Enforce Ruff result
        if: steps.ruff.outputs.exit_code != '0'
        run: exit 1

      - name: Ruff format
        run: |
          python -m ruff format \
            src/core/zusd.py \
            tools/runtime/zusd_kernel_lib.py \
            tests/runtime/test_zusd_rust_audit_parity.py

      - name: Rust format
        id: rustfmt
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path rust-runtime/Cargo.toml 2>&1 | tee rustfmt-diagnostics.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Rust format diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-zusd-rustfmt-diagnostics
          path: rustfmt-diagnostics.txt
          if-no-files-found: error

      - name: Enforce Rust format result
        if: steps.rustfmt.outputs.exit_code != '0'
        run: exit 1

      - name: Validate Rust FCIS inventory
        run: python tools/check_rust_fcis_policy.py --pretty

      - name: Rust zUSD core tests
        working-directory: rust-runtime
        run: |
          cargo test --locked -p zenodex-runtime-core zusd
          cargo clippy --locked -p zenodex-runtime-core --all-targets -- -D warnings

      - name: Build Rust authority bridge
        working-directory: rust-runtime
        run: cargo build --locked --bin zenodex-runtime

      - name: Python/Rust audit parity and differential tests
        run: |
          python -m pytest -q \
            tests/runtime/test_zusd_rust_audit_parity.py \
            tests/runtime/test_zusd_conformance.py \
            tests/runtime/test_zusd_live_path.py

      - name: Publish normal source commit
        run: |
          rm -f .agent/apply_rust_zusd_audit_parity.py
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-rust-zusd-audit-parity.yml
          rm -f transformation-diagnostics.txt ruff-diagnostics.txt rustfmt-diagnostics.txt
          git add -A
          git commit -m "fix(runtime): align Rust zUSD with audited authority"
          git push origin HEAD:agent/rust-zusd-audit-parity-20260722
