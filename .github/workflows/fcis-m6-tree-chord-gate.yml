name: FCIS M6 Tree-Chord-Gate

on:
  pull_request:
    paths:
      - "src/core/fcis_tree_chord_gate_authority.py"
      - "tests/core/test_fcis_tree_chord_gate_authority.py"
      - "experiments/fcis_tcg_bounded_search.py"
      - "experiments/fcis_tcg_bounded_search_result.json"
      - "experiments/julia/fcis_tree_chord_gate_oracle.jl"
      - "formal/esso/fcis_tree_chord_gate_authority_v1.yaml"
      - "lean-mathlib/Proofs/FCISTreeChordGateAuthority.lean"
      - "lean-mathlib/lakefile.lean"
      - ".github/workflows/fcis-m6-tree-chord-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-certificate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact development requirements
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile focused files
        run: |
          python -m py_compile \
            src/core/fcis_tree_chord_gate_authority.py \
            tests/core/test_fcis_tree_chord_gate_authority.py \
            experiments/fcis_tcg_bounded_search.py
      - name: Lint focused files
        run: |
          python -m ruff check \
            src/core/fcis_tree_chord_gate_authority.py \
            tests/core/test_fcis_tree_chord_gate_authority.py \
            experiments/fcis_tcg_bounded_search.py
      - name: Type-check certificate checker
        run: python -m mypy src/core/fcis_tree_chord_gate_authority.py
      - name: Run focused certificate tests
        run: python -m pytest -q tests/core/test_fcis_tree_chord_gate_authority.py
      - name: Replay bounded search
        run: |
          python experiments/fcis_tcg_bounded_search.py > /tmp/fcis-tcg-python.json
          git diff --exit-code -- experiments/fcis_tcg_bounded_search_result.json

  julia-oracle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pinned Julia action
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9
        with:
          version: "1.12"
      - name: Run independent Julia oracle
        run: julia --startup-file=no experiments/julia/fcis_tree_chord_gate_oracle.jl > /tmp/fcis-tcg-julia.json
      - name: Compare Julia and frozen Python results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(
              Path("experiments/fcis_tcg_bounded_search_result.json").read_text(
                  encoding="utf-8"
              )
          )
          actual = json.loads(Path("/tmp/fcis-tcg-julia.json").read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit(
                  "Julia oracle disagrees with frozen Python result\n"
                  f"expected={json.dumps(expected, sort_keys=True)}\n"
                  f"actual={json.dumps(actual, sort_keys=True)}"
              )
          PY

  lean-theorems:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Materialize the pinned compatible mathlib tree
        run: |
          git clone \
            --depth 1 \
            --branch v4.27.0 \
            https://github.com/leanprover-community/mathlib4.git \
            external/mathlib4
      - name: Install pinned Elan and project Lean toolchain
        env:
          ELAN_INSTALLER_COMMIT: b6cec7e10fe4965a605aaf60d1cb4a5837f0462b
        run: |
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_INSTALLER_COMMIT}/elan-init.sh" \
            --output /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-mathlib/lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-mathlib/lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Generate manifest and restore compatible mathlib cache
        working-directory: lean-mathlib
        run: |
          lake update
          lake exe cache get
      - name: Build theorem root and capture dependency audit
        working-directory: lean-mathlib
        run: |
          lake build Proofs.FCISTreeChordGateAuthority
          lake env lean Proofs/FCISTreeChordGateAuthority.lean | tee dependency-audit.txt
          grep -F "FCISTreeChordGateAuthority.DPath.run_eq_canonical" dependency-audit.txt
          grep -F "FCISTreeChordGateAuthority.DPath.two_paths_agree" dependency-audit.txt
          grep -F "FCISTreeChordGateAuthority.gateComplete_cross" dependency-audit.txt
          grep -F "FCISTreeChordGateAuthority.unit_stage_edge_crosses_unique_gate" dependency-audit.txt
      - name: Reject proof placeholders and trust-expanding declarations
        run: |
          if grep -n -E '\b(sorry|admit|axiom|unsafe)\b' \
            lean-mathlib/Proofs/FCISTreeChordGateAuthority.lean; then
            exit 1
          fi
