              - { param: "session_capability_binding_ok" }
              - { param: "wallet_capability_ok" }
              - { param: "nonce_ok" }
      system_ok:
        op: "or"
        args:
          - op: "not"
            args:
              - { param: "emit_requested" }
          - op: "and"
            args:
              - { param: "policy_artifact_ok" }
              - { param: "tau_policy_bundle_ok" }
              - { param: "compile_ok" }
              - { param: "source_registry_ok" }
              - { param: "signer_binding_ok" }
              - { param: "signal_provenance_ok" }
              - { param: "execution_ok" }
