  state_vars:
    - "free_debt_units"
    - "external_supply_units"
    - "protocol_pool_units"
    - "host_pool_units"
    - "staking_pool_units"
    - "staking_claim_sum_units"
    - "committed_protocol_authority"
    - "fee_partition_evidence"
    - "transport_exactness_evidence"
    - "protocol_claimability_evidence"
    - "host_claimant_allocation_evidence"
    - "staking_claimant_authorization_evidence"
    - "staking_claim_sum_evidence"
    - "cover_preservation_evidence"
    - "authority_binding_evidence"
    - "policy_config_binding_evidence"
    - "normative_split_evidence"
    - "cumulative_split_evidence"
    - "policy_content_evidence"
    - "source_asset_unit_evidence"
    - "event_origin_replay_evidence"
    - "carry_continuity_evidence"
    - "stake_disposition_evidence"
    - "host_disposition_evidence"
    - "fallback_semantics_evidence"
    - "reserve_buyback_custody_evidence"
    - "router_stack_refinement_evidence"
    - "carry_migration_evidence"
    - "temporal_liveness_evidence"
    - "reject_noop_evidence"
    - "runtime_refinement_evidence"
    - "claim_status"
  effects:
    - "claimed_units"
    - "claimant"
    - "event"
    - "fee_units"
    - "host_route_units"
    - "liability_cover_preserved"
    - "observed_protocol_authority"
    - "principal_units"
    - "protocol_authority_bound"
    - "protocol_route_units"
    - "recorded_atom"
    - "recorded_status"
    - "staking_claim_sum_exact"
    - "staking_route_units"

types:
  - id: "Authority"
    type: { kind: "enum", symbols: ["AUTH_None", "AUTH_A", "AUTH_B"] }
  - id: "EvidenceStatus"
    type: { kind: "enum", symbols: ["EVID_Unknown", "EVID_Pass", "EVID_Fail"] }
  - id: "RequirementAtom"
    type:
      kind: "enum"
      symbols:
        - "REQ_None"
        - "REQ_FeePartition"
        - "REQ_TransportExactness"
        - "REQ_ProtocolClaimability"
        - "REQ_HostClaimantAllocation"
        - "REQ_StakingClaimantAuthorization"
        - "REQ_StakingClaimSum"
        - "REQ_CoverPreservation"
        - "REQ_AuthorityBinding"
        - "REQ_PolicyConfigBinding"
        - "REQ_NormativeSplit"
        - "REQ_CumulativeSplit"
        - "REQ_PolicyContent"
        - "REQ_SourceAssetUnit"
        - "REQ_EventOriginReplay"
        - "REQ_CarryContinuity"
        - "REQ_StakeDisposition"
        - "REQ_HostDisposition"
        - "REQ_FallbackSemantics"
        - "REQ_ReserveBuybackCustody"
        - "REQ_RouterStackRefinement"
        - "REQ_CarryMigration"
        - "REQ_TemporalLiveness"
        - "REQ_RejectNoop"
        - "REQ_RuntimeRefinement"
  - id: "ClaimStatus"
    type: { kind: "enum", symbols: ["CLAIM_Blocked", "CLAIM_Promoted"] }
  - id: "Event"
    type:
      kind: "enum"
      symbols:
        - "EV_AuthorityConfigured"
        - "EV_FeeRouted"
        - "EV_ProtocolClaimed"
        - "EV_HostClaimed"
        - "EV_StakingClaimed"
        - "EV_EvidenceRecorded"
        - "EV_ClaimPromoted"

