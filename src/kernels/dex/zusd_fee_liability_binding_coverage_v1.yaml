# [FORGE] zUSD Fee Liability And Binding Coverage v1
# Scope correction: `staking_claim_sum_units` below is an abstract aggregate scalar.
# The IR does not contain a per-staker claim vector or prove that scalar is the sum of
# individual entitlements; per-staker no-dust coverage remains an open sidecar obligation.
ir_version: "esso-ir/v1"
meta:
  model_id: "zusd_fee_liability_binding_coverage_v1"
  created_by: "zenodex"
  notes: |
    Bounded assurance model for the live zUSD fee-liability boundary.

    Unit convention:
      - One `*_units` value is one whole zUSD unit at the v0.1 balance transport.
      - Fractional transport is abstracted as the caller-supplied
        `transport_remainder`; routing rejects unless that flag is zero.

    Effect convention:
      - Every accepted action emits the same total observable effect ABI.
      - Fields irrelevant to an action use typed sentinels: integer zero,
        AUTH_None, REQ_None, or EVID_Unknown.

    Guarantees inside this finite model:
      - Fee routes conserve the aggregate caller-supplied host/staking/protocol
        partition by construction.
      - Free debt equals external supply plus internal fee liabilities.
      - The staking fee pool equals the abstract `staking_claim_sum_units` mirror.
      - Each modeled live route or claim binds an explicit observed protocol
        authority directly to the immutable committed authority.
      - Claims move liability to external supply without changing free debt.
      - Promotion is unavailable until every named evidence atom is Pass.
      - Committing the protocol authority invalidates every evidence atom so
        pre-configuration evidence cannot authorize a post-configuration claim.
      - Guard rejection is state-preserving under ESSO kernel semantics.

    Explicit non-claims:
      - This model does not prove that the Python runtime refines these transitions.
      - This model does not derive `transport_remainder` from E8 arithmetic.
      - This model assumes the protocol claimant enum already identifies an
        authenticated principal.
      - Host and staking claims are aggregate transitions without claimant identity.
      - No per-host entitlement map or equality between the aggregate host pool and
        individual host claims is represented.
      - Host allocation/authorization and staking sender authorization remain open
        promotion obligations.
      - This model has no per-staker entitlement vector, allocation, or no-dust theorem.
      - This model proves no temporal liveness or from-init claim reachability property.
      - This model does not commit or authenticate the live fee and staking policy
        configuration; policy binding is represented only as a promotion atom.
      - This model does not derive tokenomics v2 source-specific destination
        shares; host and staking route amounts remain caller-supplied abstractions.
      - The standalone six-lane residue router, its policy table, source/asset
        bindings, event IDs, disposition roots, carry chain, and migration are
        represented only as explicit promotion obligations.
      - The model does not prove router-to-bridge-to-Rust observational refinement.
      - No terminal-residue drain, approved fallback, reserve/buyback custody, or
        fee-liability temporal-liveness property is represented.
      - Evidence recording is an external authenticated-input assumption.
      - Bounds are deliberately small and do not establish arithmetic overflow safety
        for production-width integers.
      - Authority rotation governance and migration are outside this v1 model.
      - Shutdown snapshots, Stability Pool and perps liabilities, wallet payout
        inventory, shutdown payout coverage, and post-shutdown repay are outside
        this model.
      - No operation nonce, receipt identifier, or replay-protection state is
        represented; runtime replay safety is outside this model.
      - Command semantics are sequential; concurrency, batch reordering,
        interleavings, and mempool visibility are not modeled.

