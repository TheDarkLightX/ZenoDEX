      claimant: { param: "claimant" }
      event: { enum: "EV_ProtocolClaimed" }
      fee_units: { const: 0 }
      host_route_units: { const: 0 }
      observed_protocol_authority: { param: "observed_protocol_authority" }
      principal_units: { const: 0 }
