  - { var: "runtime_refinement_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "claim_status", expr: { enum: "CLAIM_Blocked" } }

invariants:
  - id: "inv_free_debt_liability_cover"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "free_debt_units" }
        - op: "+"
          args:
            - { var: "external_supply_units" }
            - { var: "protocol_pool_units" }
            - { var: "host_pool_units" }
            - { var: "staking_pool_units" }

  - id: "inv_staking_pool_is_exact_claim_sum"
    kind: "safety"
    expr:
      op: "="
      args: [{ var: "staking_pool_units" }, { var: "staking_claim_sum_units" }]

  - id: "inv_protocol_liability_requires_bound_authority"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - { op: ">", args: [{ var: "protocol_pool_units" }, { const: 0 }] }
        - { op: "!=", args: [{ var: "committed_protocol_authority" }, { enum: "AUTH_None" }] }

  - id: "inv_promoted_claim_requires_all_evidence"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - { op: "=", args: [{ var: "claim_status" }, { enum: "CLAIM_Promoted" }] }
        - op: "and"
          args:
            - { op: "=", args: [{ var: "fee_partition_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "transport_exactness_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "protocol_claimability_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "host_claimant_allocation_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "staking_claimant_authorization_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "staking_claim_sum_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "cover_preservation_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "authority_binding_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "policy_config_binding_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "normative_split_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "cumulative_split_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "policy_content_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "source_asset_unit_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "event_origin_replay_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "carry_continuity_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "stake_disposition_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "host_disposition_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "fallback_semantics_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "reserve_buyback_custody_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "router_stack_refinement_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "carry_migration_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "temporal_liveness_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "reject_noop_evidence" }, { enum: "EVID_Pass" }] }
            - { op: "=", args: [{ var: "runtime_refinement_evidence" }, { enum: "EVID_Pass" }] }

  - id: "inv_promoted_claim_locks_bound_authority"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - { op: "=", args: [{ var: "claim_status" }, { enum: "CLAIM_Promoted" }] }
        - { op: "!=", args: [{ var: "committed_protocol_authority" }, { enum: "AUTH_None" }] }

actions:
  - id: "configure_protocol_authority"
    params:
      - id: "authority"
        type: { ref: "Authority" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "claim_status" }, { enum: "CLAIM_Blocked" }] }
        - { op: "=", args: [{ var: "free_debt_units" }, { const: 0 }] }
        - { op: "=", args: [{ var: "committed_protocol_authority" }, { enum: "AUTH_None" }] }
        - { op: "!=", args: [{ param: "authority" }, { enum: "AUTH_None" }] }
    updates:
      - { var: "committed_protocol_authority", expr: { param: "authority" } }
      - { var: "protocol_claimability_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "host_claimant_allocation_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "staking_claimant_authorization_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "fee_partition_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "transport_exactness_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "staking_claim_sum_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "cover_preservation_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "authority_binding_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "policy_config_binding_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "normative_split_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "cumulative_split_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "policy_content_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "source_asset_unit_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "event_origin_replay_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "carry_continuity_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "stake_disposition_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "host_disposition_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "fallback_semantics_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "reserve_buyback_custody_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "router_stack_refinement_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "carry_migration_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "temporal_liveness_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "reject_noop_evidence", expr: { enum: "EVID_Unknown" } }
      - { var: "runtime_refinement_evidence", expr: { enum: "EVID_Unknown" } }
    effects:
      claimed_units: { const: 0 }
      claimant: { enum: "AUTH_None" }
      event: { enum: "EV_AuthorityConfigured" }
      fee_units: { const: 0 }
      host_route_units: { const: 0 }
      liability_cover_preserved:
        op: "="
        args:
          - { var: "free_debt_units" }
          - { op: "+", args: [{ var: "external_supply_units" }, { var: "protocol_pool_units" }, { var: "host_pool_units" }, { var: "staking_pool_units" }] }
      observed_protocol_authority: { param: "authority" }
      principal_units: { const: 0 }
      protocol_authority_bound:
        op: "="
        args: [{ var: "committed_protocol_authority" }, { param: "authority" }]
      protocol_route_units: { const: 0 }
      recorded_atom: { enum: "REQ_None" }
      recorded_status: { enum: "EVID_Unknown" }
      staking_claim_sum_exact:
        op: "="
        args: [{ var: "staking_pool_units" }, { var: "staking_claim_sum_units" }]
      staking_route_units: { const: 0 }

  - id: "route_fee_liability"
    params:
      - id: "principal_units"
        type: { kind: "int", min: 0, max: 4 }
      - id: "fee_units"
        type: { kind: "int", min: 1, max: 4 }
      - id: "host_route_units"
        type: { kind: "int", min: 0, max: 4 }
      - id: "staking_route_units"
        type: { kind: "int", min: 0, max: 4 }
      - id: "transport_remainder"
        type: { kind: "int", min: 0, max: 1 }
      - id: "observed_protocol_authority"
        type: { ref: "Authority" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ param: "transport_remainder" }, { const: 0 }] }
        - { op: "=", args: [{ param: "observed_protocol_authority" }, { var: "committed_protocol_authority" }] }
        - op: "<="
          args:
            - { op: "+", args: [{ param: "host_route_units" }, { param: "staking_route_units" }] }
            - { param: "fee_units" }
        - op: "<="
          args:
            - op: "+"
              args:
                - { var: "protocol_pool_units" }
                - op: "-"
                  args:
                    - { param: "fee_units" }
                    - { op: "+", args: [{ param: "host_route_units" }, { param: "staking_route_units" }] }
            - { const: 4 }
        - { op: "<=", args: [{ op: "+", args: [{ var: "host_pool_units" }, { param: "host_route_units" }] }, { const: 4 }] }
        - { op: "<=", args: [{ op: "+", args: [{ var: "staking_pool_units" }, { param: "staking_route_units" }] }, { const: 4 }] }
        - op: "<="
          args:
            - op: "+"
              args:
                - { var: "free_debt_units" }
                - { param: "principal_units" }
                - { param: "fee_units" }
            - { const: 12 }
        - { op: "<=", args: [{ op: "+", args: [{ var: "external_supply_units" }, { param: "principal_units" }] }, { const: 12 }] }
        - op: "or"
          args:
            - op: "="
              args:
                - { param: "fee_units" }
                - { op: "+", args: [{ param: "host_route_units" }, { param: "staking_route_units" }] }
            - { op: "!=", args: [{ var: "committed_protocol_authority" }, { enum: "AUTH_None" }] }
    updates:
      - var: "free_debt_units"
        expr: { op: "+", args: [{ var: "free_debt_units" }, { param: "principal_units" }, { param: "fee_units" }] }
      - var: "external_supply_units"
        expr: { op: "+", args: [{ var: "external_supply_units" }, { param: "principal_units" }] }
      - var: "protocol_pool_units"
        expr:
          op: "+"
          args:
            - { var: "protocol_pool_units" }
            - op: "-"
              args:
                - { param: "fee_units" }
                - { op: "+", args: [{ param: "host_route_units" }, { param: "staking_route_units" }] }
      - var: "host_pool_units"
        expr: { op: "+", args: [{ var: "host_pool_units" }, { param: "host_route_units" }] }
      - var: "staking_pool_units"
        expr: { op: "+", args: [{ var: "staking_pool_units" }, { param: "staking_route_units" }] }
      - var: "staking_claim_sum_units"
        expr: { op: "+", args: [{ var: "staking_claim_sum_units" }, { param: "staking_route_units" }] }
    effects:
      claimed_units: { const: 0 }
      claimant: { enum: "AUTH_None" }
      event: { enum: "EV_FeeRouted" }
      principal_units: { param: "principal_units" }
      fee_units: { param: "fee_units" }
      host_route_units: { param: "host_route_units" }
