init:
  - { var: "free_debt_units", expr: { const: 0 } }
  - { var: "external_supply_units", expr: { const: 0 } }
  - { var: "protocol_pool_units", expr: { const: 0 } }
  - { var: "host_pool_units", expr: { const: 0 } }
  - { var: "staking_pool_units", expr: { const: 0 } }
  - { var: "staking_claim_sum_units", expr: { const: 0 } }
  - { var: "committed_protocol_authority", expr: { enum: "AUTH_None" } }
  - { var: "fee_partition_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "transport_exactness_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "protocol_claimability_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "host_claimant_allocation_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "staking_claimant_authorization_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "staking_claim_sum_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "cover_preservation_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "authority_binding_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "policy_config_binding_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "normative_split_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "cumulative_split_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "policy_content_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "source_asset_unit_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "event_origin_replay_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "carry_continuity_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "stake_disposition_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "host_disposition_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "fallback_semantics_evidence", expr: { enum: "EVID_Unknown" } }
  - { var: "reserve_buyback_custody_evidence", expr: { enum: "EVID_Unknown" } }
