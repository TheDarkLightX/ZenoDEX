          - { op: "!=", args: [{ var: "committed_protocol_authority" }, { enum: "AUTH_None" }] }
          - { op: "=", args: [{ param: "observed_protocol_authority" }, { var: "committed_protocol_authority" }] }
      protocol_route_units: { const: 0 }
