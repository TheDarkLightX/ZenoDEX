ir_version: "esso-ir/v1"
meta:
  model_id: "esso_spec_quality_assessment_v1"
  created_by: "orchestration-unit"
  notes: |
    Spec Quality Assessment Framework for kernel IR state machine specifications (correctness ≠ quality).

    1) QUALITY DIMENSIONS (7):
       D1 Formal Soundness & Safety
       D2 Coverage & Completeness
       D3 Determinism & Replayability
       D4 Contract Clarity & Observability
       D5 Adversarial/Game-Theory Robustness
       D6 Integration & Operability (CBC)
       D7 Maintainability & Evolvability

    2) MEASURABLE METRICS (0-100 each, deterministic):
       - Each dimension score is computed from 4 evidence items in 25-pt bins:
         score_dim = Σ (25 if evidence ∈ {Pass, NA} else 0).
       - Evidence is fail-closed: Unknown blocks decisions.
       - Severe defects override scores for gate decisions.

    3) AUTOMATED CHECKS (toolchain-verifiable / deterministic gates):
       - Validate/schema/type/finite domains
       - Invariant inductiveness
       - Refinement/no-extra behavior (when a reference exists)
       - Observational equivalence (when a reference exists)
       - Canonicalizer sanity (idempotence / invariant-preserving if used)
       - Bounds/shrink sanity (state-space control)
       - Deterministic replay (trace/tape replay)
       - CBC: shell-lint + verify-shell
       - Codegen smoke (if shipping generated code)

    4) REVIEW CHECKLISTS (human/AI attestations):
       - Explicit assumptions
       - Contract/observables clarity
       - Edge-case matrix (boundary + adversarial cases)
       - Liveness/progress conditions
       - Threat model
       - Game-theory/incentive analysis
       - MEV/front-running analysis
       - Oracle/trust-boundary analysis
       - Versioning/upgrade/migration plan
       - Operability controls (timeouts/monitoring/fail-closed)
       - Modularity/decomposition
       - Documentation + changelog
       - CI quality plan (process control plan)

    5) QUALITY GATES (pass/fail thresholds; Revise means iterate before re-gating):
       - Alpha: D1>=75, D2>=50, D4>=50; no open S0/S1; core formal checks must not Fail.
       - Beta:  D1>=75, D2>=75, D3>=75, D4>=75, D6>=75, D5>=50; Pass requires no open S2.
       - Prod:  D1==100, D3==100, and D2/D4/D5/D6/D7>=75; no open S0/S1/S2; CI plan Pass;
                process_dpmo_x10 <= 34 (Six Sigma target 3.4 DPMO).

    6) DEFECT TAXONOMY:
       - Severity: S0 Catastrophic, S1 Critical, S2 Major, S3 Minor, S4 Trivial
       - Type: invariant/guard/init/bounds/nondet/observability/refinement/CBC/liveness/game-theory/oracle/upgrade/docs
       - Stage: Automated, Review, PostDeploy
       - Status: Open/Closed

    7) CONTINUOUS IMPROVEMENT:
       - Escaped (post-deploy) defects open CAPA; process_dpmo_x10 updated from external measurement.
       - Production gating requires Six Sigma readiness (process_dpmo_x10<=34) and CI plan Pass.

