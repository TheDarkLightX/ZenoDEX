invariants:
  - id: "inv_epochs_order"
    kind: "safety"
    expr:
      op: "<="
      args: [{ var: "score_epoch" }, { var: "evidence_epoch" }]

  - id: "inv_archived_requires_decision"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "!="
          args: [{ var: "phase" }, { enum: "PH_Archived" }]
        - op: "!="
          args: [{ var: "verdict" }, { enum: "VD_None" }]

  # Fail-closed core checks: these cannot be NA by design.
  - id: "inv_ac_validate_not_na"
    kind: "safety"
    expr:
      op: "!="
      args: [{ var: "ac_validate" }, { enum: "ES_NA" }]
  - id: "inv_ac_finite_domains_not_na"
    kind: "safety"
    expr:
      op: "!="
      args: [{ var: "ac_finite_domains" }, { enum: "ES_NA" }]
  - id: "inv_ac_invariants_inductive_not_na"
    kind: "safety"
    expr:
      op: "!="
      args: [{ var: "ac_invariants_inductive" }, { enum: "ES_NA" }]

  - id: "inv_rv_assumptions_not_na"
    kind: "safety"
    expr:
      op: "!="
      args: [{ var: "rv_assumptions" }, { enum: "ES_NA" }]
  - id: "inv_rv_contract_not_na"
    kind: "safety"
    expr:
      op: "!="
      args: [{ var: "rv_contract" }, { enum: "ES_NA" }]

  - id: "inv_six_sigma_flag"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "process_six_sigma_ready" }
        - op: "<="
          args: [{ var: "process_dpmo_x10" }, { const: 34 }]

  # Defect-slot consistency (present/open/closed).
  - id: "inv_d0_absent_closed"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "not"
          args: [{ var: "d0_present" }]
        - op: "="
          args: [{ var: "d0_status" }, { enum: "DF_Closed" }]
  - id: "inv_d0_open_implies_present"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "!="
          args: [{ var: "d0_status" }, { enum: "DF_Open" }]
        - { var: "d0_present" }

  - id: "inv_d1_absent_closed"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "not"
          args: [{ var: "d1_present" }]
        - op: "="
          args: [{ var: "d1_status" }, { enum: "DF_Closed" }]
  - id: "inv_d1_open_implies_present"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "!="
          args: [{ var: "d1_status" }, { enum: "DF_Open" }]
        - { var: "d1_present" }

  - id: "inv_d2_absent_closed"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "not"
          args: [{ var: "d2_present" }]
        - op: "="
          args: [{ var: "d2_status" }, { enum: "DF_Closed" }]
  - id: "inv_d2_open_implies_present"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "!="
          args: [{ var: "d2_status" }, { enum: "DF_Open" }]
        - { var: "d2_present" }

  - id: "inv_d3_absent_closed"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "not"
          args: [{ var: "d3_present" }]
        - op: "="
          args: [{ var: "d3_status" }, { enum: "DF_Closed" }]
  - id: "inv_d3_open_implies_present"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "!="
          args: [{ var: "d3_status" }, { enum: "DF_Open" }]
        - { var: "d3_present" }

