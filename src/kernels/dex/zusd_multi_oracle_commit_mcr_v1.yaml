# [FORGE] zUSD Multi Oracle Commit MCR v1
ir_version: "esso-ir/v1"
meta:
  model_id: "zusd_multi_oracle_commit_mcr_v1"
  created_by: "zenodex"
  notes: |
    Micro-kernel: multi-vault MCR-at-pending witness for zUSD oracle commits.

    Purpose:
      - Make the "both vaults remain above MCR at the pending price" predicate
        explicit and replayable for the multi-vault zUSD oracle-commit path.
      - Cover the arithmetic seam that still lived in Python/Tau glue after the
        single-vault oracle-commit apply kernel was added.

    Assume/guarantee split:
      - Assumes oracle auth, freshness, and pending<=active are handled by the
        oracle-commit apply kernel / Tau guard layer.
      - Guarantees only the per-vault MCR-at-pending booleans and their joint
        `mcr_ok_at_pending` projection.

    Non-goals:
      - oracle state updates
      - pending-price monotonicity
      - redemption or liquidation arithmetic

observables:
  state_vars:
    [
      "price_pending_e8",
      "mcr_bps",
      "vault_a_collateral_e8",
      "vault_a_debt_e8",
      "vault_b_collateral_e8",
      "vault_b_debt_e8",
    ]
  effects:
    [
      "vault_a_mcr_ok",
      "vault_b_mcr_ok",
      "mcr_ok_at_pending",
    ]

types: []

state_vars:
  - id: "price_pending_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }
  - id: "mcr_bps"
    role: "data"
    type: { kind: "int", min: 1, max: 20000 }
  - id: "vault_a_collateral_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }
  - id: "vault_a_debt_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }
  - id: "vault_b_collateral_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }
  - id: "vault_b_debt_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }

init:
  - var: "price_pending_e8"
    expr: { const: 0 }
  - var: "mcr_bps"
    expr: { const: 11000 }
  - var: "vault_a_collateral_e8"
    expr: { const: 0 }
  - var: "vault_a_debt_e8"
    expr: { const: 0 }
  - var: "vault_b_collateral_e8"
    expr: { const: 0 }
  - var: "vault_b_debt_e8"
    expr: { const: 0 }

invariants:
  - id: "inv_non_negative_vaults"
    kind: "safety"
    expr:
      op: "and"
      args:
        - { op: ">=", args: [{ var: "price_pending_e8" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "vault_a_collateral_e8" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "vault_a_debt_e8" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "vault_b_collateral_e8" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "vault_b_debt_e8" }, { const: 0 }] }

actions:
  - id: "evaluate_multi_oracle_commit_mcr"
    params: []
    guard:
      op: "="
      args: [{ const: 0 }, { const: 0 }]
    updates: []
    effects:
      vault_a_mcr_ok:
        op: "or"
        args:
          - op: "="
            args: [{ var: "vault_a_debt_e8" }, { const: 0 }]
          - op: ">="
            args:
              - op: "*"
                args:
                  - { var: "vault_a_collateral_e8" }
                  - op: "*"
                    args: [{ var: "price_pending_e8" }, { const: 10000 }]
              - op: "*"
                args:
                  - { var: "vault_a_debt_e8" }
                  - op: "*"
                    args: [{ var: "mcr_bps" }, { const: 100000000 }]
      vault_b_mcr_ok:
        op: "or"
        args:
          - op: "="
            args: [{ var: "vault_b_debt_e8" }, { const: 0 }]
          - op: ">="
            args:
              - op: "*"
                args:
                  - { var: "vault_b_collateral_e8" }
                  - op: "*"
                    args: [{ var: "price_pending_e8" }, { const: 10000 }]
              - op: "*"
                args:
                  - { var: "vault_b_debt_e8" }
                  - op: "*"
                    args: [{ var: "mcr_bps" }, { const: 100000000 }]
      mcr_ok_at_pending:
        op: "and"
        args:
          - op: "or"
            args:
              - op: "="
                args: [{ var: "vault_a_debt_e8" }, { const: 0 }]
              - op: ">="
                args:
                  - op: "*"
                    args:
                      - { var: "vault_a_collateral_e8" }
                      - op: "*"
                        args: [{ var: "price_pending_e8" }, { const: 10000 }]
                  - op: "*"
                    args:
                      - { var: "vault_a_debt_e8" }
                      - op: "*"
                        args: [{ var: "mcr_bps" }, { const: 100000000 }]
          - op: "or"
            args:
              - op: "="
                args: [{ var: "vault_b_debt_e8" }, { const: 0 }]
              - op: ">="
                args:
                  - op: "*"
                    args:
                      - { var: "vault_b_collateral_e8" }
                      - op: "*"
                        args: [{ var: "price_pending_e8" }, { const: 10000 }]
                  - op: "*"
                    args:
                      - { var: "vault_b_debt_e8" }
                      - op: "*"
                        args: [{ var: "mcr_bps" }, { const: 100000000 }]
