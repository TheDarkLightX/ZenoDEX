# [FORGE] Settlement Remove-Liquidity Apply (proof-carrying witness) v1
ir_version: "esso-ir/v1"
meta:
  model_id: "settlement_remove_liquidity_apply_witness_v1"
  created_by: "zenodex"
  notes: |
    Micro-kernel: apply a single REMOVE_LIQUIDITY fill against a live pool.

    Purpose:
      - Provide a small, verifiable "certificate-checking" primitive for settlement.
      - If the sender can burn the claimed LP amount and the pool reserves / LP supply
        match the pre-state witness, the step applies deterministically and preserves
        asset conservation plus LP supply accounting.

    Non-goals:
      - multi-holder LP accounting
      - pool_id / asset-id hashing
      - recipient authorization

    Those remain outside this micro-kernel and should be checked by composition or
    shell-level deterministic guards.

observables:
  state_vars:
    [
      "pool_active",
      "recipient_asset0",
      "recipient_asset1",
      "sender_lp",
      "lock_lp",
      "reserve0",
      "reserve1",
      "lp_supply",
      "total_asset0_const",
      "total_asset1_const",
    ]
  effects:
    [
      "lp_burned",
      "amount0_out",
      "amount1_out",
      "reserve0_after",
      "reserve1_after",
      "lp_supply_after",
      "balance_delta_ok",
      "reserve_delta_ok",
      "lp_delta_ok",
    ]

types: []

state_vars:
  - id: "pool_active"
    role: "control"
    type: { kind: "int", min: 0, max: 1 }

  - id: "recipient_asset0"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "recipient_asset1"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "sender_lp"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "lock_lp"
    role: "data"
    type: { kind: "int", min: 0, max: 1000 }

  - id: "reserve0_before"
    role: "data"
    type: { kind: "int", min: 1, max: 3000 }

  - id: "reserve0"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "reserve1_before"
    role: "data"
    type: { kind: "int", min: 1, max: 3000 }

  - id: "reserve1"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "lp_supply_before"
    role: "data"
    type: { kind: "int", min: 1, max: 4000 }

  - id: "lp_supply"
    role: "data"
    type: { kind: "int", min: 0, max: 4000 }

  - id: "total_asset0_const"
    role: "data"
    type: { kind: "int", min: 1, max: 3000 }

  - id: "total_asset1_const"
    role: "data"
    type: { kind: "int", min: 1, max: 3000 }

init:
  - var: "pool_active"
    expr: { const: 1 }
  - var: "recipient_asset0"
    expr: { const: 0 }
  - var: "recipient_asset1"
    expr: { const: 0 }
  - var: "sender_lp"
    expr: { const: 3000 }
  - var: "lock_lp"
    expr: { const: 1000 }
  - var: "reserve0_before"
    expr: { const: 2000 }
  - var: "reserve0"
    expr: { const: 2000 }
  - var: "reserve1_before"
    expr: { const: 2000 }
  - var: "reserve1"
    expr: { const: 2000 }
  - var: "lp_supply_before"
    expr: { const: 4000 }
  - var: "lp_supply"
    expr: { const: 4000 }
  - var: "total_asset0_const"
    expr: { const: 2000 }
  - var: "total_asset1_const"
    expr: { const: 2000 }

invariants:
  - id: "inv_conserve_asset0"
    kind: "safety"
    expr:
      op: "="
      args:
        - op: "+"
          args: [{ var: "recipient_asset0" }, { var: "reserve0" }]
        - { var: "total_asset0_const" }

  - id: "inv_conserve_asset1"
    kind: "safety"
    expr:
      op: "="
      args:
        - op: "+"
          args: [{ var: "recipient_asset1" }, { var: "reserve1" }]
        - { var: "total_asset1_const" }

  - id: "inv_lp_supply_matches_distribution"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "lp_supply" }
        - op: "+"
          args: [{ var: "sender_lp" }, { var: "lock_lp" }]

  - id: "inv_active_pool_positive"
    kind: "safety"
    expr:
      op: "or"
      args:
        - { op: "=", args: [{ var: "pool_active" }, { const: 0 }] }
        - op: "and"
          args:
            - { op: ">", args: [{ var: "reserve0" }, { const: 0 }] }
            - { op: ">", args: [{ var: "reserve1" }, { const: 0 }] }
            - { op: ">", args: [{ var: "lp_supply" }, { const: 0 }] }
            - { op: "=", args: [{ var: "lock_lp" }, { const: 1000 }] }

actions:
  - id: "remove_liquidity_apply"
    params:
      - id: "lp_amount"
        type: { kind: "int", min: 1, max: 3000 }
      - id: "amount0_min"
        type: { kind: "int", min: 0, max: 3000 }
      - id: "amount1_min"
        type: { kind: "int", min: 0, max: 3000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "pool_active" }, { const: 1 }] }
        - { op: ">=", args: [{ var: "sender_lp" }, { param: "lp_amount" }] }
        - { op: "<=", args: [{ param: "lp_amount" }, { var: "lp_supply" }] }
        - { op: ">=",
            args: [
              { op: "div",
                args: [
                  { op: "*", args: [{ param: "lp_amount" }, { var: "reserve0" }] },
                  { var: "lp_supply" }
                ]
              },
              { param: "amount0_min" }
            ]
          }
        - { op: ">=",
            args: [
              { op: "div",
                args: [
                  { op: "*", args: [{ param: "lp_amount" }, { var: "reserve1" }] },
                  { var: "lp_supply" }
                ]
              },
              { param: "amount1_min" }
            ]
          }
    updates:
      - var: "reserve0_before"
        expr: { var: "reserve0" }
      - var: "reserve1_before"
        expr: { var: "reserve1" }
      - var: "lp_supply_before"
        expr: { var: "lp_supply" }
      - var: "recipient_asset0"
        expr:
          op: "+"
          args:
            - { var: "recipient_asset0" }
            - op: "div"
              args:
                - op: "*"
                  args: [{ param: "lp_amount" }, { var: "reserve0" }]
                - { var: "lp_supply" }
      - var: "recipient_asset1"
        expr:
          op: "+"
          args:
            - { var: "recipient_asset1" }
            - op: "div"
              args:
                - op: "*"
                  args: [{ param: "lp_amount" }, { var: "reserve1" }]
                - { var: "lp_supply" }
      - var: "sender_lp"
        expr:
          op: "-"
          args: [{ var: "sender_lp" }, { param: "lp_amount" }]
      - var: "reserve0"
        expr:
          op: "-"
          args:
            - { var: "reserve0" }
            - op: "div"
              args:
                - op: "*"
                  args: [{ param: "lp_amount" }, { var: "reserve0" }]
                - { var: "lp_supply" }
      - var: "reserve1"
        expr:
          op: "-"
          args:
            - { var: "reserve1" }
            - op: "div"
              args:
                - op: "*"
                  args: [{ param: "lp_amount" }, { var: "reserve1" }]
                - { var: "lp_supply" }
      - var: "lp_supply"
        expr:
          op: "-"
          args: [{ var: "lp_supply" }, { param: "lp_amount" }]
    effects:
      lp_burned: { param: "lp_amount" }
      amount0_out:
        op: "div"
        args:
          - op: "*"
            args: [{ param: "lp_amount" }, { var: "reserve0_before" }]
          - { var: "lp_supply_before" }
      amount1_out:
        op: "div"
        args:
          - op: "*"
            args: [{ param: "lp_amount" }, { var: "reserve1_before" }]
          - { var: "lp_supply_before" }
      reserve0_after: { var: "reserve0" }
      reserve1_after: { var: "reserve1" }
      lp_supply_after: { var: "lp_supply" }
      balance_delta_ok: { const: 1 }
      reserve_delta_ok: { const: 1 }
      lp_delta_ok: { const: 1 }
