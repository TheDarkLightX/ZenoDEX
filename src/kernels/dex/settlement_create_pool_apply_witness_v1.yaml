# [FORGE] Settlement Create-Pool Apply (proof-carrying witness) v1
ir_version: "esso-ir/v1"
meta:
  model_id: "settlement_create_pool_apply_witness_v1"
  created_by: "zenodex"
  notes: |
    Micro-kernel: apply a single CREATE_POOL fill against an empty pool slot.

    Purpose:
      - Provide a small, verifiable "certificate-checking" primitive for settlement.
      - If the pre-state is an empty pool slot, the creator can pay both deposits, and
        the provided sqrt witness is valid, the step applies deterministically and
        preserves per-asset conservation plus LP supply accounting.

    Non-goals:
      - pool_id hashing
      - curve_tag / curve_params normalization
      - event payload hashing or signature binding

    Those remain outside this micro-kernel and should be checked by composition or
    shell-level deterministic guards.

observables:
  state_vars:
    [
      "pool_initialized",
      "creator_asset0",
      "creator_asset1",
      "creator_lp",
      "lock_lp",
      "reserve0",
      "reserve1",
      "lp_supply",
      "total_asset0_const",
      "total_asset1_const",
    ]
  effects:
    [
      "amount0_used",
      "amount1_used",
      "lp_minted",
      "reserve0_after",
      "reserve1_after",
      "lp_supply_after",
      "witness_ok",
      "balance_delta_ok",
      "reserve_delta_ok",
      "lp_delta_ok",
    ]

types: []

state_vars:
  - id: "pool_initialized"
    role: "control"
    type: { kind: "int", min: 0, max: 1 }

  - id: "creator_asset0"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "creator_asset1"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "creator_lp"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "lock_lp"
    role: "data"
    type: { kind: "int", min: 0, max: 1000 }

  - id: "reserve0"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "reserve1"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "lp_supply"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "total_asset0_const"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "total_asset1_const"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

init:
  - var: "pool_initialized"
    expr: { const: 0 }
  - var: "creator_asset0"
    expr: { const: 2000 }
  - var: "creator_asset1"
    expr: { const: 2000 }
  - var: "creator_lp"
    expr: { const: 0 }
  - var: "lock_lp"
    expr: { const: 0 }
  - var: "reserve0"
    expr: { const: 0 }
  - var: "reserve1"
    expr: { const: 0 }
  - var: "lp_supply"
    expr: { const: 0 }
  - var: "total_asset0_const"
    expr: { const: 2000 }
  - var: "total_asset1_const"
    expr: { const: 2000 }

invariants:
  - id: "inv_conserve_asset0"
    kind: "safety"
    expr:
      op: "="
      args:
        - op: "+"
          args: [{ var: "creator_asset0" }, { var: "reserve0" }]
        - { var: "total_asset0_const" }

  - id: "inv_conserve_asset1"
    kind: "safety"
    expr:
      op: "="
      args:
        - op: "+"
          args: [{ var: "creator_asset1" }, { var: "reserve1" }]
        - { var: "total_asset1_const" }

  - id: "inv_lp_supply_matches_distribution"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "lp_supply" }
        - op: "+"
          args: [{ var: "creator_lp" }, { var: "lock_lp" }]

  - id: "inv_empty_pool_zeroed"
    kind: "safety"
    expr:
      op: "or"
      args:
        - { op: "=", args: [{ var: "pool_initialized" }, { const: 1 }] }
        - op: "and"
          args:
            - { op: "=", args: [{ var: "reserve0" }, { const: 0 }] }
            - { op: "=", args: [{ var: "reserve1" }, { const: 0 }] }
            - { op: "=", args: [{ var: "creator_lp" }, { const: 0 }] }
            - { op: "=", args: [{ var: "lock_lp" }, { const: 0 }] }
            - { op: "=", args: [{ var: "lp_supply" }, { const: 0 }] }

actions:
  - id: "create_pool_apply"
    params:
      - id: "amount0"
        type: { kind: "int", min: 1, max: 3000 }
      - id: "amount1"
        type: { kind: "int", min: 1, max: 3000 }
      - id: "fee_bps"
        type: { kind: "int", min: 0, max: 10000 }
      - id: "sqrt_product"
        type: { kind: "int", min: 1001, max: 3000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "pool_initialized" }, { const: 0 }] }
        - { op: "=", args: [{ var: "reserve0" }, { const: 0 }] }
        - { op: "=", args: [{ var: "reserve1" }, { const: 0 }] }
        - { op: "=", args: [{ var: "creator_lp" }, { const: 0 }] }
        - { op: "=", args: [{ var: "lock_lp" }, { const: 0 }] }
        - { op: "=", args: [{ var: "lp_supply" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "creator_asset0" }, { param: "amount0" }] }
        - { op: ">=", args: [{ var: "creator_asset1" }, { param: "amount1" }] }
        - { op: "<=", args: [{ param: "fee_bps" }, { const: 10000 }] }
        - { op: "<=",
            args: [
              { op: "*", args: [{ param: "sqrt_product" }, { param: "sqrt_product" }] },
              { op: "*", args: [{ param: "amount0" }, { param: "amount1" }] }
            ]
          }
        - { op: "<",
            args: [
              { op: "*", args: [{ param: "amount0" }, { param: "amount1" }] },
              { op: "*",
                args: [
                  { op: "+", args: [{ param: "sqrt_product" }, { const: 1 }] },
                  { op: "+", args: [{ param: "sqrt_product" }, { const: 1 }] }
                ]
              }
            ]
          }
        - { op: ">", args: [{ param: "sqrt_product" }, { const: 1000 }] }
    updates:
      - var: "pool_initialized"
        expr: { const: 1 }
      - var: "creator_asset0"
        expr:
          op: "-"
          args: [{ var: "creator_asset0" }, { param: "amount0" }]
      - var: "creator_asset1"
        expr:
          op: "-"
          args: [{ var: "creator_asset1" }, { param: "amount1" }]
      - var: "creator_lp"
        expr:
          op: "-"
          args: [{ param: "sqrt_product" }, { const: 1000 }]
      - var: "lock_lp"
        expr: { const: 1000 }
      - var: "reserve0"
        expr: { param: "amount0" }
      - var: "reserve1"
        expr: { param: "amount1" }
      - var: "lp_supply"
        expr: { param: "sqrt_product" }
    effects:
      amount0_used: { param: "amount0" }
      amount1_used: { param: "amount1" }
      lp_minted:
        op: "-"
        args: [{ param: "sqrt_product" }, { const: 1000 }]
      reserve0_after: { param: "amount0" }
      reserve1_after: { param: "amount1" }
      lp_supply_after: { param: "sqrt_product" }
      witness_ok:
        op: "and"
        args:
          - { op: "<=",
              args: [
                { op: "*", args: [{ param: "sqrt_product" }, { param: "sqrt_product" }] },
                { op: "*", args: [{ param: "amount0" }, { param: "amount1" }] }
              ]
            }
          - { op: "<",
              args: [
                { op: "*", args: [{ param: "amount0" }, { param: "amount1" }] },
                { op: "*",
                  args: [
                    { op: "+", args: [{ param: "sqrt_product" }, { const: 1 }] },
                    { op: "+", args: [{ param: "sqrt_product" }, { const: 1 }] }
                  ]
                }
              ]
            }
      balance_delta_ok: { const: 1 }
      reserve_delta_ok: { const: 1 }
      lp_delta_ok: { const: 1 }
