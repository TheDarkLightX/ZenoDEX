# [FORGE] Batch Auction Settler v1 - MEV-Resistant Intent Settlement
#
# Purpose:
# - Collect trading intents into batches, run solver competition, settle at uniform clearing price
# - Capture MEV for protocol (surplus goes to protocol, not searchers)
# - Provide formally verified fairness guarantees (no user gets worse than their limit)
#
# Design:
# - 4-phase state machine: Collecting -> Solving -> Settling -> Complete
# - Witness-based clearing price verification (SMT-friendly)
# - Aggregate fairness tracking (total guarantees vs total outputs)
# - Conservation law (input = output + fees + solver_reward)
# - Fail-closed: invalid solutions rejected, batch stuck until valid solution
#
# Composition:
# - Receives intents from order_intent_v1 (intent_emitted effect)
# - Emits settlement receipts for execution_receipts_v1
# - Rewards solvers via proof_mining_manager_v1 integration

ir_version: "esso-ir/v1"
meta:
  model_id: "batch_auction_settler_v1"
  created_by: "zenodex-forge"
  notes: |
    Batch auction settler for MEV-resistant intent execution.

    Core mechanics:
    1. COLLECTING phase: Intents arrive with (amount_in, min_out, direction).
       Aggregates: intent_count++, total_input_collected += amount_in, total_guaranteed_output += min_out

    2. SOLVING phase: Solvers submit (clearing_price, surplus_extracted).
       Kernel verifies: clearing respects all user limits (witness verification).
       Stores best (lowest surplus) valid bid.

    3. SETTLING phase: Execute fills at winning clearing price.
       Each fill verified: actual_output >= user's min_out (via aggregate tracking).
       Conservation: total_output + fees + solver_reward = total_input at clearing.

    4. COMPLETE phase: Batch done, ready for next cycle.

    Fairness invariant: total_actual_output >= total_guaranteed_output (always)
    Conservation invariant: fees_captured + solver_reward + total_output_distributed <= total_input_collected

    MEV capture: Surplus (clearing_price - individual limits) becomes protocol_fees + solver_reward.
    Fail-closed: Invalid witness -> phase stuck -> batch revert.

observables:
  state_vars:
    [
      "phase",
      "batch_id",
      "intent_count",
      "total_input_collected",
      "total_guaranteed_output",
      "total_actual_output",
      "total_filled_input",
      "clearing_price_bps",
      "best_surplus_bps",
      "solver_bid_count",
      "winning_solver_id",
      "settled_count",
      "fees_captured",
      "solver_reward",
      "epoch",
      "batch_deadline_epoch",
      "max_solving_epochs",
    ]
  effects:
    [
      "event",
      "batch_id_out",
      "phase_out",
      "clearing_price_out",
      "fill_amount",
      "fill_output",
      "settlement_complete",
      "mev_captured",
      "batch_reverted",
    ]

types:
  - id: "t_phase"
    type:
      kind: "enum"
      symbols: ["Collecting", "Solving", "Settling", "Complete"]
  - id: "t_event"
    type:
      kind: "enum"
      symbols:
        [
          "IntentAdded",
          "SolutionSubmitted",
          "WinnerSelected",
          "FillExecuted",
          "BatchCompleted",
          "NewBatchStarted",
          "EpochAdvanced",
          "BatchReverted",
        ]

state_vars:
  # Phase control
  - id: "phase"
    role: "control"
    type: { ref: "t_phase" }

  # Batch identification
  - id: "batch_id"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  # Intent aggregation (bounded for SMT decidability)
  - id: "intent_count"
    role: "data"
    type: { kind: "int", min: 0, max: 32 }

  - id: "total_input_collected"
    role: "data"
    type: { kind: "int", min: 0, max: 3000000000 }

  - id: "total_guaranteed_output"
    role: "data"
    type: { kind: "int", min: 0, max: 3000000000 }

  - id: "total_actual_output"
    role: "data"
    type: { kind: "int", min: 0, max: 3000000000 }

  # Clearing price (scaled: 10000 = 1:1, 20000 = 2:1, etc.)
  - id: "clearing_price_bps"
    role: "data"
    type: { kind: "int", min: 0, max: 100000 }

  # Solver competition
  - id: "best_surplus_bps"
    role: "data"
    type: { kind: "int", min: 0, max: 10000 }

  - id: "solver_bid_count"
    role: "data"
    type: { kind: "int", min: 0, max: 8 }

  - id: "winning_solver_id"
    role: "data"
    type: { kind: "int", min: 0, max: 8 }

  # Settlement tracking
  - id: "settled_count"
    role: "data"
    type: { kind: "int", min: 0, max: 32 }

  # Fee capture (MEV extraction)
  - id: "fees_captured"
    role: "data"
    type: { kind: "int", min: 0, max: 3000000000 }

  - id: "solver_reward"
    role: "data"
    type: { kind: "int", min: 0, max: 3000000000 }

  # Time tracking
  - id: "epoch"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  # Batch deadline for solving phase (prevents indefinite stuck)
  - id: "batch_deadline_epoch"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000 }

  # Maximum epochs allowed for solving phase (configurable)
  - id: "max_solving_epochs"
    role: "control"
    type: { kind: "int", min: 1, max: 10000 }

  # Cumulative filled input (prevents overfilling)
  - id: "total_filled_input"
    role: "data"
    type: { kind: "int", min: 0, max: 3000000000 }

invariants:
  # FAIRNESS AT COMPLETION: When batch is complete, actual output meets guaranteed minimum
  # This is the core fairness guarantee - users always get at least their min_amount_out
  - id: "inv_fairness_at_complete"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Complete" }]
        - op: ">="
          args: [{ var: "total_actual_output" }, { var: "total_guaranteed_output" }]

  # CONSERVATION: No value leakage (fees + reward + output <= input)
  - id: "inv_conservation"
    kind: "safety"
    expr:
      op: "<="
      args:
        - op: "+"
          args:
            - op: "+"
              args: [{ var: "fees_captured" }, { var: "solver_reward" }]
            - { var: "total_actual_output" }
        - { var: "total_input_collected" }

  # SETTLEMENT BOUNDS: Cannot settle more than collected
  - id: "inv_settlement_bounded"
    kind: "safety"
    expr:
      op: "<="
      args: [{ var: "settled_count" }, { var: "intent_count" }]

  # PHASE-SPECIFIC: Collecting phase has clean state
  - id: "inv_collecting_clean"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Collecting" }]
        - op: "and"
          args:
            - { op: "=", args: [{ var: "clearing_price_bps" }, { const: 0 }] }
            - { op: "=", args: [{ var: "winning_solver_id" }, { const: 0 }] }
            - { op: "=", args: [{ var: "settled_count" }, { const: 0 }] }
            - { op: "=", args: [{ var: "total_actual_output" }, { const: 0 }] }
            - { op: "=", args: [{ var: "fees_captured" }, { const: 0 }] }
            - { op: "=", args: [{ var: "solver_reward" }, { const: 0 }] }

  # PHASE-SPECIFIC: Solving phase has no settlement yet
  - id: "inv_solving_no_settlement"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Solving" }]
        - op: "and"
          args:
            - { op: "=", args: [{ var: "settled_count" }, { const: 0 }] }
            - { op: "=", args: [{ var: "total_actual_output" }, { const: 0 }] }
            - { op: "=", args: [{ var: "fees_captured" }, { const: 0 }] }
            - { op: "=", args: [{ var: "solver_reward" }, { const: 0 }] }

  # PHASE-SPECIFIC: Settling phase has no fees captured yet (only at complete)
  - id: "inv_settling_no_fees_yet"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Settling" }]
        - op: "and"
          args:
            - { op: "=", args: [{ var: "fees_captured" }, { const: 0 }] }
            - { op: "=", args: [{ var: "solver_reward" }, { const: 0 }] }

  # PHASE-SPECIFIC: Complete phase has all settled
  - id: "inv_complete_all_settled"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Complete" }]
        - op: "="
          args: [{ var: "settled_count" }, { var: "intent_count" }]

  # SOLVER: Winner must be from valid bids
  - id: "inv_winner_valid"
    kind: "safety"
    expr:
      op: "<="
      args: [{ var: "winning_solver_id" }, { var: "solver_bid_count" }]

  # PHASE-SPECIFIC: Solving/Settling phases require at least one intent
  - id: "inv_solving_has_intents"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Solving" }]
        - op: ">"
          args: [{ var: "intent_count" }, { const: 0 }]

  - id: "inv_settling_has_intents"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "phase" }, { enum: "Settling" }]
        - op: ">"
          args: [{ var: "intent_count" }, { const: 0 }]

  # DATA CONSISTENCY: Each intent contributes at least 1 to input
  # (amount_in has min: 1, so total_input_collected >= intent_count)
  - id: "inv_input_matches_intents"
    kind: "safety"
    expr:
      op: ">="
      args: [{ var: "total_input_collected" }, { var: "intent_count" }]

  # OVERFILL PREVENTION: Cannot fill more value than was collected
  - id: "inv_filled_bounded_by_collected"
    kind: "safety"
    expr:
      op: "<="
      args: [{ var: "total_filled_input" }, { var: "total_input_collected" }]

  # FILLED CONSISTENCY: Filled input tracks with settled count
  - id: "inv_filled_with_settlement"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "="
          args: [{ var: "settled_count" }, { const: 0 }]
        - op: "="
          args: [{ var: "total_filled_input" }, { const: 0 }]

  # DEADLINE SET: Solving/Settling phases have valid deadline
  - id: "inv_deadline_in_active_batch"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: "or"
          args:
            - { op: "=", args: [{ var: "phase" }, { enum: "Solving" }] }
            - { op: "=", args: [{ var: "phase" }, { enum: "Settling" }] }
        - op: ">"
          args: [{ var: "batch_deadline_epoch" }, { const: 0 }]

init:
  - var: "phase"
    expr: { enum: "Collecting" }
  - var: "batch_id"
    expr: { const: 0 }
  - var: "intent_count"
    expr: { const: 0 }
  - var: "total_input_collected"
    expr: { const: 0 }
  - var: "total_guaranteed_output"
    expr: { const: 0 }
  - var: "total_actual_output"
    expr: { const: 0 }
  - var: "clearing_price_bps"
    expr: { const: 0 }
  - var: "best_surplus_bps"
    expr: { const: 10000 }
  - var: "solver_bid_count"
    expr: { const: 0 }
  - var: "winning_solver_id"
    expr: { const: 0 }
  - var: "settled_count"
    expr: { const: 0 }
  - var: "fees_captured"
    expr: { const: 0 }
  - var: "solver_reward"
    expr: { const: 0 }
  - var: "epoch"
    expr: { const: 0 }
  - var: "batch_deadline_epoch"
    expr: { const: 0 }
  - var: "max_solving_epochs"
    expr: { const: 100 }
  - var: "total_filled_input"
    expr: { const: 0 }

actions:
  # PHASE 1: Collect intents
  - id: "add_intent"
    params:
      - id: "amount_in"
        type: { kind: "int", min: 1, max: 100000000 }
      - id: "min_amount_out"
        type: { kind: "int", min: 0, max: 100000000 }
      - id: "auth_ok"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Collecting" }] }
        - { op: "=", args: [{ param: "auth_ok" }, { bool: true }] }
        - { op: "<", args: [{ var: "intent_count" }, { const: 32 }] }
        # Prevent overflow
        - op: "<="
          args:
            - op: "+"
              args: [{ var: "total_input_collected" }, { param: "amount_in" }]
            - { const: 3000000000 }
        - op: "<="
          args:
            - op: "+"
              args: [{ var: "total_guaranteed_output" }, { param: "min_amount_out" }]
            - { const: 3000000000 }
    updates:
      - var: "intent_count"
        expr:
          op: "+"
          args: [{ var: "intent_count" }, { const: 1 }]
      - var: "total_input_collected"
        expr:
          op: "+"
          args: [{ var: "total_input_collected" }, { param: "amount_in" }]
      - var: "total_guaranteed_output"
        expr:
          op: "+"
          args: [{ var: "total_guaranteed_output" }, { param: "min_amount_out" }]
    effects:
      event: { enum: "IntentAdded" }
      batch_id_out: { var: "batch_id" }
      phase_out: { enum: "Collecting" }
      clearing_price_out: { const: 0 }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: false }
      mev_captured: { const: 0 }
      batch_reverted: { bool: false }

  # Transition: Collecting -> Solving (when batch has intents)
  - id: "close_collection"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Collecting" }] }
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
        - { op: ">", args: [{ var: "intent_count" }, { const: 0 }] }
        # Ensure deadline can be set without overflow
        - op: "<="
          args:
            - op: "+"
              args: [{ var: "epoch" }, { var: "max_solving_epochs" }]
            - { const: 1000000 }
    updates:
      - var: "phase"
        expr: { enum: "Solving" }
      # Set deadline for solving phase
      - var: "batch_deadline_epoch"
        expr:
          op: "+"
          args: [{ var: "epoch" }, { var: "max_solving_epochs" }]
    effects:
      event: { enum: "IntentAdded" }
      batch_id_out: { var: "batch_id" }
      phase_out: { enum: "Solving" }
      clearing_price_out: { const: 0 }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: false }
      batch_reverted: { bool: false }
      mev_captured: { const: 0 }

  # PHASE 2: Solver competition
  - id: "submit_solution"
    params:
      - id: "solver_id"
        type: { kind: "int", min: 1, max: 8 }
      - id: "proposed_clearing_price_bps"
        type: { kind: "int", min: 1, max: 100000 }
      - id: "surplus_extracted_bps"
        type: { kind: "int", min: 0, max: 10000 }
      # Witness: host verifies clearing satisfies all intent limits
      - id: "clearing_valid_witness"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Solving" }] }
        - { op: "<", args: [{ var: "solver_bid_count" }, { const: 8 }] }
        # Witness must confirm clearing is valid
        - { op: "=", args: [{ param: "clearing_valid_witness" }, { bool: true }] }
        # Better (lower) surplus than current best
        - { op: "<", args: [{ param: "surplus_extracted_bps" }, { var: "best_surplus_bps" }] }
    updates:
      - var: "solver_bid_count"
        expr:
          op: "+"
          args: [{ var: "solver_bid_count" }, { const: 1 }]
      - var: "best_surplus_bps"
        expr: { param: "surplus_extracted_bps" }
      - var: "clearing_price_bps"
        expr: { param: "proposed_clearing_price_bps" }
      # Use bid count as winner index to maintain inv_winner_valid
      - var: "winning_solver_id"
        expr:
          op: "+"
          args: [{ var: "solver_bid_count" }, { const: 1 }]
    effects:
      event: { enum: "SolutionSubmitted" }
      batch_id_out: { var: "batch_id" }
      phase_out: { enum: "Solving" }
      clearing_price_out: { param: "proposed_clearing_price_bps" }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: false }
      mev_captured: { const: 0 }
      batch_reverted: { bool: false }

  # Transition: Solving -> Settling (when winning solution selected)
  - id: "finalize_winner"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Solving" }] }
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
        - { op: ">", args: [{ var: "solver_bid_count" }, { const: 0 }] }
        - { op: ">", args: [{ var: "clearing_price_bps" }, { const: 0 }] }
        # Must finalize before deadline
        - { op: "<=", args: [{ var: "epoch" }, { var: "batch_deadline_epoch" }] }
    updates:
      - var: "phase"
        expr: { enum: "Settling" }
    effects:
      event: { enum: "WinnerSelected" }
      batch_id_out: { var: "batch_id" }
      phase_out: { enum: "Settling" }
      clearing_price_out: { var: "clearing_price_bps" }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: false }
      mev_captured: { const: 0 }
      batch_reverted: { bool: false }

  # PHASE 3: Execute fills
  - id: "execute_fill"
    params:
      - id: "fill_input_amount"
        type: { kind: "int", min: 1, max: 100000000 }
      - id: "fill_output_amount"
        type: { kind: "int", min: 0, max: 100000000 }
      - id: "fill_min_guaranteed"
        type: { kind: "int", min: 0, max: 100000000 }
      # Witness: host confirms this fill respects user's limit
      - id: "fill_valid_witness"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Settling" }] }
        - { op: "<", args: [{ var: "settled_count" }, { var: "intent_count" }] }
        # Witness confirms fill is valid
        - { op: "=", args: [{ param: "fill_valid_witness" }, { bool: true }] }
        # Output meets guaranteed minimum (core fairness check)
        - { op: ">=", args: [{ param: "fill_output_amount" }, { param: "fill_min_guaranteed" }] }
        # Conservation: don't exceed collected input
        - op: "<="
          args:
            - op: "+"
              args: [{ var: "total_actual_output" }, { param: "fill_output_amount" }]
            - { var: "total_input_collected" }
        # Overfill prevention: don't fill more than collected
        - op: "<="
          args:
            - op: "+"
              args: [{ var: "total_filled_input" }, { param: "fill_input_amount" }]
            - { var: "total_input_collected" }
    updates:
      - var: "settled_count"
        expr:
          op: "+"
          args: [{ var: "settled_count" }, { const: 1 }]
      - var: "total_actual_output"
        expr:
          op: "+"
          args: [{ var: "total_actual_output" }, { param: "fill_output_amount" }]
      # Track filled input for overfill prevention
      - var: "total_filled_input"
        expr:
          op: "+"
          args: [{ var: "total_filled_input" }, { param: "fill_input_amount" }]
    effects:
      event: { enum: "FillExecuted" }
      batch_id_out: { var: "batch_id" }
      phase_out: { enum: "Settling" }
      clearing_price_out: { var: "clearing_price_bps" }
      fill_amount: { param: "fill_input_amount" }
      fill_output: { param: "fill_output_amount" }
      settlement_complete: { bool: false }
      mev_captured: { const: 0 }
      batch_reverted: { bool: false }

  # Transition: Settling -> Complete (all fills executed, capture MEV)
  - id: "complete_batch"
    params:
      - id: "protocol_fee_amount"
        type: { kind: "int", min: 0, max: 3000000000 }
      - id: "solver_reward_amount"
        type: { kind: "int", min: 0, max: 3000000000 }
      # Witness: conservation law verified by host
      - id: "conservation_witness"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Settling" }] }
        - { op: "=", args: [{ var: "settled_count" }, { var: "intent_count" }] }
        - { op: "=", args: [{ param: "conservation_witness" }, { bool: true }] }
        # FAIRNESS: Actual output meets all guarantees before completing
        - { op: ">=", args: [{ var: "total_actual_output" }, { var: "total_guaranteed_output" }] }
        # Conservation: fees + reward + output <= input
        - op: "<="
          args:
            - op: "+"
              args:
                - op: "+"
                  args: [{ param: "protocol_fee_amount" }, { param: "solver_reward_amount" }]
                - { var: "total_actual_output" }
            - { var: "total_input_collected" }
    updates:
      - var: "phase"
        expr: { enum: "Complete" }
      - var: "fees_captured"
        expr: { param: "protocol_fee_amount" }
      - var: "solver_reward"
        expr: { param: "solver_reward_amount" }
    effects:
      event: { enum: "BatchCompleted" }
      batch_id_out: { var: "batch_id" }
      phase_out: { enum: "Complete" }
      clearing_price_out: { var: "clearing_price_bps" }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: true }
      mev_captured:
        op: "+"
        args: [{ param: "protocol_fee_amount" }, { param: "solver_reward_amount" }]
      batch_reverted: { bool: false }

  # Transition: Complete -> Collecting (start new batch)
  - id: "start_new_batch"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "phase" }, { enum: "Complete" }] }
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
        - { op: "<", args: [{ var: "batch_id" }, { const: 1000000 }] }
    updates:
      - var: "phase"
        expr: { enum: "Collecting" }
      - var: "batch_id"
        expr:
          op: "+"
          args: [{ var: "batch_id" }, { const: 1 }]
      # Reset batch state
      - var: "intent_count"
        expr: { const: 0 }
      - var: "total_input_collected"
        expr: { const: 0 }
      - var: "total_guaranteed_output"
        expr: { const: 0 }
      - var: "total_actual_output"
        expr: { const: 0 }
      - var: "clearing_price_bps"
        expr: { const: 0 }
      - var: "best_surplus_bps"
        expr: { const: 10000 }
      - var: "solver_bid_count"
        expr: { const: 0 }
      - var: "winning_solver_id"
        expr: { const: 0 }
      - var: "settled_count"
        expr: { const: 0 }
      - var: "fees_captured"
        expr: { const: 0 }
      - var: "solver_reward"
        expr: { const: 0 }
      # Reset new tracking variables
      - var: "batch_deadline_epoch"
        expr: { const: 0 }
      - var: "total_filled_input"
        expr: { const: 0 }
    effects:
      event: { enum: "NewBatchStarted" }
      batch_id_out:
        op: "+"
        args: [{ var: "batch_id" }, { const: 1 }]
      phase_out: { enum: "Collecting" }
      clearing_price_out: { const: 0 }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: false }
      mev_captured: { const: 0 }
      batch_reverted: { bool: false }

  # Utility: Advance epoch (for time-based batch closing)
  - id: "advance_epoch"
    params:
      - id: "delta"
        type: { kind: "int", min: 1, max: 1000 }
    guard:
      op: "<="
      args:
        - op: "+"
          args: [{ var: "epoch" }, { param: "delta" }]
        - { const: 1000000 }
    updates:
      - var: "epoch"
        expr:
          op: "+"
          args: [{ var: "epoch" }, { param: "delta" }]
    effects:
      event: { enum: "EpochAdvanced" }
      batch_id_out: { var: "batch_id" }
      phase_out: { var: "phase" }
      clearing_price_out: { var: "clearing_price_bps" }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: false }
      mev_captured: { const: 0 }
      batch_reverted: { bool: false }

  # EMERGENCY: Revert batch (abort stuck or expired batches)
  # Can be called from Solving (if no solution or deadline passed) or Settling (if fills can't complete)
  - id: "revert_batch"
    params:
      - id: "operator_auth"
        type: { kind: "bool" }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ param: "operator_auth" }, { bool: true }] }
        # Prevent batch_id overflow
        - { op: "<", args: [{ var: "batch_id" }, { const: 1000000 }] }
        # Can only revert from Solving or Settling phases
        - op: "or"
          args:
            - { op: "=", args: [{ var: "phase" }, { enum: "Solving" }] }
            - { op: "=", args: [{ var: "phase" }, { enum: "Settling" }] }
        # Either deadline passed OR in Solving with no valid bids
        - op: "or"
          args:
            # Deadline expired
            - { op: ">", args: [{ var: "epoch" }, { var: "batch_deadline_epoch" }] }
            # In Solving with no valid solution submitted
            - op: "and"
              args:
                - { op: "=", args: [{ var: "phase" }, { enum: "Solving" }] }
                - { op: "=", args: [{ var: "solver_bid_count" }, { const: 0 }] }
    updates:
      # Return to Collecting phase
      - var: "phase"
        expr: { enum: "Collecting" }
      # Increment batch_id to start fresh
      - var: "batch_id"
        expr:
          op: "+"
          args: [{ var: "batch_id" }, { const: 1 }]
      # Reset all batch state (funds returned to users off-chain)
      - var: "intent_count"
        expr: { const: 0 }
      - var: "total_input_collected"
        expr: { const: 0 }
      - var: "total_guaranteed_output"
        expr: { const: 0 }
      - var: "total_actual_output"
        expr: { const: 0 }
      - var: "total_filled_input"
        expr: { const: 0 }
      - var: "clearing_price_bps"
        expr: { const: 0 }
      - var: "best_surplus_bps"
        expr: { const: 10000 }
      - var: "solver_bid_count"
        expr: { const: 0 }
      - var: "winning_solver_id"
        expr: { const: 0 }
      - var: "settled_count"
        expr: { const: 0 }
      - var: "fees_captured"
        expr: { const: 0 }
      - var: "solver_reward"
        expr: { const: 0 }
      - var: "batch_deadline_epoch"
        expr: { const: 0 }
    effects:
      event: { enum: "BatchReverted" }
      batch_id_out: { var: "batch_id" }
      phase_out: { enum: "Collecting" }
      clearing_price_out: { const: 0 }
      fill_amount: { const: 0 }
      fill_output: { const: 0 }
      settlement_complete: { bool: false }
      mev_captured: { const: 0 }
      batch_reverted: { bool: true }
