# [FORGE] M6 global-state qualification boundary v1
ir_version: "esso-ir/v1"
meta:
  model_id: "fcis_m6_global_state_qualification_v1"
  created_by: "zenodex"
  global_gap_registry:
    - "managed_asset_policy"
    - "fee_role_claim_state"
    - "fee_apportionment_state"
    - "fee_authority_configuration"
    - "authenticated_execution_context"
    - "host_native_custody"
    - "feature_activation_profile"
    - "oracle_reporter_authority"
    - "buy_and_burn_lifecycle"
    - "sealed_bid_lifecycle"
    - "sovereign_ledger_carriers"
    - "writer_epoch_and_migration"
    - "history_nullifier_receipt"
    - "outbox_and_acknowledgment"
  authority_obligation_registry:
    - "tau_stable_committed_view"
    - "ledger_selected_head"
    - "ledger_execution_ancestry"
    - "cross_source_handoff"
    - "deployment_binding"
    - "current_writer_binding"
    - "global_economic_coherence"
    - "sovereign_carrier_refinement"
    - "requirements_registry_completeness"
  notes: |
    Exact finite model of the current V1 Python qualification boundary. A valid
    content-parity receipt is rejected because it remains incomplete. Invalid
    parity is also rejected. No action closes an obligation or issues authority.
    Future closure requires a new model whose actions consume typed same-subject
    discharge receipts.

observables:
  state_vars:
    - "content_parity_admitted"
    - "rejection_issued"
    - "authority_issued"
  effects: []

types: []

state_vars:
  - { id: "content_parity_admitted", role: "data", type: { kind: "int", min: 0, max: 1 } }
  - { id: "rejection_issued", role: "data", type: { kind: "int", min: 0, max: 1 } }
  - { id: "authority_issued", role: "data", type: { kind: "int", min: 0, max: 1 } }

init:
  - { var: "content_parity_admitted", expr: { const: 1 } }
  - { var: "rejection_issued", expr: { const: 0 } }
  - { var: "authority_issued", expr: { const: 0 } }

invariants:
  - id: "inv_v1_never_issues_authority"
    kind: "safety"
    expr: { op: "=", args: [{ var: "authority_issued" }, { const: 0 }] }
  - id: "inv_rejection_excludes_authority"
    kind: "safety"
    expr:
      op: "<="
      args:
        - { var: "rejection_issued" }
        - { op: "-", args: [{ const: 1 }, { var: "authority_issued" }] }

actions:
  - id: "reject_current_content_receipt"
    params: []
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "content_parity_admitted" }, { const: 1 }] }
        - { op: "=", args: [{ var: "rejection_issued" }, { const: 0 }] }
    updates:
      - { var: "rejection_issued", expr: { const: 1 } }
    effects: {}
  - id: "invalidate_content_parity"
    params: []
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "content_parity_admitted" }, { const: 1 }] }
        - { op: "=", args: [{ var: "rejection_issued" }, { const: 0 }] }
    updates: [{ var: "content_parity_admitted", expr: { const: 0 } }]
    effects: {}
  - id: "reject_invalid_content_receipt"
    params: []
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "content_parity_admitted" }, { const: 0 }] }
        - { op: "=", args: [{ var: "rejection_issued" }, { const: 0 }] }
    updates: [{ var: "rejection_issued", expr: { const: 1 } }]
    effects: {}
  - id: "stutter"
    params: []
    guard: { bool: true }
    updates: []
    effects: {}
