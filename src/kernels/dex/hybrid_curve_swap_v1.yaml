# [FORGE] Hybrid Curve AMM swap v1
# Blends CPMM K_cpmm = x*y with Cubic K_cubic = x*y*(x+y)
# based on imbalance ratio delta = |x - y| / (x + y)
#
# Hybrid invariant:
#   K_hybrid(x, y, alpha) = alpha * K_cubic(x,y) + (1 - alpha) * K_cpmm(x,y)
#                        = alpha * x*y*(x+y) + (1 - alpha) * x*y
#                        = x*y * [alpha*(x+y) + (1 - alpha)]
#                        = x*y * [alpha*x + alpha*y + 1 - alpha]
#
# where alpha is computed from imbalance:
#   delta = |x - y| * SCALE / (x + y)    (scaled to avoid fractions)
#   alpha = max(0, SCALE - delta) / SCALE  (near balance -> alpha high -> more cubic)
#
# At delta=0 (perfect balance): alpha=1, K = K_cubic
# At delta=SCALE (max imbalance): alpha=0, K = K_cpmm
#
# This kernel uses SCALE=100 for bounded verification.

ir_version: "esso-ir/v1"
meta:
  model_id: "hybrid_curve_swap_v1"
  notes: |
    Hybrid curve swap kernel that smoothly transitions between:
    - Cubic curve K = x*y*(x+y) when reserves are balanced (delta ~ 0)
    - Standard CPMM K = x*y when reserves are imbalanced (delta ~ 1)

    The blending function alpha(delta) provides:
    - Lower slippage near balance (cubic-like behavior)
    - Standard CPMM guarantees at extremes (proven no-extraction)

    Key safety properties to verify:
    1. Monotonicity: K' >= K after any valid swap
    2. No-arbitrage: roundtrip A->B->A yields profit <= 0
    3. Continuity: bounded K change for small delta change
    4. No reserve depletion: reserves stay positive

observables:
  state_vars: ["x", "y"]
  effects: ["amount_out", "k_before", "k_after", "alpha_before", "alpha_after"]

types:
  - id: "t_reserve"
    type: { kind: "int", min: 1, max: 10000 }
  - id: "t_amount"
    type: { kind: "int", min: 1, max: 1000 }
  - id: "t_alpha"
    type: { kind: "int", min: 0, max: 100 }

state_vars:
  - id: "x"
    role: "data"
    type: { ref: "t_reserve" }
  - id: "y"
    role: "data"
    type: { ref: "t_reserve" }
  - id: "k_snapshot"
    role: "data"
    type: { kind: "int", min: 0, max: 2000000000 }

init:
  - var: "x"
    expr: { const: 1000 }
  - var: "y"
    expr: { const: 1000 }
  - var: "k_snapshot"
    expr: { const: 0 }

invariants:
  # Safety: reserves must stay positive
  - id: "positive_reserves"
    kind: "safety"
    expr:
      op: "and"
      args:
        - { op: ">", args: [{ var: "x" }, { const: 0 }] }
        - { op: ">", args: [{ var: "y" }, { const: 0 }] }

  # Safety: reserves bounded
  - id: "bounded_reserves"
    kind: "safety"
    expr:
      op: "and"
      args:
        - { op: "<=", args: [{ var: "x" }, { const: 10000 }] }
        - { op: "<=", args: [{ var: "y" }, { const: 10000 }] }

  # No extraction: K_hybrid must never decrease (core AMM safety)
  # K_hybrid = x*y * [alpha*(x+y) + (100 - alpha)] / 100
  # Since alpha depends on current state, we track via k_snapshot
  # after first swap and verify non-decrease
  - id: "no_k_decrease"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - { op: ">", args: [{ var: "k_snapshot" }, { const: 0 }] }
        - op: ">="
          args:
            # Current K_hybrid (simplified: at least x*y which is lower bound)
            - { op: "*", args: [{ var: "x" }, { var: "y" }] }
            # k_snapshot / 200 as lower bound (conservative)
            - { op: "div", args: [{ var: "k_snapshot" }, { const: 200 }] }

actions:
  # Swap X for Y (exact input dx, receive dy)
  - id: "swap_x_for_y"
    params:
      - id: "dx"
        type: { ref: "t_amount" }
      - id: "dy_witness"
        type: { ref: "t_amount" }
    guard:
      op: "and"
      args:
        # Input amount positive and bounded
        - { op: ">", args: [{ param: "dx" }, { const: 0 }] }
        - { op: "<=", args: [{ param: "dx" }, { const: 1000 }] }

        # Output witness positive
        - { op: ">", args: [{ param: "dy_witness" }, { const: 0 }] }

        # Post-swap x still in bounds
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "x" }, { param: "dx" }] },
              { const: 10000 }
            ]
          }

        # Post-swap y still positive (can't drain full reserve)
        - { op: ">",
            args: [
              { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] },
              { const: 0 }
            ]
          }

        # CRITICAL: K_hybrid monotonicity constraint
        # Let x1 = x + dx, y1 = y - dy
        # Compute alpha_before from current (x,y) imbalance
        # Compute alpha_after from post-swap (x1,y1) imbalance
        #
        # K_before = x*y * [alpha_before*(x+y) + (100 - alpha_before)]
        # K_after = x1*y1 * [alpha_after*(x1+y1) + (100 - alpha_after)]
        #
        # Require: K_after >= K_before
        #
        # For tractability, we use a simplified conservative check:
        # The CPMM component (x*y) must not decrease, i.e.,
        # (x + dx) * (y - dy) >= x * y
        - { op: ">=",
            args: [
              { op: "*",
                args: [
                  { op: "+", args: [{ var: "x" }, { param: "dx" }] },
                  { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
                ]
              },
              { op: "*", args: [{ var: "x" }, { var: "y" }] }
            ]
          }

        # Full hybrid K check with integer alpha approximation
        # alpha = max(0, 100 - delta*100/(x+y)) where delta = |x - y|
        # For verification tractability, we verify the weighted combination:
        #
        # K_hybrid_after >= K_hybrid_before
        #
        # Using the formula:
        # K_hybrid = x*y * (alpha*(x+y)/100 + 1)
        #
        # Since alpha * (x+y) is already scaled by 100, we get:
        # K_hybrid = x*y * (alpha*(x+y) + 100) / 100
        #
        # For integer math with SCALE=100:
        # K_hybrid_scaled = x*y * (alpha*(x+y) + 100)
        #
        # Before state alpha_before:
        #   delta_before = abs(x - y)
        #   alpha_before = max(0, 100 - 100*delta_before/(x+y))
        #
        # After state alpha_after:
        #   delta_after = abs(x1 - y1)
        #   alpha_after = max(0, 100 - 100*delta_after/(x1+y1))
        #
        # For simplicity in the guard, we verify:
        # x1*y1*(x1+y1) >= x*y*(x+y) - epsilon (cubic component non-decrease)
        # AND x1*y1 >= x*y (CPMM component non-decrease)
        - { op: ">=",
            args: [
              # Cubic K after = x1 * y1 * (x1 + y1)
              { op: "*",
                args: [
                  { op: "*",
                    args: [
                      { op: "+", args: [{ var: "x" }, { param: "dx" }] },
                      { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
                    ]
                  },
                  { op: "+",
                    args: [
                      { op: "+", args: [{ var: "x" }, { param: "dx" }] },
                      { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
                    ]
                  }
                ]
              },
              # Cubic K before = x * y * (x + y) with small tolerance
              { op: "-",
                args: [
                  { op: "*",
                    args: [
                      { op: "*", args: [{ var: "x" }, { var: "y" }] },
                      { op: "+", args: [{ var: "x" }, { var: "y" }] }
                    ]
                  },
                  { const: 100 }  # tolerance for integer rounding
                ]
              }
            ]
          }

    updates:
      - var: "x"
        expr: { op: "+", args: [{ var: "x" }, { param: "dx" }] }
      - var: "y"
        expr: { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
      - var: "k_snapshot"
        # Store hybrid K for tracking (simplified as x*y*(x+y+100)/100)
        expr:
          op: "div"
          args:
            - op: "*"
              args:
                - { op: "*", args: [{ var: "x" }, { var: "y" }] }
                - { op: "+",
                    args: [
                      { op: "+", args: [{ var: "x" }, { var: "y" }] },
                      { const: 100 }
                    ]
                  }
            - { const: 100 }

    effects:
      amount_out: { param: "dy_witness" }
      k_before:
        op: "*"
        args:
          - { op: "*", args: [{ var: "x" }, { var: "y" }] }
          - { op: "+", args: [{ var: "x" }, { var: "y" }] }
      k_after:
        op: "*"
        args:
          - op: "*"
            args:
              - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
              - { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
          - op: "+"
            args:
              - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
              - { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
      alpha_before:
        # alpha = max(0, 100 - 100*|x-y|/(x+y))
        # Simplified: use ite for |x - y|
        op: "max"
        args:
          - { const: 0 }
          - op: "-"
            args:
              - { const: 100 }
              - op: "div"
                args:
                  - op: "*"
                    args:
                      - { const: 100 }
                      - op: "ite"
                        cond: { op: ">=", args: [{ var: "x" }, { var: "y" }] }
                        then: { op: "-", args: [{ var: "x" }, { var: "y" }] }
                        else: { op: "-", args: [{ var: "y" }, { var: "x" }] }
                  - { op: "+", args: [{ var: "x" }, { var: "y" }] }
      alpha_after:
        op: "max"
        args:
          - { const: 0 }
          - op: "-"
            args:
              - { const: 100 }
              - op: "div"
                args:
                  - op: "*"
                    args:
                      - { const: 100 }
                      - op: "ite"
                        cond:
                          op: ">="
                          args:
                            - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
                            - { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
                        then:
                          op: "-"
                          args:
                            - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
                            - { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
                        else:
                          op: "-"
                          args:
                            - { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }
                            - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
                  - op: "+"
                    args:
                      - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
                      - { op: "-", args: [{ var: "y" }, { param: "dy_witness" }] }

  # Swap Y for X (symmetric)
  - id: "swap_y_for_x"
    params:
      - id: "dy"
        type: { ref: "t_amount" }
      - id: "dx_witness"
        type: { ref: "t_amount" }
    guard:
      op: "and"
      args:
        - { op: ">", args: [{ param: "dy" }, { const: 0 }] }
        - { op: "<=", args: [{ param: "dy" }, { const: 1000 }] }
        - { op: ">", args: [{ param: "dx_witness" }, { const: 0 }] }
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "y" }, { param: "dy" }] },
              { const: 10000 }
            ]
          }
        - { op: ">",
            args: [
              { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] },
              { const: 0 }
            ]
          }
        # CPMM K non-decrease
        - { op: ">=",
            args: [
              { op: "*",
                args: [
                  { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] },
                  { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                ]
              },
              { op: "*", args: [{ var: "x" }, { var: "y" }] }
            ]
          }
        # Cubic K non-decrease (with tolerance)
        - { op: ">=",
            args: [
              { op: "*",
                args: [
                  { op: "*",
                    args: [
                      { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] },
                      { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                    ]
                  },
                  { op: "+",
                    args: [
                      { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] },
                      { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                    ]
                  }
                ]
              },
              { op: "-",
                args: [
                  { op: "*",
                    args: [
                      { op: "*", args: [{ var: "x" }, { var: "y" }] },
                      { op: "+", args: [{ var: "x" }, { var: "y" }] }
                    ]
                  },
                  { const: 100 }
                ]
              }
            ]
          }

    updates:
      - var: "x"
        expr: { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] }
      - var: "y"
        expr: { op: "+", args: [{ var: "y" }, { param: "dy" }] }
      - var: "k_snapshot"
        expr:
          op: "div"
          args:
            - op: "*"
              args:
                - { op: "*", args: [{ var: "x" }, { var: "y" }] }
                - { op: "+",
                    args: [
                      { op: "+", args: [{ var: "x" }, { var: "y" }] },
                      { const: 100 }
                    ]
                  }
            - { const: 100 }

    effects:
      amount_out: { param: "dx_witness" }
      k_before:
        op: "*"
        args:
          - { op: "*", args: [{ var: "x" }, { var: "y" }] }
          - { op: "+", args: [{ var: "x" }, { var: "y" }] }
      k_after:
        op: "*"
        args:
          - op: "*"
            args:
              - { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] }
              - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
          - op: "+"
            args:
              - { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] }
              - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
      alpha_before:
        op: "max"
        args:
          - { const: 0 }
          - op: "-"
            args:
              - { const: 100 }
              - op: "div"
                args:
                  - op: "*"
                    args:
                      - { const: 100 }
                      - op: "ite"
                        cond: { op: ">=", args: [{ var: "x" }, { var: "y" }] }
                        then: { op: "-", args: [{ var: "x" }, { var: "y" }] }
                        else: { op: "-", args: [{ var: "y" }, { var: "x" }] }
                  - { op: "+", args: [{ var: "x" }, { var: "y" }] }
      alpha_after:
        op: "max"
        args:
          - { const: 0 }
          - op: "-"
            args:
              - { const: 100 }
              - op: "div"
                args:
                  - op: "*"
                    args:
                      - { const: 100 }
                      - op: "ite"
                        cond:
                          op: ">="
                          args:
                            - { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] }
                            - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                        then:
                          op: "-"
                          args:
                            - { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] }
                            - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                        else:
                          op: "-"
                          args:
                            - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                            - { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] }
                  - op: "+"
                    args:
                      - { op: "-", args: [{ var: "x" }, { param: "dx_witness" }] }
                      - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
