ir_version: "esso-ir/v1"

meta:
  model_id: "flash_loan_guard_v2"
  description: "Flash loan guard that blocks swaps on borrow (not repay) to close exploit window"
  tags: ["security", "flash-loan", "exploit-prevention", "mev"]

observables:
  state_vars: ["flash_suspect", "flash_confirmed", "current_block", "swaps_blocked"]
  effects: ["guard_triggered", "block_advanced", "suspect_raised"]

types: []

state_vars:
  - id: "current_block"
    role: "control"
    type: {kind: "int", min: 0, max: 100000000}
    description: "Current block number"

  - id: "borrowed_this_block"
    role: "data"
    type: {kind: "int", min: 0, max: 1000000000000}
    description: "Amount borrowed in current block"

  - id: "repaid_this_block"
    role: "data"
    type: {kind: "int", min: 0, max: 1000000000000}
    description: "Amount repaid in current block"

  - id: "flash_suspect"
    role: "control"
    type: {kind: "bool"}
    description: "TRUE when borrow detected - blocks swaps immediately"

  - id: "flash_confirmed"
    role: "control"
    type: {kind: "bool"}
    description: "TRUE when borrow+repay pattern confirmed in same block"

  - id: "swaps_blocked"
    role: "data"
    type: {kind: "int", min: 0, max: 1000000}
    description: "Total swaps blocked due to flash detection"

  - id: "total_borrows"
    role: "data"
    type: {kind: "int", min: 0, max: 1000000000000}
    description: "Cumulative borrows tracked"

  - id: "flash_attempts"
    role: "data"
    type: {kind: "int", min: 0, max: 1000000}
    description: "Total confirmed flash loan attempts"

invariants:
  - id: "RepayBoundedByBorrow"
    kind: "safety"
    expr:
      op: "<="
      args:
        - {var: "repaid_this_block"}
        - {var: "borrowed_this_block"}
    description: "Cannot repay more than borrowed in same block"

  - id: "SuspectOnBorrow"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - op: ">"
          args:
            - {var: "borrowed_this_block"}
            - {const: 0}
        - {var: "flash_suspect"}
    description: "Any borrow raises suspect flag"

  - id: "ConfirmedImpliesSuspect"
    kind: "safety"
    expr:
      op: "=>"
      args:
        - {var: "flash_confirmed"}
        - {var: "flash_suspect"}
    description: "Confirmed implies suspect was raised"

  - id: "SwapsBlockedMonotonic"
    kind: "safety"
    expr:
      op: ">="
      args:
        - {var: "swaps_blocked"}
        - {const: 0}
    description: "Blocked swaps counter is non-negative"

init:
  - var: "current_block"
    expr: {const: 0}
  - var: "borrowed_this_block"
    expr: {const: 0}
  - var: "repaid_this_block"
    expr: {const: 0}
  - var: "flash_suspect"
    expr: {bool: false}
  - var: "flash_confirmed"
    expr: {bool: false}
  - var: "swaps_blocked"
    expr: {const: 0}
  - var: "total_borrows"
    expr: {const: 0}
  - var: "flash_attempts"
    expr: {const: 0}

actions:
  - id: "advance_block"
    description: "Move to next block, resetting per-block tracking"
    params:
      - id: "new_block"
        type: {kind: "int", min: 1, max: 100000000}
    guard:
      op: ">"
      args:
        - {param: "new_block"}
        - {var: "current_block"}
    updates:
      - var: "current_block"
        expr: {param: "new_block"}
      - var: "borrowed_this_block"
        expr: {const: 0}
      - var: "repaid_this_block"
        expr: {const: 0}
      - var: "flash_suspect"
        expr: {bool: false}
      - var: "flash_confirmed"
        expr: {bool: false}
    effects:
      block_advanced: {bool: true}
      guard_triggered: {bool: false}
      suspect_raised: {bool: false}

  - id: "on_borrow"
    description: "Record borrow - immediately raises suspect flag to block swaps"
    params:
      - id: "amount"
        type: {kind: "int", min: 1, max: 1000000000000}
    guard:
      op: "and"
      args:
        - op: "<="
          args:
            - op: "+"
              args:
                - {var: "borrowed_this_block"}
                - {param: "amount"}
            - {const: 1000000000000}
        - op: "<="
          args:
            - op: "+"
              args:
                - {var: "total_borrows"}
                - {param: "amount"}
            - {const: 1000000000000}
    updates:
      - var: "borrowed_this_block"
        expr:
          op: "+"
          args:
            - {var: "borrowed_this_block"}
            - {param: "amount"}
      - var: "total_borrows"
        expr:
          op: "+"
          args:
            - {var: "total_borrows"}
            - {param: "amount"}
      - var: "flash_suspect"
        expr: {bool: true}
    effects:
      guard_triggered: {bool: false}
      block_advanced: {bool: false}
      suspect_raised: {bool: true}

  - id: "on_repay"
    description: "Record repay - confirms flash loan pattern if borrow exists"
    params:
      - id: "amount"
        type: {kind: "int", min: 1, max: 1000000000000}
    guard:
      op: "and"
      args:
        - op: ">"
          args:
            - {var: "borrowed_this_block"}
            - {const: 0}
        - op: "<="
          args:
            - op: "+"
              args:
                - {var: "repaid_this_block"}
                - {param: "amount"}
            - {var: "borrowed_this_block"}
        - op: "<"
          args:
            - {var: "flash_attempts"}
            - {const: 1000000}
    updates:
      - var: "repaid_this_block"
        expr:
          op: "+"
          args:
            - {var: "repaid_this_block"}
            - {param: "amount"}
      - var: "flash_confirmed"
        expr: {bool: true}
      - var: "flash_attempts"
        expr:
          op: "+"
          args:
            - {var: "flash_attempts"}
            - {const: 1}
    effects:
      guard_triggered: {bool: true}
      block_advanced: {bool: false}
      suspect_raised: {bool: false}

  - id: "try_swap"
    description: "Attempt swap - blocked if flash_suspect (borrow detected)"
    params:
      - id: "swap_amount"
        type: {kind: "int", min: 1, max: 1000000000000}
    guard:
      op: "not"
      args:
        - {var: "flash_suspect"}
    updates: []
    effects:
      guard_triggered: {bool: false}
      block_advanced: {bool: false}
      suspect_raised: {bool: false}

  - id: "blocked_swap"
    description: "Record blocked swap due to flash suspect"
    params: []
    guard:
      op: "and"
      args:
        - {var: "flash_suspect"}
        - op: "<"
          args:
            - {var: "swaps_blocked"}
            - {const: 1000000}
    updates:
      - var: "swaps_blocked"
        expr:
          op: "+"
          args:
            - {var: "swaps_blocked"}
            - {const: 1}
    effects:
      guard_triggered: {bool: true}
      block_advanced: {bool: false}
      suspect_raised: {bool: false}
