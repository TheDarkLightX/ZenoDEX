  - id: "finalize"
    params:
      - { id: "burn_receipt_ok", type: { kind: "bool" } }
      - { id: "pending_binding_ok", type: { kind: "bool" } }
      - { id: "commit_authority_current", type: { kind: "bool" } }
      - { id: "terminal_close_ok", type: { kind: "bool" } }
    guard: { bool: true }
    updates:
      - var: "quote_buyback"
        expr:
          op: "ite"
          cond: &commit_ok
            op: "and"
            args:
              - { op: "=", args: [{ var: "phase" }, { enum: "PENDING" }] }
              - { param: "burn_receipt_ok" }
              - { param: "pending_binding_ok" }
              - { param: "commit_authority_current" }
              - { param: "terminal_close_ok" }
              - { var: "pending_profile_route_ok" }
              - { var: "pending_pool_assets_ok" }
              - { var: "pending_budget_binding_ok" }
              - { var: "pending_price_authority_ok" }
              - { var: "pending_oracle_finalized" }
              - { var: "pending_oracle_fresh" }
              - { var: "pending_purchase_receipt_ok" }
              - { op: "<=", args: [{ var: "pending_spend" }, { var: "pending_safe_limit" }] }
              - { op: ">=", args: [{ var: "pending_out" }, { var: "pending_minimum_out" }] }
              - { op: "<=", args: [{ var: "pending_out" }, { var: "pending_burn_cap" }] }
              - { op: "<", args: [{ var: "height" }, { const: 2 }] }
          then: { op: "-", args: [{ var: "quote_buyback" }, { var: "pending_spend" }] }
          else: { var: "quote_buyback" }
      - var: "quote_pool"
        expr: { op: "ite", cond: *commit_ok, then: { op: "+", args: [{ var: "quote_pool" }, { var: "pending_spend" }] }, else: { var: "quote_pool" } }
      - var: "zdex_pool"
        expr: { op: "ite", cond: *commit_ok, then: { op: "-", args: [{ var: "zdex_pool" }, { var: "pending_out" }] }, else: { var: "zdex_pool" } }
      - var: "zdex_supply"
        expr: { op: "ite", cond: *commit_ok, then: { op: "-", args: [{ var: "zdex_supply" }, { var: "pending_out" }] }, else: { var: "zdex_supply" } }
      - var: "height"
        expr: { op: "ite", cond: *commit_ok, then: { op: "+", args: [{ var: "height" }, { const: 1 }] }, else: { var: "height" } }
      - var: "command_used_0"
        expr:
          op: "or"
          args:
            - { var: "command_used_0" }
            - { op: "and", args: [*commit_ok, { op: "=", args: [{ var: "pending_occurrence" }, { const: 0 }] }] }
      - var: "command_used_1"
        expr:
          op: "or"
          args:
            - { var: "command_used_1" }
            - { op: "and", args: [*commit_ok, { op: "=", args: [{ var: "pending_occurrence" }, { const: 1 }] }] }
      - var: "budget_used_0"
        expr:
          op: "or"
          args:
            - { var: "budget_used_0" }
            - { op: "and", args: [*commit_ok, { op: "=", args: [{ var: "pending_occurrence" }, { const: 0 }] }] }
      - var: "budget_used_1"
        expr:
          op: "or"
          args:
            - { var: "budget_used_1" }
            - { op: "and", args: [*commit_ok, { op: "=", args: [{ var: "pending_occurrence" }, { const: 1 }] }] }
      - { var: "phase", expr: { op: "ite", cond: *commit_ok, then: { enum: "EMPTY" }, else: { var: "phase" } } }
      - { var: "pending_spend", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_spend" } } }
      - { var: "pending_out", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_out" } } }
      - { var: "pending_terminal", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_terminal" } } }
      - { var: "pending_pre_quote_buyback", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_pre_quote_buyback" } } }
      - { var: "pending_pre_quote_pool", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_pre_quote_pool" } } }
      - { var: "pending_pre_zdex_pool", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_pre_zdex_pool" } } }
      - { var: "pending_pre_zdex_supply", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_pre_zdex_supply" } } }
      - { var: "pending_pre_height", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_pre_height" } } }
      - { var: "pending_safe_limit", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_safe_limit" } } }
      - { var: "pending_minimum_out", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_minimum_out" } } }
      - { var: "pending_burn_cap", expr: { op: "ite", cond: *commit_ok, then: { const: 0 }, else: { var: "pending_burn_cap" } } }
      - { var: "pending_profile_route_ok", expr: { op: "ite", cond: *commit_ok, then: { bool: false }, else: { var: "pending_profile_route_ok" } } }
      - { var: "pending_pool_assets_ok", expr: { op: "ite", cond: *commit_ok, then: { bool: false }, else: { var: "pending_pool_assets_ok" } } }
      - { var: "pending_budget_binding_ok", expr: { op: "ite", cond: *commit_ok, then: { bool: false }, else: { var: "pending_budget_binding_ok" } } }
      - { var: "pending_price_authority_ok", expr: { op: "ite", cond: *commit_ok, then: { bool: false }, else: { var: "pending_price_authority_ok" } } }
      - { var: "pending_oracle_finalized", expr: { op: "ite", cond: *commit_ok, then: { bool: false }, else: { var: "pending_oracle_finalized" } } }
      - { var: "pending_oracle_fresh", expr: { op: "ite", cond: *commit_ok, then: { bool: false }, else: { var: "pending_oracle_fresh" } } }
      - { var: "pending_purchase_receipt_ok", expr: { op: "ite", cond: *commit_ok, then: { bool: false }, else: { var: "pending_purchase_receipt_ok" } } }
      - { var: "g_decision", expr: { op: "ite", cond: *commit_ok, then: { enum: "COMMITTED" }, else: { enum: "FINALIZE_REJECTED" } } }
      - { var: "g_pre_quote_buyback", expr: { var: "quote_buyback" } }
      - { var: "g_pre_quote_pool", expr: { var: "quote_pool" } }
      - { var: "g_pre_zdex_pool", expr: { var: "zdex_pool" } }
      - { var: "g_pre_zdex_other", expr: { var: "zdex_other" } }
      - { var: "g_pre_zdex_supply", expr: { var: "zdex_supply" } }
      - { var: "g_pre_height", expr: { var: "height" } }
      - { var: "g_pre_command_used_0", expr: { var: "command_used_0" } }
      - { var: "g_pre_command_used_1", expr: { var: "command_used_1" } }
      - { var: "g_pre_budget_used_0", expr: { var: "budget_used_0" } }
      - { var: "g_pre_budget_used_1", expr: { var: "budget_used_1" } }
      - { var: "g_occurrence", expr: { var: "pending_occurrence" } }
      - { var: "g_spend", expr: { var: "pending_spend" } }
      - { var: "g_out", expr: { var: "pending_out" } }
      - { var: "g_burn_receipt_ok", expr: { param: "burn_receipt_ok" } }
      - { var: "g_pending_binding_ok", expr: { param: "pending_binding_ok" } }
      - { var: "g_commit_authority_current", expr: { param: "commit_authority_current" } }
      - { var: "g_terminal_close_ok", expr: { param: "terminal_close_ok" } }
    effects:
      decision: { var: "g_decision" }
      published: { op: "=", args: [{ var: "g_decision" }, { enum: "COMMITTED" }] }
      quote_spent: { op: "ite", cond: { op: "=", args: [{ var: "g_decision" }, { enum: "COMMITTED" }] }, then: { var: "g_spend" }, else: { const: 0 } }
      zdex_burned: { op: "ite", cond: { op: "=", args: [{ var: "g_decision" }, { enum: "COMMITTED" }] }, then: { var: "g_out" }, else: { const: 0 } }
      pending_terminal: { var: "pending_terminal" }

  - id: "discard"
    params: []
    guard: { op: "=", args: [{ var: "phase" }, { enum: "PENDING" }] }
    updates:
      - { var: "phase", expr: { enum: "EMPTY" } }
      - { var: "pending_spend", expr: { const: 0 } }
      - { var: "pending_out", expr: { const: 0 } }
      - { var: "pending_terminal", expr: { const: 0 } }
      - { var: "pending_pre_quote_buyback", expr: { const: 0 } }
      - { var: "pending_pre_quote_pool", expr: { const: 0 } }
      - { var: "pending_pre_zdex_pool", expr: { const: 0 } }
