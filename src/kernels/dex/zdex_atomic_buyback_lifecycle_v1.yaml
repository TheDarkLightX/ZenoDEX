      - { var: "g_pre_zdex_other", expr: { var: "zdex_other" } }
      - { var: "g_pre_zdex_supply", expr: { var: "zdex_supply" } }
      - { var: "g_pre_height", expr: { var: "height" } }
      - { var: "g_pre_command_used_0", expr: { var: "command_used_0" } }
