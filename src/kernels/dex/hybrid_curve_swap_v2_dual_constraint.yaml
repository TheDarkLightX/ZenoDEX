# [FORGE] Hybrid Curve AMM v2 - Dual Constraint Approach
#
# CORRECTED FORMULATION based on SMT verification findings:
#
# The naive hybrid K = x*y*(alpha*(x+y) + (1-alpha)) is UNSOUND because
# satisfying CPMM (x'*y' >= x*y) does not guarantee the sum component
# (x'+y') is preserved.
#
# CORRECT APPROACH: Dual constraint
# A swap is valid iff BOTH:
#   1. K_cpmm(x', y') >= K_cpmm(x, y)  i.e., x'*y' >= x*y
#   2. K_cubic(x', y') >= K_cubic(x, y) i.e., x'*y'*(x'+y') >= x*y*(x+y)
#
# This ensures the hybrid curve maintains BOTH invariants simultaneously,
# providing the lower slippage of cubic near balance while preserving
# CPMM's proven no-extraction property.

ir_version: "esso-ir/v1"
meta:
  model_id: "hybrid_curve_swap_v2_dual"
  notes: |
    Hybrid curve with dual-constraint enforcement.
    Guarantees:
    - No extraction (K_cpmm never decreases)
    - Low slippage at balance (K_cubic behavior)
    - Sound integer rounding

observables:
  state_vars: ["x", "y"]
  effects: ["amount_out", "k_cpmm_before", "k_cpmm_after", "k_cubic_before", "k_cubic_after"]

types:
  - id: "t_reserve"
    type: { kind: "int", min: 1, max: 10000 }
  - id: "t_amount"
    type: { kind: "int", min: 1, max: 1000 }

state_vars:
  - id: "x"
    role: "data"
    type: { ref: "t_reserve" }
  - id: "y"
    role: "data"
    type: { ref: "t_reserve" }

init:
  - var: "x"
    expr: { const: 1000 }
  - var: "y"
    expr: { const: 1000 }

invariants:
  # Safety: reserves positive
  - id: "positive_reserves"
    kind: "safety"
    expr:
      op: "and"
      args:
        - { op: ">", args: [{ var: "x" }, { const: 0 }] }
        - { op: ">", args: [{ var: "y" }, { const: 0 }] }

  # Safety: reserves bounded
  - id: "bounded_reserves"
    kind: "safety"
    expr:
      op: "and"
      args:
        - { op: "<=", args: [{ var: "x" }, { const: 10000 }] }
        - { op: "<=", args: [{ var: "y" }, { const: 10000 }] }

actions:
  # Swap X for Y with dual-constraint enforcement
  - id: "swap_x_for_y"
    params:
      - id: "dx"
        type: { ref: "t_amount" }
      - id: "dy"
        type: { ref: "t_amount" }
    guard:
      op: "and"
      args:
        # Input bounds
        - { op: ">", args: [{ param: "dx" }, { const: 0 }] }
        - { op: "<=", args: [{ param: "dx" }, { const: 1000 }] }

        # Output bounds
        - { op: ">", args: [{ param: "dy" }, { const: 0 }] }

        # Post-swap x bounded
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "x" }, { param: "dx" }] },
              { const: 10000 }
            ]
          }

        # Post-swap y positive
        - { op: ">",
            args: [
              { op: "-", args: [{ var: "y" }, { param: "dy" }] },
              { const: 0 }
            ]
          }

        # CONSTRAINT 1: K_cpmm non-decrease
        # x' * y' >= x * y
        - { op: ">=",
            args: [
              { op: "*",
                args: [
                  { op: "+", args: [{ var: "x" }, { param: "dx" }] },
                  { op: "-", args: [{ var: "y" }, { param: "dy" }] }
                ]
              },
              { op: "*", args: [{ var: "x" }, { var: "y" }] }
            ]
          }

        # CONSTRAINT 2: K_cubic non-decrease
        # x' * y' * (x' + y') >= x * y * (x + y)
        - { op: ">=",
            args: [
              { op: "*",
                args: [
                  { op: "*",
                    args: [
                      { op: "+", args: [{ var: "x" }, { param: "dx" }] },
                      { op: "-", args: [{ var: "y" }, { param: "dy" }] }
                    ]
                  },
                  { op: "+",
                    args: [
                      { op: "+", args: [{ var: "x" }, { param: "dx" }] },
                      { op: "-", args: [{ var: "y" }, { param: "dy" }] }
                    ]
                  }
                ]
              },
              { op: "*",
                args: [
                  { op: "*", args: [{ var: "x" }, { var: "y" }] },
                  { op: "+", args: [{ var: "x" }, { var: "y" }] }
                ]
              }
            ]
          }

    updates:
      - var: "x"
        expr: { op: "+", args: [{ var: "x" }, { param: "dx" }] }
      - var: "y"
        expr: { op: "-", args: [{ var: "y" }, { param: "dy" }] }

    effects:
      amount_out: { param: "dy" }
      k_cpmm_before: { op: "*", args: [{ var: "x" }, { var: "y" }] }
      k_cpmm_after:
        op: "*"
        args:
          - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
          - { op: "-", args: [{ var: "y" }, { param: "dy" }] }
      k_cubic_before:
        op: "*"
        args:
          - { op: "*", args: [{ var: "x" }, { var: "y" }] }
          - { op: "+", args: [{ var: "x" }, { var: "y" }] }
      k_cubic_after:
        op: "*"
        args:
          - op: "*"
            args:
              - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
              - { op: "-", args: [{ var: "y" }, { param: "dy" }] }
          - op: "+"
            args:
              - { op: "+", args: [{ var: "x" }, { param: "dx" }] }
              - { op: "-", args: [{ var: "y" }, { param: "dy" }] }

  # Swap Y for X (symmetric)
  - id: "swap_y_for_x"
    params:
      - id: "dy"
        type: { ref: "t_amount" }
      - id: "dx"
        type: { ref: "t_amount" }
    guard:
      op: "and"
      args:
        - { op: ">", args: [{ param: "dy" }, { const: 0 }] }
        - { op: "<=", args: [{ param: "dy" }, { const: 1000 }] }
        - { op: ">", args: [{ param: "dx" }, { const: 0 }] }
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "y" }, { param: "dy" }] },
              { const: 10000 }
            ]
          }
        - { op: ">",
            args: [
              { op: "-", args: [{ var: "x" }, { param: "dx" }] },
              { const: 0 }
            ]
          }
        # CPMM constraint
        - { op: ">=",
            args: [
              { op: "*",
                args: [
                  { op: "-", args: [{ var: "x" }, { param: "dx" }] },
                  { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                ]
              },
              { op: "*", args: [{ var: "x" }, { var: "y" }] }
            ]
          }
        # Cubic constraint
        - { op: ">=",
            args: [
              { op: "*",
                args: [
                  { op: "*",
                    args: [
                      { op: "-", args: [{ var: "x" }, { param: "dx" }] },
                      { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                    ]
                  },
                  { op: "+",
                    args: [
                      { op: "-", args: [{ var: "x" }, { param: "dx" }] },
                      { op: "+", args: [{ var: "y" }, { param: "dy" }] }
                    ]
                  }
                ]
              },
              { op: "*",
                args: [
                  { op: "*", args: [{ var: "x" }, { var: "y" }] },
                  { op: "+", args: [{ var: "x" }, { var: "y" }] }
                ]
              }
            ]
          }

    updates:
      - var: "x"
        expr: { op: "-", args: [{ var: "x" }, { param: "dx" }] }
      - var: "y"
        expr: { op: "+", args: [{ var: "y" }, { param: "dy" }] }

    effects:
      amount_out: { param: "dx" }
      k_cpmm_before: { op: "*", args: [{ var: "x" }, { var: "y" }] }
      k_cpmm_after:
        op: "*"
        args:
          - { op: "-", args: [{ var: "x" }, { param: "dx" }] }
          - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
      k_cubic_before:
        op: "*"
        args:
          - { op: "*", args: [{ var: "x" }, { var: "y" }] }
          - { op: "+", args: [{ var: "x" }, { var: "y" }] }
      k_cubic_after:
        op: "*"
        args:
          - op: "*"
            args:
              - { op: "-", args: [{ var: "x" }, { param: "dx" }] }
              - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
          - op: "+"
            args:
              - { op: "-", args: [{ var: "x" }, { param: "dx" }] }
              - { op: "+", args: [{ var: "y" }, { param: "dy" }] }
