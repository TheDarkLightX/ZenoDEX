# [FORGE] zUSD current protocol-fee claim v1
ir_version: "esso-ir/v1"
meta:
  model_id: "zusd_protocol_fee_claim_v1"
  created_by: "zenodex"
  notes: |
    Finite composition model for zUSD debt, ledger supply, and the exact current
    unissued protocol-fee claim:

      debt = ledger_supply + outstanding_claim
      outstanding_claim <= accrued_cumulative

    Mint adds principal to ledger supply and fee to the current claim. Claim
    settlement moves an exact amount from the claim into ledger supply without
    changing debt. Repayment burns ledger supply and debt equally.

    The model does not authenticate a settlement caller, prove custody
    inventory completeness, select recipients, model the existing fee router,
    refine U256 arithmetic, or establish atomic publication. The Python bridge
    keeps nonzero fee accrual blocked until those runtime obligations are
    mounted.

observables:
  state_vars: ["debt", "ledger_supply", "outstanding_claim", "accrued_cumulative"]
  effects: []

types: []

state_vars:
  - id: "debt"
    role: "data"
    type: { kind: "int", min: 0, max: 8 }
  - id: "ledger_supply"
    role: "data"
    type: { kind: "int", min: 0, max: 8 }
  - id: "outstanding_claim"
    role: "data"
    type: { kind: "int", min: 0, max: 8 }
  - id: "accrued_cumulative"
    role: "data"
    type: { kind: "int", min: 0, max: 8 }

init:
  - var: "debt"
    expr: { const: 0 }
  - var: "ledger_supply"
    expr: { const: 0 }
  - var: "outstanding_claim"
    expr: { const: 0 }
  - var: "accrued_cumulative"
    expr: { const: 0 }

invariants:
  - id: "inv_debt_equals_ledger_supply_plus_outstanding_claim"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "debt" }
        - op: "+"
          args: [{ var: "ledger_supply" }, { var: "outstanding_claim" }]
  - id: "inv_outstanding_claim_bounded_by_cumulative_accrual"
    kind: "safety"
    expr:
      op: "<="
      args: [{ var: "outstanding_claim" }, { var: "accrued_cumulative" }]

actions:
  - id: "mint_with_fee_claim"
    params:
      - id: "principal"
        type: { kind: "int", min: 1, max: 2 }
      - id: "fee"
        type: { kind: "int", min: 0, max: 2 }
    guard:
      op: "and"
      args:
        - op: "<="
          args:
            - op: "+"
              args:
                - { var: "debt" }
                - op: "+"
                  args: [{ param: "principal" }, { param: "fee" }]
            - { const: 8 }
        - op: "<="
          args:
            - { op: "+", args: [{ var: "ledger_supply" }, { param: "principal" }] }
            - { const: 8 }
        - op: "<="
          args:
            - { op: "+", args: [{ var: "outstanding_claim" }, { param: "fee" }] }
            - { const: 8 }
        - op: "<="
          args:
            - { op: "+", args: [{ var: "accrued_cumulative" }, { param: "fee" }] }
            - { const: 8 }
    updates:
      - var: "debt"
        expr:
          op: "+"
          args:
            - { var: "debt" }
            - op: "+"
              args: [{ param: "principal" }, { param: "fee" }]
      - var: "ledger_supply"
        expr: { op: "+", args: [{ var: "ledger_supply" }, { param: "principal" }] }
      - var: "outstanding_claim"
        expr: { op: "+", args: [{ var: "outstanding_claim" }, { param: "fee" }] }
      - var: "accrued_cumulative"
        expr: { op: "+", args: [{ var: "accrued_cumulative" }, { param: "fee" }] }
    effects: {}
  - id: "settle_claim_into_ledger"
    params:
      - id: "amount"
        type: { kind: "int", min: 1, max: 2 }
    guard:
      op: "and"
      args:
        - { op: "<=", args: [{ param: "amount" }, { var: "outstanding_claim" }] }
        - op: "<="
          args:
            - { op: "+", args: [{ var: "ledger_supply" }, { param: "amount" }] }
            - { const: 8 }
    updates:
      - var: "ledger_supply"
        expr: { op: "+", args: [{ var: "ledger_supply" }, { param: "amount" }] }
      - var: "outstanding_claim"
        expr: { op: "-", args: [{ var: "outstanding_claim" }, { param: "amount" }] }
    effects: {}

  - id: "repay_from_ledger"
    params:
      - id: "amount"
        type: { kind: "int", min: 1, max: 2 }
    guard:
      op: "and"
      args:
        - { op: "<=", args: [{ param: "amount" }, { var: "debt" }] }
        - { op: "<=", args: [{ param: "amount" }, { var: "ledger_supply" }] }
    updates:
      - var: "debt"
        expr: { op: "-", args: [{ var: "debt" }, { param: "amount" }] }
      - var: "ledger_supply"
        expr: { op: "-", args: [{ var: "ledger_supply" }, { param: "amount" }] }
    effects: {}

  - id: "custody_stutter"
    params: []
    guard: { bool: true }
    updates: []
    effects: {}
