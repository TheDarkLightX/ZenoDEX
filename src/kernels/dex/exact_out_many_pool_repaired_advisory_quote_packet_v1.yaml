ir_version: "esso-ir/v1"
meta:
  model_id: "exact_out_many_pool_repaired_advisory_quote_packet_v1"
  created_by: "zenodex"
  notes: |
    Bounded acceptance shell for the repaired many-pool exact-out advisory
    quote packet.

    Purpose:
    - mechanically check the deterministic boolean relation around the public
      advisory packet above the repaired-prefilter contract
    - keep the boundary explicit: a repaired advisory quote is exposed iff the
      repaired-prefilter contract is OK

    Scope boundary:
    - does not model exact-out routing arithmetic or repaired-prefilter
      completeness
    - treats repaired_contract_ok and runtime_matches_advisory as externally
      supplied bounded booleans
    - only checks the deterministic packet shell over those booleans

observables:
  state_vars:
    [
      "repaired_contract_ok",
      "runtime_matches_advisory",
      "packet_ok",
      "advisory_quote_present",
      "error_present",
    ]
  effects:
    [
      "packet_ok",
      "advisory_quote_present",
      "runtime_matches_advisory",
      "error_present",
    ]

types: []

state_vars:
  - id: "repaired_contract_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "runtime_matches_advisory"
    role: "data"
    type: { kind: "bool" }
  - id: "packet_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "advisory_quote_present"
    role: "data"
    type: { kind: "bool" }
  - id: "error_present"
    role: "data"
    type: { kind: "bool" }

init:
  - var: "repaired_contract_ok"
    expr: { bool: false }
  - var: "runtime_matches_advisory"
    expr: { bool: false }
  - var: "packet_ok"
    expr: { bool: false }
  - var: "advisory_quote_present"
    expr: { bool: false }
  - var: "error_present"
    expr: { bool: true }

invariants:
  - id: "inv_packet_ok_flag_correct"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "packet_ok" }
        - { var: "repaired_contract_ok" }
  - id: "inv_advisory_quote_present_flag_correct"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "advisory_quote_present" }
        - { var: "repaired_contract_ok" }
  - id: "inv_error_present_flag_correct"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "error_present" }
        - op: "not"
          args:
            - { var: "repaired_contract_ok" }
  - id: "inv_packet_ok_implies_advisory_quote_present"
    kind: "safety"
    expr:
      op: "or"
      args:
        - op: "not"
          args:
            - { var: "packet_ok" }
        - { var: "advisory_quote_present" }
  - id: "inv_error_exclusive_with_advisory_quote"
    kind: "safety"
    expr:
      op: "not"
      args:
        - op: "and"
          args:
            - { var: "advisory_quote_present" }
            - { var: "error_present" }

actions:
  - id: "rebuild_repaired_advisory_quote_packet"
    params:
      - id: "repaired_contract_ok_in"
        type: { kind: "bool" }
      - id: "runtime_matches_advisory_in"
        type: { kind: "bool" }
    guard: { bool: true }
    updates:
      - var: "repaired_contract_ok"
        expr: { param: "repaired_contract_ok_in" }
      - var: "runtime_matches_advisory"
        expr:
          op: "ite"
          cond: { param: "repaired_contract_ok_in" }
          then: { param: "runtime_matches_advisory_in" }
          else: { bool: false }
      - var: "packet_ok"
        expr: { param: "repaired_contract_ok_in" }
      - var: "advisory_quote_present"
        expr: { param: "repaired_contract_ok_in" }
      - var: "error_present"
        expr:
          op: "not"
          args:
            - { param: "repaired_contract_ok_in" }
    effects:
      packet_ok: { var: "packet_ok" }
      advisory_quote_present: { var: "advisory_quote_present" }
      runtime_matches_advisory: { var: "runtime_matches_advisory" }
      error_present: { var: "error_present" }

checks:
  - id: "init_implies_inv"
    kind: "invariant"
  - id: "inductive_rebuild_packet"
    kind: "inductive"
