# [FORGE] zUSD Multi Redeem Selector v1
ir_version: "esso-ir/v1"
meta:
  model_id: "zusd_multi_redeem_selector_v1"
  created_by: "zenodex"
  notes: |
    Micro-kernel: deterministic vault selector for multi-vault zUSD auto redemption.

    Purpose:
      - Make the "closest to MCR, tie-break to vault a" policy explicit and replayable.
      - Cover the shell/core policy seam that decides which vault auto redemption
        should target before the single-vault redemption apply logic runs.

    Assume/guarantee split:
      - Assumes oracle freshness / pending-price equality / free-debt checks are
        handled elsewhere.
      - Assumes fee arithmetic and collateral transfer application are handled by
        the redemption apply kernel.
      - Guarantees only candidate admissibility and deterministic selector output.

    Non-goals:
      - free-debt accounting
      - protocol-collateral fee accumulation
      - post-state transition application

observables:
  state_vars:
    [
      "amount_e8",
      "price_e8",
      "mcr_bps",
      "vault_a_collateral_e8",
      "vault_a_debt_e8",
      "vault_b_collateral_e8",
      "vault_b_debt_e8",
    ]
  effects:
    [
      "gross_collateral_e8",
      "candidate_a_ok",
      "candidate_b_ok",
      "headroom_a_before_e8",
      "headroom_b_before_e8",
      "selection_ok",
      "selected_vault",
    ]

types:
  - id: "t_selected_vault"
    type:
      kind: "enum"
      symbols: ["None", "VaultA", "VaultB"]

state_vars:
  - id: "amount_e8"
    role: "data"
    type: { kind: "int", min: 1, max: 1000000000000 }
  - id: "price_e8"
    role: "data"
    type: { kind: "int", min: 1, max: 1000000000000 }
  - id: "mcr_bps"
    role: "data"
    type: { kind: "int", min: 1, max: 20000 }
  - id: "vault_a_collateral_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }
  - id: "vault_a_debt_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }
  - id: "vault_b_collateral_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }
  - id: "vault_b_debt_e8"
    role: "data"
    type: { kind: "int", min: 0, max: 1000000000000 }

init:
  - var: "amount_e8"
    expr: { const: 1 }
  - var: "price_e8"
    expr: { const: 100000000 }
  - var: "mcr_bps"
    expr: { const: 11000 }
  - var: "vault_a_collateral_e8"
    expr: { const: 0 }
  - var: "vault_a_debt_e8"
    expr: { const: 0 }
  - var: "vault_b_collateral_e8"
    expr: { const: 0 }
  - var: "vault_b_debt_e8"
    expr: { const: 0 }

invariants:
  - id: "inv_non_negative_vaults"
    kind: "safety"
    expr:
      op: "and"
      args:
        - { op: ">=", args: [{ var: "vault_a_collateral_e8" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "vault_a_debt_e8" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "vault_b_collateral_e8" }, { const: 0 }] }
        - { op: ">=", args: [{ var: "vault_b_debt_e8" }, { const: 0 }] }

actions:
  - id: "select_redeem_vault"
    params: []
    guard:
      op: ">"
      args:
        - op: "div"
          args:
            - op: "*"
              args: [{ var: "amount_e8" }, { const: 100000000 }]
            - { var: "price_e8" }
        - { const: 0 }
    updates: []
    effects:
      gross_collateral_e8:
        op: "div"
        args:
          - op: "*"
            args: [{ var: "amount_e8" }, { const: 100000000 }]
          - { var: "price_e8" }
      candidate_a_ok:
        op: "and"
        args:
          - { op: "<=", args: [{ var: "amount_e8" }, { var: "vault_a_debt_e8" }] }
          - op: "<="
            args:
              - op: "div"
                args:
                  - op: "*"
                    args: [{ var: "amount_e8" }, { const: 100000000 }]
                  - { var: "price_e8" }
              - { var: "vault_a_collateral_e8" }
          - op: "or"
            args:
              - op: "="
                args:
                  - op: "-"
                    args: [{ var: "vault_a_debt_e8" }, { var: "amount_e8" }]
                  - { const: 0 }
              - op: ">="
                args:
                  - op: "*"
                    args:
                      - op: "-"
                        args:
                          - { var: "vault_a_collateral_e8" }
                          - op: "div"
                            args:
                              - op: "*"
                                args: [{ var: "amount_e8" }, { const: 100000000 }]
                              - { var: "price_e8" }
                      - op: "*"
                        args: [{ var: "price_e8" }, { const: 10000 }]
                  - op: "*"
                    args:
                      - op: "-"
                        args: [{ var: "vault_a_debt_e8" }, { var: "amount_e8" }]
                      - op: "*"
                        args: [{ var: "mcr_bps" }, { const: 100000000 }]
      candidate_b_ok:
        op: "and"
        args:
          - { op: "<=", args: [{ var: "amount_e8" }, { var: "vault_b_debt_e8" }] }
          - op: "<="
            args:
              - op: "div"
                args:
                  - op: "*"
                    args: [{ var: "amount_e8" }, { const: 100000000 }]
                  - { var: "price_e8" }
              - { var: "vault_b_collateral_e8" }
          - op: "or"
            args:
              - op: "="
                args:
                  - op: "-"
                    args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                  - { const: 0 }
              - op: ">="
                args:
                  - op: "*"
                    args:
                      - op: "-"
                        args:
                          - { var: "vault_b_collateral_e8" }
                          - op: "div"
                            args:
                              - op: "*"
                                args: [{ var: "amount_e8" }, { const: 100000000 }]
                              - { var: "price_e8" }
                      - op: "*"
                        args: [{ var: "price_e8" }, { const: 10000 }]
                  - op: "*"
                    args:
                      - op: "-"
                        args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                      - op: "*"
                        args: [{ var: "mcr_bps" }, { const: 100000000 }]
      headroom_a_before_e8:
        op: "-"
        args:
          - op: "*"
            args:
              - { var: "vault_a_collateral_e8" }
              - op: "*"
                args: [{ var: "price_e8" }, { const: 10000 }]
          - op: "*"
            args:
              - { var: "vault_a_debt_e8" }
              - op: "*"
                args: [{ var: "mcr_bps" }, { const: 100000000 }]
      headroom_b_before_e8:
        op: "-"
        args:
          - op: "*"
            args:
              - { var: "vault_b_collateral_e8" }
              - op: "*"
                args: [{ var: "price_e8" }, { const: 10000 }]
          - op: "*"
            args:
              - { var: "vault_b_debt_e8" }
              - op: "*"
                args: [{ var: "mcr_bps" }, { const: 100000000 }]
      selection_ok:
        op: "or"
        args:
          - op: "and"
            args:
              - op: "and"
                args:
                  - op: "<="
                    args: [{ var: "amount_e8" }, { var: "vault_a_debt_e8" }]
                  - op: "<="
                    args:
                      - op: "div"
                        args:
                          - op: "*"
                            args: [{ var: "amount_e8" }, { const: 100000000 }]
                          - { var: "price_e8" }
                      - { var: "vault_a_collateral_e8" }
              - op: "or"
                args:
                  - op: "="
                    args:
                      - op: "-"
                        args: [{ var: "vault_a_debt_e8" }, { var: "amount_e8" }]
                      - { const: 0 }
                  - op: ">="
                    args:
                      - op: "*"
                        args:
                          - op: "-"
                            args:
                              - { var: "vault_a_collateral_e8" }
                              - op: "div"
                                args:
                                  - op: "*"
                                    args: [{ var: "amount_e8" }, { const: 100000000 }]
                                  - { var: "price_e8" }
                          - op: "*"
                            args: [{ var: "price_e8" }, { const: 10000 }]
                      - op: "*"
                        args:
                          - op: "-"
                            args: [{ var: "vault_a_debt_e8" }, { var: "amount_e8" }]
                          - op: "*"
                            args: [{ var: "mcr_bps" }, { const: 100000000 }]
          - op: "and"
            args:
              - op: "and"
                args:
                  - op: "<="
                    args: [{ var: "amount_e8" }, { var: "vault_b_debt_e8" }]
                  - op: "<="
                    args:
                      - op: "div"
                        args:
                          - op: "*"
                            args: [{ var: "amount_e8" }, { const: 100000000 }]
                          - { var: "price_e8" }
                      - { var: "vault_b_collateral_e8" }
              - op: "or"
                args:
                  - op: "="
                    args:
                      - op: "-"
                        args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                      - { const: 0 }
                  - op: ">="
                    args:
                      - op: "*"
                        args:
                          - op: "-"
                            args:
                              - { var: "vault_b_collateral_e8" }
                              - op: "div"
                                args:
                                  - op: "*"
                                    args: [{ var: "amount_e8" }, { const: 100000000 }]
                                  - { var: "price_e8" }
                          - op: "*"
                            args: [{ var: "price_e8" }, { const: 10000 }]
                      - op: "*"
                        args:
                          - op: "-"
                            args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                          - op: "*"
                            args: [{ var: "mcr_bps" }, { const: 100000000 }]
      selected_vault:
        op: "ite"
        cond:
          op: "and"
          args:
            - op: "and"
              args:
                - op: "<="
                  args: [{ var: "amount_e8" }, { var: "vault_a_debt_e8" }]
                - op: "<="
                  args:
                    - op: "div"
                      args:
                        - op: "*"
                          args: [{ var: "amount_e8" }, { const: 100000000 }]
                        - { var: "price_e8" }
                    - { var: "vault_a_collateral_e8" }
            - op: "or"
              args:
                - op: "="
                  args:
                    - op: "-"
                      args: [{ var: "vault_a_debt_e8" }, { var: "amount_e8" }]
                    - { const: 0 }
                - op: ">="
                  args:
                    - op: "*"
                      args:
                        - op: "-"
                          args:
                            - { var: "vault_a_collateral_e8" }
                            - op: "div"
                              args:
                                - op: "*"
                                  args: [{ var: "amount_e8" }, { const: 100000000 }]
                                - { var: "price_e8" }
                        - op: "*"
                          args: [{ var: "price_e8" }, { const: 10000 }]
                    - op: "*"
                      args:
                        - op: "-"
                          args: [{ var: "vault_a_debt_e8" }, { var: "amount_e8" }]
                        - op: "*"
                          args: [{ var: "mcr_bps" }, { const: 100000000 }]
        then:
          op: "ite"
          cond:
            op: "or"
            args:
              - op: "not"
                args:
                  - op: "and"
                    args:
                      - op: "<="
                        args: [{ var: "amount_e8" }, { var: "vault_b_debt_e8" }]
                      - op: "<="
                        args:
                          - op: "div"
                            args:
                              - op: "*"
                                args: [{ var: "amount_e8" }, { const: 100000000 }]
                              - { var: "price_e8" }
                          - { var: "vault_b_collateral_e8" }
                      - op: "or"
                        args:
                          - op: "="
                            args:
                              - op: "-"
                                args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                              - { const: 0 }
                          - op: ">="
                            args:
                              - op: "*"
                                args:
                                  - op: "-"
                                    args:
                                      - { var: "vault_b_collateral_e8" }
                                      - op: "div"
                                        args:
                                          - op: "*"
                                            args: [{ var: "amount_e8" }, { const: 100000000 }]
                                          - { var: "price_e8" }
                                  - op: "*"
                                    args: [{ var: "price_e8" }, { const: 10000 }]
                              - op: "*"
                                args:
                                  - op: "-"
                                    args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                                  - op: "*"
                                    args: [{ var: "mcr_bps" }, { const: 100000000 }]
              - op: "<="
                args:
                  - op: "-"
                    args:
                      - op: "*"
                        args:
                          - { var: "vault_a_collateral_e8" }
                          - op: "*"
                            args: [{ var: "price_e8" }, { const: 10000 }]
                      - op: "*"
                        args:
                          - { var: "vault_a_debt_e8" }
                          - op: "*"
                            args: [{ var: "mcr_bps" }, { const: 100000000 }]
                  - op: "-"
                    args:
                      - op: "*"
                        args:
                          - { var: "vault_b_collateral_e8" }
                          - op: "*"
                            args: [{ var: "price_e8" }, { const: 10000 }]
                      - op: "*"
                        args:
                          - { var: "vault_b_debt_e8" }
                          - op: "*"
                            args: [{ var: "mcr_bps" }, { const: 100000000 }]
          then: { enum: "VaultA" }
          else: { enum: "VaultB" }
        else:
          op: "ite"
          cond:
            op: "and"
            args:
              - op: "<="
                args: [{ var: "amount_e8" }, { var: "vault_b_debt_e8" }]
              - op: "<="
                args:
                  - op: "div"
                    args:
                      - op: "*"
                        args: [{ var: "amount_e8" }, { const: 100000000 }]
                      - { var: "price_e8" }
                  - { var: "vault_b_collateral_e8" }
              - op: "or"
                args:
                  - op: "="
                    args:
                      - op: "-"
                        args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                      - { const: 0 }
                  - op: ">="
                    args:
                      - op: "*"
                        args:
                          - op: "-"
                            args:
                              - { var: "vault_b_collateral_e8" }
                              - op: "div"
                                args:
                                  - op: "*"
                                    args: [{ var: "amount_e8" }, { const: 100000000 }]
                                  - { var: "price_e8" }
                          - op: "*"
                            args: [{ var: "price_e8" }, { const: 10000 }]
                      - op: "*"
                        args:
                          - op: "-"
                            args: [{ var: "vault_b_debt_e8" }, { var: "amount_e8" }]
                          - op: "*"
                            args: [{ var: "mcr_bps" }, { const: 100000000 }]
          then: { enum: "VaultB" }
          else: { enum: "None" }
