ir_version: "esso-ir/v1"
meta:
  model_id: "zusd_generic_token_admission_v1"
  created_by: "zenodex"
  notes: |
    Dual-authority and reserved-custody policy for canonical zUSD.

    The generic token writer may transfer canonical zUSD only to custody
    classified as ordinary by the authoritative recipient registry. It may not
    mint or burn canonical zUSD. A zUSD monetary-authority command receives a
    route-to-monetary-kernel result instead of generic-writer admission. Every
    admitted generic operation preserves this kernel's canonical supply
    projection. Every rejection or routing result is a no-op at this stage.

    The executable typed core expands the bounded flags into action, asset,
    writer-role, and custody-class enums. The live registry currently binds the
    chain-derived Stability Pool escrow pubkey. Gas reserve, fee pools, perps
    liabilities, and DEX custody are internal ledgers without addressable
    recipient pubkeys in the current bridge. A future addressable principal
    must be added to that registry before admission.

    This model owns authority admission only. Authentication, canonical asset
    and principal derivation, registry completeness, amounts, balances, nonces,
    monetary transition correctness, and atomic shell commit remain external
    refinement obligations.

observables:
  state_vars: ["canonical_supply_units", "violation_found"]
  effects:
    [
      "operation_code",
      "actor_is_monetary_authority",
      "asset_is_canonical_zusd",
      "recipient_is_reserved_internal_custody",
      "admitted",
      "decision_code",
      "canonical_zusd_supply_delta",
      "post_canonical_supply_units",
      "rejection_noop",
      "exhaustive_case_ok",
    ]

types: []

state_vars:
  - id: "canonical_supply_units"
    role: "data"
    type: { kind: "int", min: 0, max: 4294967295 }
  - id: "violation_found"
    role: "control"
    type: { kind: "int", min: 0, max: 1 }

init:
  - var: "canonical_supply_units"
    expr: { const: 0 }
  - var: "violation_found"
    expr: { const: 0 }

invariants:
  - id: "inv_authority_and_custody_partition_complete"
    kind: "safety"
    expr: { op: "=", args: [{ var: "violation_found" }, { const: 0 }] }

actions:
  - id: "evaluate_transfer"
    params: &policy_params
      - id: "actor_is_monetary_authority"
        type: { kind: "bool" }
      - id: "asset_is_canonical_zusd"
        type: { kind: "bool" }
      - id: "recipient_is_reserved_internal_custody"
        type: { kind: "bool" }
    guard: { bool: true }
    updates:
      - var: "violation_found"
        expr:
          op: "ite"
          cond: &transfer_obligations
            op: "and"
            args:
              - op: "="
                args:
                  - &transfer_admitted
                    op: "and"
                    args:
                      - { op: "not", args: [{ param: "actor_is_monetary_authority" }] }
                      - op: "or"
                        args:
                          - { op: "not", args: [{ param: "asset_is_canonical_zusd" }] }
                          - { op: "not", args: [{ param: "recipient_is_reserved_internal_custody" }] }
                  - op: "and"
                    args:
                      - { op: "not", args: [{ param: "actor_is_monetary_authority" }] }
                      - op: "or"
                        args:
                          - { op: "not", args: [{ param: "asset_is_canonical_zusd" }] }
                          - { op: "not", args: [{ param: "recipient_is_reserved_internal_custody" }] }
              - op: "="
                args:
                  - &transfer_decision_code
                    op: "ite"
                    cond: { param: "actor_is_monetary_authority" }
                    then: { const: 4 }
                    else:
                      op: "ite"
                      cond: *transfer_admitted
                      then: { const: 0 }
                      else: { const: 3 }
                  - op: "ite"
                    cond: { param: "actor_is_monetary_authority" }
                    then: { const: 4 }
                    else:
                      op: "ite"
                      cond: *transfer_admitted
                      then: { const: 0 }
                      else: { const: 3 }
              - { op: "=", args: [{ const: 0 }, { const: 0 }] }
              - op: "="
                args: [{ var: "canonical_supply_units" }, { var: "canonical_supply_units" }]
          then: { const: 0 }
          else: { const: 1 }
    effects:
      operation_code: { const: 0 }
      actor_is_monetary_authority: { param: "actor_is_monetary_authority" }
      asset_is_canonical_zusd: { param: "asset_is_canonical_zusd" }
      recipient_is_reserved_internal_custody:
        { param: "recipient_is_reserved_internal_custody" }
      admitted: *transfer_admitted
      decision_code: *transfer_decision_code
      canonical_zusd_supply_delta: { const: 0 }
      post_canonical_supply_units: { var: "canonical_supply_units" }
      rejection_noop:
        op: "or"
        args:
          - *transfer_admitted
          - { op: "=", args: [{ var: "canonical_supply_units" }, { var: "canonical_supply_units" }] }
      exhaustive_case_ok: *transfer_obligations

  - id: "evaluate_mint"
    params: *policy_params
    guard: { bool: true }
    updates:
      - var: "violation_found"
        expr:
          op: "ite"
          cond: &mint_obligations
            op: "and"
            args:
              - op: "="
                args:
                  - &mint_admitted
                    op: "and"
                    args:
                      - { op: "not", args: [{ param: "actor_is_monetary_authority" }] }
                      - { op: "not", args: [{ param: "asset_is_canonical_zusd" }] }
                  - op: "and"
                    args:
                      - { op: "not", args: [{ param: "actor_is_monetary_authority" }] }
                      - { op: "not", args: [{ param: "asset_is_canonical_zusd" }] }
              - op: "="
                args:
                  - &mint_decision_code
                    op: "ite"
                    cond: { param: "actor_is_monetary_authority" }
                    then: { const: 4 }
                    else:
                      op: "ite"
                      cond: *mint_admitted
                      then: { const: 0 }
                      else: { const: 1 }
                  - op: "ite"
                    cond: { param: "actor_is_monetary_authority" }
                    then: { const: 4 }
                    else:
                      op: "ite"
                      cond: *mint_admitted
                      then: { const: 0 }
                      else: { const: 1 }
              - { op: "=", args: [{ const: 0 }, { const: 0 }] }
              - op: "="
                args: [{ var: "canonical_supply_units" }, { var: "canonical_supply_units" }]
          then: { const: 0 }
          else: { const: 1 }
    effects:
      operation_code: { const: 1 }
      actor_is_monetary_authority: { param: "actor_is_monetary_authority" }
      asset_is_canonical_zusd: { param: "asset_is_canonical_zusd" }
      recipient_is_reserved_internal_custody:
        { param: "recipient_is_reserved_internal_custody" }
      admitted: *mint_admitted
      decision_code: *mint_decision_code
      canonical_zusd_supply_delta: { const: 0 }
      post_canonical_supply_units: { var: "canonical_supply_units" }
      rejection_noop:
        op: "or"
        args:
          - *mint_admitted
          - { op: "=", args: [{ var: "canonical_supply_units" }, { var: "canonical_supply_units" }] }
      exhaustive_case_ok: *mint_obligations

  - id: "evaluate_burn"
    params: *policy_params
    guard: { bool: true }
    updates:
      - var: "violation_found"
        expr:
          op: "ite"
          cond: &burn_obligations
            op: "and"
            args:
              - op: "="
                args:
                  - &burn_admitted
                    op: "and"
                    args:
                      - { op: "not", args: [{ param: "actor_is_monetary_authority" }] }
                      - { op: "not", args: [{ param: "asset_is_canonical_zusd" }] }
                  - op: "and"
                    args:
                      - { op: "not", args: [{ param: "actor_is_monetary_authority" }] }
                      - { op: "not", args: [{ param: "asset_is_canonical_zusd" }] }
              - op: "="
                args:
                  - &burn_decision_code
                    op: "ite"
                    cond: { param: "actor_is_monetary_authority" }
                    then: { const: 4 }
                    else:
                      op: "ite"
                      cond: *burn_admitted
                      then: { const: 0 }
                      else: { const: 2 }
                  - op: "ite"
                    cond: { param: "actor_is_monetary_authority" }
                    then: { const: 4 }
                    else:
                      op: "ite"
                      cond: *burn_admitted
                      then: { const: 0 }
                      else: { const: 2 }
              - { op: "=", args: [{ const: 0 }, { const: 0 }] }
              - op: "="
                args: [{ var: "canonical_supply_units" }, { var: "canonical_supply_units" }]
          then: { const: 0 }
          else: { const: 1 }
    effects:
      operation_code: { const: 2 }
      actor_is_monetary_authority: { param: "actor_is_monetary_authority" }
      asset_is_canonical_zusd: { param: "asset_is_canonical_zusd" }
      recipient_is_reserved_internal_custody:
        { param: "recipient_is_reserved_internal_custody" }
      admitted: *burn_admitted
      decision_code: *burn_decision_code
      canonical_zusd_supply_delta: { const: 0 }
      post_canonical_supply_units: { var: "canonical_supply_units" }
      rejection_noop:
        op: "or"
        args:
          - *burn_admitted
          - { op: "=", args: [{ var: "canonical_supply_units" }, { var: "canonical_supply_units" }] }
      exhaustive_case_ok: *burn_obligations
