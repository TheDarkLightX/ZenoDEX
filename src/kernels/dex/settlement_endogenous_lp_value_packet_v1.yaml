ir_version: "esso-ir/v1"
meta:
  model_id: "settlement_endogenous_lp_value_packet_v1"
  created_by: "zenodex"
  notes: |
    Bounded acceptance shell for the replayable endogenous LP settlement value packet.

    Purpose:
    - mechanically check the boolean acceptance relation around the packet
    - keep the boundary explicit: packet_ok holds exactly when price provenance,
      bounded pool-snapshot sanity, LP-liability balance, and value conservation
      all hold, plus attestation_ok in attestation mode

    Scope boundary:
    - does not model settlement arithmetic or LP valuation algebra
    - treats the boolean facts as externally supplied primitives
    - only checks the deterministic packet shell over bounded booleans

observables:
  state_vars:
    [
      "attestation_mode",
      "price_provenance_ok",
      "attestation_ok",
      "unique_pool_ids_ok",
      "all_positive_lp_supply_ok",
      "all_assets_priced_ok",
      "asset_conservation_ok",
      "lp_liability_balanced_ok",
      "value_conservation_ok",
      "packet_ok"
    ]
  effects: ["packet_ok"]

types: []

state_vars:
  - id: "attestation_mode"
    role: "data"
    type: { kind: "bool" }
  - id: "price_provenance_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "attestation_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "unique_pool_ids_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "all_positive_lp_supply_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "all_assets_priced_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "asset_conservation_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "lp_liability_balanced_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "value_conservation_ok"
    role: "data"
    type: { kind: "bool" }
  - id: "packet_ok"
    role: "data"
    type: { kind: "bool" }

init:
  - var: "attestation_mode"
    expr: { bool: false }
  - var: "price_provenance_ok"
    expr: { bool: false }
  - var: "attestation_ok"
    expr: { bool: true }
  - var: "unique_pool_ids_ok"
    expr: { bool: false }
  - var: "all_positive_lp_supply_ok"
    expr: { bool: false }
  - var: "all_assets_priced_ok"
    expr: { bool: false }
  - var: "asset_conservation_ok"
    expr: { bool: false }
  - var: "lp_liability_balanced_ok"
    expr: { bool: false }
  - var: "value_conservation_ok"
    expr: { bool: false }
  - var: "packet_ok"
    expr: { bool: false }

invariants:
  - id: "inv_packet_ok_formula"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "packet_ok" }
        - op: "and"
          args:
            - { var: "price_provenance_ok" }
            - op: "and"
              args:
                - { var: "unique_pool_ids_ok" }
                - op: "and"
                  args:
                    - { var: "all_positive_lp_supply_ok" }
                    - op: "and"
                      args:
                        - { var: "all_assets_priced_ok" }
                        - op: "and"
                          args:
                            - { var: "asset_conservation_ok" }
                            - op: "and"
                              args:
                                - { var: "lp_liability_balanced_ok" }
                                - op: "and"
                                  args:
                                    - { var: "value_conservation_ok" }
                                    - op: "or"
                                      args:
                                        - op: "not"
                                          args:
                                            - { var: "attestation_mode" }
                                        - { var: "attestation_ok" }

actions:
  - id: "rebuild_endogenous_lp_value_packet"
    params:
      - id: "attestation_mode_in"
        type: { kind: "bool" }
      - id: "price_provenance_ok_in"
        type: { kind: "bool" }
      - id: "attestation_ok_in"
        type: { kind: "bool" }
      - id: "unique_pool_ids_ok_in"
        type: { kind: "bool" }
      - id: "all_positive_lp_supply_ok_in"
        type: { kind: "bool" }
      - id: "all_assets_priced_ok_in"
        type: { kind: "bool" }
      - id: "asset_conservation_ok_in"
        type: { kind: "bool" }
      - id: "lp_liability_balanced_ok_in"
        type: { kind: "bool" }
      - id: "value_conservation_ok_in"
        type: { kind: "bool" }
    guard: { bool: true }
    updates:
      - var: "attestation_mode"
        expr: { param: "attestation_mode_in" }
      - var: "price_provenance_ok"
        expr: { param: "price_provenance_ok_in" }
      - var: "attestation_ok"
        expr: { param: "attestation_ok_in" }
      - var: "unique_pool_ids_ok"
        expr: { param: "unique_pool_ids_ok_in" }
      - var: "all_positive_lp_supply_ok"
        expr: { param: "all_positive_lp_supply_ok_in" }
      - var: "all_assets_priced_ok"
        expr: { param: "all_assets_priced_ok_in" }
      - var: "asset_conservation_ok"
        expr: { param: "asset_conservation_ok_in" }
      - var: "lp_liability_balanced_ok"
        expr: { param: "lp_liability_balanced_ok_in" }
      - var: "value_conservation_ok"
        expr: { param: "value_conservation_ok_in" }
      - var: "packet_ok"
        expr:
          op: "and"
          args:
            - { param: "price_provenance_ok_in" }
            - op: "and"
              args:
                - { param: "unique_pool_ids_ok_in" }
                - op: "and"
                  args:
                    - { param: "all_positive_lp_supply_ok_in" }
                    - op: "and"
                      args:
                        - { param: "all_assets_priced_ok_in" }
                        - op: "and"
                          args:
                            - { param: "asset_conservation_ok_in" }
                            - op: "and"
                              args:
                                - { param: "lp_liability_balanced_ok_in" }
                                - op: "and"
                                  args:
                                    - { param: "value_conservation_ok_in" }
                                    - op: "or"
                                      args:
                                        - op: "not"
                                          args:
                                            - { param: "attestation_mode_in" }
                                        - { param: "attestation_ok_in" }
    effects:
      packet_ok: { var: "packet_ok" }

checks:
  - id: "init_implies_inv"
    kind: "invariant"
  - id: "inductive_rebuild_endogenous_lp_value_packet"
    kind: "inductive"
