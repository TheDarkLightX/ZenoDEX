# [FORGE] Settlement Add-Liquidity Apply (proof-carrying witness) v1
ir_version: "esso-ir/v1"
meta:
  model_id: "settlement_add_liquidity_apply_witness_v1"
  created_by: "zenodex"
  notes: |
    Micro-kernel: apply a single ADD_LIQUIDITY fill against a live pool.

    Purpose:
      - Provide a small, verifiable "certificate-checking" primitive for settlement.
      - If the sender can pay the claimed used amounts, the LP mint matches the
        min-of-floors rule, and the pool pre-state witness matches, the step applies
        deterministically and preserves per-asset conservation plus LP supply accounting.

    Assume/guarantee split:
      - Assumes a separate ratio/binding witness already chose amount0_used and
        amount1_used from the user's desired amounts and minimums.
      - Guarantees the concrete reserve/LP post-state transition for those claimed
        used amounts and lp_minted.

    Non-goals:
      - ratio selection from desired amounts
      - amount0_min / amount1_min checks
      - recipient authorization or pool-id hashing

    Those remain outside this micro-kernel and should be checked by composition or
    shell-level deterministic guards.

observables:
  state_vars:
    [
      "pool_active",
      "sender_asset0",
      "sender_asset1",
      "recipient_lp",
      "lock_lp",
      "reserve0",
      "reserve1",
      "lp_supply",
      "total_asset0_const",
      "total_asset1_const",
    ]
  effects:
    [
      "amount0_used",
      "amount1_used",
      "lp_minted",
      "reserve0_after",
      "reserve1_after",
      "lp_supply_after",
      "lp_math_ok",
      "balance_delta_ok",
      "reserve_delta_ok",
      "lp_delta_ok",
    ]

types: []

state_vars:
  - id: "pool_active"
    role: "control"
    type: { kind: "int", min: 0, max: 1 }

  - id: "sender_asset0"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "sender_asset1"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "recipient_lp"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "lock_lp"
    role: "data"
    type: { kind: "int", min: 0, max: 1000 }

  - id: "reserve0_before"
    role: "data"
    type: { kind: "int", min: 1, max: 3000 }

  - id: "reserve0"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "reserve1_before"
    role: "data"
    type: { kind: "int", min: 1, max: 3000 }

  - id: "reserve1"
    role: "data"
    type: { kind: "int", min: 0, max: 3000 }

  - id: "lp_supply_before"
    role: "data"
    type: { kind: "int", min: 1, max: 4000 }

  - id: "lp_supply"
    role: "data"
    type: { kind: "int", min: 0, max: 4000 }

  - id: "total_asset0_const"
    role: "data"
    type: { kind: "int", min: 1, max: 6000 }

  - id: "total_asset1_const"
    role: "data"
    type: { kind: "int", min: 1, max: 6000 }

init:
  - var: "pool_active"
    expr: { const: 1 }
  - var: "sender_asset0"
    expr: { const: 1000 }
  - var: "sender_asset1"
    expr: { const: 1000 }
  - var: "recipient_lp"
    expr: { const: 2000 }
  - var: "lock_lp"
    expr: { const: 1000 }
  - var: "reserve0_before"
    expr: { const: 2000 }
  - var: "reserve0"
    expr: { const: 2000 }
  - var: "reserve1_before"
    expr: { const: 2000 }
  - var: "reserve1"
    expr: { const: 2000 }
  - var: "lp_supply_before"
    expr: { const: 3000 }
  - var: "lp_supply"
    expr: { const: 3000 }
  - var: "total_asset0_const"
    expr: { const: 3000 }
  - var: "total_asset1_const"
    expr: { const: 3000 }

invariants:
  - id: "inv_conserve_asset0"
    kind: "safety"
    expr:
      op: "="
      args:
        - op: "+"
          args: [{ var: "sender_asset0" }, { var: "reserve0" }]
        - { var: "total_asset0_const" }

  - id: "inv_conserve_asset1"
    kind: "safety"
    expr:
      op: "="
      args:
        - op: "+"
          args: [{ var: "sender_asset1" }, { var: "reserve1" }]
        - { var: "total_asset1_const" }

  - id: "inv_lp_supply_matches_distribution"
    kind: "safety"
    expr:
      op: "="
      args:
        - { var: "lp_supply" }
        - op: "+"
          args: [{ var: "recipient_lp" }, { var: "lock_lp" }]

  - id: "inv_active_pool_positive"
    kind: "safety"
    expr:
      op: "or"
      args:
        - { op: "=", args: [{ var: "pool_active" }, { const: 0 }] }
        - op: "and"
          args:
            - { op: ">", args: [{ var: "reserve0" }, { const: 0 }] }
            - { op: ">", args: [{ var: "reserve1" }, { const: 0 }] }
            - { op: ">", args: [{ var: "lp_supply" }, { const: 0 }] }
            - { op: "=", args: [{ var: "lock_lp" }, { const: 1000 }] }

actions:
  - id: "add_liquidity_apply"
    params:
      - id: "amount0_used"
        type: { kind: "int", min: 1, max: 1000 }
      - id: "amount1_used"
        type: { kind: "int", min: 1, max: 1000 }
      - id: "lp_minted"
        type: { kind: "int", min: 1, max: 1000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "pool_active" }, { const: 1 }] }
        - { op: ">=", args: [{ var: "sender_asset0" }, { param: "amount0_used" }] }
        - { op: ">=", args: [{ var: "sender_asset1" }, { param: "amount1_used" }] }
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "reserve0" }, { param: "amount0_used" }] },
              { const: 3000 }
            ]
          }
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "reserve1" }, { param: "amount1_used" }] },
              { const: 3000 }
            ]
          }
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "recipient_lp" }, { param: "lp_minted" }] },
              { const: 3000 }
            ]
          }
        - { op: "<=",
            args: [
              { op: "+", args: [{ var: "lp_supply" }, { param: "lp_minted" }] },
              { const: 4000 }
            ]
          }
        - { op: "<=",
            args: [
              { param: "lp_minted" },
              {
                op: "div",
                args: [
                  { op: "*", args: [{ param: "amount0_used" }, { var: "lp_supply" }] },
                  { var: "reserve0" }
                ]
              }
            ]
          }
        - { op: "<=",
            args: [
              { param: "lp_minted" },
              {
                op: "div",
                args: [
                  { op: "*", args: [{ param: "amount1_used" }, { var: "lp_supply" }] },
                  { var: "reserve1" }
                ]
              }
            ]
          }
        - {
            op: "or",
            args: [
              {
                op: "=",
                args: [
                  { param: "lp_minted" },
                  {
                    op: "div",
                    args: [
                      { op: "*", args: [{ param: "amount0_used" }, { var: "lp_supply" }] },
                      { var: "reserve0" }
                    ]
                  }
                ]
              },
              {
                op: "=",
                args: [
                  { param: "lp_minted" },
                  {
                    op: "div",
                    args: [
                      { op: "*", args: [{ param: "amount1_used" }, { var: "lp_supply" }] },
                      { var: "reserve1" }
                    ]
                  }
                ]
              }
            ]
          }
    updates:
      - var: "reserve0_before"
        expr: { var: "reserve0" }
      - var: "reserve1_before"
        expr: { var: "reserve1" }
      - var: "lp_supply_before"
        expr: { var: "lp_supply" }
      - var: "sender_asset0"
        expr:
          op: "-"
          args: [{ var: "sender_asset0" }, { param: "amount0_used" }]
      - var: "sender_asset1"
        expr:
          op: "-"
          args: [{ var: "sender_asset1" }, { param: "amount1_used" }]
      - var: "recipient_lp"
        expr:
          op: "+"
          args: [{ var: "recipient_lp" }, { param: "lp_minted" }]
      - var: "reserve0"
        expr:
          op: "+"
          args: [{ var: "reserve0" }, { param: "amount0_used" }]
      - var: "reserve1"
        expr:
          op: "+"
          args: [{ var: "reserve1" }, { param: "amount1_used" }]
      - var: "lp_supply"
        expr:
          op: "+"
          args: [{ var: "lp_supply" }, { param: "lp_minted" }]
    effects:
      amount0_used: { param: "amount0_used" }
      amount1_used: { param: "amount1_used" }
      lp_minted: { param: "lp_minted" }
      reserve0_after: { var: "reserve0" }
      reserve1_after: { var: "reserve1" }
      lp_supply_after: { var: "lp_supply" }
      lp_math_ok:
        op: "and"
        args:
          - { op: "<=",
              args: [
                { param: "lp_minted" },
                {
                  op: "div",
                  args: [
                    { op: "*", args: [{ param: "amount0_used" }, { var: "lp_supply_before" }] },
                    { var: "reserve0_before" }
                  ]
                }
              ]
            }
          - { op: "<=",
              args: [
                { param: "lp_minted" },
                {
                  op: "div",
                  args: [
                    { op: "*", args: [{ param: "amount1_used" }, { var: "lp_supply_before" }] },
                    { var: "reserve1_before" }
                  ]
                }
              ]
            }
          - {
              op: "or",
              args: [
                {
                  op: "=",
                  args: [
                    { param: "lp_minted" },
                    {
                      op: "div",
                      args: [
                        { op: "*", args: [{ param: "amount0_used" }, { var: "lp_supply_before" }] },
                        { var: "reserve0_before" }
                      ]
                    }
                  ]
                },
                {
                  op: "=",
                  args: [
                    { param: "lp_minted" },
                    {
                      op: "div",
                      args: [
                        { op: "*", args: [{ param: "amount1_used" }, { var: "lp_supply_before" }] },
                        { var: "reserve1_before" }
                      ]
                    }
                  ]
                }
              ]
            }
      balance_delta_ok: { const: 1 }
      reserve_delta_ok: { const: 1 }
      lp_delta_ok: { const: 1 }
