                            - { var: "pool_b" }
                      - { var: "lp_supply" }
                  - { var: "pool_a" }
              else:
                op: "div"
                args:
                  - op: "*"
                    args:
                      - op: "ite"
                        cond:
                          op: "<="
                          args:
                            - op: "div"
                              args:
                                - { op: "*", args: [{ param: "amount_a_desired" }, { var: "pool_b" }] }
                                - { var: "pool_a" }
                            - { param: "amount_b_desired" }
                        then:
                          op: "div"
                          args:
                            - { op: "*", args: [{ param: "amount_a_desired" }, { var: "pool_b" }] }
                            - { var: "pool_a" }
                        else: { param: "amount_b_desired" }
                      - { var: "lp_supply" }
                  - { var: "pool_b" }
    effects:
      event: { const: 4 }

  - id: "remove_liquidity"
    params:
      - id: "burner"
        type: { kind: "int", min: 0, max: 1 }
      - id: "recipient"
        type: { kind: "int", min: 0, max: 1 }
      - id: "lp_amount"
        type: { kind: "int", min: 1, max: 1000000000 }
      - id: "amount_a_min"
        type: { kind: "int", min: 0, max: 1000000000 }
      - id: "amount_b_min"
        type: { kind: "int", min: 0, max: 1000000000 }
    guard:
      op: "and"
      args:
        - { op: "=", args: [{ var: "pool_initialized" }, { const: 1 }] }
        - { op: ">", args: [{ var: "lp_supply" }, { const: 0 }] }
        - { op: "=", args: [{ var: "lock_lp" }, { const: 1000 }] }
        # Burner must own lp_amount.
        - op: ">="
          args:
            - op: "ite"
              cond: { op: "=", args: [{ param: "burner" }, { const: 0 }] }
              then: { var: "u0_lp" }
              else: { var: "u1_lp" }
            - { param: "lp_amount" }
        # Outputs meet mins.
        - op: ">="
          args:
            - op: "div"
              args:
                - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_a" }] }
                - { var: "lp_supply" }
            - { param: "amount_a_min" }
        - op: ">="
          args:
            - op: "div"
              args:
                - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_b" }] }
                - { var: "lp_supply" }
            - { param: "amount_b_min" }
        # Recipient post-balance bounds (assets A and B).
        - op: "<="
          args:
            - op: "+"
              args:
                - op: "ite"
                  cond: { op: "=", args: [{ param: "recipient" }, { const: 0 }] }
                  then: { var: "u0_a" }
                  else: { var: "u1_a" }
                - op: "div"
                  args:
                    - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_a" }] }
                    - { var: "lp_supply" }
            - { const: 3000000000 }
        - op: "<="
          args:
            - op: "+"
              args:
                - op: "ite"
                  cond: { op: "=", args: [{ param: "recipient" }, { const: 0 }] }
                  then: { var: "u0_b" }
                  else: { var: "u1_b" }
                - op: "div"
                  args:
                    - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_b" }] }
                    - { var: "lp_supply" }
            - { const: 3000000000 }
    updates:
      - var: "u0_lp"
        expr:
          op: "ite"
          cond: { op: "=", args: [{ param: "burner" }, { const: 0 }] }
          then: { op: "-", args: [{ var: "u0_lp" }, { param: "lp_amount" }] }
          else: { var: "u0_lp" }
      - var: "u1_lp"
        expr:
          op: "ite"
          cond: { op: "=", args: [{ param: "burner" }, { const: 1 }] }
          then: { op: "-", args: [{ var: "u1_lp" }, { param: "lp_amount" }] }
          else: { var: "u1_lp" }
      - var: "lp_supply"
        expr: { op: "-", args: [{ var: "lp_supply" }, { param: "lp_amount" }] }
      - var: "pool_a"
        expr:
          op: "-"
          args:
            - { var: "pool_a" }
            - op: "div"
              args:
                - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_a" }] }
                - { var: "lp_supply" }
      - var: "pool_b"
        expr:
          op: "-"
          args:
            - { var: "pool_b" }
            - op: "div"
              args:
                - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_b" }] }
                - { var: "lp_supply" }
      - var: "u0_a"
        expr:
          op: "ite"
          cond: { op: "=", args: [{ param: "recipient" }, { const: 0 }] }
          then:
            op: "+"
            args:
              - { var: "u0_a" }
              - op: "div"
                args:
                  - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_a" }] }
                  - { var: "lp_supply" }
          else: { var: "u0_a" }
      - var: "u1_a"
        expr:
          op: "ite"
          cond: { op: "=", args: [{ param: "recipient" }, { const: 1 }] }
          then:
            op: "+"
            args:
              - { var: "u1_a" }
              - op: "div"
                args:
                  - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_a" }] }
                  - { var: "lp_supply" }
          else: { var: "u1_a" }
      - var: "u0_b"
        expr:
          op: "ite"
          cond: { op: "=", args: [{ param: "recipient" }, { const: 0 }] }
          then:
            op: "+"
            args:
              - { var: "u0_b" }
              - op: "div"
                args:
                  - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_b" }] }
                  - { var: "lp_supply" }
          else: { var: "u0_b" }
      - var: "u1_b"
        expr:
          op: "ite"
          cond: { op: "=", args: [{ param: "recipient" }, { const: 1 }] }
          then:
            op: "+"
            args:
              - { var: "u1_b" }
              - op: "div"
                args:
                  - { op: "*", args: [{ param: "lp_amount" }, { var: "pool_b" }] }
                  - { var: "lp_supply" }
          else: { var: "u1_b" }
    effects:
      event: { const: 5 }
