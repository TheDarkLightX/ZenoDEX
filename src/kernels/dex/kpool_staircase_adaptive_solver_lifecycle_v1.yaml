ir_version: "esso-ir/v1"
meta:
  model_id: "kpool_staircase_adaptive_solver_lifecycle_v1"
  created_by: "zenodex"
  notes: |
    Boolean-level lifecycle shell for the experimental k-pool staircase
    exact-in split solver.

    Scope boundary:
    - models the adaptive control decisions around the solver
    - treats CPMM quote arithmetic, jump-point enumeration, DP folding, and
      brute-force parity as externally supplied booleans
    - records rejection precedence: invalid requests reject before solver
      selection; otherwise staircase is used only when all exactness/resource
      gates pass; exact fallback is the only admissible recovery path

observables:
  state_vars: []
  effects:
    [
      "request_ok",
      "staircase_path_ok",
      "fallback_path_ok",
      "reject_invalid_request",
      "reject_no_exact_path",
      "use_staircase",
      "use_fallback",
      "solver_accepts",
      "solver_rejects",
      "solver_outcome",
      "invalid_request_precedence_ok",
      "fallback_only_after_staircase_blocked",
      "exactness_preserved",
    ]

types:
  - id: "t_solver_outcome"
    type:
      kind: "enum"
      symbols:
        [
          "RejectInvalidRequest",
          "RejectNoExactPath",
          "UseStaircase",
          "UseFallback",
        ]

state_vars: []
init: []
invariants: []

actions:
  - id: "check_kpool_adaptive_solver_lifecycle"
    params:
      - id: "positive_amount"
        type: { kind: "bool" }
      - id: "positive_max_legs"
        type: { kind: "bool" }
      - id: "pools_nonempty"
        type: { kind: "bool" }
      - id: "pool_ids_unique"
        type: { kind: "bool" }
      - id: "breakpoints_sparse"
        type: { kind: "bool" }
      - id: "jump_enumeration_drift_free"
        type: { kind: "bool" }
      - id: "resource_bounds_ok"
        type: { kind: "bool" }
      - id: "staircase_witness_exact"
        type: { kind: "bool" }
      - id: "exact_fallback_available"
        type: { kind: "bool" }
      - id: "fallback_witness_exact"
        type: { kind: "bool" }
    guard: { bool: true }
    updates: []
    effects:
      request_ok:
        op: "and"
        args:
          - { param: "positive_amount" }
          - { param: "positive_max_legs" }
          - { param: "pools_nonempty" }
          - { param: "pool_ids_unique" }
      staircase_path_ok:
        op: "and"
        args:
          - { param: "positive_amount" }
          - { param: "positive_max_legs" }
          - { param: "pools_nonempty" }
          - { param: "pool_ids_unique" }
          - { param: "breakpoints_sparse" }
          - { param: "jump_enumeration_drift_free" }
          - { param: "resource_bounds_ok" }
          - { param: "staircase_witness_exact" }
      fallback_path_ok:
        op: "and"
        args:
          - { param: "positive_amount" }
          - { param: "positive_max_legs" }
          - { param: "pools_nonempty" }
          - { param: "pool_ids_unique" }
          - { param: "exact_fallback_available" }
          - { param: "fallback_witness_exact" }
      reject_invalid_request:
        op: "not"
        args:
          - op: "and"
            args:
              - { param: "positive_amount" }
              - { param: "positive_max_legs" }
              - { param: "pools_nonempty" }
              - { param: "pool_ids_unique" }
      use_staircase:
        op: "and"
        args:
          - { param: "positive_amount" }
          - { param: "positive_max_legs" }
          - { param: "pools_nonempty" }
          - { param: "pool_ids_unique" }
          - { param: "breakpoints_sparse" }
          - { param: "jump_enumeration_drift_free" }
          - { param: "resource_bounds_ok" }
          - { param: "staircase_witness_exact" }
      use_fallback:
        op: "and"
        args:
          - { param: "positive_amount" }
          - { param: "positive_max_legs" }
          - { param: "pools_nonempty" }
          - { param: "pool_ids_unique" }
          - op: "not"
            args:
              - op: "and"
                args:
                  - { param: "breakpoints_sparse" }
                  - { param: "jump_enumeration_drift_free" }
                  - { param: "resource_bounds_ok" }
                  - { param: "staircase_witness_exact" }
          - { param: "exact_fallback_available" }
          - { param: "fallback_witness_exact" }
      reject_no_exact_path:
        op: "and"
        args:
          - { param: "positive_amount" }
          - { param: "positive_max_legs" }
          - { param: "pools_nonempty" }
          - { param: "pool_ids_unique" }
          - op: "not"
            args:
              - op: "or"
                args:
                  - op: "and"
                    args:
                      - { param: "breakpoints_sparse" }
                      - { param: "jump_enumeration_drift_free" }
                      - { param: "resource_bounds_ok" }
                      - { param: "staircase_witness_exact" }
                  - op: "and"
                    args:
                      - { param: "exact_fallback_available" }
                      - { param: "fallback_witness_exact" }
      solver_accepts:
        op: "or"
        args:
          - op: "and"
            args:
              - { param: "positive_amount" }
              - { param: "positive_max_legs" }
              - { param: "pools_nonempty" }
              - { param: "pool_ids_unique" }
              - { param: "breakpoints_sparse" }
              - { param: "jump_enumeration_drift_free" }
              - { param: "resource_bounds_ok" }
              - { param: "staircase_witness_exact" }
          - op: "and"
            args:
              - { param: "positive_amount" }
              - { param: "positive_max_legs" }
              - { param: "pools_nonempty" }
              - { param: "pool_ids_unique" }
              - op: "not"
                args:
                  - op: "and"
                    args:
                      - { param: "breakpoints_sparse" }
                      - { param: "jump_enumeration_drift_free" }
                      - { param: "resource_bounds_ok" }
                      - { param: "staircase_witness_exact" }
              - { param: "exact_fallback_available" }
              - { param: "fallback_witness_exact" }
      solver_rejects:
        op: "not"
        args:
          - op: "or"
            args:
              - op: "and"
                args:
                  - { param: "positive_amount" }
                  - { param: "positive_max_legs" }
                  - { param: "pools_nonempty" }
                  - { param: "pool_ids_unique" }
                  - { param: "breakpoints_sparse" }
                  - { param: "jump_enumeration_drift_free" }
                  - { param: "resource_bounds_ok" }
                  - { param: "staircase_witness_exact" }
              - op: "and"
                args:
                  - { param: "positive_amount" }
                  - { param: "positive_max_legs" }
                  - { param: "pools_nonempty" }
                  - { param: "pool_ids_unique" }
                  - op: "not"
                    args:
                      - op: "and"
                        args:
                          - { param: "breakpoints_sparse" }
                          - { param: "jump_enumeration_drift_free" }
                          - { param: "resource_bounds_ok" }
                          - { param: "staircase_witness_exact" }
                  - { param: "exact_fallback_available" }
                  - { param: "fallback_witness_exact" }
      solver_outcome:
        op: "ite"
        cond:
          op: "not"
          args:
            - op: "and"
              args:
                - { param: "positive_amount" }
                - { param: "positive_max_legs" }
                - { param: "pools_nonempty" }
                - { param: "pool_ids_unique" }
        then: { enum: "RejectInvalidRequest" }
        else:
          op: "ite"
          cond:
            op: "and"
            args:
              - { param: "breakpoints_sparse" }
              - { param: "jump_enumeration_drift_free" }
              - { param: "resource_bounds_ok" }
              - { param: "staircase_witness_exact" }
          then: { enum: "UseStaircase" }
          else:
            op: "ite"
            cond:
              op: "and"
              args:
                - { param: "exact_fallback_available" }
                - { param: "fallback_witness_exact" }
            then: { enum: "UseFallback" }
            else: { enum: "RejectNoExactPath" }
      invalid_request_precedence_ok:
        op: "or"
        args:
          - op: "and"
            args:
              - { param: "positive_amount" }
              - { param: "positive_max_legs" }
              - { param: "pools_nonempty" }
              - { param: "pool_ids_unique" }
          - op: "not"
            args:
              - op: "or"
                args:
                  - op: "and"
                    args:
                      - { param: "positive_amount" }
                      - { param: "positive_max_legs" }
                      - { param: "pools_nonempty" }
                      - { param: "pool_ids_unique" }
                      - { param: "breakpoints_sparse" }
                      - { param: "jump_enumeration_drift_free" }
                      - { param: "resource_bounds_ok" }
                      - { param: "staircase_witness_exact" }
                  - op: "and"
                    args:
                      - { param: "positive_amount" }
                      - { param: "positive_max_legs" }
                      - { param: "pools_nonempty" }
                      - { param: "pool_ids_unique" }
                      - op: "not"
                        args:
                          - op: "and"
                            args:
                              - { param: "breakpoints_sparse" }
                              - { param: "jump_enumeration_drift_free" }
                              - { param: "resource_bounds_ok" }
                              - { param: "staircase_witness_exact" }
                      - { param: "exact_fallback_available" }
                      - { param: "fallback_witness_exact" }
      fallback_only_after_staircase_blocked:
        op: "or"
        args:
          - op: "not"
            args:
              - op: "and"
                args:
                  - { param: "positive_amount" }
                  - { param: "positive_max_legs" }
                  - { param: "pools_nonempty" }
                  - { param: "pool_ids_unique" }
                  - op: "not"
                    args:
                      - op: "and"
                        args:
                          - { param: "breakpoints_sparse" }
                          - { param: "jump_enumeration_drift_free" }
                          - { param: "resource_bounds_ok" }
                          - { param: "staircase_witness_exact" }
                  - { param: "exact_fallback_available" }
                  - { param: "fallback_witness_exact" }
          - op: "not"
            args:
              - op: "and"
                args:
                  - { param: "breakpoints_sparse" }
                  - { param: "jump_enumeration_drift_free" }
                  - { param: "resource_bounds_ok" }
                  - { param: "staircase_witness_exact" }
      exactness_preserved:
        op: "or"
        args:
          - op: "and"
            args:
              - { param: "positive_amount" }
              - { param: "positive_max_legs" }
              - { param: "pools_nonempty" }
              - { param: "pool_ids_unique" }
              - { param: "breakpoints_sparse" }
              - { param: "jump_enumeration_drift_free" }
              - { param: "resource_bounds_ok" }
              - { param: "staircase_witness_exact" }
          - op: "and"
            args:
              - { param: "positive_amount" }
              - { param: "positive_max_legs" }
              - { param: "pools_nonempty" }
              - { param: "pool_ids_unique" }
              - op: "not"
                args:
                  - op: "and"
                    args:
                      - { param: "breakpoints_sparse" }
                      - { param: "jump_enumeration_drift_free" }
                      - { param: "resource_bounds_ok" }
                      - { param: "staircase_witness_exact" }
              - { param: "exact_fallback_available" }
              - { param: "fallback_witness_exact" }
          - op: "not"
            args:
              - op: "or"
                args:
                  - op: "and"
                    args:
                      - { param: "positive_amount" }
                      - { param: "positive_max_legs" }
                      - { param: "pools_nonempty" }
                      - { param: "pool_ids_unique" }
                      - { param: "breakpoints_sparse" }
                      - { param: "jump_enumeration_drift_free" }
                      - { param: "resource_bounds_ok" }
                      - { param: "staircase_witness_exact" }
                  - op: "and"
                    args:
                      - { param: "positive_amount" }
                      - { param: "positive_max_legs" }
                      - { param: "pools_nonempty" }
                      - { param: "pool_ids_unique" }
                      - op: "not"
                        args:
                          - op: "and"
                            args:
                              - { param: "breakpoints_sparse" }
                              - { param: "jump_enumeration_drift_free" }
                              - { param: "resource_bounds_ok" }
                              - { param: "staircase_witness_exact" }
                      - { param: "exact_fallback_available" }
                      - { param: "fallback_witness_exact" }
