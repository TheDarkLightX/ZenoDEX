actions:
- id: enable_lane
  description: Enable a lane whose fragment producer is receipt-backed; the lane state root and header
    must be bound.
  params:
  - &id001
    id: lane
    type:
      ref: Lane
  - id: receipt_backed
    type:
      kind: bool
  - &id002
    id: lane_root_bound
    type:
      kind: bool
  - &id003
    id: header_bound
    type:
      kind: bool
  guard:
    op: and
    args:
    - param: receipt_backed
    - &id004
      param: lane_root_bound
    - &id005
      param: header_bound
  updates:
  - var: enabled_l0
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: lane
        - enum: L0
      then:
        bool: true
      else:
        var: enabled_l0
  - var: enabled_l1
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: lane
        - enum: L1
      then:
        bool: true
      else:
        var: enabled_l1
  - var: receipt_backed_l0
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: lane
        - enum: L0
      then:
        param: receipt_backed
      else:
        var: receipt_backed_l0
  - var: receipt_backed_l1
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: lane
        - enum: L1
      then:
        param: receipt_backed
      else:
        var: receipt_backed_l1
  - var: g_lane_root_bound
    expr:
      param: lane_root_bound
  - var: g_header_bound
    expr:
      param: header_bound
  - var: g_decision
    expr:
      enum: LANE_ENABLED
  effects:
    accepted:
      bool: true
    decision:
      var: g_decision
- id: open_entitlement
  description: A lane classifies newly controlled atoms as a claimant entitlement; the global liability
    and custody tables move with it.
  params:
  - *id001
  - &id007
    id: claimant
    type:
      ref: Claimant
  - &id006
    id: amount
    type:
      kind: int
      min: 1
      max: 2
  - *id002
  - *id003
  guard:
    op: and
    args:
    - *id004
    - *id005
    - op: ite
      cond:
        op: '='
        args:
        - param: lane
        - enum: L0
      then:
        var: enabled_l0
      else:
        var: enabled_l1
    - op: <=
      args:
      - op: +
        args:
        - op: ite
          cond:
            op: '='
            args:
            - param: lane
            - enum: L0
          then:
            var: controlled_l0
          else:
            var: controlled_l1
        - param: amount
      - const: 8
    - op: <=
      args:
      - op: +
        args:
        - op: ite
          cond:
            op: and
            args:
            - op: '='
              args:
              - param: claimant
              - enum: ALICE
            - op: '='
              args:
              - param: lane
              - enum: L0
          then:
            var: ent_alice_l0
          else:
            op: ite
            cond:
              op: and
              args:
              - op: '='
                args:
                - param: claimant
                - enum: ALICE
              - op: '='
                args:
                - param: lane
                - enum: L1
            then:
              var: ent_alice_l1
            else:
              op: ite
              cond:
                op: and
                args:
                - op: '='
                  args:
                  - param: claimant
                  - enum: BOB
                - op: '='
                  args:
                  - param: lane
                  - enum: L0
              then:
                var: ent_bob_l0
              else:
                var: ent_bob_l1
        - param: amount
      - const: 8
    - op: <=
      args:
      - op: +
        args:
        - var: custody
        - param: amount
      - const: 8
    - op: <=
      args:
      - op: +
        args:
        - op: ite
          cond:
            op: '='
            args:
            - param: claimant
            - enum: ALICE
          then:
            var: liability_alice
          else:
            var: liability_bob
        - param: amount
      - const: 8
  updates:
  - var: controlled_l0
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: lane
        - enum: L0
      then:
        op: +
        args:
        - var: controlled_l0
        - param: amount
      else:
        var: controlled_l0
  - var: controlled_l1
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: lane
        - enum: L1
      then:
        op: +
        args:
        - var: controlled_l1
        - param: amount
      else:
        var: controlled_l1
  - var: ent_alice_l0
    expr:
      op: ite
      cond:
        op: and
        args:
        - op: '='
          args:
          - param: claimant
          - enum: ALICE
        - op: '='
          args:
          - param: lane
          - enum: L0
      then:
        op: +
        args:
        - var: ent_alice_l0
        - param: amount
      else:
        var: ent_alice_l0
  - var: ent_alice_l1
    expr:
      op: ite
      cond:
        op: and
        args:
        - op: '='
          args:
          - param: claimant
          - enum: ALICE
        - op: '='
          args:
          - param: lane
          - enum: L1
      then:
        op: +
        args:
        - var: ent_alice_l1
        - param: amount
      else:
        var: ent_alice_l1
  - var: ent_bob_l0
    expr:
      op: ite
      cond:
        op: and
        args:
        - op: '='
          args:
          - param: claimant
          - enum: BOB
        - op: '='
          args:
          - param: lane
          - enum: L0
      then:
        op: +
        args:
        - var: ent_bob_l0
        - param: amount
      else:
        var: ent_bob_l0
  - var: ent_bob_l1
    expr:
      op: ite
      cond:
        op: and
        args:
        - op: '='
          args:
          - param: claimant
          - enum: BOB
        - op: '='
          args:
          - param: lane
          - enum: L1
      then:
        op: +
        args:
        - var: ent_bob_l1
        - param: amount
      else:
        var: ent_bob_l1
  - var: liability_alice
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: claimant
        - enum: ALICE
      then:
        op: +
        args:
        - var: liability_alice
        - param: amount
      else:
        var: liability_alice
  - var: liability_bob
    expr:
      op: ite
      cond:
        op: '='
        args:
        - param: claimant
        - enum: BOB
      then:
        op: +
        args:
        - var: liability_bob
        - param: amount
      else:
        var: liability_bob
  - var: custody
    expr:
      op: +
      args:
      - var: custody
      - param: amount
  - var: g_lane_root_bound
    expr:
      param: lane_root_bound
  - var: g_header_bound
    expr:
      param: header_bound
  - var: g_decision
    expr:
      enum: ENTITLED
  effects:
    accepted:
      bool: true
    decision:
      var: g_decision
- id: deposit_reserve
  description: A lane classifies newly controlled atoms as an unencumbered reserve with no claimant.
  params:
