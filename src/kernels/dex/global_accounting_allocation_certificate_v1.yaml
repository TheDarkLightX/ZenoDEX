  - enabled_l0
  - receipt_backed_l0
  - controlled_l1
  - reserve_l1
  - external_l1
  - ent_alice_l1
  - ent_bob_l1
  - term_alice_l1
  - term_bob_l1
  - enabled_l1
  - receipt_backed_l1
  - custody
  - liability_alice
  - liability_bob
  - reserves
  - external
  - open_alice
  - open_bob
  - g_decision
  - g_lane_root_bound
  - g_header_bound
  effects:
  - accepted
  - decision
