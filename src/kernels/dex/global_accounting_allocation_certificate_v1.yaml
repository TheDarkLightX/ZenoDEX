# Bounded target contract for the GlobalAccountingAllocationCertificateV1 sidecar checker.
ir_version: esso-ir/v1
meta:
  model_id: global_accounting_allocation_certificate_v1
  created_by: zenodex
  seed: 0
  notes: 'Research-only finite model of GlobalAccountingAllocationCertificateV1, the

    state-keyed sidecar over the control-domain vocabulary. The domain has one

    asset, one control domain, two lanes (L0, L1), two claimants, and at most

    eight atoms per cell; the twelve running lanes and the unbounded vocabulary are

    outside the model.


    Each lane fragment classifies the atoms it controls exactly once into

    claimant entitlements, an unencumbered reserve with no claimant, and pending

    registered external obligations (inv_lane_partition_exact), and binds its

    open terminal claims to same-lane entitlements (inv_terminal_bound_by_entitlement).

    The lane rows sum to the global tables (inv_lane_rows_equal_tables) and the

    lane aggregates equal global custody (inv_lane_aggregate_equals_custody). An

    enabled lane needs a receipt-backed producer and a disabled lane is

    registered-empty (inv_producer_gate); every accepted transition implies the

    lane state root and header bindings (inv_accept_requires_lane_binding). The

    normative partition controlled = claimant_entitlements +

    named_unencumbered_reserves + pending_registered_external_obligations and

    same-domain backing are proved as inductive consequences

    (inv_normative_partition, inv_same_domain_backed).


    A reserve never stands in for a missing claimant entitlement: the named mutant

    reserve_masks_entitlement routes an entitlement''s atoms into the reserve while

    the liability table still grows and breaks the row equality. The Boolean

    parameters of every action are adversarial abstract premises established by

    an opaque verifier; a caller-provided true Boolean would not be authority.


    This model is a bounded target contract. It does not prove finite-width

    arithmetic, canonical bytes, roots, current V1 runtime refinement, private

    lane projections, verifier correctness, receipt validity, mounting, liveness,

    production, settlement authority, or whole-value-movement safety. No lane

    producer is receipt-backed in the running code, so the only certificate it

    accepts today is the registered-empty one; enable_lane models the future

    receipt-backed producers, not a present capability.

    '
