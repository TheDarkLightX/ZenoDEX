# [FORGE] zUSD Mint Borrow Fee v1
ir_version: "esso-ir/v1"
meta:
  model_id: "zusd_mint_borrow_fee_v1"
  created_by: "zenodex"
  notes: |
    Micro-kernel: single-vault mint arithmetic, fee schedule, and apply witness.

    Purpose:
      - Make the selected-vault mint path explicit: effective borrow fee schedule,
        ceil fee arithmetic, debt/free-debt deltas, post-MCR check, and base-rate update.
      - Keep the witness small enough to reuse from the multi-vault wrapper after a
        separate selector chooses the target vault and the risky-ops gate already passed.

    Assume/guarantee split:
      - Assumes risky-op gating (oracle freshness / pending-match / recovery mode) passed.
      - Assumes the target vault has already been selected in multi-vault flows.
      - Guarantees only the local fee schedule, exact mint/debt deltas, per-vault / global
        capacity bounds, post-MCR check, and base-rate transition.

    Non-goals:
      - oracle_report / oracle_commit policy
      - multi-vault target selection
      - protocol revenue accumulator update

observables:
  state_vars:
    [
      "now_epoch",
      "price_e8",
      "collateral_e8",
      "debt_e8",
      "free_debt_e8",
      "max_debt_e8",
      "max_debt_supply_e8",
      "mcr_bps",
      "min_debt_open_e8",
      "base_rate_bps",
      "base_rate_last_epoch",
      "base_rate_decay_per_epoch_bps",
      "base_rate_borrow_bump_bps",
      "borrow_fee_floor_bps",
      "borrow_fee_max_bps",
    ]
  effects:
    [
      "base_rate_after_bps",
      "base_rate_last_epoch_after",
      "debt_after_e8",
      "debt_delta_e8",
      "decayed_base_rate_bps",
      "free_debt_after_e8",
      "mcr_post_ok",
      "mint_fee_bps",
      "mint_fee_e8",
      "principal_e8",
    ]

types: []

