ir_version: "esso-ir/v1"
meta:
  model_id: "nonce_batch_sequencing_v1"
  created_by: "zenodex"
  notes: |
    Inductive safety model of the per-sender strict-sequential nonce policy
    enforced by the LIVE spot-DEX replay authority
    src/state/nonces.py::validate_and_apply_intent_nonce_batch
    (wired at src/integration/dex_engine.py:132 with require_all_nonces=True, and
    src/integration/autotrader_live.py:2628).

    SCOPE / ABSTRACTION (read this — it bounds what is proven):
    The live validator, for each sender, accepts a batch iff the sorted nonces are
    exactly the contiguous successor range {last+1, .., last+k}, then sets
    last := last+k; any rejection returns None (a no-op on the table). This model
    proves the SAFETY of the per-sender nonce STATE MACHINE that the validator
    drives. It does NOT model the multi-sender batch wrapper (cross-sender
    atomicity, order-independence, in-batch duplicate detection) or the input
    range-equality CHECK itself — those are the wrapper's refinement obligation,
    pinned by tests/runtime/test_nonces_batch_binding.py (incl. the multi-sender
    wrapper law: batch == per-sender sorted fold of the single-transition core).
    Here:
      - accept_one(n):   n == last+1                 -> last += 1,  count += 1
      - accept_range(k): a pre-validated size-k run  -> last += k,  count += k
        (models the validator's `set_last(sender, last+k)` advance; the range
         CONTIGUITY check sorted==[last+1..last+k] is the wrapper's, test-pinned)
      - reject_stale(n): 1 <= n <= last              -> no-op (duplicate / stale)
      - reject_gap(n):   n >= last+2                 -> no-op (non-contiguous)

    PROVEN inductive invariants (z3 + cvc5, verify-multi):
      inv_contiguous:    last_nonce == accepted_count
        The accepted nonce stream is a GAPLESS PREFIX 1..count. Combined with the
        accept guard (n == last+1) this is exactly anti-replay + strict-sequential
        + no-gap + no-double-apply: any nonce m with 1 <= m <= last has
        m != last+1, so it is rejected (reject_stale), and an accepted nonce is
        always exactly last+1, so last advances by precisely the number accepted.
      inv_monotone_step: last_nonce >= prev_last
        last never rolls back across a step, including on reject (reject-is-no-op
        leaves last unchanged; accepts only increase it).

    NON-VACUITY: accept_one(n=1) and accept_range are reachable from init
    (last=0), so last/count grow and the equality invariant is a genuine
    constraint on the dynamics (not vacuously true). See the companion witness
    note in the registry entry for nonces.
observables:
  state_vars: ["last_nonce", "accepted_count", "prev_last"]
  effects: ["event"]
types:
  - id: "t_event"
    type:
      kind: "enum"
      symbols: ["AcceptOne", "AcceptRange", "RejectStale", "RejectGap"]
state_vars:
  # Last accepted nonce for the sender (0 = none accepted yet). Mirrors
  # NonceTable.get_last(sender) and the validator's per-sender `last`.
  - id: "last_nonce"
    role: "data"
    type: { kind: "int", min: 0, max: 4294967295 }
  # Ghost: number of nonces accepted so far for the sender. Used to state the
  # gapless-prefix invariant; the live table does not carry it.
  - id: "accepted_count"
    role: "data"
    type: { kind: "int", min: 0, max: 4294967295 }
  # Ghost: last_nonce before the current step, for per-step monotonicity.
  - id: "prev_last"
    role: "data"
    type: { kind: "int", min: 0, max: 4294967295 }
init:
  - var: "last_nonce"
    expr: { const: 0 }
  - var: "accepted_count"
    expr: { const: 0 }
  - var: "prev_last"
    expr: { const: 0 }
invariants:
  - id: "inv_contiguous"
    kind: "safety"
    expr:
      op: "="
      args: [{ var: "last_nonce" }, { var: "accepted_count" }]
  - id: "inv_monotone_step"
    kind: "safety"
    expr:
      op: ">="
      args: [{ var: "last_nonce" }, { var: "prev_last" }]
actions:
  # ---- accept a single strict-successor nonce ----
  - id: "accept_one"
    params:
      - id: "n"
        type: { kind: "int", min: 1, max: 4294967295 }
    guard:
      op: "="
      args:
        - { param: "n" }
        - op: "+"
          args: [{ var: "last_nonce" }, { const: 1 }]
    updates:
      - var: "prev_last"
        expr: { var: "last_nonce" }
      - var: "last_nonce"
        expr: { param: "n" }
      - var: "accepted_count"
        expr:
          op: "+"
          args: [{ var: "accepted_count" }, { const: 1 }]
    effects:
      event: { enum: "AcceptOne" }

  # ---- accept a pre-validated contiguous run of size k (the batch advance) ----
  # Models `updated.set_last(sender, last+k)` after the wrapper has checked
  # sorted(nonces) == [last+1 .. last+k]. The advance preserves the gapless-prefix
  # invariant for any k; the contiguity CHECK is the wrapper's (test-pinned).
  - id: "accept_range"
    params:
      - id: "k"
        type: { kind: "int", min: 1, max: 1000000 }
    guard:
      op: "<="
      args:
        - op: "+"
          args: [{ var: "last_nonce" }, { param: "k" }]
        - { const: 4294967295 }
    updates:
      - var: "prev_last"
        expr: { var: "last_nonce" }
      - var: "last_nonce"
        expr:
          op: "+"
          args: [{ var: "last_nonce" }, { param: "k" }]
      - var: "accepted_count"
        expr:
          op: "+"
          args: [{ var: "accepted_count" }, { param: "k" }]
    effects:
      event: { enum: "AcceptRange" }

  # ---- reject a stale / duplicate nonce (<= last): no-op ----
  - id: "reject_stale"
    params:
      - id: "n"
        type: { kind: "int", min: 1, max: 4294967295 }
    guard:
      op: "and"
      args:
        - { op: ">=", args: [{ param: "n" }, { const: 1 }] }
        - { op: "<=", args: [{ param: "n" }, { var: "last_nonce" }] }
    updates:
      - var: "prev_last"
        expr: { var: "last_nonce" }
    effects:
      event: { enum: "RejectStale" }

  # ---- reject a non-contiguous (gap) nonce (>= last+2): no-op ----
  - id: "reject_gap"
    params:
      - id: "n"
        type: { kind: "int", min: 1, max: 4294967295 }
    guard:
      op: ">="
      args:
        - { param: "n" }
        - op: "+"
          args: [{ var: "last_nonce" }, { const: 2 }]
    updates:
      - var: "prev_last"
        expr: { var: "last_nonce" }
    effects:
      event: { enum: "RejectGap" }
