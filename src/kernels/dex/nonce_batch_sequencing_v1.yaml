ir_version: "esso-ir/v1"
meta:
  model_id: "nonce_batch_sequencing_v1"
  created_by: "zenodex"
  notes: |
    Inductive safety model of the per-sender SINGLE-TRANSITION strict-sequential
    nonce policy that the live spot-DEX replay authority
    src/state/nonces.py::validate_and_apply_intent_nonce_batch applies to each
    nonce, in sorted order, within a sender's batch (wired at
    src/integration/dex_engine.py:132, require_all_nonces=True, and
    src/integration/autotrader_live.py:2628).

    SCOPE (read this — it bounds what is proven, and why earlier peer review
    rejected an over-broad version):
    This proves the SINGLE-TRANSITION policy only. The live validator, per sender,
    sorts the batch and accepts iff it is the exact contiguous run
    {last+1 .. last+k}; that is equivalent to FOLDING the single-transition accept
    over the sorted nonces. This model proves the safety of that single step:
      - accept_one(n):   guard n == last+1  -> last := n (= last+1), count += 1
      - reject_stale(n): guard 1 <= n <= last      -> no-op (duplicate / stale)
      - reject_gap(n):   guard n >= last+2         -> no-op (non-contiguous)
    It deliberately does NOT model the batch as a single fat transition: an earlier
    accept_range(k) that incremented last and count together was a TAUTOLOGY
    (last==count preserved as L+k==C+k regardless of contiguity) and was removed.
    The batch == sorted-iterate-of-accept_one equivalence, plus cross-sender
    atomicity / order-independence / in-batch dedup, are pinned (by test) in
    tests/runtime/test_nonces_batch_binding.py (incl. the multi-sender wrapper law:
    batch == per-sender sorted fold of THIS single-transition core). So this ESSO
    model is the per-element core; the test suite is the batch refinement.

    PROVEN inductive invariants (z3 + cvc5, verify-multi):
      inv_contiguous:    last_nonce == accepted_count
        NON-TAUTOLOGICAL here: it is preserved ONLY because accept_one's guard is
        the strict successor n == last+1 (so last advances by exactly 1, matching
        count's +1). Under a looser accept (e.g. any n > last) it would BREAK — a
        gap-accept from last=2 to n=5 gives last=5, count=3. Hence last==count is
        exactly "the accepted nonces are a gapless prefix 1..count" => anti-replay
        (any m <= last has m != last+1 -> rejected) + strict-sequential + no-gap +
        no-double-apply. See the discrimination ("teeth") witness in
        tests/runtime/test_nonce_esso_model.py.
      inv_monotone_step: last_nonce >= prev_last
        last never rolls back across a step, including on reject (reject-is-no-op).

    NON-VACUITY: accept_one(n=1) is reachable from init (last=0), so last/count
    grow and the equality is a genuine constraint on the dynamics.
observables:
  state_vars: ["last_nonce", "accepted_count", "prev_last"]
  effects: ["event"]
types:
  - id: "t_event"
    type:
      kind: "enum"
      symbols: ["AcceptOne", "RejectStale", "RejectGap"]
state_vars:
  # Last accepted nonce for the sender (0 = none accepted yet). Mirrors
  # NonceTable.get_last(sender) and the validator's per-sender `last`.
  - id: "last_nonce"
    role: "data"
    type: { kind: "int", min: 0, max: 4294967295 }
  # Ghost: number of nonces accepted so far for the sender (not on the live table).
  # Honest ghost: incremented by exactly 1 ONLY when a strict-successor is accepted,
  # so it is NOT pre-tied to last_nonce (that is what makes inv_contiguous have
  # content rather than baking in the conclusion).
  - id: "accepted_count"
    role: "data"
    type: { kind: "int", min: 0, max: 4294967295 }
  # Ghost: last_nonce before the current step, for per-step monotonicity.
  - id: "prev_last"
    role: "data"
    type: { kind: "int", min: 0, max: 4294967295 }
init:
  - var: "last_nonce"
    expr: { const: 0 }
  - var: "accepted_count"
    expr: { const: 0 }
  - var: "prev_last"
    expr: { const: 0 }
invariants:
  - id: "inv_contiguous"
    kind: "safety"
    expr:
      op: "="
      args: [{ var: "last_nonce" }, { var: "accepted_count" }]
  - id: "inv_monotone_step"
    kind: "safety"
    expr:
      op: ">="
      args: [{ var: "last_nonce" }, { var: "prev_last" }]
actions:
  # ---- accept a single strict-successor nonce (n == last+1) ----
  # The guard is the entire policy: only the immediate successor advances the
  # state. This is what makes inv_contiguous meaningful (a gap/replay cannot fire
  # this action).
  - id: "accept_one"
    params:
      - id: "n"
        type: { kind: "int", min: 1, max: 4294967295 }
    guard:
      op: "="
      args:
        - { param: "n" }
        - op: "+"
          args: [{ var: "last_nonce" }, { const: 1 }]
    updates:
      - var: "prev_last"
        expr: { var: "last_nonce" }
      - var: "last_nonce"
        expr: { param: "n" }
      - var: "accepted_count"
        expr:
          op: "+"
          args: [{ var: "accepted_count" }, { const: 1 }]
    effects:
      event: { enum: "AcceptOne" }

  # ---- reject a stale / duplicate nonce (1 <= n <= last): no-op ----
  - id: "reject_stale"
    params:
      - id: "n"
        type: { kind: "int", min: 1, max: 4294967295 }
    guard:
      op: "and"
      args:
        - { op: ">=", args: [{ param: "n" }, { const: 1 }] }
        - { op: "<=", args: [{ param: "n" }, { var: "last_nonce" }] }
    updates:
      - var: "prev_last"
        expr: { var: "last_nonce" }
    effects:
      event: { enum: "RejectStale" }

  # ---- reject a non-contiguous (gap) nonce (n >= last+2): no-op ----
  - id: "reject_gap"
    params:
      - id: "n"
        type: { kind: "int", min: 1, max: 4294967295 }
    guard:
      op: ">="
      args:
        - { param: "n" }
        - op: "+"
          args: [{ var: "last_nonce" }, { const: 2 }]
    updates:
      - var: "prev_last"
        expr: { var: "last_nonce" }
    effects:
      event: { enum: "RejectGap" }
