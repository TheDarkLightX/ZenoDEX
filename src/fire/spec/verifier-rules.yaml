schema: zenodex/fire-verifier-rules/v1

theorem:
  name: settlement_admissibility
  statement: "FIREVAccept(O, I, Gamma, w, C) -> SettlementSafe(O, I, w, C)"
  standard_reading: >
    If FIRE-V accepts the canonical object template, instance, certificate,
    witness bundle, and collateral table, settlement is mechanically safe.
  practical_consequence: >
    Compiler, Refiner/ORE, UI, and docs remain non-authoritative. Only the
    fail-closed verifier and kernel path may authorize settlement deltas, and
    the runtime receipt must bind object_hash, instance_hash, cert_sha256,
    witness_hash, and delta_hash.
  premises:
    - SchemaOK
    - HashBindOK
    - ParamOK
    - CertOK
    - WitnessOK
    - AuthorizationOK
    - NonceOK
    - MaturityOK
    - WindowOK
    - BoundOK
    - CollateralOK
    - IntegerEvalOK
    - DeltaConservationOK
    - ReplayOK
  conclusion:
    - SettlementSafe

required_checks:
  - SchemaOK
  - HashBindOK
  - ParamOK
  - CertOK
  - WitnessOK
  - AuthorizationOK
  - NonceOK
  - MaturityOK
  - WindowOK
  - BoundOK
  - CollateralOK
  - IntegerEvalOK
  - DeltaConservationOK
  - ReplayOK

evidence_lattice:
  levels:
    - proved
    - contract
    - implemented
    - tested_discovery
    - hypothesis
  meet_rule: weakest_required_claim
  derived_rule_ids:
    - evidence_meet

artifact_rules:
  - hash_bind_object
  - hash_bind_instance
  - dependency_closed

unit_rules:
  - unit_add
  - unit_sub
  - unit_mul
  - unit_div
  - unit_log_dimensionless
  - unit_exp_dimensionless

interval_rules:
  - exact_param
  - source_bound
  - interval_const
  - interval_add
  - interval_sub
  - interval_mul
  - interval_min
  - interval_max
  - interval_nonnegative_scalar_mul
  - interval_positive_part
  - interval_cap
  - interval_clamp
  - interval_finite_sum

bound_rules:
  - witness_bound_intro

collateral_rules:
  - collateral_one_sided_writer
  - collateral_two_party

delta_rules:
  - delta_conservation_cash
  - delta_conservation_with_sinks

replay_rules:
  - replay_determinism

rounding_rules:
  - fixed_point_rounding_bound

settlement_rules:
  - settlement_authority_receipt_binding
  - settlement_admissibility

rule_catalog:
  artifact:
    - id: hash_bind_object
      purpose: bind canonical object template bytes to object_hash
      establishes:
        - predicate: ObjectHashBindOK
          input_predicates: []
      reject_if:
        - hash_mismatch
        - unsupported_fmos_version
        - noncanonical_encoding
    - id: hash_bind_instance
      purpose: bind canonical instance bytes to instance_hash and object_hash
      establishes:
        - predicate: InstanceHashBindOK
          input_predicates:
            - ObjectHashBindOK
        - predicate: ParamOK
          input_predicates:
            - InstanceHashBindOK
        - predicate: AuthorizationOK
          input_predicates:
            - InstanceHashBindOK
        - predicate: NonceOK
          input_predicates:
            - InstanceHashBindOK
        - predicate: MaturityOK
          input_predicates:
            - InstanceHashBindOK
        - predicate: WindowOK
          input_predicates:
            - InstanceHashBindOK
      reject_if:
        - hash_mismatch
        - object_hash_mismatch
        - noncanonical_encoding
    - id: dependency_closed
      purpose: require hash-pinned dependency closure for published bundles
      establishes:
        - predicate: DependencyClosed
          input_predicates: []
      reject_if:
        - floating_version
        - missing_dependency_hash
        - dependency_hash_mismatch
  unit:
    - id: unit_add
      establishes:
        - predicate: UnitOK
          input_predicates: []
    - id: unit_sub
      establishes:
        - predicate: UnitOK
          input_predicates: []
    - id: unit_mul
      establishes:
        - predicate: UnitOK
          input_predicates: []
    - id: unit_div
      establishes:
        - predicate: UnitOK
          input_predicates: []
    - id: unit_log_dimensionless
      establishes:
        - predicate: UnitOK
          input_predicates: []
    - id: unit_exp_dimensionless
      establishes:
        - predicate: UnitOK
          input_predicates: []
  interval:
    - id: exact_param
      purpose: bind an exact runtime parameter value into an interval proof leaf
      establishes:
        - predicate: BoundLeafExactParam
          input_predicates: []
    - id: source_bound
      purpose: bind an imported witness/source interval into an interval proof leaf
      establishes:
        - predicate: BoundLeafSourceBound
          input_predicates: []
    - id: interval_const
      establishes:
        - predicate: BoundLeafConst
          input_predicates: []
    - id: interval_add
      establishes:
        - predicate: BoundExpr
    - id: interval_sub
      establishes:
        - predicate: BoundExpr
    - id: interval_mul
      establishes:
        - predicate: BoundExpr
    - id: interval_min
      establishes:
        - predicate: BoundExpr
    - id: interval_max
      establishes:
        - predicate: BoundExpr
    - id: interval_nonnegative_scalar_mul
      establishes:
        - predicate: BoundExpr
    - id: interval_positive_part
      establishes:
        - predicate: BoundExpr
    - id: interval_cap
      establishes:
        - predicate: BoundExpr
    - id: interval_clamp
      establishes:
        - predicate: BoundExpr
    - id: interval_finite_sum
      establishes:
        - predicate: BoundExpr
  bound:
    - id: witness_bound_intro
      purpose: derive BoundOK from admissible witnesses and interval obligations
      establishes:
        - predicate: BoundOK
          input_predicates:
            - BoundExpr
        - predicate: WitnessOK
          input_predicates: []
  collateral:
    - id: collateral_one_sided_writer
      establishes:
        - predicate: CollateralOK
          input_predicates:
            - BoundOK
    - id: collateral_two_party
      establishes:
        - predicate: CollateralOK
          input_predicates:
            - BoundOK
  delta:
    - id: delta_conservation_cash
      establishes:
        - predicate: DeltaConservationOK
    - id: delta_conservation_with_sinks
      establishes:
        - predicate: DeltaConservationOK
  replay:
    - id: replay_determinism
      establishes:
        - predicate: ReplayOK
          input_predicates:
            - InstanceHashBindOK
  rounding:
    - id: fixed_point_rounding_bound
      purpose: bound deterministic fixed-point rounding error in the admitted kernel
      establishes:
        - predicate: IntegerEvalOK
          input_predicates: []
  settlement:
    - id: settlement_authority_receipt_binding
      purpose: require settlement authority receipts to bind object, instance, certificate, witness bundle, and delta
      establishes:
        - predicate: FIREVReceiptOK
          input_predicates:
            - ObjectHashBindOK
            - InstanceHashBindOK
            - WitnessOK
            - DeltaConservationOK
      reject_if:
        - object_hash_mismatch
        - instance_hash_mismatch
        - cert_sha256_mismatch
        - witness_hash_mismatch
        - delta_hash_mismatch
        - delta_nonzero_sum
        - receipt_hash_mismatch
    - id: settlement_admissibility
      establishes:
        - predicate: SettlementSafe

refinement_rules:
  - id: CapRefinement
    trusted: false
    requires_user_approval: true
  - id: ClampRefinement
    trusted: false
    requires_user_approval: true
  - id: CollateralRefinement
    trusted: false
    requires_user_approval: false
  - id: WitnessRefinement
    trusted: false
    requires_user_approval: false
  - id: UnitRepairRefinement
    trusted: false
    requires_user_approval: true
  - id: SpreadRefinement
    trusted: false
    requires_user_approval: true
  - id: TrancheRefinement
    trusted: false
    requires_user_approval: true
  - id: EvidenceRefinement
    trusted: false
    requires_user_approval: false

non_authoritative_surfaces:
  - zpl_source
  - fire_refiner
  - object_card
  - product_docs
  - ui_rendering
  - marketing_copy
