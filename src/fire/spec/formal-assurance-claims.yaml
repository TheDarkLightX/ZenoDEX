schema: zenodex/fire-formal-assurance-claims/v1

theorem:
  name: settlement_admissibility
  statement: "FIREVAccept(O, I, Gamma, w, C) -> SettlementSafe(O, I, w, C)"
  status: current FIRE acceptance theorem target; runtime compiler/verifier code is still in the TCB unless backed by checked proof receipts

evidence_lattice:
  levels:
    - proved
    - contract
    - implemented
    - tested_discovery
    - hypothesis
  meet_rule: weakest_required_claim

public_runtime_requires_private_esso: false

settlement_authority:
  predicate: FIREVReceiptOK
  required_bindings:
    - object_hash
    - instance_hash
    - cert_sha256
    - witness_hash
    - delta_hash
  missing_or_mismatch_behavior: reject
  only_authoritative_surfaces:
    - FIRE-V
    - FIRE-VCore

components:
  - id: fire_compiler_v1
    surface: compiler
    paths:
      - src/fire/compiler
      - tools/compile_fire_zpl.py
      - tools/build_fire_registry_bundle.py
    can_authorize_settlement: false
    claims_bug_free: false
    assurance_level: implemented
    formal_verification:
      claimed: false
      status: not_formally_verified
      proof_receipts: []
    notes: compiler output is non-authoritative and must be accepted by FIRE-V/FIRE-VCore before any settlement path can use it

  - id: fire_zpl_language_lean_v1
    surface: compiler
    paths:
      - lean-mathlib/Proofs/CertifiedFinancialMathObjects.lean
      - lean-mathlib/Proofs/CALCoreSoundness.lean
      - lean-mathlib/Proofs/ZenoPayoffLanguage.lean
      - lean-mathlib/Proofs/ZPLPayoffCombinators.lean
      - lean-mathlib/Proofs/FixedPointIntervalBridge.lean
      - lean-mathlib/Proofs/FixedPointPortfolioBridge.lean
      - lean-mathlib/Proofs/ZenoPayoffFixedPointBridge.lean
      - lean-mathlib/Proofs/ZenoPayoffPortfolioFixedPointBridge.lean
      - lean-mathlib/Proofs/FIREUnified.lean
      - lean-mathlib/Proofs/FIREBudgetSafety.lean
      - lean-mathlib/Proofs/TokenomicsMechanismSafety.lean
      - lean-mathlib/proof_receipts/zeno_payoff_language_v1.json
      - lean-mathlib/proof_receipts/zpl_payoff_combinators_v1.json
      - lean-mathlib/proof_receipts/fire_zpl_fixed_point_bridge_v1.json
      - lean-mathlib/proof_receipts/fire_unified_settlement_v1.json
      - lean-mathlib/proof_receipts/fire_budget_safety_v1.json
      - lean-mathlib/proof_receipts/tokenomics_mechanism_safety_v1.json
      - tests/formal/test_lean_cal_core_soundness.py
      - tests/formal/test_lean_zeno_payoff_language.py
      - tests/formal/test_lean_fixed_point_bridges.py
    can_authorize_settlement: false
    claims_bug_free: false
    assurance_level: proved
    formal_verification:
      claimed: true
      status: formally_verified
      proof_receipts:
        - path: lean-mathlib/proof_receipts/zeno_payoff_language_v1.json
          checker: lean
          result: proved
          sha256: sha256:18441378184c6032bfd1faa3f18e6d225d6d813b7006999257b678c5477daaf1
          scope: ZPL compiler soundness, CAL core soundness, and certified payoff collateral safety theorem surface
        - path: lean-mathlib/proof_receipts/zpl_payoff_combinators_v1.json
          checker: lean
          result: proved
          sha256: sha256:33f6235ef78ccb25d3db91d84d882795afe721a7e6731555ffeffecd86869fc0
          scope: ZPL/FIRE certified payoff combinators for digitals, barrier-gated payoffs, collars, conditional portfolios, short-side negation, collateral monotonicity, and no-default safety
        - path: lean-mathlib/proof_receipts/fire_zpl_fixed_point_bridge_v1.json
          checker: lean
          result: proved
          sha256: sha256:d006c4da5734fb3e3e6a2d1a2b314e5f23386b5b57d152dd652019229c93efa2
          scope: FIRE/ZPL fixed-point single-leg, uniform portfolio, and mixed-rounding portfolio bridge from compiler certificates to collateral-safe runtime settlement buffers, including exact two-party delta conservation by negating the rounded holder leg at the integer receipt layer and decoded fixed-point layer
        - path: lean-mathlib/proof_receipts/fire_unified_settlement_v1.json
          checker: lean
          result: proved
          sha256: sha256:501b9123b1bc79b86632cea205c215935503f5fffe087bc84e6bf8ab1eb8f2de
          scope: FIRE/ZPL unified settlement receipt theorem surface, including bilateral solvency, exact conservation, net-zero aggregate accounting, neutral receipt, and grouping/order-independent operational receipt composition
        - path: lean-mathlib/proof_receipts/fire_budget_safety_v1.json
          checker: lean
          result: proved
          sha256: sha256:819b3299d9d1074fc57a7485baa2a57b77fc951eb01e33463b90be516f692f1b
          scope: FIRE reward, rebate, buyback, bounty, and budget controller spend cannot exceed verified value plus explicit budget, and finite batching/relabeling/composition/proportional-cap refinement preserve the budget certificate
        - path: lean-mathlib/proof_receipts/tokenomics_mechanism_safety_v1.json
          checker: lean
          result: proved
          sha256: sha256:e690663a3f97af91b1f91516d905d13f7d2b5ae74edac0ca2df0287dbc715c56
          scope: admitted finite tokenomics traces preserve nonnegative reward spend, nonnegative verified value gain, cumulative reward/rebate/bounty/buyback spend bounded by verified value gained plus initial treasury, and no positive payout on no-value/no-budget loops
    notes: this component proves the payoff-language theorem surface only; it does not make the Python compiler or verifier bug-free or settlement-authoritative

  - id: fire_verifier_v1
    surface: verifier
    paths:
      - src/fire/verifier
      - src/fire/spec/verifier-rules.yaml
    can_authorize_settlement: true
    claims_bug_free: false
    assurance_level: implemented
    formal_verification:
      claimed: false
      status: not_formally_verified
      proof_receipts: []
    requires_firev_receipt_ok: true
    required_receipt_bindings:
      - object_hash
      - instance_hash
      - cert_sha256
      - witness_hash
      - delta_hash
    fails_closed_on_missing_receipt: true
    notes: verifier implementation is a trusted computing base component until independently discharged by machine-checked proof receipts

  - id: fire_acceptance_receipt_v1
    surface: receipt
    paths:
      - src/fire/verifier/acceptance_receipt_v1.py
      - src/fire/spec/fire-acceptance-receipt.schema.json
      - tools/build_fire_acceptance_receipt.py
      - tools/check_fire_acceptance_receipt.py
    can_authorize_settlement: false
    authorizes_settlement: false
    claims_bug_free: false
    assurance_level: implemented
    formal_verification:
      claimed: false
      status: not_formally_verified
      proof_receipts: []
    notes: package acceptance strengthens provenance but deliberately does not authorize funds movement

  - id: fire_settlement_receipt_v1
    surface: receipt
    paths:
      - src/fire/verifier/settlement_v1.py
      - src/fire/kernel/apply_receipt_v1.py
      - src/fire/kernel/ledger_adapter_v1.py
      - src/fire/runtime/common_v1.py
      - src/fire/runtime/adapter_manifest_gate_v1.py
      - tools/apply_fire_settlement.py
    can_authorize_settlement: true
    claims_bug_free: false
    assurance_level: implemented
    formal_verification:
      claimed: false
      status: not_formally_verified
      proof_receipts: []
    requires_firev_receipt_ok: true
    required_receipt_bindings:
      - object_hash
      - instance_hash
      - cert_sha256
      - witness_hash
      - delta_hash
    fails_closed_on_missing_receipt: true
    notes: this is the money-moving receipt boundary and must reject on any missing or mismatched authority binding

  - id: fire_esso_kernel_admission_v1
    surface: kernel
    paths:
      - src/fire/verifier/esso_kernels_v1.py
      - src/kernels/dex/fire_burn_boost_call_v1.yaml
      - src/kernels/dex/fire_fee_note_v1.yaml
      - src/kernels/dex/fire_lp_loss_cover_v1.yaml
    can_authorize_settlement: false
    claims_bug_free: false
    assurance_level: tested_discovery
    formal_verification:
      claimed: false
      status: partially_verified
      proof_receipts: []
    notes: private ESSO admission is maintainer-only evidence and is not a public runtime dependency or settlement authority

  - id: fire_refiner_ore_v1
    surface: refiner
    paths:
      - src/fire/refiner
    can_authorize_settlement: false
    claims_bug_free: false
    assurance_level: hypothesis
    formal_verification:
      claimed: false
      status: not_formally_verified
      proof_receipts: []
    notes: FIRE Refiner/ORE proposals are non-authoritative and must compile and verify before use

  - id: fire_registry_ui_docs_v1
    surface: ui_docs
    paths:
      - src/fire/registry
      - src/fire/registry/README.md
      - docs/fire_registry/README.md
    can_authorize_settlement: false
    claims_bug_free: false
    assurance_level: contract
    formal_verification:
      claimed: false
      status: not_formally_verified
      proof_receipts: []
    notes: registry, product cards, UI text, and docs may explain claims but cannot strengthen settlement authority

forbidden_public_claims:
  - compiler_bug_free
  - verifier_bug_free
  - compiler_formally_verified_without_proof_receipt
  - verifier_formally_verified_without_proof_receipt
  - acceptance_receipt_authorizes_settlement
  - private_esso_required_for_public_runtime

claim_gate:
  fail_closed: true
  formal_claim_requires_checked_receipt: true
  bug_free_claim_allowed: false
  acceptance_receipt_authorizes_settlement_allowed: false
