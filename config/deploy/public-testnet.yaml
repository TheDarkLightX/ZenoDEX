schema: zenodex/deployment_profile/v1
profile_id: public-testnet
threat_model: public testnet with signed writes and operator evidence
allowed_routes:
  - health
  - signed_intents
  - public_bundle
  - peer_check
required_auth:
  public_api: bearer_token
  write_api: signed_intent_or_operator_token
key_policy:
  raw_private_key_flags_allowed: false
  production_key_receipts_required: false
  browser_key_generation_allowed: false
  external_signer_required: true
  signer_user_approval_required: true
proof_policy:
  proof_metadata_required: true
spot_policy:
  route_price_interval_trusted_policy_root_required: true
  route_price_interval_trusted_policy_root_bundle_required: true
  route_price_interval_trusted_policy_root_bundle_quorum_required: true
  route_price_interval_max_width_bps_required: true
runtime_policy:
  allow_path_lookup: false
  plaintext_fixture_keys_allowed: false
  local_only_routes_allowed: false
  env_config_file_allowlist_required: true
  dependency_sbom_required: true
  secret_scan_required: true
  external_static_analysis_required_in_ci: true
perps_policy:
  isolated_partial_liquidate_tau_source_binding_required: false
  isolated_partial_liquidate_tau_source_state_root_binding_required: false
  isolated_partial_liquidate_tau_source_membership_proof_required: false
  isolated_partial_liquidate_tau_source_root_authority_required: false
  isolated_partial_liquidate_tau_source_admission_envelope_required: false
  isolated_partial_liquidate_tau_source_authority_policy_receipt_required: false
  isolated_partial_liquidate_tau_source_authority_policy_receipt_verifier_required: false
  isolated_partial_liquidate_tau_source_authority_policy_receipt_verifier_sha256_required: false
  isolated_partial_liquidate_tau_source_authority_policy_receipt_verifier_build_receipt_required: false
  isolated_partial_liquidate_tau_source_authority_policy_receipt_verifier_build_receipt_signature_required: false
  isolated_partial_liquidate_tau_source_authority_policy_receipt_verifier_release_bundle_required: false
  isolated_partial_liquidate_tau_source_authority_policy_receipt_verifier_release_registry_required: false
upba_policy: balanced
peer_policy:
  public_peer_admission_allowed: true
  dynamic_peer_cap_required: true
gossip_policy:
  transport_auth_required: true
observability_policy:
  metrics_required: true
