schema: zenodex/deployment_profile/v1
profile_id: local-dev
threat_model: loopback developer operation
allowed_routes:
  - health
  - local_demo
  - signed_intents
required_auth:
  public_api: optional_loopback_only
  write_api: optional_loopback_only
key_policy:
  raw_private_key_flags_allowed: true
  production_key_receipts_required: false
proof_policy:
  proof_metadata_required: false
upba_policy: fast
peer_policy:
  public_peer_admission_allowed: false
  dynamic_peer_cap_required: false
gossip_policy:
  transport_auth_required: false
observability_policy:
  metrics_required: false
runtime_authority_policy:
  schema: zenodex/runtime_authority_policy/v1
  # Dev loopback: Python authority by default. This is not a strict profile, so
  # the selector permits experimenting with rust_shadow / rust_authority modes
  # per surface (advisory validation only).
  default: python_authority
  per_surface: {}
  promoted_surfaces: []
