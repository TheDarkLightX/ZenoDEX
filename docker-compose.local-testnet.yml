# ZenoDEX Local-Testnet Compose Overlay
#
# Brings up a real local-testnet stack:
#   3-node ZenoLedger (bootstrap + writer + forwarder + readonly)
#   zenodex-oracle (Zeno Oracle dashboard/API)
#   zenodex-api   (stdlib API with live local lanes enabled)
#   zenodex-nginx (UI + nginx, only host-exposed service)
#
# This overlay is self-contained. Do NOT compose it with the upstream
# `docker-compose.multimachine.yml` or `docker-compose.permissionless.yml`
# (it reuses their images but defines services independently to avoid
# silent drift). The orchestrator at `tools/zenoctl_testnet_local/`
# launches and tears down this stack.
#
# Required env (injected by the orchestrator):
#   - ZENO_LEDGER_WRITER_TOKEN   bearer token for writer mutation auth
#   - ZENODEX_API_BEARER_TOKEN   bearer token for stdlib API auth
#   - RENDERED_NGINX_CONF_PATH   abs path to rendered nginx.local-testnet.conf
#   - RENDERED_RUNTIME_CONFIG_PATH abs path to rendered zenodex-config.json
#   - FIXTURES_DIR               abs path to generated fixtures
#   - ORACLE_HOME_DIR            abs path to generated Oracle home
#   - HOST_UID, HOST_GID         host user/group ids for bind-mounted artifacts
#   - UI_PORT                    host TCP port for the UI nginx (default 18080)
#   - CHAIN_ID, NETWORK_ID       ledger identifiers
#   - ZENO_LEDGER_TOKEN_SYMBOL   local protocol-token symbol (default ZDEX)
#   - ZENODEX_LOCAL_OPERATOR_PROFILE_ID exact local admission profile
#   - ZENODEX_LOCAL_OPERATOR_PROFILE_DIGEST content digest for that profile

services:
  zeno-ledger-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.operator-tools
    image: zenodex/operator-tools:local
    labels: &local_operator_profile_labels
      io.zenodex.local-operator-profile-id: ${ZENODEX_LOCAL_OPERATOR_PROFILE_ID:?ZENODEX_LOCAL_OPERATOR_PROFILE_ID must be set by the orchestrator}
      io.zenodex.local-operator-profile-digest: ${ZENODEX_LOCAL_OPERATOR_PROFILE_DIGEST:?ZENODEX_LOCAL_OPERATOR_PROFILE_DIGEST must be set by the orchestrator}
    working_dir: /app
    user: zenodex
    entrypoint: ["python"]
    command:
      - tools/zeno_ledger_multidocker_scenario.py
      - bootstrap
      - --bundle-root
      - /app/data/local-testnet/bundle
      - --network-id
      - ${NETWORK_ID:-zeno-ledger-localtest-v0}
      - --chain-id
      - ${CHAIN_ID:-zeno-ledger-localtest-v0}
      - --token-symbol
      - ${ZENO_LEDGER_TOKEN_SYMBOL:-ZDEX}
      - --fixture-key-bundle
      - /app/fixtures/role_pubkeys.json
      - --report-out
      - /app/data/local-testnet/reports/bootstrap.json
      - --bundle-tar-out
      - /app/data/local-testnet/bundle.tar.gz
      - --stay-alive
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      ZENO_LEDGER_WRITER_TOKEN: ${ZENO_LEDGER_WRITER_TOKEN:?ZENO_LEDGER_WRITER_TOKEN must be set by the orchestrator}
      ZENO_LEDGER_TOKEN_SYMBOL: ${ZENO_LEDGER_TOKEN_SYMBOL:-ZDEX}
    volumes:
      - zeno-local-testnet-data:/app/data
      - ${FIXTURES_DIR:?FIXTURES_DIR must be set by the orchestrator}/role_pubkeys.json:/app/fixtures/role_pubkeys.json:ro
    networks: [zenodex-local-testnet]
    security_opt: &security_opts
      - no-new-privileges:true
    init: true
    cap_drop: &cap_drop
      - ALL
    pids_limit: 256
    mem_limit: 2g
    read_only: true
    tmpfs: &tmpfs
      - /tmp:mode=1777,noexec,nosuid,nodev,size=128m

  zeno-ledger-writer:
    image: zenodex/operator-tools:local
    labels: *local_operator_profile_labels
    working_dir: /app
    user: zenodex
    depends_on:
      zeno-ledger-bootstrap:
        condition: service_started
    restart: on-failure
    entrypoint: ["python"]
    command:
      - tools/zeno_ledger_multidocker_scenario.py
      - serve-node
      - --role
      - writer
      - --bundle-root
      - /app/data/local-testnet/bundle
      - --data-dir
      - /app/data/local-testnet/node-writer
      - --network-id
      - ${NETWORK_ID:-zeno-ledger-localtest-v0}
      - --chain-id
      - ${CHAIN_ID:-zeno-ledger-localtest-v0}
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --enable-testnet-intake
      - --enable-testnet-faucet
      - --expose-testnet-faucet-http
      - --write-auth-token-env
      - ZENO_LEDGER_WRITER_TOKEN
      - --min-lp-position-age-seconds
      - ${ZENO_LEDGER_MIN_LP_POSITION_AGE_SECONDS:-300}
      - --lp-duration-risk-policy
      - ${ZENO_LEDGER_LP_DURATION_RISK_POLICY:-zeno-oracle}
    environment: &node_env
      PYTHONDONTWRITEBYTECODE: "1"
      ZENO_LEDGER_WRITER_TOKEN: ${ZENO_LEDGER_WRITER_TOKEN:?ZENO_LEDGER_WRITER_TOKEN must be set by the orchestrator}
      TAU_DEX_CHAIN_ID: ${CHAIN_ID:-zeno-ledger-localtest-v0}
      TAU_DEX_TOKEN_SYMBOL: ${ZENO_LEDGER_TOKEN_SYMBOL:-ZDEX}
      TAU_DEX_PROOF_MINING_POOL_PUBKEY: ${TAU_DEX_PROOF_MINING_POOL_PUBKEY:-}
      TAU_DEX_ALLOW_EXTERNAL_TOOLS: ${TAU_DEX_ALLOW_EXTERNAL_TOOLS:-}
      TAU_DEX_CONSENSUS_MODE: ${TAU_DEX_CONSENSUS_MODE:-}
      TAU_DEX_PROOF_VERIFIER_CMD_JSON: ${TAU_DEX_PROOF_VERIFIER_CMD_JSON:-}
      TAU_DEX_PROOF_VERIFIER_TIMEOUT_S: ${TAU_DEX_PROOF_VERIFIER_TIMEOUT_S:-}
      TAU_DEX_PROOF_VERIFIER_MAX_PROOF_BYTES: ${TAU_DEX_PROOF_VERIFIER_MAX_PROOF_BYTES:-}
      TAU_DEX_PROOF_VERIFIER_ALLOW_PATH_LOOKUP: ${TAU_DEX_PROOF_VERIFIER_ALLOW_PATH_LOOKUP:-}
      TAU_DEX_PROOF_VERIFIER_ARTIFACT_JSON: ${TAU_DEX_PROOF_VERIFIER_ARTIFACT_JSON:-}
      TAU_DEX_PROOF_CIRCUIT_ARTIFACT_JSON: ${TAU_DEX_PROOF_CIRCUIT_ARTIFACT_JSON:-}
      TAU_DEX_PROOF_VERIFIER_ARTIFACT_FILE: ${TAU_DEX_PROOF_VERIFIER_ARTIFACT_FILE:-}
      TAU_DEX_PROOF_CIRCUIT_ARTIFACT_FILE: ${TAU_DEX_PROOF_CIRCUIT_ARTIFACT_FILE:-}
    volumes:
      - zeno-local-testnet-data:/app/data
    networks: [zenodex-local-testnet]
    security_opt: *security_opts
    init: true
    cap_drop: *cap_drop
    pids_limit: 256
    mem_limit: 768m
    read_only: true
    tmpfs: *tmpfs

  zeno-ledger-forwarder:
    image: zenodex/operator-tools:local
    labels: *local_operator_profile_labels
    working_dir: /app
    user: zenodex
    depends_on:
      zeno-ledger-writer:
        condition: service_started
    restart: on-failure
    entrypoint: ["python"]
    command:
      - tools/zeno_ledger_multidocker_scenario.py
      - serve-node
      - --role
      - forwarder
      - --bundle-root
      - /app/data/local-testnet/bundle
      - --data-dir
      - /app/data/local-testnet/node-forwarder
      - --network-id
      - ${NETWORK_ID:-zeno-ledger-localtest-v0}
      - --chain-id
      - ${CHAIN_ID:-zeno-ledger-localtest-v0}
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --peer-url
      - http://zeno-ledger-writer:8787
      - --poll-seconds
      - "1"
      - --enable-testnet-intake
      - --enable-testnet-faucet
      - --expose-testnet-faucet-http
      - --submit-peer-url
      - http://zeno-ledger-writer:8787
      - --write-auth-token-env
      - ZENO_LEDGER_WRITER_TOKEN
      - --submit-peer-auth-token-env
      - ZENO_LEDGER_WRITER_TOKEN
      - --min-lp-position-age-seconds
      - ${ZENO_LEDGER_MIN_LP_POSITION_AGE_SECONDS:-300}
      - --lp-duration-risk-policy
      - ${ZENO_LEDGER_LP_DURATION_RISK_POLICY:-zeno-oracle}
    environment: *node_env
    volumes:
      - zeno-local-testnet-data:/app/data
    networks: [zenodex-local-testnet]
    security_opt: *security_opts
    init: true
    cap_drop: *cap_drop
    pids_limit: 256
    mem_limit: 768m
    read_only: true
    tmpfs: *tmpfs

  zeno-ledger-readonly:
    image: zenodex/operator-tools:local
    labels: *local_operator_profile_labels
    working_dir: /app
    user: zenodex
    depends_on:
      zeno-ledger-writer:
        condition: service_started
    restart: on-failure
    entrypoint: ["python"]
    command:
      - tools/zeno_ledger_multidocker_scenario.py
      - serve-node
      - --role
      - readonly
      - --bundle-root
      - /app/data/local-testnet/bundle
      - --data-dir
      - /app/data/local-testnet/node-readonly
      - --network-id
      - ${NETWORK_ID:-zeno-ledger-localtest-v0}
      - --chain-id
      - ${CHAIN_ID:-zeno-ledger-localtest-v0}
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --peer-url
      - http://zeno-ledger-writer:8787
      - --poll-seconds
      - "1"
      - --write-auth-token-env
      - ZENO_LEDGER_WRITER_TOKEN
      - --min-lp-position-age-seconds
      - ${ZENO_LEDGER_MIN_LP_POSITION_AGE_SECONDS:-300}
      - --lp-duration-risk-policy
      - ${ZENO_LEDGER_LP_DURATION_RISK_POLICY:-zeno-oracle}
    environment: *node_env
    volumes:
      - zeno-local-testnet-data:/app/data
    networks: [zenodex-local-testnet]
    security_opt: *security_opts
    init: true
    cap_drop: *cap_drop
    pids_limit: 256
    mem_limit: 768m
    read_only: true
    tmpfs: *tmpfs

  zenodex-oracle:
    image: zenodex/operator-tools:local
    labels: *local_operator_profile_labels
    working_dir: /app
    user: "${HOST_UID:?HOST_UID must be set by the orchestrator}:${HOST_GID:?HOST_GID must be set by the orchestrator}"
    entrypoint: ["python"]
    command:
      - tools/zenodex_oracle.py
      - serve
      - --home
      - /app/data/oracle-home
      - --allow-writes
      - --host
      - 0.0.0.0
      - --port
      - "9100"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - zeno-local-testnet-data:/app/data
      - ${ORACLE_HOME_DIR:?ORACLE_HOME_DIR must be set by the orchestrator}:/app/data/oracle-home
    networks: [zenodex-local-testnet]
    security_opt: *security_opts
    init: true
    cap_drop: *cap_drop
    pids_limit: 256
    mem_limit: 512m
    read_only: true
    tmpfs: *tmpfs

  zenodex-api:
    image: zenodex/operator-tools:local
    labels: *local_operator_profile_labels
    working_dir: /app
    user: "${HOST_UID:?HOST_UID must be set by the orchestrator}:${HOST_GID:?HOST_GID must be set by the orchestrator}"
    depends_on:
      zeno-ledger-writer:
        condition: service_started
    entrypoint: ["python"]
    command:
      - -m
      - src.integration.api_server
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      ZENODEX_ENV: "local"
      TAU_DEX_CHAIN_ID: ${CHAIN_ID:-zeno-ledger-localtest-v0}
      TAU_DEX_TOKEN_SYMBOL: ${ZENO_LEDGER_TOKEN_SYMBOL:-ZDEX}
      DEX_API_ENABLED: "true"
      PERPS_API_ENABLED: "false"
      PERPS_WALLET_API_ENABLED: "false"
      TAU_DEX_REQUIRE_LIVE_ZK_PROOF: ${TAU_DEX_REQUIRE_LIVE_ZK_PROOF:-false}
      TAU_DEX_PROOF_VERIFIER_CMD_JSON: ${TAU_DEX_PROOF_VERIFIER_CMD_JSON:-}
      TAU_DEX_PROOF_VERIFIER_TIMEOUT_S: ${TAU_DEX_PROOF_VERIFIER_TIMEOUT_S:-}
      TAU_DEX_PROOF_VERIFIER_MAX_PROOF_BYTES: ${TAU_DEX_PROOF_VERIFIER_MAX_PROOF_BYTES:-}
      TAU_DEX_PROOF_VERIFIER_ALLOW_PATH_LOOKUP: ${TAU_DEX_PROOF_VERIFIER_ALLOW_PATH_LOOKUP:-}
      TAU_DEX_PROOF_VERIFIER_ARTIFACT_JSON: ${TAU_DEX_PROOF_VERIFIER_ARTIFACT_JSON:-}
      TAU_DEX_PROOF_CIRCUIT_ARTIFACT_JSON: ${TAU_DEX_PROOF_CIRCUIT_ARTIFACT_JSON:-}
      TAU_DEX_PROOF_VERIFIER_ARTIFACT_FILE: ${TAU_DEX_PROOF_VERIFIER_ARTIFACT_FILE:-}
      TAU_DEX_PROOF_CIRCUIT_ARTIFACT_FILE: ${TAU_DEX_PROOF_CIRCUIT_ARTIFACT_FILE:-}
      TAU_DEX_PROOF_MINING_POOL_PUBKEY: ${TAU_DEX_PROOF_MINING_POOL_PUBKEY:-}
      ZENO_LEDGER_WRITER_SNAPSHOT_URL: http://zeno-ledger-writer:8787/api/dex/snapshot
      ZUSD_API_ENABLED: "false"
      ZUSD_TAU_WALLET_API_ENABLED: "false"
      ZUSD_MONETARY_WALLET_API_ENABLED: "false"
      AUTOTRADER_LIVE_API_ENABLED: "false"
      CONFIDENTIAL_ATTESTATION_API_ENABLED: "true"
      CONFIDENTIAL_SEALED_BID_STATE_FILE: /tmp/confidential_sealed_bid_state.json
      CONFIDENTIAL_SEALED_BID_LOCAL_LEDGER_SETTLEMENT_ENABLED: "false"
      CONFIDENTIAL_OPERATOR_CONTACT: "https://ops.zenodex.local"
      CONFIDENTIAL_APPROVED_MEASUREMENTS: ${CONFIDENTIAL_APPROVED_MEASUREMENTS:?CONFIDENTIAL_APPROVED_MEASUREMENTS must be set by the orchestrator}
      CONFIDENTIAL_ATTESTATION_VERIFIER_ENABLED: "true"
      CONFIDENTIAL_ATTESTATION_VERIFIER_CMD_JSON: ${CONFIDENTIAL_ATTESTATION_VERIFIER_CMD_JSON:?CONFIDENTIAL_ATTESTATION_VERIFIER_CMD_JSON must be set by the orchestrator}
      ZENODEX_API_BEARER_TOKEN: ${ZENODEX_API_BEARER_TOKEN:?ZENODEX_API_BEARER_TOKEN must be set by the orchestrator}
    volumes:
      - zeno-local-testnet-data:/app/data
    networks: [zenodex-local-testnet]
    security_opt: *security_opts
    init: true
    cap_drop: *cap_drop
    pids_limit: 512
    mem_limit: 768m
    read_only: true
    tmpfs: *tmpfs

  zenodex-nginx:
    build:
      context: .
      dockerfile: Dockerfile
    image: zenodex:local
    labels: *local_operator_profile_labels
    working_dir: /app
    user: "${HOST_UID:?HOST_UID must be set by the orchestrator}:${HOST_GID:?HOST_GID must be set by the orchestrator}"
    depends_on:
      zenodex-api:
        condition: service_started
      zenodex-oracle:
        condition: service_started
      zeno-ledger-writer:
        condition: service_started
    entrypoint: []
    command:
      - sh
      - -c
      - >
        mkdir -p /tmp/nginx/client_body /tmp/nginx/proxy /tmp/nginx/fastcgi /tmp/nginx/uwsgi /tmp/nginx/scgi
        && exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:${UI_PORT:-18080}:8080"
    volumes:
      - ${RENDERED_NGINX_CONF_PATH:?RENDERED_NGINX_CONF_PATH must be set by the orchestrator}:/etc/nginx/conf.d/zenodex.conf:ro
      - ${RENDERED_RUNTIME_CONFIG_PATH:?RENDERED_RUNTIME_CONFIG_PATH must be set by the orchestrator}:/var/www/zenodex/zenodex-config.json:ro
    networks: [zenodex-local-testnet]
    security_opt: *security_opts
    init: true
    cap_drop: *cap_drop
    pids_limit: 256
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
      - /var/run:uid=10001,gid=10001,mode=755,noexec,nosuid,nodev,size=16m
      - /var/cache/nginx:uid=10001,gid=10001,mode=755,noexec,nosuid,nodev,size=64m
      - /var/log/nginx:uid=10001,gid=10001,mode=755,noexec,nosuid,nodev,size=16m

networks:
  zenodex-local-testnet:
    driver: bridge

volumes:
  zeno-local-testnet-data:
