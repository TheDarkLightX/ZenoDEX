[package]
name = "tau-state-proof-risc0-shared-v2"
version = "0.1.0"
edition = "2021"
description = "Bounded two-level recursive node ABI for Tau state proofs"
publish = false

[lib]
doctest = false

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10.9", default-features = false }
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared" }

[dev-dependencies]
serde_json = "1.0.140"
