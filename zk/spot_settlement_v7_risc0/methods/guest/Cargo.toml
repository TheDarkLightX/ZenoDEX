[package]
name = "zenodex-zrpf-risc0-spot-settlement-v7-guest"
version = "0.1.0"
edition = "2021"
description = "RISC0 guest for source-opened Spot settlement V7"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "unstable"] }
zenodex-zrpf-protocol-v3 = { path = "../../../zrpf_protocol/protocol", default-features = false }
zenodex-zrpf-risc0-shared = { path = "../../../zrpf_risc0/shared", default-features = false }
zenodex-zrpf-risc0-spot-settlement-v7-child-policy = { path = "../../child_policy" }
zenodex-zrpf-risc0-spot-settlement-v7-shared = { path = "../../shared" }

[[bin]]
name = "zenodex-zrpf-risc0-spot-settlement-v7-guest"
path = "src/main.rs"
test = false
bench = false
