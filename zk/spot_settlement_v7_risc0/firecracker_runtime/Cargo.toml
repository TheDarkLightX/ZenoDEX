[package]
name = "zenodex-zrpf-spot-v7-firecracker-runtime"
version = "0.1.0"
edition = "2021"
description = "Authority-neutral Spot V7 Firecracker binary protocol and PID-1 mechanics"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zenodex-zrpf-spot-v7-firecracker-protocol-init"
path = "src/bin/spot_v7_firecracker_protocol_init.rs"

[[bin]]
name = "spot-v7-firecracker-protocol-vector-v1"
path = "src/bin/protocol_vector_v1.rs"

[[bin]]
name = "spot-v7-firecracker-negative-vector-v1"
path = "src/bin/protocol_negative_vector_v1.rs"

[[test]]
name = "protocol_v1"
path = "tests/protocol_v1.rs"

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "mount", "std", "system"] }
