[package]
name = "zenodex-zrpf-risc0-spot-settlement-v7-input-builder"
version = "0.1.0"
edition = "2021"
description = "Authority-neutral canonical guest-input builder for Spot settlement V7"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "build_spot_settlement_v7_guest_input"
path = "src/main.rs"

[[test]]
name = "input_builder_v1"
path = "tests/input_builder_v1.rs"

[[test]]
name = "input_builder_cli_v1"
path = "tests/input_builder_cli_v1.rs"

[dependencies]
libc = "=0.2.186"
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol" }
zenodex-zrpf-risc0-spot-settlement-v6-shared = { path = "../../zrpf_risc0/spot_settlement_v6_shared" }
zenodex-zrpf-risc0-spot-settlement-v7-shared = { path = "../shared" }
zenodex-zrpf-risc0-spot-state-root-v7-semantic-shared = { path = "../../spot_state_root_v7_semantic_shared" }

[dev-dependencies]
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared", default-features = false }
zenodex-zrpf-risc0-semantic-shared = { path = "../../zrpf_risc0/semantic_shared", default-features = false }
zenodex-zrpf-risc0-spot-value-leaf-v6-shared = { path = "../../zrpf_risc0/spot_value_leaf_v6_shared", default-features = false }
