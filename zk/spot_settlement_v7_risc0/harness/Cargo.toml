[package]
name = "zenodex-zrpf-risc0-spot-settlement-v7-harness"
version = "0.1.0"
edition = "2021"
description = "Evidence harness scaffold for source-opened Spot settlement V7"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "prove_spot_settlement_v7"
path = "src/bin/prove_spot_settlement_v7.rs"

[dependencies]
risc0-zkvm = { version = "=3.0.5", features = ["disable-dev-mode"] }
serde_json = "=1.0.150"
sha2 = "0.10.9"
zenodex-zrpf-risc0-execution-profile = { path = "../../state_proof_risc0/execution_profile" }
zenodex-zrpf-risc0-shared = { path = "../../zrpf_risc0/shared" }
zenodex-zrpf-risc0-verifier = { path = "../../zrpf_risc0/verifier" }
zenodex-zrpf-risc0-spot-settlement-v7-child-policy = { path = "../child_policy" }
zenodex-zrpf-risc0-spot-settlement-v7-methods = { path = "../methods" }
zenodex-zrpf-risc0-spot-settlement-v7-shared = { path = "../shared" }
zenodex-zrpf-risc0-spot-settlement-v7-verifier = { path = "../verifier" }
