[package]
name = "zenodex-zrpf-zusd-value-flow-reference-v1"
version = "0.1.0"
edition = "2021"
description = "Proof-neutral zUSD lifecycle value-flow reference"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "zusd_value_flow_v1"
path = "tests/zusd_value_flow_v1.rs"

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10.9", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../protocol", default-features = false }

[dev-dependencies]
serde_json = "1.0.140"
