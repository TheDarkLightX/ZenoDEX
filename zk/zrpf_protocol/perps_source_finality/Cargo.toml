[package]
name = "zenodex-zrpf-perps-source-finality-reference-v1"
version = "0.1.0"
edition = "2021"
description = "Proof-neutral perps collateral source-finality row reference"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "perps_source_finality_v1"
path = "tests/perps_source_finality_v1.rs"

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10.9", default-features = false }
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../protocol", default-features = false }

[dev-dependencies]
serde_json = "1.0.140"
