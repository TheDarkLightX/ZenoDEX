[package]
name = "zenodex-zrpf-protocol-v3"
version = "0.1.0"
edition = "2021"
description = "Bounded proof-system-neutral ZRPF V3 structural journal protocol for ZenoDEX"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

