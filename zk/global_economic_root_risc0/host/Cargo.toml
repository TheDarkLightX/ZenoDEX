[package]
name = "zenodex-global-economic-root-risc0-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
doctest = false

[features]
cuda = ["risc0-zkvm/cuda"]

[dependencies]
postcard = { version = "=1.1.3", features = ["alloc"] }
risc0-zkvm = { version = "=3.0.6", features = ["disable-dev-mode"] }
zenodex-global-economic-root-risc0-methods = { path = "../methods" }
zenodex-global-economic-root-risc0-shared = { path = "../shared" }
zenodex-global-economic-epoch-risc0-shared = { path = "../../global_economic_epoch_risc0/shared" }

[dev-dependencies]
serde_json = "=1.0.148"
zenodex-economic-initial-state-risc0-shared = { path = "../../economic_initial_state_risc0/shared" }
zenodex-global-settlement-abi-v1 = { path = "../../global_settlement_abi_v1" }
zenodex-epoch-test-methods = { path = "../../global_economic_epoch_risc0/test_methods" }

[lints.rust]
unsafe_code = "forbid"
