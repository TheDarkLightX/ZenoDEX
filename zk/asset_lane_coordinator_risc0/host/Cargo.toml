[package]
name = "zenodex-asset-lane-coordinator-risc0-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Fail-closed host and receipt verifier for the ASSET_TRANSFER lane coordinator guest"

[lib]
doctest = false

[features]
default = []
cuda = ["risc0-zkvm/cuda"]

[dependencies]
hex = "=0.4.3"
risc0-zkvm = { version = "=3.0.6", features = ["disable-dev-mode"] }
serde_json = "=1.0.148"
zenodex-asset-lane-coordinator-risc0-methods = { path = "../methods" }
zenodex-asset-lane-coordinator-risc0-shared = { path = "../shared" }
zenodex-global-settlement-abi-v1 = { path = "../../global_settlement_abi_v1" }

[dev-dependencies]
sha2 = "=0.10.9"
zenodex-asset-transfer-module-risc0-host = { path = "../../asset_transfer_module_risc0/host" }
zenodex-asset-transfer-module-risc0-methods = { path = "../../asset_transfer_module_risc0/methods" }

[lints.rust]
unsafe_code = "forbid"
