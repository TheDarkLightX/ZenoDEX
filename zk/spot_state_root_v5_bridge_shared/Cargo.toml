[package]
name = "zenodex-zrpf-risc0-spot-state-root-v5-bridge-shared"
version = "0.1.0"
edition = "2021"
description = "Guest-safe restricted bridge from legacy Spot snapshots to ZenoLedger state-root v5"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "restricted_bridge_v1"
path = "tests/restricted_bridge_v1.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
tau-state-proof-risc0-shared = { path = "../state_proof_risc0/shared", default-features = false }

[dev-dependencies]
serde_json = "1.0.140"

[workspace]
resolver = "2"
