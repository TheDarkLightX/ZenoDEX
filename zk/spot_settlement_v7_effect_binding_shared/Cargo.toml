[package]
name = "zenodex-zrpf-risc0-spot-settlement-v7-effect-binding-shared"
version = "0.1.0"
edition = "2021"
description = "Proof-neutral typed Spot settlement effects bound to state-root V5"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "effect_binding_v1"
path = "tests/effect_binding_v1.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
tau-state-proof-risc0-shared = { path = "../state_proof_risc0/shared", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../zrpf_protocol/protocol" }
zenodex-zrpf-risc0-spot-state-root-v5-bridge-shared = { path = "../spot_state_root_v5_bridge_shared" }
zenodex-zrpf-risc0-spot-state-root-v7-semantic-shared = { path = "../spot_state_root_v7_semantic_shared" }

[dev-dependencies]
serde_json = "1.0.140"

[workspace]
resolver = "2"
