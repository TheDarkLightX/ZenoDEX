[package]
name = "zenodex-zrpf-full-blob-da-checker-v1"
version = "0.1.0"
edition = "2021"
description = "Bounded exact full_blob_da_v1 policy checker process"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "zrpf-full-blob-da-checker-v1"
path = "src/main.rs"

[[test]]
name = "checker_v1"
path = "tests/checker_v1.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../zrpf_protocol/protocol" }
