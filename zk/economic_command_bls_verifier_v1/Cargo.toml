[package]
name = "zenodex-economic-command-bls-verifier-v1"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
blst = { version = "=0.3.16", default-features = false, features = ["no-threads", "portable"] }
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
