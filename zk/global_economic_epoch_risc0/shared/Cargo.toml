[package]
name = "zenodex-global-economic-epoch-risc0-shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Guest-compatible exact-assumption ABI for GlobalSettlementABI V1 epochs"

[lib]
doctest = false

[features]
default = ["std"]
std = [
  "hex/std",
  "postcard/use-std",
  "serde/std",
  "serde_json/std",
  "sha2/std",
]

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.148", default-features = false, features = ["alloc", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false }
