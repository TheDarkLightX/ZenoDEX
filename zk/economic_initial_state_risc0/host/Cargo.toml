[package]
name = "zenodex-economic-initial-state-risc0-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Fail-closed host and receipt verifier for the ZenoDEX economic initial-state guest"

[lib]
doctest = false

[dependencies]
risc0-zkvm = { version = "=3.0.6", features = ["disable-dev-mode"] }
serde_json = "=1.0.148"
zenodex-economic-initial-state-risc0-methods = { path = "../methods" }
zenodex-economic-initial-state-risc0-shared = { path = "../shared" }
zenodex-global-settlement-abi-v1 = { path = "../../global_settlement_abi_v1" }

[lints.rust]
unsafe_code = "forbid"
