[package]
name = "zenodex-zdex-tokenomics-lane-coordinator-risc0-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Fail-closed recursive host and pinned receipt verifier for the ZDEX tokenomics lane coordinator"

[lib]
doctest = false

[dependencies]
risc0-zkvm = { version = "=3.0.6", features = ["disable-dev-mode"] }
serde_json = "=1.0.148"
zenodex-global-settlement-abi-v1 = { path = "../../global_settlement_abi_v1" }
zenodex-zdex-tokenomics-lane-coordinator-risc0-methods = { path = "../methods" }
zenodex-zdex-tokenomics-lane-coordinator-risc0-shared = { path = "../shared" }

[dev-dependencies]
hex = "=0.4.3"
sha2 = "=0.10.9"
zenodex-zdex-hyperdeflation-burn-risc0-host = { path = "../../zdex_hyperdeflation_burn_risc0/host" }
zenodex-zdex-hyperdeflation-burn-risc0-methods = { path = "../../zdex_hyperdeflation_burn_risc0/methods" }
zenodex-zdex-hyperdeflation-burn-risc0-shared = { path = "../../zdex_hyperdeflation_burn_risc0/shared" }

[lints.rust]
unsafe_code = "forbid"
