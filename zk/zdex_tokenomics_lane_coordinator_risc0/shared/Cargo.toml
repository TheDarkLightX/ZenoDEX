[package]
name = "zenodex-zdex-tokenomics-lane-coordinator-risc0-shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Canonical complete-lane composition seam for the ZDEX tokenomics RISC0 coordinator"

[lib]
doctest = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.148", features = ["arbitrary_precision"] }
zenodex-global-settlement-abi-v1 = { path = "../../global_settlement_abi_v1" }

[dev-dependencies]
zenodex-zdex-fee-allocation-risc0-shared = { path = "../../zdex_fee_allocation_risc0/shared" }
zenodex-zdex-hyperdeflation-burn-risc0-shared = { path = "../../zdex_hyperdeflation_burn_risc0/shared" }

[lints.rust]
unsafe_code = "forbid"
