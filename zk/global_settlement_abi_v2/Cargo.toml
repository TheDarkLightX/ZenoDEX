[package]
name = "zenodex-global-settlement-abi-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
readme = "README.md"

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.148", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
unsafe_code = "forbid"
