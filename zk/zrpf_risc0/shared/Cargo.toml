[package]
name = "zenodex-zrpf-risc0-shared"
version = "0.1.0"
edition = "2021"
description = "Pure RISC0 compatibility mappings for the Zeno Recursive Proof Fabric"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"
doctest = false

[[test]]
name = "v1_leaf_adapter"
path = "tests/v1_leaf_adapter.rs"

[features]
default = []
test-only-candidate-source-policy = []

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10.9", default-features = false }
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol", default-features = false }

[dev-dependencies]
serde_json = "1.0.140"
