[package]
name = "zenodex-zrpf-risc0-verifier"
version = "0.1.0"
edition = "2021"
description = "Sealed host verifier for receipt-authenticated ZRPF V3 nodes"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "source-opened-spot-settlement-verifier-v6"
path = "src/bin/source_opened_spot_settlement_verifier_v6.rs"

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["disable-dev-mode", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol" }
zenodex-zrpf-risc0-semantic-shared = { path = "../semantic_shared" }
zenodex-zrpf-risc0-shared = { path = "../shared" }
zenodex-zrpf-risc0-value-node-shared = { path = "../value_node_shared" }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared" }
