[package]
name = "zenodex-zrpf-risc0-spot-settlement-v6-shared"
version = "0.1.0"
edition = "2021"
description = "Guest-safe source-opened ordinary Spot V6 settlement profile"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "source_opened_settlement_v6"
path = "tests/source_opened_settlement_v6.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol", default-features = false }
zenodex-zrpf-risc0-semantic-shared = { path = "../semantic_shared", default-features = false }
zenodex-zrpf-risc0-spot-value-aggregate-l1-policy-v6 = { path = "../spot_value_aggregate_l1_policy_v6", default-features = false }
zenodex-zrpf-risc0-spot-value-aggregate-l2-policy-v6 = { path = "../spot_value_aggregate_l2_policy_v6", default-features = false }
zenodex-zrpf-risc0-spot-value-leaf-v6-shared = { path = "../spot_value_leaf_v6_shared", default-features = false }
zenodex-zrpf-risc0-value-aggregate-shared = { path = "../value_aggregate_shared", default-features = false }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared" }
zenodex-zrpf-risc0-shared = { path = "../shared" }
