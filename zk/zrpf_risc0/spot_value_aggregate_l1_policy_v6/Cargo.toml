[package]
name = "zenodex-zrpf-risc0-spot-value-aggregate-l1-policy-v6"
version = "0.1.0"
edition = "2021"
description = "Cycle-free child and parent identity policy for source-opened Spot V6 L1 aggregation"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol", default-features = false }
zenodex-zrpf-risc0-shared = { path = "../shared", default-features = false }
zenodex-zrpf-risc0-spot-value-leaf-v6-shared = { path = "../spot_value_leaf_v6_shared", default-features = false }
zenodex-zrpf-risc0-value-aggregate-shared = { path = "../value_aggregate_shared", default-features = false }
