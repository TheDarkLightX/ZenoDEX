[package]
name = "zenodex-zrpf-risc0-spot-value-leaf-v6-shared"
version = "0.1.0"
edition = "2021"
description = "Guest-safe source-opened ordinary Spot value-leaf V6 core"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "source_opened_v6"
path = "tests/source_opened_v6.rs"
required-features = ["test-only-candidate-source-policy"]

[features]
default = []
test-only-candidate-source-policy = [
  "zenodex-zrpf-risc0-shared/test-only-candidate-source-policy",
]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10.9", default-features = false }
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol", default-features = false }
zenodex-zrpf-risc0-semantic-shared = { path = "../semantic_shared", default-features = false }
zenodex-zrpf-risc0-shared = { path = "../shared", default-features = false }

[dev-dependencies]
serde_json = "1.0.140"
