[package]
name = "zenodex-zrpf-risc0-value-aggregate-root-policy"
version = "0.1.0"
edition = "2021"
description = "Host-side governed root identity for ZRPF Value Aggregate V5"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "architecture_v5"
path = "tests/architecture_v5.rs"

[[test]]
name = "identity_v5"
path = "tests/identity_v5.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol", default-features = false }
zenodex-zrpf-risc0-shared = { path = "../shared", default-features = false }
