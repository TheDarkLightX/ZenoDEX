[package]
name = "zenodex-zrpf-risc0-replay-verifier"
version = "0.1.0"
edition = "2021"
description = "Source-built verifier for the retained ZRPF V3 structural receipt tree"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "zenodex-zrpf-risc0-replay-verifier"
path = "src/main.rs"

[[bin]]
name = "zenodex-zrpf-firecracker-guest-init"
path = "src/bin/zrpf_firecracker_guest_init.rs"

[dependencies]
hex = "=0.4.3"
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["disable-dev-mode", "std"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
zenodex-zrpf-risc0-aggregate-shared = { path = "../aggregate_shared" }
zenodex-zrpf-risc0-verifier = { path = "../verifier" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "mount", "std", "system"] }
