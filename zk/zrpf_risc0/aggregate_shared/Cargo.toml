[package]
name = "zenodex-zrpf-risc0-aggregate-shared"
version = "0.1.0"
edition = "2021"
description = "Guest-safe structural aggregate profile for ZRPF V3"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[test]]
name = "structural_v1"
path = "tests/structural_v1.rs"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }
zenodex-zrpf-protocol-v3 = { path = "../../zrpf_protocol/protocol", default-features = false }
zenodex-zrpf-risc0-shared = { path = "../shared", default-features = false }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
serde_json = "1.0.140"
tau-state-proof-risc0-shared = { path = "../../state_proof_risc0/shared" }
