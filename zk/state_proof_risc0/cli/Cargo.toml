[package]
name = "tau-state-proof-risc0-cli"
version = "0.1.0"
edition = "2021"
description = "Standalone generator/verifier for Tau state_proof envelopes using Risc0"

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"] }
risc0-zkvm = { version = "=3.0.5", features = ["disable-dev-mode"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
tau-state-proof-risc0-methods = { path = "../methods" }
tau-state-proof-risc0-shared = { path = "../shared" }
