[package]
name = "tau-state-proof-risc0-guest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }
serde = { version = "1.0.219", default-features = false }
tau-state-proof-risc0-shared = { path = "../../shared", default-features = false }
tau-state-proof-risc0-zusd-policy = { path = "../../zusd_proof_policy", default-features = false }

[[bin]]
name = "tau-state-proof-risc0-guest"
path = "src/main.rs"
test = false
bench = false
