[pytest]
testpaths = tests
norecursedirs = external deprecated generated experiments tools exotic_state_machines
addopts = --strict-markers
markers =
    critical_core: consensus-critical functional-core tests
    spec_parity: parity tests against generated refs or trusted small models
    formal: tests that depend on formal artifacts or solver outputs
    integration: imperative-shell or integration coverage
    slow: long-running assurance checks
