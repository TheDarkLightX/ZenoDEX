<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172026; }
  .title { font-size: 23px; font-weight: 750; }
  .subtitle { font-size: 13px; fill: #52606d; }
  .label { font-size: 12px; fill: #36424d; }
  .value { font-size: 12px; font-weight: 700; fill: #172026; }
  .tiny { font-size: 10px; fill: #61717f; }
  .axis { stroke: #cbd5dd; stroke-width: 1; }
  .grid { stroke: #e3e8ed; stroke-width: 1; }
</style>
<text class="title" x="60" y="42">Review Caps vs Retail Hard Rail</text>
<text class="subtitle" x="60" y="65">v192 emits review caps only; no launch-parameter claim is produced.</text>
<line x1="100" y1="126.66666666666666" x2="610" y2="126.66666666666666" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
<text class="label" x="485" y="118.66666666666666">2500 bps retail rail</text>
<rect x="150" y="126.66666666666666" width="95" height="158.33333333333334" rx="3" fill="#0f766e"/>
<text class="label" x="150" y="302.0">Route surplus</text>
<text class="value" x="150" y="119.66666666666666">2500 bps</text>
<rect x="380" y="126.85666666666665" width="95" height="158.14333333333335" rx="3" fill="#7c3aed"/>
<text class="label" x="380" y="302.0">Exact-out savings</text>
<text class="value" x="380" y="119.85666666666665">2497 bps</text>
<text class="tiny" x="60" y="345">Interpretation: recommended caps are bounded by measured user value and clipped by hard retail rails.</text>
</svg>
