  - id: py:zeno_ledger:risc0_proof_metadata_adapter_v0
    status: supported
    layer: runtime
    statement: >
      The ZenoLedger Risc0 metadata adapter converts a scoped
      `risc0.zenodex_spot_transition.v1` Tau state-proof envelope into
      `zenodex/zeno_ledger/proof_metadata/v0`, binds the generated metadata to
      a ZenoLedger header, and fails closed on unsupported proof types,
      malformed base64 receipt payloads, malformed image/state/transaction/app
      hashes, body/header root mismatch, post-app-hash mismatch when required,
      missing metadata/header binding when required, and zero placeholder
      metadata roots. The adapter binds the Risc0 pre-app-hash presence bit
      into both the public-input hash and journal hash. It can require the
      Risc0 post-app-hash to match `header.post_state_root`, and when present,
      the Risc0 pre-app-hash to match `header.pre_state_root`. It also binds
      Risc0 `ingress_commitment`, `pre_nonce_root`, `post_nonce_root`, and
      `accepted_receipts_root` into the proof metadata public-input and journal
      hashes. When
      `--require-risc0-verifier` is supplied, the adapter also requires an
      external verifier command to accept the normalized proof envelope before
      metadata is emitted. This is a binding-adapter and verifier-command
      plumbing claim; it does not implement Risc0 cryptography in Python or
      prove guest/runtime semantic equivalence.
