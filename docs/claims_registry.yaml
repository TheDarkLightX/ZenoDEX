  - id: py:perp_clearinghouse_2p:liquidation_penalty_conservation
    status: supported
    layer: spec
    statement: >
      In the 2-party clearinghouse reference model, a +5% settlement move can deterministically liquidate
      the under-margined side, apply a liquidation penalty into the fee pool, and preserve exact quote-e8
      conservation (net_deposited = collateral_a + collateral_b + fee_pool).
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_clearinghouse_2p/test_ref_smoke.py
      files:
        - tests/core/test_perp_clearinghouse_2p/test_ref_smoke.py
        - generated/perp_python/perp_epoch_clearinghouse_2p_v0_1_ref.py
        - src/kernels/dex/perp_epoch_clearinghouse_2p_v0_1.yaml

  - id: py:perp_clearinghouse_3p_transfer:transfer_penalty_conservation
    status: supported
    layer: spec
    statement: >
      In the 3-party transfer clearinghouse reference model, a +5% settlement move can deterministically
      transfer the distressed side into an idle account, apply a liquidation penalty into the fee pool,
      and preserve exact quote-e8 conservation
      (net_deposited = collateral_a + collateral_b + collateral_c + fee_pool).
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_clearinghouse_3p_transfer/test_ref_smoke.py
      files:
        - tests/core/test_perp_clearinghouse_3p_transfer/test_ref_smoke.py
        - generated/perp_python/perp_epoch_clearinghouse_3p_transfer_v0_1_ref.py
        - src/kernels/dex/perp_epoch_clearinghouse_3p_transfer_v0_1.yaml

  - id: py:derivatives_generated_refs:smoke_v1
    status: supported
    layer: spec
    statement: >
      The committed, dependency-free Python reference models for v1 and v1.1 derivative kernels import
