  - id: py:zeno_oracle:production_network_config_gate_v1
    status: supported
    layer: implementation
    statement: >
      The production-candidate ZenoOracle network config checker accepts only a
      config with a non-devnet chain id, timelocked governance, production
      report signing, required code signing, at least five active bonded
      reporters with quorum and operator-diversity constraints, feed-level
      reporter/source/freshness/deviation policies, required critical-runtime
      controls including typed isolated perps settlement authorization, a local
      receipt bundle for reporter-registry deployment, feed-governance
      deployment, feed-governance approval/execution with timelock checking,
      signed release artifact verification, signed-release transparency-log
      root binding, runtime-control attestation, receipt happens-before
      ordering, and
      explicit non-claims for undeployed network, unexecuted
      governance, live token settlement, reporter honesty, and market-price
      truth. The checker rejects devnet chain ids, weak reporter quorum,
      concentrated operators, missing signing/code-signing controls, disabled
      runtime controls, missing receipt bundles, early governance execution,
      proposal drift, release transparency-log root drift, receipt drift, and
      receipt-order drift, and missing non-claims. This is a
      production-candidate config and local receipt gate only; it does not
      claim that the network is deployed, public release transparency logs have
      verified the artifact, the network is publicly soaked, governance has
      executed live, or tokens are live-settling.
    evidence:
      kind: python
      check:
        - cmd: python3 tools/check_zeno_oracle_production_network_config.py --format text
        - cmd: pytest -q tests/test_check_zeno_oracle_production_network_config.py
