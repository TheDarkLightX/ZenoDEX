      verifier-release entry drift, verifier release/sandbox digest drift,
      missing transparency-log observation, transparency-log root drift,
      receipt happens-before drift, and failed reward-payout replay. The normal
      checker accepts the current
      production-candidate policy; `--require-live` rejects while proof-network,
      code-signing, sandbox, revocation, and live proof-mining token-settlement
      blockers remain.
