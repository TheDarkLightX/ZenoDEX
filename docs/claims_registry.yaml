  - id: lean:zeno_ledger:zk_tee_proof_composition_v1
    status: proved
    layer: math
    statement: >
      The ZenoLedger ZK/TEE proof-composition model proves deterministic
      metadata binding for accepted proof receipts: accepted proof metadata
      exposes the same pre-state, post-state, transaction, evidence, and body
      roots as the ZenoLedger header; kind-specific TEE, recursive, and zkVM
      fields are fail-closed; metadata bound to the same header is unique under
      an explicit digest-injectivity assumption; and pairwise-commuting proof
      chunks can be reordered without changing the final state. This is a
