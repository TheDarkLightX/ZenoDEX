    status: supported
    layer: runtime
    statement: >
      ZenoLedger v0 now has a deterministic local validator-schedule boundary:
      canonical validator-set hashing is order-invariant, scheduled proposer
      selection is derived from height and voting power, body batch-cutoff
      sequencer ids can be checked against that schedule, and conflicting
      header hashes at the same chain height are reported as equivocations. It
      also validates local header-chain linkage by chain id, unique consecutive
      heights, and parent hashes matching the previous canonical header hash,
      and selects a deterministic canonical branch from anchored local header
      segments by maximum tip height, chain length, and lowest tip hash while
      reporting orphan headers.
