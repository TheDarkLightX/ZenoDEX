schema: zenodex/claims-registry/v1
meta:
  project: ZenoDEX (Autonomous Tau DEX)
  purpose: >
    Machine-readable index of *promoted* safety/liveness claims with replayable checks.
    This is intentionally tool-agnostic: it can point to private evidence objects,
    theorem statements, tests, and model-checking configs.
  note: >
    This registry is the curated subset that can be validated in CI without requiring any
    private evidence ledger.

claims:
  - id: py:snapshot:v2_perps_roundtrip_deterministic
    status: supported
    layer: implementation
    statement: >
      Serializing then decoding a DEX snapshot (v2) that includes a non-empty perps state
      yields identical canonical bytes (deterministic round-trip).
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/integration/test_dex_snapshot.py::test_snapshot_roundtrip_with_perps_is_deterministic
      files:
        - tests/integration/test_dex_snapshot.py
        - src/integration/dex_snapshot.py

  - id: py:perp_engine:settle_epoch_order_independent
    status: supported
    layer: implementation
    statement: >
      Settling an epoch across multiple accounts is deterministic and independent of account
      table iteration order (global post-state is consistent across accounts).
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/integration/test_perp_engine.py::test_settle_epoch_is_order_independent
      files:
        - tests/integration/test_perp_engine.py
        - src/integration/perp_engine.py
        - src/core/perp_epoch.py

  - id: py:perp_engine:settle_epoch_fee_pool_accumulates_across_accounts
    status: supported
    layer: implementation
    statement: >
      When some (but not all) accounts liquidate during settle_epoch, the per-market fee pool
      increases by the sum of per-account liquidation penalties, and the transition remains
      deterministic and independent of account insertion order.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/integration/test_perp_engine.py::test_settle_epoch_accumulates_fee_pool_for_mixed_liquidation
      files:
        - tests/integration/test_perp_engine.py
        - src/integration/perp_engine.py

  - id: py:perp_engine:breaker_reduce_only_and_clear
    status: supported
    layer: implementation
    statement: >
      Under the clamp+breaker posture, an out-of-bounds clearing price update deterministically
      triggers the breaker, clamps the mark price, enforces reduce-only position updates while active,
      and allows operator clear only after all positions are closed.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/integration/test_perp_engine.py::test_breaker_reduce_only_and_clear
      files:
        - tests/integration/test_perp_engine.py
        - src/integration/perp_engine.py
        - src/kernels/dex/perp_epoch_isolated_v2.yaml

  - id: py:perp_engine:advance_requires_prior_settlement
    status: supported
    layer: implementation
    statement: >
      Operator epoch advancement is fail-closed: the engine rejects advancing again until the
      current epoch has been settled (prevents skipping settlement epochs).
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/integration/test_perp_engine.py::test_operator_cannot_skip_settlement
      files:
        - tests/integration/test_perp_engine.py
        - src/integration/perp_engine.py

  - id: py:perp_engine_ch2p:net_zero_and_pair_liquidation
    status: supported
    layer: implementation
    statement: >
      The perps tx adapter supports a minimal 2-party clearinghouse posture (perps.version=1.0; legacy 0.2)
      that is fail-closed and deterministic: markets are initialized with exactly two accounts,
      market init and matched position updates are jointly authorized by per-operation signatures from
      both accounts, clearing-price publication is oracle-authorized when configured, and settlement/liquidation is executed by
      a spec-derived, deterministic reference implementation while persisting the clearinghouse kernel
      state inside snapshots (perps state v5). Collateral accounting is maintained in quote-e8 units so
      the closed-system invariant holds exactly (net_deposited = collateral_a + collateral_b + fee_pool).
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/integration/test_perp_engine_clearinghouse_2p.py
      files:
        - tests/integration/test_perp_engine_clearinghouse_2p.py
        - src/integration/perp_engine.py
        - src/core/perps.py
        - src/integration/dex_snapshot.py
        - generated/perp_python/perp_epoch_clearinghouse_2p_v0_1_ref.py

  - id: py:perp_engine_ch3p:transfer_and_conservation
    status: supported
    layer: implementation
    statement: >
      The perps tx adapter supports a 3-party transfer clearinghouse posture (perps.version=1.1)
      that is fail-closed and deterministic: markets bind exactly three accounts (A,B,C),
      market init and matched position updates are jointly authorized by per-operation signatures from
      the three accounts, clearing-price publication is oracle-authorized when configured, position updates keep net position == 0
      with at least one idle account, and settlement can
      transfer a distressed position to the idle account when it satisfies initial margin.
      Quote-e8 accounting preserves the closed-system invariant exactly:
      net_deposited = collateral_a + collateral_b + collateral_c + fee_pool.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/integration/test_perp_engine_clearinghouse_3p_transfer.py
      files:
        - tests/integration/test_perp_engine_clearinghouse_3p_transfer.py
        - src/integration/perp_engine.py
        - src/core/perps.py
        - src/integration/dex_snapshot.py
        - generated/perp_python/perp_epoch_clearinghouse_3p_transfer_v0_1_ref.py

  - id: risc0:perps_np_transition_v1:real_proof_smoke
    status: supported
    layer: assurance
    statement: >
      The scoped RISC0 proof surface `risc0.zenodex_perps_np_transition.v1`
      proves a dynamic N-party perps epoch transition with at least four
      participants in the positive smoke cases. The guest recomputes
      settle-before-match, largest-remainder rationing, zero-sum position
      conservation, insurance ledger identity, ADL/liquidation handling, and
      journal bindings for chain, market, operation, state roots, state delta,
      oracle binding, collateral binding, participant set, receipts root, and
      nonzero RISC0 image ID. The strict verifier rejects wrong proof type,
      image ID, chain, app hashes, state roots, operation hash, oracle binding
      hash, participant-set hash, state-delta hash, and ledger-field tampering.
      This is scoped transition evidence; it does not certify external oracle
      truth, custody, production finality, or the full Python runtime.
    evidence:
      kind: risc0-smoke
      check:
        - cmd: python3 tools/zeno_ledger_perp_np_risc0_real_proof_smoke.py --case all --timeout 1800 --out-dir /tmp/zenodex_perps_np_risc0_smoke_all --target-dir /tmp/zenodex_perps_np_risc0_target
      files:
        - docs/zenodex_perps_np_state_proof_risc0_v1.md
        - tools/zeno_ledger_perp_np_risc0_real_proof_smoke.py
        - tools/proof_verifiers/risc0_perps_np_live_wrapper_v1.py
        - zk/state_proof_risc0/cli/src/main.rs
        - zk/state_proof_risc0/methods/guest/src/main.rs
        - zk/state_proof_risc0/shared/src/lib.rs
        - zk/state_proof_risc0/shared/src/surfaces.rs

  - id: risc0:zusd_transition_v1:real_proof_smoke
    status: supported
    layer: assurance
    statement: >
      The scoped RISC0 proof surface `risc0.zenodex_zusd_transition.v1` proves
      one zUSD collateral-deposit plus mint transition in the positive smoke
      case. The guest binds chain, vault, owner, pre/post app hashes, pre/post
      zUSD state roots, operation hash, oracle binding hash, state-delta hash,
      vault root, wallet balance root, MCR checks, debt conservation, minted
      balance, protocol revenue, and nonzero RISC0 image ID. The strict
      verifier rejects wrong proof type, image ID, chain, app hashes, operation
      hash, oracle binding hash, state-delta hash, zUSD balance root hash, and
      zUSD vault root hash. This is scoped transition evidence; it does not
      certify real oracle truth, custody, redemptions, repayments,
      liquidations, multi-vault behavior, production finality, or the full
      Python runtime.
    evidence:
      kind: risc0-smoke
      check:
        - cmd: python3 tools/zeno_ledger_zusd_risc0_real_proof_smoke.py --case all --timeout 1800 --out-dir /tmp/zenodex_zusd_risc0_smoke_all --target-dir /tmp/zenodex_zusd_risc0_target
      files:
        - docs/zenodex_zusd_state_proof_risc0_v1.md
        - tools/zeno_ledger_zusd_risc0_real_proof_smoke.py
        - tools/proof_verifiers/risc0_zusd_live_wrapper_v1.py
        - zk/state_proof_risc0/cli/src/main.rs
        - zk/state_proof_risc0/methods/guest/src/main.rs
        - zk/state_proof_risc0/shared/src/lib.rs
        - zk/state_proof_risc0/shared/src/surfaces.rs

