  - id: tla:settlement_attestation_governance:governed_policy_activation
    status: supported
    layer: liveness
    statement: >
      In the bounded TLA+ settlement-attestation governance model
      (`SIGNERS = {0,1}`, `SOURCES = {0,1}`), accepted settlements require an
      active approved, timelocked, multisig-backed, non-revoked policy snapshot
      with enough observed signers and sources; revoked active policy blocks
      future settlement acceptance; accepted settlements cannot drift away from
      the active policy epoch; and under weak fairness, an approved pending
      policy with an elapsed timelock eventually activates.
    evidence:
      kind: tla
      note: >
        Bounded TLC model check over the repo-local settlement attestation
        governance model. This is a control-flow claim about bounded signer and
        source sets, not a proof of real-world signer independence, oracle
        truth, BLS validity, bribery resistance, or on-chain governance
        execution.
      check:
        - cmd: python3 tools/run_tla_models.py --json
      files:
        - formal/tla/SettlementAttestationGovernance.tla
        - formal/tla/SettlementAttestationGovernance.cfg
        - tools/run_tla_models.py

