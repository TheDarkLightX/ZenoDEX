  - id: py:funding_rate_market_v1_1:parity_with_generated_ref
    status: supported
    layer: spec
    statement: >
      The hand-written Python implementation of the funding-rate market matches the committed generated
      reference model for the v1.1 kernel spec over a deterministic random trace (semantic parity).
    evidence:
      kind: pytest
      check:
