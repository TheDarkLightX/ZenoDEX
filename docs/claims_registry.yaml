  - id: lean:zenodex_routing:foldl_argmin_key_le_all
    status: proved
    layer: math
    statement: >
      Folding a finite candidate list with an argmin-step returns an element whose key is
      ≤ every candidate key (deterministic tie behavior from the step definition).
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.ZenoDEXRoutingArgmin"
      files:
        - lean-mathlib/Proofs/ZenoDEXRoutingArgmin.lean
      theorems:
        - Proofs.ZenoDEX.foldl_argmin_key_le_all

  - id: lean:zenodex_rounding:ceilDiv_mul_ge
    status: proved
    layer: math
    statement: >
      Standard ceil-division bound: for b>0, a ≤ ceilDiv(a,b)*b + (b-1).
      Used to bound integer rounding error in kernel-style arithmetic.
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.ZenoDEXRounding"
      files:
        - lean-mathlib/Proofs/ZenoDEXRounding.lean
      theorems:
        - Proofs.ZenoDEX.ceilDiv_mul_ge

  - id: lean:fire_zpl_fixed_point_bridge:one_tick_runtime_settlement
    status: proved
    layer: math
    statement: >
      Successful FIRE/ZPL compilation composes with fixed-point runtime rounding:
      floor-decoded single-leg and portfolio settlements are safe under a one-tick
      lower-side buffer, ceil-decoded settlements are safe under a one-tick upper-side
      buffer, mixed floor/ceil portfolios are safe under the corresponding per-leg
      side buffers, and posted collateral against those expanded intervals prevents
      bilateral default. Runtime delta conservation is exact when the writer leg
      negates the rounded holder leg, including the integer receipt delta table
      and its decoded fixed-point interpretation.
    evidence:
      kind: lean
      check:
