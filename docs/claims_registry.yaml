  - id: py:upba:exact_out_uniform_batch_certificate_v3
    status: supported
    layer: runtime
    statement: >
      The UPBA v3 runtime verifier accepts scoped single-pool CPMM
      SWAP_EXACT_OUT certificates only when each fill exactly matches the
      requested output, stays within the user's max input, satisfies the
      uniform-price inequality, and uses the minimal gross input required by
      deterministic integer fee rounding. It rejects mixed exact-in/exact-out
      admitted sets under the v3 policy, and integer overdelivery from minimal
      input rounding remains in pool reserves. This is a fixed-admission runtime
      settlement claim; it does not claim partial exact-out fills, multi-hop
      routing, fair inclusion, or economic sufficiency of the price grid.
