      commitment emission at the shared transition boundary. The CLI and
      methods crate now compile in both placeholder mode and
      `RISC0_FORCE_BUILD=1` real-method mode, using the same generated method
      constant names in both paths.
      This is a bounded runtime-equivalence fixture claim for the current Risc0
      v1 guest scope; it does not prove full Rust/Python equivalence,
      multi-intent batches inside one transaction, exact-out, multi-hop
      routing, nonce/receipt execution, or cryptographic Risc0 receipt
