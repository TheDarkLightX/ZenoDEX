  - id: lean:perp_epoch_safety:collateral_nonneg_after_clamped_move
    status: proved
    layer: math
    statement: >
      Under the bounded-move oracle assumption, and with maintenance margin ≥ max oracle move,
      one clamped price update cannot drive collateral negative (math-only statement over ℚ).
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.PerpEpochSafety"
      files:
        - lean-mathlib/Proofs/PerpEpochSafety.lean
      theorems:
        - Proofs.PerpEpochSafety.collateral_nonneg_after_clamped_move

  - id: py:perp_math:rounding_leak_witness_under_euclidean_division
    status: supported
    layer: math
    statement: >
      Per-account Euclidean division can violate global conservation even under net-zero exposure
      (Σpos=0 does not imply Σpnl=0 when pnl_i := (pos_i·ΔP_e8) div 1e8).
      A minimal witness is captured as a deterministic pytest.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_math_hazards.py::test_rounding_leak_witness_under_euclidean_division
      files:
        - tests/core/test_perp_math_hazards.py

  - id: py:perp_math:largest_remainder_dust_allocator_restores_conservation
    status: supported
    layer: implementation
    statement: >
      The deterministic "largest remainder" dust allocator restores conservation under net-zero sums:
      given xs with Σxs=0, it returns integer adjustments whose sum is 0 and each element differs from
      floor(xs_i/d) by at most +1, with deterministic tie-breaking by account key.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_math_hazards.py::test_largest_remainder_dust_allocator_restores_net_zero_conservation
      files:
        - tests/core/test_perp_math_hazards.py
        - src/core/perp_rounding.py

  - id: py:perp_math:breaker_quantization_can_stall_witness
    status: supported
    layer: math
    statement: >
      Clamp/breaker bounded-step enforcement can stall when integer quantization yields δ=0
      (δ := floor(P*m_bps/10000)), while the raw oracle price is out of bounds.
      A minimal witness is captured as a deterministic pytest.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_math_hazards.py::test_breaker_quantization_can_stall_witness
      files:
        - tests/core/test_perp_math_hazards.py

  - id: py:perp_incentives:volume_rewards_can_subsidize_oracle_manipulation_witness
    status: supported
    layer: math
    statement: >
      A naive per-leg volume reward can subsidize a spot-derived oracle manipulation loop: even when
      integer quantization yields perp_pnl=0, the reward can exceed the spot roundtrip cost, producing
      net_profit>0. A concrete witness is captured as a deterministic pytest.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_incentive_hazards.py::test_volume_rewards_can_subsidize_oracle_manipulation_witness
      files:
        - tests/core/test_perp_incentive_hazards.py

  - id: py:cpmm:lp_fees_are_recapturable_for_full_lp_witness
    status: supported
    layer: math
    statement: >
      When protocol fees are not extracted from a CPMM, swap fees remain in the pool. A trader who is also
      100% of the LP side therefore recaptures the roundtrip loss via pool ownership (combined wallet+pool
      balances are conserved). A concrete witness is captured as a deterministic pytest.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_incentive_hazards.py::test_cpmm_lp_fees_are_recapturable_for_full_lp_witness
      files:
        - tests/core/test_perp_incentive_hazards.py

  - id: py:cpmm:protocol_fee_rebate_capped_by_extracted_fees_unprofitable_under_bounds
    status: supported
    layer: math
    statement: >
      For a fixed CPMM configuration (reserves=10_000/10_000, fee_bps=10, protocol_fee_share_bps=10_000,
      rebate_share_bps=10_000), a quote->base->quote roundtrip is not profitable when the rebate is capped
      by extracted protocol fees. This is checked by bounded brute-force over trade_in_quote ∈ [1, 20_000),
      skipping invalid tiny trades where the unwind leg is undefined under exact-in semantics.
    evidence:
      kind: pytest
      check:
        - cmd: pytest -q tests/core/test_perp_incentive_hazards.py::test_protocol_fee_rebate_capped_by_extracted_fees_not_profitable_under_bounds
      files:
        - tests/core/test_perp_incentive_hazards.py

  - id: lean:zenodex_nonces:no_replay_in_later_valid_seq
    status: proved
    layer: math
    statement: >
      Sequential nonce batches cannot be replayed: a nonce from an accepted batch cannot
      appear in any later valid sequential batch for the same sender.
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.ZenoDEXNonces"
      files:
        - lean-mathlib/Proofs/ZenoDEXNonces.lean
      theorems:
        - Proofs.ZenoDEX.no_replay_in_later_valid_seq

  - id: lean:cpmm:fee_ceil_decomposition
    status: proved
    layer: math
    statement: >
      The overflow-safer fee decomposition used by the CPMM safety lane is exact:
      ceil(gross*fee_bps/10000) equals the quotient/remainder decomposition over gross/10000.
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.FeeCeilDecomposition"
      files:
        - lean-mathlib/Proofs/FeeCeilDecomposition.lean
        - lean-mathlib/Proofs/CPMMInvariants.lean
      theorems:
        - CPMMInvariants.computeFee_decomposed

  - id: lean:cpmm_v8_exact_out:sufficient_and_minimal
    status: proved
    layer: math
    statement: >
      Under the theorem preconditions `0 < reserve_in`, `amount_out < reserve_out`, and
      `fee_bps < 10000`, the exact-out CPMM v8 construction is sufficient and minimal:
      the computed gross input yields the requested output bound, and any strictly smaller
      gross input fails it.
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.CpmmSwapV8ExactOutMinimality"
      files:
        - lean-mathlib/Proofs/CpmmSwapV8ExactOutMinimality.lean
      theorems:
        - TauSwap.CPMM.V8.swap_exact_out_sufficient_and_minimal

  - id: lean:cpmm_settlement:valid_swap_preserves_k
    status: proved
    layer: math
    statement: >
      A valid CPMM swap transition preserves the real pool invariant: post-swap K is at least
      the pre-swap K.
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.CPMMSettlement"
      files:
        - lean-mathlib/Proofs/CPMMSettlement.lean
        - lean-mathlib/Proofs/CPMMInvariants.lean
      theorems:
        - CPMMSettlement.valid_swap_preserves_K

  - id: lean:batch_auction:canonical_min_key
    status: proved
    layer: math
    statement: >
      The batch-auction canonicalization rule has a unique deterministic winner under the
      total key ((volume desc, surplus desc), order asc), and the winner dominates every candidate.
    evidence:
      kind: lean
      check:
        - cmd: bash -lc "cd lean-mathlib && lake build Proofs.BatchAuctionCanonical"
      files:
        - lean-mathlib/Proofs/BatchAuctionCanonical.lean
      theorems:
        - TauSwap.Batch.exists_unique_canonical
        - TauSwap.Batch.canonical_dominates

  - id: py_lean:upba:bounded_price_grid_global_weak_optimality_v1
    status: supported
    layer: math_runtime
    statement: >
      A runtime upper-bound optimality certificate whose winner is bound to a UPBA certificate
      proves audited-set weak optimality over the finite candidate list. The deterministic local
      builder sorts the candidate set and selects the volume-first, surplus-second winner with a
      stable candidate-id tie-break. The Lean bounded price-grid theorem lifts the checked result
      to global weak optimality over all candidates generated by the configured bounded integer
      price grid. The v2 theorem extends this bridge to bounded partial-fill plans when the audit
      set enumerates every canonical bounded-grid price and every admitted bounded partial-fill
      plan. The v3 theorem extends the same conditional bridge to admitted bounded exact-out fill
      plans. The v3 exact-grid theorem derives winner feasibility from exact audit-set soundness
      and winner membership. The v3 full-fill theorem specializes the bridge to the current runtime
      surface where the admitted intent set fixes one exact-out fill plan, with singleton-plan
      equivalence lemmas tying it back to the general exact-out model. This does not claim unbounded rational-price completeness, fair inclusion, oracle
      safety, multi-hop routing, partial exact-out fills, or economic sufficiency of a particular
      grid resolution.
    evidence:
      kind: lean_pytest
      check:
        - cmd: bash -lc "cd lean-mathlib && lake env lean Proofs/UniformBatchOptimality.lean"
        - cmd: pytest -q tests/core/test_uniform_batch_clearing.py tests/core/test_uniform_batch_optimality.py tests/integration/test_dex_engine_uniform_batch_certificate.py
      files:
        - lean-mathlib/Proofs/UniformBatchOptimality.lean
