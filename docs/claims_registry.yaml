      In the 3-party transfer clearinghouse reference model, a +5% settlement move can deterministically
      transfer the distressed side into an idle account, apply a liquidation penalty into the fee pool,
      and preserve exact quote-e8 conservation
      (net_deposited = collateral_a + collateral_b + collateral_c + fee_pool).
    evidence:
