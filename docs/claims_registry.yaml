  - id: py:zenodex:host_independent_coverage_v0
    status: supported
    layer: assurance
    statement: >
      The host-independent coverage manifest separates full-node host
      independence from succinct proof coverage for every critical transition.
      Covered full-node surfaces must use deterministic replay or valid zkVM
      proof modes; metadata/report/checkpoint replay cannot count as transition
      correctness; Docker cannot be used as a correctness boundary; and the
      manifest must keep full-ZK execution for all value-moving surfaces open
      while the proof matrix still lists real proof gaps. This is a scoped
      coverage and claim-control gate. It does not add zkVM execution support
      for the open proof-gap surfaces.
