      archive from Machine A and Machine B host artifacts, token-test output,
      and watcher attestations, then runs the strict evidence checker before
      writing the archive. The checker requires the checked commit to equal the
      latest pushed commit or caller-supplied expected commit, Machine A and
      Machine B each to report that same commit and a parseable Python version,
      distinct machine identities with matching network-config, feature-suite,
      and common-header hashes, at least one accepted fake-token transaction, an
      accepted token test result, and two unique machine watcher attestations
      that replay their own hashes and bind to the same common header. This is
      an archive-validation gate for externally collected evidence; it does not
