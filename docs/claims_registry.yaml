  - id: py:upba:v1_grid_economic_profiles_v1
    status: supported
    layer: runtime
    statement: >
      The UPBA v1 grid economic profile checker evaluates named price-grid
      profiles against explicit price-band, denominator, and per-fill input
      caps. Accepted profiles satisfy the rational-price epsilon bound
      `1 / (2D)`, emit exact nearest-grid witnesses for representative rational
      prices in the declared band, emit an explicit interval-cover certificate
      for every rational price in that band under `p_min * D >= 1` and
      `ceil(p_max * D) <= max_grid_num`, satisfy conservative upper bounds for
      relative price error and output-unit slack, and keep their grid numerator
      and denominator inside the runtime price-ratio domain. This is a scoped
      deployment profile gate; it does not claim fair admission, rational-price
      search completeness outside the declared band, market-depth sufficiency,
      oracle safety, or universal economic optimality.
    evidence:
      kind: pytest
      check:
