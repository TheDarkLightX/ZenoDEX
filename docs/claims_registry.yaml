        - generated/derivatives_python/curve_selection_market_v1_ref.py

  - id: smt:funding_rate_market_v1:inductive_z3_cvc5
    status: disputed
    layer: spec
    statement: >
      The funding-rate market kernel (v1) is inductive (k=1) under SMT, but its settlement action still relies on
      environment-supplied realized-rate and payout values and should not be treated as an authorization-complete
