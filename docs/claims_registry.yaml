    statement: >
      The ZenoProof production-candidate governance policy checker binds the
      public verifier registry manifest to governance timelock/quorum controls,
      verifier code-signing requirements, deterministic sandbox limits,
      revocation receipts, devnet-only quarantine for local static verifiers,
      production-enabled public replay verifier IDs with executable path lookup
      disabled, O3/O5 bridge controls, bounded no-mint reward settlement replay,
      a local receipt bundle for
      governance execution, revocation drill/list, code-signing attestation with
      verifier-release manifest binding, verifier-release transparency-log root
      binding, sandbox image/seccomp digest binding for every signed verifier
      release entry, and sandbox attestation, and explicit non-claims. It
      rejects static verifier promotion, devnet verifier production enablement,
      production verifier path-lookup enablement, weak bridge or sandbox
      controls, bad governance or reward controls, missing non-claims, missing
