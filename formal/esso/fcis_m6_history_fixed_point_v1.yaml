  effects: {}
- id: remove_state_row
  params: []
  guard: {var: state_row}
  updates:
  - {var: state_row, expr: {bool: false}}
  - {var: fixed_point, expr: {bool: false}}
  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: remove_history_row
  params: []
  guard: {var: history_row}
  updates:
  - {var: history_row, expr: {bool: false}}
  - {var: fixed_point, expr: {bool: false}}
  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: remove_evidence_row
  params: []
  guard: {var: evidence_row}
  updates:
  - {var: evidence_row, expr: {bool: false}}
  - {var: fixed_point, expr: {bool: false}}
  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: remove_nullifier_row
  params: []
  guard: {var: nullifier_row}
  updates:
