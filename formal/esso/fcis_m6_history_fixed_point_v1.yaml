  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: canonical_reencode
  params: []
  guard:
    op: and
    args:
    - {var: state_row}
    - {var: history_row}
    - {var: evidence_row}
    - {var: nullifier_row}
    - {var: receipt_row}
    - {var: outbox_row}
    - {var: authority_row}
    - {var: relations_valid}
    - {var: layout_exact}
  updates:
  - {var: fixed_point, expr: {bool: true}}
  effects: {}
- id: reopen_reject
