  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: remove_receipt_row
  params: []
  guard: {var: receipt_row}
  updates:
  - {var: receipt_row, expr: {bool: false}}
  - {var: fixed_point, expr: {bool: false}}
  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: remove_outbox_row
  params: []
  guard: {var: outbox_row}
  updates:
  - {var: outbox_row, expr: {bool: false}}
  - {var: fixed_point, expr: {bool: false}}
  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: remove_authority_row
  params: []
  guard: {var: authority_row}
  updates:
  - {var: authority_row, expr: {bool: false}}
  - {var: fixed_point, expr: {bool: false}}
  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: cross_relation_rows
  params: []
  guard: {bool: true}
  updates:
  - {var: relations_valid, expr: {bool: false}}
  - {var: fixed_point, expr: {bool: false}}
  - {var: canonical_open, expr: {bool: false}}
  effects: {}
- id: add_surplus_row
  params: []
  guard: {bool: true}
  updates:
  - {var: layout_exact, expr: {bool: false}}
