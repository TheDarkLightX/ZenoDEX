SPECIFICATION Spec

\* Small bounded model for browser/mobile checkpoint wallet sync.
CONSTANTS
  CHAINS = {"chain_a", "chain_b"}
  HEIGHTS = {0, 1, 2}
  ROOTS = {"root_a", "root_b"}
  BUNDLES = {"bundle_a", "bundle_b"}

INVARIANT TypeOK
INVARIANT RejectedDoesNotMutateState
INVARIANT AcceptedRequiresValidBundle
INVARIANT AcceptedRequiresValidPriorState
INVARIANT AcceptedNeverRollsBack
INVARIANT AcceptedKeepsChainStableAfterInitialSync
INVARIANT AcceptedSameHeightCannotDrift
INVARIANT AcceptedStateMatchesCandidate
